or it. What is this diagnosis for?","options":["Choosing between a prompt library and a Skill for the team","Estimating the token budget for the system prompt and history","Deciding where to place the cache breakpoint in the prompt","Finding underspecification gaps the model will fill differently each time"],"correct":[3],"explanation":"Reading a prompt for what it fails to say reveals gaps. The fix is to make the implicit explicit by restating the goal, naming the format and bounding the constraints.","mnemonic":"State it or lose it."},{"id":"d2s3q06","concept":"guardrail-underspecified","type":"single","stem":"A prompt includes the line 'be careful with sensitive data'. Why might this be worse than having no guardrail at all?","options":["It looks like a control but has no substance; the model can route around it.","It consumes tokens that would otherwise have been available for prompt caching.","It forces the model into chain-of-thought reasoning on every single call.","It prevents the output contract from being applied to the final response."],"correct":[0],"explanation":"An underspecified guardrail looks like a control and invites false confidence, but a constraint the model can quietly route around is not a constraint. A missing guardrail at least is known to be missing.","mnemonic":"Vague guardrail: a lock painted on the door."},{"id":"d2s3q07","concept":"guardrail-underspecified","type":"multi","stem":"Which TWO changes turn a vague guardrail into an enforceable one? Select TWO.","options":["Name exactly what must never appear in output, and under what conditions","Add a polite reminder to be careful at the end of the prompt","Place the rule in fixed template scaffolding so slot content cannot remove it","Rely on a larger model to infer the intent of the rule","Repeat the same vague wording in several places"],"correct":[0,2],"explanation":"A guardrail must state its bounds precisely, and living in fixed scaffolding means filling a slot cannot delete it. Politeness, repetition of vague wording, or hoping a larger model infers the intent add no substance.","mnemonic":"Name it exactly, nail it in scaffolding."},{"id":"d2s3q08","concept":"technique-progression","type":"single","stem":"A team needs to extract structured fields from invoices and a first prompt has not been tried yet. Which approach follows the recommended progression?","options":["Start with chain-of-thought, then remove steps that look unnecessary.","Start with ten few-shot examples to anchor the format immediately.","Start zero-shot; add examples only if format or judgment needs showing.","Start with extended thinking and a long system prompt."],"correct":[2],"explanation":"The progression is zero-shot, then few-shot, then chain-of-thought, adding each only if the task needs it. Each step adds tokens and latency, so use the lightest technique that meets the requirement.","mnemonic":"Zero, few, chain: climb only when needed."},{"id":"d2s3q09","concept":"technique-progression","type":"single","stem":"Why is applying chain-of-thought to a simple classification task a design flaw?","options":["It makes the model less accurate on well-specified tasks of every kind.","It is a recurring token and latency tax with no gain.","It prevents the use of a stable cached prefix across requests.","It forces the model tier to be upgraded to the next level."],"correct":[1],"explanation":"Heavier techniques cost tokens and latency on every call. Chain-of-thought suits multi-step reasoning where the path matters, not simple tasks that already work.","mnemonic":"Needless reasoning is a tax on every call."},{"id":"d2s3q10","concept":"prompt-model-pairing","type":"single","stem":"A team swaps a mature prompt from one model generation to a newer tier and finds output quality has shifted. What principle explains this?","options":["Prompts are portable, so the difference must be a bug in the new model.","Output quality depends only on the system prompt length.","Newer models always need more examples and more explicit steps.","The prompt-model pairing is what ships, so a swap needs an eval."],"correct":[3],"explanation":"The same prompt does not behave identically across tiers or generations; a prompt tuned for one model is a starting point for another. That is why a model swap is treated as a release gated by an eval.","mnemonic":"Prompt plus model is the product."},{"id":"d2s3q11","concept":"prompt-model-pairing","type":"multi","stem":"Which TWO statements about prompts across model tiers are accurate? Select TWO.","options":["A more capable model may need less scaffolding to reach the same quality","A prompt tuned for one model is guaranteed to work on a cheaper tier","A less capable model may need more examples or explicit steps","Prompts transfer unchanged, so no eval is needed after a swap","Few-shot examples behave identically across all generations"],"correct":[0,2],"explanation":"Scaffolding needs vary with capability: capable models need less, weaker ones more. Because behavior differs, the swap itself must be gated with an evaluation.","mnemonic":"Stronger model, lighter scaffolding; weaker, heavier."},{"id":"d2s3q12","concept":"bias-unbalanced-examples","type":"multi","stem":"A few-shot classifier over-predicts 'approve' in aggregate. Which TWO prompt-construction faults are most likely responsible? Select TWO.","options":["Examples that show mostly approvals and few other cases","An output contract that names the response shape","A neutral instruction that lists the possible labels","Leading phrasing that presumes the answer is 'approve'","A system prompt that states the role and scope"],"correct":[0,3],"explanation":"Unbalanced examples and leading phrasing steer the output toward one answer, and bias like this is invisible in any single output, only appearing in aggregate. Neutral phrasing and balanced examples are design requirements.","mnemonic":"Lopsided examples, loaded wording, lopsided outputs."},{"id":"d2s3q13","concept":"stale-few-shot","type":"single","stem":"Six months after launch, a few-shot extraction prompt starts mishandling a new document layout even though nothing in the code changed. What is the most likely first thing to review?","options":["The retry policy for handling transient API errors under load","The few-shot examples, which may be stale against the evolved task","The cache TTL setting configured on the system prompt prefix","The output token limit set for each individual response"],"correct":[1],"explanation":"Few-shot examples are content to maintain; as the task evolves, stale examples quietly steer the model wrong. They should be reviewed and rebalanced like any other asset.","mnemonic":"Examples age; stale shots steer wrong."}]},{"id":"d2s4","title":"Prompt caching, modular prompts and Skills","learn":["Caching works on a stable prefix: static content first, dynamic content after the cache breakpoint; cache_control markers are explicit.","Cache writes cost more than standard input and reads cost less (verify current rates on the pricing page); the default TTL is 5 minutes, so infrequent calls do not amortize.","Caching is not worth it for small fixed portions or rarely called prompts; model call frequency and prefix size before committing.","What is cached is the prompt prefix, and the response is identical to an uncached call; cached live state creates a consistency window risk.","A prompt library is for one team or codebase with light governance; a Skill (SKILL.md with instructions and scripts) suits repeatable, distributed, governed procedures.","Ungoverned copy-pasted prompts drift into many slightly different versions; versioned reuse with approval and rollback is the control."],"traps":["Unstable prefix: caching matches only a stable prefix, so anything variable placed before the breakpoint stops hits; static before dynamic, always.","Cache everywhere: caching has a write cost, so rarely called or small prefixes can cost more than they save.","Slow cadence: a request frequency lower than the TTL means no consistent savings, because the cache expires between calls.","Stale cached state: caching content that must reflect live state creates a consistency window that may violate requirements.","Copy-paste reuse: prompts shared by copying drift apart, each with quietly different behavior and no rollback."],"questions":[{"id":"d2s4q01","concept":"cache-stable-prefix","type":"single","stem":"On what basis does prompt caching match a request to a stored entry?","options":["A stable, identical prefix of the prompt","The semantic similarity of the user message to earlier messages","The model's earlier response to the same question","The hash of the most recent user message only"],"correct":[0],"explanation":"Caching preserves the processed prompt prefix so the API does not reprocess those tokens. It matches on a stable prefix, which is why the fixed part must stay genuinely fixed.","mnemonic":"Cache the prefix, not the question."},{"id":"d2s4q17","concept":"cache-ttl-frequency","type":"multi","stem":"Which TWO factors should drive the choice of cache lifetime (TTL) for a reusable prompt? Select TWO.","options":["The expected length of the model's response to each request","The number of few-shot examples included in the prompt","How often the fixed content of the prompt actually changes","The model tier the prompt is currently being sent to","How frequently the prompt is called by the application"],"correct":[2,4],"explanation":"Match the cache lifetime to how often the fixed content actually changes and how frequently the prompt is called: a constantly called prompt benefits from a longer-lived cache, while one called rarely may never amortize the write. Response length, example count and tier do not decide how long the prefix should live.","mnemonic":"TTL tracks two clocks: how often it changes, how often it is called."},{"id":"d2s4q03","concept":"static-before-dynamic","type":"single","stem":"An application sends the same 8,000-token system prompt and policy document on every request, followed by a short varying user message. Which optimization most directly reduces both latency and cost?","options":["Truncate the policy document to its first 1,000 tokens to cut input size.","Move the policy document into a few-shot example block in the user turn.","Switch to the smallest available model, regardless of how well it fits the task.","Put static prompt and policy before dynamic content, and enable prompt caching."],"correct":[3],"explanation":"A long, stable prefix reused across requests is the ideal caching case. Truncation loses content, and a smaller model regardless of fit risks quality without addressing the repeated prefix.","mnemonic":"Long stable prefix up front: cache it."},{"id":"d2s4q04","concept":"cache-breakpoint","type":"single","stem":"What is the purpose of a cache breakpoint?","options":["To mark where the fixed cacheable prefix ends and variable content begins","To split the response into cached and uncached portions after generation","To set the maximum number of cache hits allowed per hour","To flag prompts that should skip the safety guardrails entirely"],"correct":[0],"explanation":"A breakpoint marks the boundary between the fixed part of the prompt and the variable part. Caching requires explicit cache_control markers, and the fixed part must remain genuinely fixed.","mnemonic":"Breakpoint: where fixed ends and variable begins."},{"id":"d2s4q05","concept":"cache-ttl-frequency","type":"single","stem":"The default cache TTL is 5 minutes. A workload calls the same long prompt once every 20 minutes. What is the likely outcome?","options":["Consistent savings, because the prefix is long and stable enough to cache.","No consistent savings, because entries expire between calls and writes repeat.","Savings on output tokens only, since input tokens are reprocessed.","Savings that grow over time because idle periods keep the cache warm."],"correct":[1],"explanation":"Request frequency lower than the TTL means the cache will not give consistent savings, since each call pays the write cost. Match the cache lifetime to call frequency and how often the fixed content changes.","mnemonic":"Gap longer than TTL, write forever."},{"id":"d2s4q18","concept":"cache-economics","type":"single","stem":"Cache writes cost more than standard input and cache reads cost less. Which workload produces the largest caching savings?","options":["A short prefix used a handful of times a week","A prefix reused only once after the initial write","A prefix that changes on every request but is very long","A long, stable prefix reused across many requests within the TTL"],"correct":[3],"explanation":"Savings scale with both the length of the cached prefix and how often it is reused within the TTL. The first use pays the higher write cost, which is amortized across many cheaper reads, while a prefix that changes every request never hits. Verify current cache rates on the pricing page.","mnemonic":"Pay once to write, save on every read."},{"id":"d2s4q07","concept":"cache-not-worth","type":"multi","stem":"In which TWO situations is enabling prompt caching likely to cost more than it saves? Select TWO.","options":["The fixed portion of the prompt is small","The prompt is called constantly with a large fixed prefix","The prompt is called infrequently, so the write is rarely amortized","The fixed instruction block is 8,000 tokens and reused each minute","The static content is placed first and dynamic content last"],"correct":[0,2],"explanation":"Caching has its own write cost, so a small fixed portion or rarely called prompt may never recoup it. Caching is a design decision, not a default to enable everywhere.","mnemonic":"Small or seldom: skip the cache."},{"id":"d2s4q08","concept":"cache-response-identical","type":"single","stem":"A stakeholder worries that prompt caching will return stale or altered model answers. Which statement is accurate?","options":["Caching stores the final response and replays it for matching requests later.","Caching returns a cheaper, abbreviated answer with the same overall meaning.","Caching stores the prompt prefix; the response matches an uncached call.","Caching changes the response only when the user message is very short."],"correct":[2],"explanation":"What is stored is the processed prompt prefix, not the response. The response is identical to what you would get without caching.","mnemonic":"Cache the prompt, not the answer."},{"id":"d2s4q09","concept":"consistency-window","type":"single","stem":"A team caches a prefix that includes a live inventory snapshot, and answers sometimes reflect outdated stock levels. What risk was overlooked?","options":["The cache write cost exceeded the cost of the original request.","The model rewrote the cached state during generation.","Caching created a consistency window where cached content lags live state.","The breakpoint was placed after the dynamic content."],"correct":[2],"explanation":"If cached content must reflect live state, caching introduces a consistency window that may violate the use case requirements. Live values belong in dynamic content or a tool call.","mnemonic":"Cached prefix freezes the facts inside it."},{"id":"d2s4q10","concept":"library-vs-skill","type":"single","stem":"A procedure must run the same way across several products, with versioning, approval and rollback. Which reuse approach best fits?","options":["A shared document of prompt tips that teams copy when needed","A Skill, packaged as a versioned self-contained unit","A modular prompt library assembled in each team's own code","A longer system prompt copied into each product"],"correct":[1],"explanation":"Lean toward a Skill when the procedure is stable, distributed across teams or products, and needs versioning, approval and rollback. A library suits an often-tweaked prompt within one team or codebase.","mnemonic":"Many teams, one governed procedure: Skill."},{"id":"d2s4q11","concept":"library-vs-skill","type":"single","stem":"An engineering team within one codebase assembles and frequently tweaks prompt fragments, with light governance. Which approach is the better fit?","options":["A modular prompt library owned by the engineers","A Skill with formal approval workflow for every tweak","A cached monolithic prompt that nobody edits","A copy of the prompt in each service repository"],"correct":[0],"explanation":"A modular prompt library is a shared collection of fragments and templates that engineers assemble in their own code. It fits within one codebase and light governance, whereas Skills suit stable, distributed, governed procedures.","mnemonic":"One codebase, often tweaked: library."},{"id":"d2s4q12","concept":"skill-packaging","type":"single","stem":"What does a Skill package together?","options":["Only a system prompt and a list of few-shot examples","A SKILL.md with instructions, optional scripts and version management","A cache breakpoint configuration and a TTL","A model selection rule and an eval threshold"],"correct":[1],"explanation":"A Skill is a versioned, self-contained unit: SKILL.md packages the instructions, optional executable scripts and version management so the whole procedure travels as one governed artifact.","mnemonic":"SKILL.md: instructions, scripts, version, one unit."},{"id":"d2s4q13","concept":"ungoverned-drift","type":"single","stem":"A prompt is copy-pasted across five teams, each adjusting it slightly. Which risk does this most directly create?","options":["The shared prefix becomes so stable that caching stops working for any team.","The model refuses prompts that appear in several products at once.","Token counts fall below the minimum length that can be cached.","Many slightly different versions drift apart, each with quietly different behavior."],"correct":[3],"explanation":"An ungoverned prompt copied across teams drifts into many versions. Versioned reuse, as a Skill provides, is the control, because a sprawl of copy-pasted prompts cannot be reviewed or rolled back.","mnemonic":"Copy, paste, drift apart."},{"id":"d2s4q14","concept":"cache-ttl-frequency","type":"multi","stem":"With the default 5-minute TTL, which TWO workloads will realize consistent caching savings? Select TWO.","options":["A long stable prefix called several times every minute","A long stable prefix called once every thirty minutes","A long prefix that is rebuilt differently on every call","A long stable prefix called steadily every few seconds","A short fixed block called twice during each working day"],"correct":[0,3],"explanation":"Savings need requests more frequent than the TTL against a prefix that stays fixed. Calls spaced beyond the TTL expire the cache and repeat the write cost, and a prefix that changes each call never hits.","mnemonic":"Call faster than five minutes or pay the write again."},{"id":"d2s4q15","concept":"cache-economics","type":"single","stem":"Why must a caching cost model include the first request on a new prefix?","options":["The first request is always rejected and must be retried at full price.","Cache writes carry a higher per-token cost than standard input on first use.","The first request returns a lower quality answer while the cache warms.","Cached prefixes are billed at the output token rate on every later read."],"correct":[1],"explanation":"Writing to the cache costs more than standard input, while reads are cheaper (verify current rates on the pricing page). Savings only appear once the write is amortized over enough reads.","mnemonic":"Pricey write once, cheap reads after."},{"id":"d2s4q16","concept":"consistency-window","type":"single","stem":"Which prompt is the riskiest candidate for caching in its entirety?","options":["A prompt whose prefix embeds an hourly-changing price table that answers must always reflect","A prompt whose prefix holds a stable 8,000-token policy document used for all customers","A prompt whose prefix holds fixed role, scope and output-contract instructions only","A prompt whose prefix contains an unchanging style guide reused across all requests"],"correct":[0],"explanation":"If cached content must reflect live state, caching creates a consistency window that may violate the use case. Stable policy and instructions are ideal cacheable content; live values belong after the breakpoint or behind a tool call.","mnemonic":"Cache the constants, never the changing numbers."}]}]},{"domain":3,"subjects":[{"id":"d3s1","title":"Build-time interfaces, entry points and delivery routes","learn":["Claude.ai trades zero build for zero integration. Team adds admin controls, SSO/SAML, domain capture, a no-training commitment; Enterprise adds SCIM, configurable retention, audit logs, Compliance API, a HIPAA-ready BAA option.","API and SDK are the same entry point with different ergonomics; the Anthropic SDK does not run an agent loop. The Agent SDK is the managed loop that powers Claude Code, embedded in your own product.","MCP is a sharing convention across clients, not an alternative to API tool use; with only one client it adds overhead without payback.","Claude Code is built for developer workflows and is not a backend for multi-tenant or customer-facing products; use the API, client SDK or Agent SDK.","Four delivery routes (first-party, Bedrock, Vertex, Foundry) are chosen by cloud commitments, procurement and identity, not capability. CSP routes lag on new features; model IDs differ.","Skills attach via container.skills and /v1/skills and need the Code Execution Tool. Pick the entry point by the work and name its tradeoff out loud; that stated tradeoff later signals when to switch."],"traps":["SDK equals agent loop: the Anthropic SDK is only a typed wrapper over the API; the loop is still your code. The Agent SDK is the one that runs it.","MCP as default: treating MCP as the integration layer for everything, or as a rival to API tool use, when only one client needs the tools.","Claude Code everywhere: reaching for it on non-engineering work or as the engine of a customer-facing product.","Capability-based route choice: picking Bedrock, Vertex or Foundry for model quality, when the model is the same and commitments decide.","Feature parity assumption: assuming CSP routes ship new features the day first-party does, or share model identifiers."],"questions":[{"id":"d3s1q01","concept":"sdk-vs-agent-sdk","type":"single","stem":"An engineer proposes adopting the Anthropic Python SDK 'so we do not have to write the agent loop'. Which statement about the SDK is accurate?","options":["It wraps the API with typed helpers, but any agent loop is still the partner's own code","It is a separate entry point whose model behaviour differs from the direct API","It runs a managed loop that iterates tool calls and handles termination until completion","It supplies the same iteration and stop logic that powers Claude Code in partner apps"],"correct":[0],"explanation":"The SDK is a convenience wrapper over the same API entry point; it handles authentication, retries, streaming and tool-use boilerplate but runs no agent loop. The managed loop belongs to the Agent SDK.","mnemonic":"SDK wraps, Agent SDK loops."},{"id":"d3s1q02","concept":"sdk-vs-agent-sdk","type":"single","stem":"A team wants Claude to work across many turns inside their own web application, with iteration, tool execution and termination handled for them. Which build-time interface fits best?","options":["An MCP server, since it manages the agent loop for every connected client","The Agent SDK, which runs the managed loop used by Claude Code from your own code","The Anthropic Python SDK, which handles tool use and keeps iterating until the task is done","The direct API, since it already includes iteration and termination handling for you"],"correct":[1],"explanation":"The Agent SDK is the managed runtime for multi-turn tool use embedded in your own product. The Anthropic SDK only reduces boilerplate, and MCP shares tools across clients rather than running a loop.","mnemonic":"Many turns in my app? Agent SDK."},{"id":"d3s1q03","concept":"mcp-vs-api-tool-use","type":"single","stem":"One internal support app is the only client that will ever use three custom tools. A colleague insists on building an MCP server for them. What is the best response?","options":["Build the MCP server, because MCP replaces API tool use as the standard calling convention","Use API tool use directly, because MCP's reuse benefit is absent and adds overhead","Build the MCP server, because MCP is the default integration layer for any tool","Move the tools to the Agent SDK, because MCP cannot run inside a single product"],"correct":[1],"explanation":"MCP is a sharing convention across clients. When tools live inside one product only, raw API tool use is the better choice and MCP adds protocol overhead and harder debugging.","mnemonic":"One client, no MCP."},{"id":"d3s1q04","concept":"mcp-vs-api-tool-use","type":"multi","stem":"Which TWO statements about MCP and API tool use are accurate? Select TWO.","options":["MCP is an alternative that replaces API tool use in a single product","MCP is required whenever Claude calls any tool","MCP removes debugging complexity compared with direct function calls","An MCP server exposes tools that clients then call using API tool use","MCP is a convention for sharing tools across multiple Claude clients"],"correct":[3,4],"explanation":"MCP and API tool use operate at different layers: MCP exposes and discovers tools across clients, and the calls themselves still use API tool use. MCP actually makes tool-call debugging more complex, not simpler.","mnemonic":"MCP shares; API tool use calls."},{"id":"d3s1q05","concept":"claude-code-not-backend","type":"single","stem":"A startup plans to run Claude Code behind its customer-facing, multi-tenant support portal because it already works well for their developers. What should the architect recommend?","options":["Keep Claude Code but assign each tenant a separate permission mode to provide proper isolation","Build on the Claude API, client SDK or Agent SDK, since Claude Code targets developer workflows","Switch to Claude Cowork, which is the supported backend for customer-facing products","Keep Claude Code and add hooks, since the governing layers make it multi-tenant safe"],"correct":[1],"explanation":"Claude Code is not designed as a backend for multi-user or customer-facing products. Product integrations should use the API, SDK or Agent SDK. Hooks and permission modes do not change its intended use.","mnemonic":"Devs use Claude Code; customers get the API."},{"id":"d3s1q06","concept":"claude-code-not-backend","type":"single","stem":"What is the strongest reason not to choose Claude Code as the engine of a customer-facing product?","options":["It is only available through the Bedrock and Vertex delivery routes, not first-party","It targets developer workflows rather than serving as a multi-tenant or customer-facing backend","It offers no permission boundaries or sandboxing options for production use at all","It cannot read or edit any files outside a single repository directory on the machine"],"correct":[1],"explanation":"Claude Code targets developer workflows and is not meant for multi-tenant products. It does have permission boundaries and hooks, and it is not route-restricted.","mnemonic":"Claude Code: developer desk, not customer door."},{"id":"d3s1q07","concept":"route-by-commitment","type":"single","stem":"A partner has a committed AWS enterprise agreement, uses IAM everywhere and wants AI spend to draw down against that commitment. Which delivery route is usually easiest, and why?","options":["Foundry, because Entra ID federates with IAM at no extra effort or cost","The first-party API, because it always offers the strongest model capability on any route","Bedrock, because spend, identity and audit inherit from the existing AWS agreement","Vertex AI, because it provides the broadest regional availability of any delivery route"],"correct":[2],"explanation":"Routes are chosen by what the partner has already committed to, not by capability: the model behaves the same on each. AWS contract plus IAM points to Bedrock.","mnemonic":"Where you've signed, there you route."},{"id":"d3s1q08","concept":"route-by-commitment","type":"single","stem":"What should primarily decide among the Anthropic first-party, Bedrock, Vertex and Foundry delivery routes?","options":["Differences in reasoning quality between the model versions on each route","Which route supports the largest context-window behaviour for long documents","Whether prompting and evaluation strategy can transfer between the routes","Existing cloud commitments, procurement contracts and the partner's identity system"],"correct":[3],"explanation":"The model, prompting, evaluation strategy, tool use and context behaviour are the same across routes. What differs is the wrapper: billing, identity, region and procurement.","mnemonic":"Same model, different paperwork."},{"id":"d3s1q09","concept":"csp-route-lag","type":"single","stem":"A partner on Vertex AI asks why a feature announced by Anthropic last week is not yet available to them. What is the most consistent explanation?","options":["Cloud routes tend to lag the first-party API on new features by weeks","The partner's prompts must be rewritten for Vertex before features unlock","The feature needs a Claude Enterprise plan before it works on Vertex","Vertex serves a weaker model variant that has different tool-use behaviour"],"correct":[0],"explanation":"Bedrock, Vertex and Foundry typically trail the first-party API on new features. Prompting and tool use transfer unchanged, so the lag is a delivery matter, not a model difference.","mnemonic":"Cloud routes trail the launch day."},{"id":"d3s1q10","concept":"route-differences","type":"multi","stem":"When the same Claude model is reached through a different delivery route, which TWO things change? Select TWO.","options":["Context-window behaviour of the model","Model identifiers and version strings","Regional availability and CSP-side wrapper features","The prompting strategy needed for equivalent results","Tool-use semantics inside a single request"],"correct":[1,2],"explanation":"Identifiers, regional availability and wrapper concepts (inference profiles, model deployments, Model Garden controls) differ. Prompting, evaluation, tool use and context behaviour all transfer.","mnemonic":"New wrapper, same brain."},{"id":"d3s1q11","concept":"foundry-hosting","type":"single","stem":"A GDPR-sensitive partner wants to deploy Claude on Microsoft Foundry. Foundry offers Hosted on Azure and Hosted on Anthropic infrastructure forms. What should the architect do?","options":["Assume all Foundry models run inside the partner's Azure environment by default","Assume Entra ID authentication guarantees EU residency for every deployed model","Choose the Anthropic-infrastructure hosting form because it is generally available","Verify the hosting form and compliance posture of each specific model first"],"correct":[3],"explanation":"Only the Hosted on Azure form runs inference in the partner's Azure environment; other models route to Anthropic-managed infrastructure. Residency claims must be checked per model.","mnemonic":"Foundry: check where inference actually runs."},{"id":"d3s1q12","concept":"skills-integration","type":"single","stem":"A team attaches a versioned Skill to requests via container.skills and publishes it through /v1/skills. What dependency does this integration carry?","options":["The Code Execution Tool, which provides a sandboxed execution environment","An MCP server hosting the Skill for every connected client","A Bedrock inference profile used to version the Skill","The Agent SDK, which must run the Skill's managed loop"],"correct":[0],"explanation":"Skills are an integration mechanism that require the Code Execution Tool to run, adding a sandboxed execution dependency to the pattern.","mnemonic":"Skills ride on code execution."},{"id":"d3s1q13","concept":"claude-ai-tiers","type":"single","stem":"A firm already has SSO and now needs SCIM provisioning, configurable retention, audit logs and a Compliance API on Claude.ai. Which tier provides these?","options":["Team, which adds SCIM and the Compliance API on top of its existing admin controls","Pro, which adds audit logs for individual users and for small teams as well","Max, which adds configurable retention for shared Projects and uploaded files","Enterprise, adding SCIM, configurable retention, audit logs, Compliance API and a BAA option"],"correct":[3],"explanation":"Team adds admin controls, SSO/SAML, domain capture and a no-training commitment. SCIM, retention settings, audit logs, Compliance API and the HIPAA-ready BAA option are Enterprise.","mnemonic":"Team has SSO; Enterprise has SCIM and audit."},{"id":"d3s1q14","concept":"entry-point-follows-work","type":"multi","stem":"Which TWO are described as the most common entry point mistakes? Select TWO.","options":["Using the SDK instead of raw HTTP for typed helpers","Choosing the Agent SDK when a managed loop is needed","Treating MCP as the default integration layer regardless of reuse needs","Reaching for Claude Code on non-engineering work","Picking a delivery route by existing cloud commitment"],"correct":[2,3],"explanation":"The entry point should follow the work. Claude Code suits engineering, and MCP only pays back when tools are shared across clients. The other options are sound choices.","mnemonic":"Work first, entry point second."},{"id":"d3s1q15","concept":"entry-point-follows-work","type":"single","stem":"Operations staff who are not developers need Claude to manage files and tasks directly on their own computers. Which entry point is the best fit?","options":["Claude in Chrome, since it automates file management across the desktop","Claude for Excel, since spreadsheets hold most operations task data","Claude Code, since it is the only entry point that can act on local files","Claude Cowork, the desktop agent for non-developers working with local files and applications"],"correct":[3],"explanation":"Cowork targets non-engineering roles needing real system actions on the machine, with permission scoping and human review mattering more. Chrome fits web apps and Excel fits spreadsheets.","mnemonic":"Non-devs on their desktop: Cowork."},{"id":"d3s1q16","concept":"sdk-default-raw-http","type":"single","stem":"A product team is embedding Claude in its TypeScript service and asks whether to call the HTTP API directly or use the official SDK. What is the recommended default, and what is the main exception?","options":["Use raw HTTP by default, since the SDK changes model behaviour relative to the direct API","Use the Agent SDK by default, since the client SDK cannot handle streaming or tool use","Use raw HTTP by default; switch to the SDK only once traffic justifies the wrapper overhead","Use the SDK by default; drop to raw HTTP only for a freshly shipped feature it lacks"],"correct":[3],"explanation":"The SDK is the same entry point as the API with language-native types, streaming and tool-use helpers, and it is the default for most teams. The only reason to drop to raw HTTP is an API feature the SDK has not exposed yet. Model behaviour does not differ between the two.","mnemonic":"SDK by default; HTTP only for the brand-new."},{"id":"d3s1q17","concept":"sdk-default-raw-http","type":"single","stem":"A team on the Python SDK needs a capability Anthropic shipped on the API yesterday, but the SDK has not exposed it yet. What is the appropriate move?","options":["Call that feature over raw HTTP until the SDK catches up, keeping the SDK elsewhere","Move the whole integration to the Agent SDK, which exposes new API features first","Wait for a CSP route such as Bedrock, which ships new features before the SDK does","Build an MCP server around the feature so every client can reach it on day one"],"correct":[0],"explanation":"SDK abstractions move at Anthropic's release cadence, so a raw API feature the SDK lacks means dropping back to HTTP for that feature. CSP routes tend to lag the first-party API, so waiting on Bedrock delays the feature further.","mnemonic":"SDK lags the API? Bridge the gap with HTTP."},{"id":"d3s1q18","concept":"claude-ai-zero-integration","type":"single","stem":"A software vendor wants Claude's chat experience inside its own customer portal, under its own branding and with control over which features users see. The sponsor proposes buying Claude.ai Enterprise seats. What is the core problem?","options":["Claude.ai Enterprise lacks SSO, so portal users could not sign in with their identity","Claude.ai runs a different model from the API, so answer quality would not match","Claude.ai cannot be embedded in another product or customized in what it exposes","Claude.ai requires a Bedrock or Vertex route before it can serve external customers"],"correct":[2],"explanation":"Claude.ai has zero build cost but also zero integration: you get the product Anthropic ships, and you cannot embed it or change what it exposes. Embedding Claude in a product calls for the API or SDK. Enterprise does include SSO, and the model is the same.","mnemonic":"Claude.ai: zero build, zero embed."},{"id":"d3s1q19","concept":"claude-ai-zero-integration","type":"single","stem":"Which statement captures the core tradeoff of Claude.ai as an entry point?","options":["Maximum control, but the partner's team owns retries, streaming and the UI","Reuse across clients, but added architectural complexity for a single client","A managed agent loop, but less fine-grained control over the orchestration","Zero build cost, but zero integration: you get the shipped product as it is"],"correct":[3],"explanation":"Claude.ai trades zero build cost for zero integration, because the product cannot be embedded or customized. Maximum control with full ownership describes the direct API, reuse versus complexity describes MCP, and the managed loop describes the Agent SDK.","mnemonic":"Nothing to build, nothing to bend."},{"id":"d3s1q20","concept":"claude-for-work-team-tier","type":"single","stem":"A 40-person consultancy wants staff on Claude.ai with SSO via SAML, domain capture, admin controls and a contractual commitment not to train on customer content. It has no need for SCIM, audit logs or a BAA. Which tier fits best?","options":["Max, the top consumer tier","Claude for Work, Team tier","Claude for Work, Enterprise tier","Pro, a consumer tier for individuals"],"correct":[1],"explanation":"The Team tier of Claude for Work adds admin controls, SSO and SAML, domain capture and a no-training commitment. Enterprise adds SCIM, configurable retention, audit logs, a Compliance API and a BAA option, none of which are needed here. Consumer tiers suit low-sensitivity work without governance controls.","mnemonic":"SSO plus no-training is Team; SCIM and audit is Enterprise."},{"id":"d3s1q21","concept":"cowork-supervision","type":"single","stem":"An operations team adopts Claude Cowork to reorganize shared files and automate routine tasks on their desktops. Compared with a chat-only entry point, what deserves more design attention?","options":["Prompt caching configuration, because Cowork resends every local file on each turn","Permission scoping and human review, because Cowork acts directly on the user's machine","MCP server design, because Cowork can reach local files only through a custom server","Agent SDK orchestration, because Cowork needs partner code to run its action loop"],"correct":[1],"explanation":"Cowork's tradeoff is real system actions versus supervision overhead. Because it works on the user's machine directly, permission scoping and human review matter more than they do in a chat-only entry point. It needs no custom MCP server or partner-written loop to reach local files.","mnemonic":"Cowork touches your machine: scope it, review it."},{"id":"d3s1q22","concept":"bedrock-inference-profiles","type":"single","stem":"A partner on AWS Bedrock finds that the Claude model it needs is not available in every region its traffic comes from, and asks how Bedrock handles routing requests across regions. Which Bedrock concept addresses this?","options":["Model Garden access controls, which enable the model per project and region","Inference profiles, which solve the cross-region routing problem on Bedrock","Model deployments, which pin the model into the partner's own Azure region","The legacy InvokeModel path, which bypasses regional availability entirely"],"correct":[1],"explanation":"On Bedrock, regional availability matters and inference profiles solve cross-region routing. Model Garden access controls belong to Vertex and model deployments to Foundry. The architect needs to know these wrapper concepts exist even when the partner's engineers own the implementation.","mnemonic":"Bedrock crosses regions by profile."},{"id":"d3s1q23","concept":"entry-point-cost-risk","type":"multi","stem":"A partner's use case is an internal drafting assistant for analysts. The proposal adds Claude.ai, Claude Code and a custom API app 'to keep options open'. Which TWO statements reflect sound entry-point guidance? Select TWO.","options":["Several entry points up front keep options open at little added integration cost","Add another entry point only when the use case genuinely spans it","Migration cost is mostly rewritten code, since user habits transfer between entry points","Starting on the right entry point is cheaper than migrating off the wrong one later","MCP should be the default integration layer so entry points can be swapped freely"],"correct":[1,3],"explanation":"Each entry point carries real integration cost, so pick more than one only when the use case spans them. Outgrowing the wrong entry point is expensive because of rewritten code and also the conventions and habits built around it, so starting on the right one is cheapest. Treating MCP as the default layer is a named mistake.","mnemonic":"One entry point per real need; start right, avoid the move."},{"id":"d3s1q24","concept":"entry-point-cost-risk","type":"single","stem":"A team built on an entry point that no longer fits its work and now plans to migrate. Beyond rewriting code, what makes outgrowing the wrong entry point expensive?","options":["Model behaviour differs between entry points, so every prompt must be retrained","Anthropic charges a migration fee when a workload moves between entry points","Delivery routes are fixed per entry point, so the cloud contract must be renegotiated","The conventions and user habits that have built up around the original entry point"],"correct":[3],"explanation":"Outgrowing the wrong entry point costs more than code: conventions and user habits form around it and have to be unwound. The same model sits under every entry point, so prompts are not retrained, and the layers are largely independent.","mnemonic":"Habits are the hidden migration bill."},{"id":"d3s1q25","concept":"entry-point-tradeoffs","type":"single","stem":"A team needs Claude to work across many tool-using turns inside its product, but must run custom validation logic between every turn. Which approach fits?","options":["The Agent SDK, since its managed loop exposes every iteration step","A raw API loop, accepting the cost of building and maintaining it","Claude Code, since it already handles multi-turn tool execution","An MCP server, which adds control between turns of the loop"],"correct":[1],"explanation":"The Agent SDK's managed loop gives up fine-grained control over each iteration, so custom logic between turns calls for a raw API loop, at the cost of building and maintaining it. Claude Code is not a product backend, and MCP standardizes tool connections rather than loop control.","mnemonic":"Need hands between turns? Write the loop yourself; the Agent SDK drives its own."},{"id":"d3s1q26","concept":"entry-point-tradeoffs","type":"multi","stem":"Which TWO trade-offs of build-time entry points are stated correctly? Select TWO.","options":["Agent SDK: the managed loop gives the finest control over each iteration","Direct API: you build and maintain retries, streaming, tool orchestration and errors","MCP: it removes a protocol layer, so tool calls are easier to debug","SDK: version upgrades can change behavior, so review code before deploying","SDK: it handles orchestration for you, leaving only HTTP to your code"],"correct":[1,3],"explanation":"The direct API gives full control but leaves retries, streaming, tool orchestration and error handling to you, and SDK upgrades can occasionally change behavior, needing code review. The SDK handles the HTTP layer and leaves orchestration to your code, and MCP adds a protocol layer that makes debugging harder.","mnemonic":"API: you own it all. SDK: owns HTTP, review upgrades. MCP: extra layer, harder debug."},{"id":"d3s1q27","concept":"name-the-tradeoff","type":"single","stem":"An architect recommends an entry point to a partner. Why should the architect name that entry point's core tradeoff out loud at the time of the recommendation?","options":["A stated tradeoff is required before procurement will clear the delivery route","Naming the tradeoff lets the team skip eval gating when it later switches","Stating what was given up is what later signals when the work has outgrown it","The named tradeoff fixes the entry point for good, so no later switch is needed"],"correct":[2],"explanation":"The right recommendation is one whose core tradeoff you can name out loud when you make it; naming it is what tells you, later, when to switch. Delivery routes are a separate procurement decision, and naming a tradeoff does not fix the entry point for good.","mnemonic":"Say the tradeoff now; it tells you when to switch later."},{"id":"d3s1q28","concept":"name-the-tradeoff","type":"single","stem":"A year after an entry point was recommended, a team debates whether it is time to switch to another one. Which earlier practice gives them the clearest signal?","options":["Having named the entry point's core tradeoff out loud when it was recommended","Having picked the entry point the team already had licences for on the shelf","Having chosen the entry point with the broadest tool set available at launch","Having deferred the entry point choice until the delivery route was signed"],"correct":[0],"explanation":"Naming the tradeoff out loud at recommendation time is what tells you later when to switch: once the work needs what was given up, it has outgrown the entry point. Choosing by what is on the shelf is the mistake the guidance warns against.","mnemonic":"A named tradeoff is a built-in switch signal."}]},{"id":"d3s2","title":"RAG: chunking, indexing and retrieval strategy","learn":["Chunking follows document structure: fixed-size for homogeneous unstructured text, semantic for self-contained prose, hierarchical for contracts, manuals and policies where section context carries meaning.","Indexing follows query pattern: dense for paraphrase and intent, sparse (BM25) for exact tokens such as part numbers, statute citations and error codes, hybrid for mixed patterns; reciprocal rank fusion merges the lists.","Retrieval trades quality, latency and maintenance; quality is measured against a labelled set because it is invisible in fluent output.","Retrieval is for stable reference material such as docs, policies and manuals; live state needs a tool call to the system that owns it. A better embedding model or shorter refresh interval will not fix it.","Confident wrong answers after a document refresh with unchanged latency and model point first to retrieval or indexing.","Progressive, just-in-time context is the default for production; monolithic suits bounded tasks and stable cacheable prefixes. RAG fails on split tables or code, top-k recall misses and multi-document synthesis."],"traps":["Chunk-size default: picking a size rather than matching chunking to document structure.","Dense-only for everything: missing exact identifiers like part numbers or citations that need a sparse or hybrid index.","RAG for live state: stale chunks look fluent and error-free; a better embedding model or faster refresh will not cure it.","Blaming the model: after a refresh, confident wrong answers with unchanged latency and model version point to retrieval first, not temperature or weights.","Monolithic by habit: loading everything works until context accumulates and the working-memory cliff arrives silently."],"questions":[{"id":"d3s2q01","concept":"chunking-match-structure","type":"single","stem":"A legal-tech team indexes contracts and policy manuals where the meaning of a clause depends on its section and subsection. Which chunking approach fits best?","options":["One chunk per entire document, so that no section is ever split apart by the chunker","Fixed-size chunking with overlap, because it is the simplest approach to operate and tune","Hierarchical chunking that preserves sections and subsections and retrieves at the fitting level","Semantic chunking only, splitting on topic shifts while ignoring document headings"],"correct":[2],"explanation":"Hierarchical chunking suits structured documents where section context carries meaning. Fixed-size ignores structure and cuts across clauses.","mnemonic":"Structured docs, hierarchical chunks."},{"id":"d3s2q02","concept":"chunking-match-structure","type":"multi","stem":"Which TWO pairings of chunking approach and corpus are well matched? Select TWO.","options":["Fixed-size chunking for structured policies where section hierarchy carries the meaning","Hierarchical chunking for flat unstructured chat transcripts","Hierarchical chunking for contracts and manuals where section context carries meaning","Fixed-size chunking with overlap for homogeneous unstructured text with weak natural boundaries","Semantic chunking for tabular price lists with rigid column layouts"],"correct":[2,3],"explanation":"Chunking is chosen by the structure of the source, not a default size. Fixed-size is the simple choice for homogeneous text; hierarchical keeps structure for sectioned documents.","mnemonic":"Match chunker to document shape."},{"id":"d3s2q03","concept":"sparse-exact-tokens","type":"single","stem":"Users search a parts catalogue with queries like 'KX-4410-B gasket' and a dense-only index keeps returning semantically similar but wrong parts. What change best addresses this?","options":["Shorten the index refresh interval so new part numbers appear sooner","Add a sparse BM25 index beside the dense one as a hybrid","Raise the embedding model's dimensionality while keeping a dense-only index","Switch to larger fixed-size chunks so each result carries more context"],"correct":[1],"explanation":"Queries hinging on exact tokens such as part numbers need keyword matching. Hybrid recovers the exact-match results dense retrieval misses while keeping semantic recall.","mnemonic":"Exact codes want keywords."},{"id":"d3s2q04","concept":"sparse-exact-tokens","type":"single","stem":"Which query pattern most clearly justifies adding sparse (keyword) retrieval to a dense index?","options":["Lookups of statute citations and error codes that depend on specific tokens","Questions paraphrased very differently from the wording of the source text","Broad conceptual questions about user intent and general themes","Requests about the current status of a customer's order"],"correct":[0],"explanation":"Sparse methods such as BM25 match exact terms and identifiers. Paraphrase and concept matching is the dense index's strength, and live order status is not a retrieval problem at all.","mnemonic":"BM25 for IDs, dense for ideas."},{"id":"d3s2q05","concept":"dense-paraphrase","type":"single","stem":"Employees ask HR questions in casual wording that rarely matches the formal policy text. Which indexing strategy handles this pattern best on its own?","options":["Fixed-size chunking with no embedding index of any kind","Dense embeddings, which match meaning rather than exact words","Sparse keyword search combined with a much larger top-k setting","Sparse BM25, which matches paraphrased intent instead of shared terms"],"correct":[1],"explanation":"Dense indexes capture semantic similarity, which suits queries phrased differently from the source. Sparse retrieval depends on shared terms.","mnemonic":"Paraphrase? Dense."},{"id":"d3s2q06","concept":"rrf","type":"single","stem":"A hybrid index returns one dense ranked list and one sparse ranked list. Which approach is the standard low-tuning way to merge them?","options":["Retraining the embedding model on the sparse list's top-ranked results","Averaging the raw similarity scores from both lists into one number","Reciprocal rank fusion, which scores by rank so items strong in both lists rise","Keeping only the dense list whenever the two lists disagree on order"],"correct":[2],"explanation":"Reciprocal rank fusion works on ranks, favoring items that rank well in both lists, and gives a defensible default for combining dense and sparse results.","mnemonic":"Rank in both lists wins."},{"id":"d3s2q07","concept":"retrieval-tradeoff","type":"single","stem":"Which statement best describes the retrieval design trade-off?","options":["Hybrid indexing improves retrieval quality while also lowering both latency and ongoing maintenance effort","Smaller chunks and hybrid indexing raise quality and latency together; large dense-only designs trade quality for speed","Dense-only retrieval with large chunks maximises quality at essentially no added cost to the team","Smaller chunks lower latency and raise maintenance cost without any change in quality at all"],"correct":[1],"explanation":"The three-way trade-off among quality, latency and maintenance has no universal answer; choose the point that fits the corpus and queries, and be able to defend it.","mnemonic":"Quality, latency, upkeep: pick two to lean."},{"id":"d3s2q08","concept":"retrieval-eval","type":"single","stem":"A RAG system produces fluent answers, but the team cannot tell whether the right chunks are being retrieved. How should retrieval quality be assessed?","options":["Increase top-k until the answers stop looking wrong to the human reviewers","Measure it against a labelled set, since poor retrieval is invisible in output","Read a sample of the final answers and check them carefully for fluency and tone","Track the latency and error-rate dashboards for retrieval calls over time"],"correct":[1],"explanation":"The failure mode is a confident answer built on the wrong chunk, which looks fine. Retrieval quality must be evaluated directly against labelled data.","mnemonic":"Fluent is not found: label and measure."},{"id":"d3s2q18","concept":"retrieval-vs-live-state","type":"multi","stem":"Which TWO symptoms suggest that a system is using retrieval where a tool call belongs? Select TWO.","options":["Answers that contradict what the database currently holds","Chunks that split tables or code blocks across boundaries","p95 latency that climbs as top-k is increased","Results that shift each time the index is refreshed","Exact identifiers missed by a dense-only index"],"correct":[0,3],"explanation":"Stale chunks, results that shift with each index refresh and answers that contradict the database are the signs of retrieval applied to live state; the fix is calling the system that owns that state, not a better embedding model or shorter refresh interval. Split tables and missed identifiers are real RAG problems, but they point to chunking and indexing, not to a missing tool call.","mnemonic":"Shifts with each refresh, contradicts the database: live state, so call the owner."},{"id":"d3s2q10","concept":"retrieval-vs-live-state","type":"multi","stem":"An assistant gives stale, confident answers about inventory levels pulled from a vector index. Which TWO changes are appropriate? Select TWO.","options":["Move to a more accurate embedding model for the vector index","Query the inventory system directly with a tool call","Shorten the index refresh interval so inventory updates arrive sooner","Raise the similarity threshold applied to retrieved chunks","Keep stable product manuals and FAQs in the retrieval index"],"correct":[1,4],"explanation":"Retrieval is for stable knowledge; tool use is for live state. Better embeddings, faster refresh or thresholds still leave the answer a snapshot of past text.","mnemonic":"Index the manual, query the stock."},{"id":"d3s2q19","concept":"context-engineering","type":"single","stem":"A team that built a successful RAG assistant over internal documentation proposes reusing the same design for a new assistant. What should the architect check first?","options":["Whether the same embedding model and chunk size can be carried over unchanged","Whether top-k can be raised to cover the larger range of new questions","Whether the new answers live in reference material that stays stable between refreshes","Whether the existing index can be refreshed more often to keep it current"],"correct":[2],"explanation":"Context engineering means deciding which mechanism gets each kind of data in front of the model. RAG works when answers live in reference material that stays stable between index refreshes, such as documentation, policy text or manuals; reaching for it because it worked on a previous use case, without checking that property, is a common mistake. Tuning embeddings, top-k or refresh frequency does not help if the new use case is really about live state.","mnemonic":"Reuse RAG only if the answers sit still between refreshes."},{"id":"d3s2q12","concept":"rag-drift","type":"single","stem":"After a document refresh, a RAG assistant gives confident but incorrect answers while latency and model version are unchanged. What is the most likely first place to investigate?","options":["A temperature setting that has been configured too low for the task","A context window that has shrunk since the document refresh","The model weights having silently changed overnight without any announcement","Retrieval and indexing returning irrelevant or stale chunks, such as a broken re-index"],"correct":[3],"explanation":"A document refresh specifically touches retrieval and indexing. With model and latency unchanged, poor or stale context is the likeliest cause; the other options would not be triggered by a refresh.","mnemonic":"Refresh broke it? Check the index."},{"id":"d3s2q13","concept":"rag-failure-modes","type":"multi","stem":"Which TWO are documented ways that retrieval-based context fails? Select TWO.","options":["Chunking splits semantic units such as tables or code blocks","The correct document never enters the top-k results","Citations can never be produced from retrieved source documents","Retrieval removes the need to evaluate or maintain the pipeline","Queries needing synthesis across many documents are its strongest use case"],"correct":[0,1],"explanation":"RAG breaks on split units, recall misses and cross-document synthesis because chunks are scored independently. It also creates a retrieval system that must be evaluated and maintained.","mnemonic":"Split tables, missed top-k, lonely chunks."},{"id":"d3s2q14","concept":"progressive-vs-monolithic","type":"single","stem":"A long-running agent loop accumulates tool output and history every turn, and the window fills silently. Which context strategy is the better default?","options":["Retrieval alone, with no summarising or compaction of any of the earlier steps","Monolithic context that reloads the entire history and the full corpus on every call","A larger monolithic prompt sized to fill the maximum context window available","Progressive context: retrieve just in time and carry forward only what the next step needs"],"correct":[3],"explanation":"Monolithic context hits the working-memory cliff as context accumulates. Progressive staging is the default for most production workloads, often layered with retrieval and compaction.","mnemonic":"Stage the context; don't dump it."},{"id":"d3s2q15","concept":"progressive-vs-monolithic","type":"single","stem":"For which situation is a monolithic context strategy a reasonable choice?","options":["A tool loop where each step depends mainly on the most recent state","A multi-turn conversation whose history keeps growing with every additional turn","A knowledge base far too large to fit inside the context window","A bounded task with predictable input size and a stable, cacheable prefix"],"correct":[3],"explanation":"Monolithic loading suits bounded tasks with predictable inputs and cacheable prefixes. It breaks when context accumulates or when the corpus exceeds the window.","mnemonic":"Bounded and cacheable: dump is fine."},{"id":"d3s2q16","concept":"semantic-chunking","type":"single","stem":"A knowledge base of long explanatory articles keeps returning chunks that stop mid-argument, so answers miss the rest of the idea. Which chunking approach fits best?","options":["Fixed-size spans with overlap, since the text has weak natural boundaries","Hierarchical chunking that retrieves whole sections of contracts and manuals","Sparse BM25 indexing, so exact terms pull back the missing part","Semantic chunking on meaning boundaries so each chunk is self-contained"],"correct":[3],"explanation":"Semantic chunking splits on meaning boundaries such as topic shifts, which suits prose where a retrieved chunk must be self-contained and reduces mid-idea cuts. Fixed-size spans cut regardless of structure, and BM25 is an indexing choice, not a chunking one.","mnemonic":"Semantic cuts follow the thought, not the ruler."},{"id":"d3s2q17","concept":"retrieval-maintenance-sizing","type":"multi","stem":"Which TWO statements about the retrieval design trade-off are correct? Select TWO.","options":["Smaller chunks and hybrid indexing lower both latency and maintenance cost together","Maintenance as the corpus changes is an axis beside quality and latency","A pipeline that was correct at launch stays correct as new documents are added","Size the pipeline to your actual query patterns, not the most thorough one","Large chunks with dense-only indexing reliably handle exact-match identifier queries"],"correct":[1,3],"explanation":"Retrieval trades off quality, latency and maintenance, and the pipeline should be sized to the query patterns you actually have. Smaller chunks and hybrid indexing raise latency, a pipeline correct at launch can degrade silently as documents are added, and dense-only designs miss exact-match queries.","mnemonic":"Quality, latency, upkeep: size to the queries you have."}]},{"id":"d3s3","title":"Identity, authorization, least privilege and data handling","learn":["Identity comes from your authentication layer and is injected server-side into the system prompt with the user's role and authorised data; a role asserted in the user message can be faked.","Add extra context (department, permission level, account identifiers) only when needed to shape the response, not by default.","The authorization model of the underlying systems must govern the Claude layer; an integration that bypasses it exposes data through a path never built to enforce policy.","Least privilege means removing unneeded tools (attack surface and cost), recording justification, and scoping each subagent's tools to its task; logging and confirmation are compensating controls only.","Data minimisation uses a necessity filter: strip or redact before the call and pass reference IDs instead of full fields. The context window is not a data-governance boundary.","Use separate API keys per tenant so rate-limit breaches can be attributed and tenants isolated."],"traps":["User-asserted role: trusting a role the user claims in their message, or a role field they control, instead of verifying identity on the server and injecting it.","Monitor instead of remove: logging or confirmation prompts on an unneeded tool are detective controls; the tool is still reachable.","Convenience data: passing a sensitive field because it was available, when the language task never needed it; it lands in plaintext request logs.","Retention comfort: reasoning that no default retention makes PII in the prompt safe, ignoring application logs and carve-outs.","Shared key: one API key across tenants hides which tenant tripped the org-level rate limit."],"questions":[{"id":"d3s3q15","concept":"server-side-identity","type":"single","stem":"In a Claude integration that scopes answers to each user's permissions, where and when should the user's identity be verified?","options":["On the server before the call, injecting role and data scope into the system prompt","After the response is generated, in an output filter that strips data beyond the user's role","By Claude itself, which infers the user's role from cues across the conversation history","In a follow-up message where the user confirms the role they stated earlier"],"correct":[0],"explanation":"Identity verification belongs on the server, before the Claude call: the server takes identity from the authentication layer and injects the user's role and authorised data into the system prompt. Anything inside the conversation is under the user's control, so inferring or confirming the role there leaves it unverified, and an output filter acts too late to scope the answer.","mnemonic":"Verify on the server, before the call; inject the role, never ask for it."},{"id":"d3s3q02","concept":"server-side-identity","type":"single","stem":"Which design weakness makes an integration's per-user scoping unreliable?","options":["The server injects the role into the system prompt before each call","Roles are assigned through the firm's SSO login and directory process","Role and identity are passed as a field the user types in their message","The system prompt lists the data the user is authorised to access"],"correct":[2],"explanation":"A raw identity field in the user message is manipulable, so Claude cannot scope responses to what that user is truly authorised to see. Server-side injection removes the risk.","mnemonic":"If they can type it, they can fake it."},{"id":"d3s3q03","concept":"extra-context-when-needed","type":"single","stem":"When building the identity block for the system prompt, what is the right approach to extra attributes such as department, permission level and account identifiers?","options":["Include them only when needed to shape Claude's response, not by default","Include them only in the user message, where they are easier to audit","Always include every available attribute so Claude can personalise its answers","Include them by default, then redact the account identifiers afterwards"],"correct":[0],"explanation":"The role and authorised data scope belong in the prompt; additional context is added only when it is needed. Defaults widen exposure without adding capability.","mnemonic":"Role always; extras only on need."},{"id":"d3s3q04","concept":"authz-model-governs","type":"single","stem":"A Claude assistant queries the claims database through a service account that can read every record, so users see cases they could not open in the normal application. What principle was violated?","options":["Claude's system prompt should repeat the full database schema for each user session","The claims database should be moved entirely into the retrieval index for speed","The authorization model of the underlying systems must also govern the Claude layer","Claude should be given a larger context window to handle access control decisions"],"correct":[2],"explanation":"An integration that bypasses the underlying authorization model gives users access through a path never designed to enforce policy. The existing roles and policies must carry through to Claude.","mnemonic":"Claude inherits the data's access rules."},{"id":"d3s3q05","concept":"least-privilege-removal","type":"single","stem":"A customer-support agent has a delete-account tool its role does not require. Which change best applies least privilege?","options":["Switch the agent to a smaller and cheaper model tier instead","Log every call to the delete-account tool for later security review and follow-up","Remove the tool from the agent's configuration, eliminating that attack surface","Add a confirmation prompt before the tool is allowed to execute"],"correct":[2],"explanation":"Least privilege removes capabilities the role does not need. Logging and confirmation are detective or compensating controls that leave the tool reachable, and model size is unrelated to authorization scope.","mnemonic":"Don't guard the door; remove it."},{"id":"d3s3q06","concept":"least-privilege-removal","type":"single","stem":"Why are confirmation prompts an inadequate substitute for removing an unneeded tool?","options":["They make the tool slower to use but equally safe in effect","They compensate for the risk, but the tool stays reachable as attack surface","They apply only to subagents and never to top-level agents","They become redundant once detailed logging has been enabled"],"correct":[1],"explanation":"Compensating controls manage the risk of a tool that stays connected. Removal eliminates the exposure entirely, which is the stronger control.","mnemonic":"Confirm, log, or cut: cutting wins."},{"id":"d3s3q07","concept":"tool-audit-practice","type":"multi","stem":"Which TWO practices belong in a least-privilege tool audit for an orchestrator-worker system? Select TWO.","options":["Rely on the system prompt alone to tell subagents which tools to avoid","Scope each subagent's tools to the task it performs","Record the justification for every tool removed from the configuration","Give every subagent the orchestrator's full tool set for maximum flexibility","Keep convenient tools because they cost nothing when unused"],"correct":[1,2],"explanation":"Ask for each tool whether it is essential or merely convenient, remove the out-of-scope ones and document why, and set the trust hierarchy by limiting subagent access to what the job needs.","mnemonic":"Justify removals; scope each subagent."},{"id":"d3s3q08","concept":"tool-bloat","type":"single","stem":"A team connects twenty tools to an agent that uses only five 'just in case'. What is the main problem with the extra fifteen?","options":["Unused tools cause the agent loop to keep running without ever terminating","Unused tools permanently reduce the usable size of the model's context window","Each connected tool is a cost and an attack surface, even if rarely called","Unused tools disable prompt caching across the entire system and every request"],"correct":[2],"explanation":"Every tool connected to a Claude system adds cost and attack surface. Audit the set as you would permissions and drop what is merely convenient.","mnemonic":"Every extra tool: more cost, more surface."},{"id":"d3s3q16","concept":"data-minimisation","type":"single","stem":"Which test should decide whether a particular data field is placed in the context window of a Claude call?","options":["Whether Claude needs that field to produce the intended output","Whether the calling service already holds the field in memory","Whether the system prompt tells Claude not to repeat it","Whether the provider retains conversation content by default"],"correct":[0],"explanation":"Necessity is the filter: for each field, ask whether Claude needs it to produce the intended output, and pass a reference identifier when that is enough. A prompt instruction not to repeat a field does not keep it out of the request or the partner's request logs, and default non-retention does not make the context window a data-governance boundary.","mnemonic":"Not needed for the output? Not in the window."},{"id":"d3s3q10","concept":"data-minimisation","type":"single","stem":"A claims workflow needs a claim number only to route a case to the right queue. How should it enter the Claude call?","options":["As a reference identifier, without attaching the full claimant data fields","As a retrieved document that is included in every single call by default","As the full claim record, so Claude has the maximum possible context for routing","As part of a user-typed message so that every value can be audited later"],"correct":[0],"explanation":"Reference IDs are often enough for routing, and passing full fields exposes data to application-layer logging without adding capability.","mnemonic":"Pass the pointer, not the payload."},{"id":"d3s3q11","concept":"context-window-not-boundary","type":"single","stem":"A designer argues that PII in prompts is acceptable because Anthropic does not retain conversation content by default. What is wrong with this argument?","options":["The window is no governance boundary: the request still crosses the wire and gets logged","Data in the system prompt is exempt from logging but data in user messages is not","Anthropic retains all conversation content indefinitely by default on the API, so exposure is certain","Retention only matters for non-API entry points such as the Claude.ai chat product"],"correct":[0],"explanation":"Non-retention by default does not change that data is transmitted, may be logged by the partner's application layer, and that retention carve-outs exist for some model classes.","mnemonic":"Window is a pipe, not a vault."},{"id":"d3s3q17","concept":"redact-before-call","type":"single","stem":"A team plans to launch its Claude integration without a PII redaction step and add one 'once usage settles'. What is the main problem with deferring it?","options":["Redaction can be configured only when the API account is first created, so it cannot be added later","Claude refuses to process unredacted input once the integration has moved into production use","Each request until then lands in application request logs, and redacting that history later is the costliest fix","Deferral only lowers summary quality, because unredacted fields distract the model from the task"],"correct":[2],"explanation":"Without redaction before the API call, sensitive fields reach the partner's application-layer request logging on every request, and retroactive redaction across a log history never designed for it is the most expensive data-handling fix in a production Claude system. Redaction is a step the integration performs before each call, so nothing ties it to account creation, and the cost is exposure rather than output quality.","mnemonic":"Redact before the call, or scrub the logs forever after."},{"id":"d3s3q13","concept":"separate-keys-per-tenant","type":"single","stem":"A multi-tenant product uses one shared API key. At peak the org rate limit trips and every tenant slows. What can the team not do?","options":["Measure the aggregate request volume at peak","Observe that a traffic spike occurred at all","Attribute the breach to the tenant that caused it","Retry throttled requests using exponential backoff"],"correct":[2],"explanation":"A shared key makes the spike visible but not its source. Separate keys per tenant give attribution and isolation.","mnemonic":"One key, no culprit."},{"id":"d3s3q14","concept":"separate-keys-per-tenant","type":"multi","stem":"Which TWO outcomes justify separate API keys per tenant in production? Select TWO.","options":["Tenants are isolated from one another's usage problems","Rate limits are removed for every tenant on its own key","Rate-limit breaches can be attributed to the responsible tenant","Tenant data is encrypted in the context window automatically","Prompt caching is shared safely across all of the tenants"],"correct":[0,2],"explanation":"Per-tenant keys give attribution and isolation. They do not encrypt context, remove limits or provide shared caching.","mnemonic":"Key per tenant: blame and boundary."}]},{"id":"d3s4","title":"Regulated-industry constraints on integration","learn":["Compliance eliminates entry points and routes before preference. Work in order: governing regulation, surviving entry point and route, integration pattern, then identity, data handling and observability.","Attorney-client privilege: API behind the firm's gateway with SSO, server-assigned identity and a firm-owned audit log of every request.","HIPAA: the BAA must cover the specific configuration in use; beta features are generally excluded unless listed eligible; send only the minimum necessary, using reference IDs where possible.","GDPR and residency: inference_geo supports only 'us' and 'global', so EU pinning needs a cloud route (Bedrock or Vertex); DPA is direct with the API or inherited from the cloud contract; Foundry EU residency is listed as Coming 2026.","FedRAMP: Claude for Government, Bedrock GovCloud, Vertex Assured Workloads. Claude Enterprise on the direct API is not authorised; government environments lag on newest models.","Five integration layers: compliance, identity/SSO, authorization/policy, data handling/PII, observability/audit. This is not legal advice; verify scope with Anthropic."],"traps":["Pattern before regulation: designing the integration first and discovering later that the route fails BAA, residency or FedRAMP review.","BAA by provider: assuming a BAA held for one configuration, or for beta features, covers the one actually deployed.","inference_geo for EU: assuming it can pin execution to the EU when it only offers 'us' and 'global'.","Enterprise equals FedRAMP: treating Claude Enterprise on the direct API as an authorised substitute for government paths.","Engineering override: replacing the CIO-cleared approved vendor with the technically nicer route; that is procurement, not engineering."],"questions":[{"id":"d3s4q01","concept":"compliance-first","type":"single","stem":"A team is designing an enterprise Claude integration for a regulated client. In what order should decisions be worked through?","options":["Observability design, then data handling, then governing regulation, then the delivery route","Governing regulation, then surviving entry point and route, then pattern, then identity and data","Integration pattern, then entry point, then governing regulation, then observability and logging","Preferred model tier, then delivery route, then governing regulation, then identity controls"],"correct":[1],"explanation":"Compliance constraints eliminate options before cost, ergonomics or preference enter. Skipping a step risks something that works technically but fails legal or security review.","mnemonic":"Law first, then layers."},{"id":"d3s4q02","concept":"compliance-first","type":"single","stem":"A team built a working integration, then found during legal review that the chosen route has no BAA coverage for their configuration. Which step was skipped?","options":["Adding a second subagent to validate every output the model produces","Selecting a larger context window for the regulated workload before launch","Tuning prompts for the model identifier used on that particular route","Identifying the governing regulation and surviving routes before choosing the integration pattern"],"correct":[3],"explanation":"Regulation eliminates entry points and routes first. Redesign after the fact costs the work already invested plus a new architecture.","mnemonic":"Constraint before construction."},{"id":"d3s4q03","concept":"privilege-gateway","type":"single","stem":"A law firm wants Claude for privileged document review. Which design is most likely to survive a privilege review?","options":["The API called directly from the browser using one key shared across the firm","Claude Code run on each lawyer's laptop in the default permission mode","Consumer-tier Claude.ai accessed through shared team accounts across the whole practice group","The API behind the firm's own application, with SSO and a firm-approved logging gateway"],"correct":[3],"explanation":"Privilege review turns on the firm owning the audit trail end to end. A gateway holding the key, enforcing access and
