 logging every request provides that; consumer tiers cannot be audited by the firm.","mnemonic":"Firm gateway, firm log."},{"id":"d3s4q04","concept":"privilege-gateway","type":"multi","stem":"Which TWO properties make the gateway pattern suitable for attorney-client privilege? Select TWO.","options":["The gateway produces an audit log the firm owns","Server-assigned identity and permissions, not claimed by users","Privileged content bypasses the gateway for speed","Anthropic holds the audit log on behalf of the firm","Users choose their own permission scope at login"],"correct":[0,1],"explanation":"The gateway holds the API key, enforces access, and records every request and response retained under firm policy. Identity is server-assigned via SSO.","mnemonic":"Own the log, assign the identity."},{"id":"d3s4q05","concept":"hipaa-baa-scope","type":"single","stem":"A health startup signed a BAA covering one Claude configuration but wants to use another route for a new feature. What is the implication?","options":["The existing BAA automatically extends to every route from the same provider","A BAA is unnecessary whenever no patient names appear in the data","Only the model name needs to appear anywhere in the signed BAA","The BAA must cover the specific configuration; an uncovered route is ruled out"],"correct":[3],"explanation":"A BAA for one configuration does not extend to another. HIPAA-eligible paths include the Claude API with a signed BAA, Bedrock and Vertex, but only the covered configuration counts.","mnemonic":"BAA covers the config, not the brand."},{"id":"d3s4q06","concept":"hipaa-baa-scope","type":"single","stem":"A hospital team on a BAA-covered configuration wants to enable a beta feature. What should the architect check first?","options":["Nothing, because beta features inherit the account's existing BAA coverage automatically and fully","Whether that beta feature is listed as eligible; betas are generally excluded","Whether the beta feature measurably improves response latency for the clinicians using it","Whether the beta feature is available on the Bedrock delivery route only"],"correct":[1],"explanation":"BAA existence is not enough; feature eligibility matters. Beta features are generally excluded unless explicitly listed.","mnemonic":"Beta isn't covered unless listed."},{"id":"d3s4q07","concept":"hipaa-minimum-necessary","type":"single","stem":"For a PHI workflow, which data-handling approach is correct?","options":["Strip PHI to what the task requires before the call, using reference IDs","Redact PHI only in the model's response, after the output is generated","Send the full patient record so Claude has complete clinical context for every request","Send full records but disable all application request logging to limit exposure"],"correct":[0],"explanation":"Access to PHI is limited to the minimum necessary, applied before the API call is made.","mnemonic":"Minimum necessary, before the call."},{"id":"d3s4q08","concept":"gdpr-inference-geo","type":"single","stem":"A deployment has an EU data-residency requirement. Which option fits?","options":["Claude Code with a local region flag configured at startup of each session","The direct API with inference_geo set to the global value to cover all regions","A pinned-region cloud route such as Bedrock or Vertex, since inference_geo lacks EU","The direct API with inference_geo set to an EU region value for the deployment"],"correct":[2],"explanation":"inference_geo currently supports only 'us' and 'global', so EU pinning needs a cloud route. Global does not pin a region.","mnemonic":"EU pin? Bedrock or Vertex."},{"id":"d3s4q09","concept":"gdpr-inference-geo","type":"single","stem":"A colleague says the team can satisfy EU pinning by setting inference_geo on the direct API. What is wrong with that plan?","options":["inference_geo pins data at rest but cannot pin inference","inference_geo is valid only on Foundry deployments of the model","inference_geo requires a signed FedRAMP authorisation before it will function","inference_geo accepts only 'us' and 'global', so it cannot pin EU execution"],"correct":[3],"explanation":"EU pinning is not available through inference_geo; where there is an EU residency requirement, use a cloud route instead.","mnemonic":"inference_geo: US or global, never EU."},{"id":"d3s4q10","concept":"gdpr-dpa","type":"single","stem":"How does the data processing agreement differ between using the Claude API directly and using a cloud route?","options":["Direct API DPAs are issued by the cloud provider, not Anthropic","Direct API: DPA with Anthropic; cloud route: terms inherited from the cloud contract","Both routes always use the same Anthropic-issued DPA terms","Cloud routes require no DPA of any kind with the provider"],"correct":[1],"explanation":"With the Claude API the DPA is with Anthropic directly; with Bedrock or Vertex the terms are inherited from the existing cloud contract.","mnemonic":"Direct: Anthropic DPA. Cloud: inherited."},{"id":"d3s4q11","concept":"foundry-eu","type":"single","stem":"A partner needs EU data pinning and proposes Microsoft Foundry. What is the right caution?","options":["Foundry is the only route that supports EU pinning at present","Foundry EU residency is listed as Coming 2026 with no timeline; verify first","Foundry EU residency is already fully available for every Claude model","Foundry inherits EU pinning from Entra ID without extra configuration"],"correct":[1],"explanation":"Foundry EU residency is listed as Coming 2026 with no confirmed timeline, so availability must be verified before relying on it.","mnemonic":"Foundry EU: verify, don't assume."},{"id":"d3s4q12","concept":"fedramp-paths","type":"single","stem":"An agency asks whether Claude Enterprise on the direct API can serve a FedRAMP workload. What is the correct answer?","options":["No; use Claude for Government, Bedrock GovCloud or Vertex Assured Workloads","Yes, provided a BAA has been signed with Anthropic first","Yes, because Enterprise includes audit logs, SSO and a Compliance API for agencies","Yes, but only for unclassified workloads on the direct API"],"correct":[0],"explanation":"Claude Enterprise on the direct API is not FedRAMP authorised and cannot substitute for the authorised paths.","mnemonic":"Enterprise is not FedRAMP."},{"id":"d3s4q13","concept":"fedramp-paths","type":"single","stem":"A government team chooses an authorised environment and then asks for the newest commercial model. What should the architect expect?","options":["Government routes use a different and older model family entirely","Government environments lag on models, so confirm the route's available model first","The newest model is always available there at the same time","The model lag only ever affects the Foundry route"],"correct":[1],"explanation":"Authorised government environments receive the newest models after commercial release, so check availability on the specific route.","mnemonic":"Gov clouds get models last."},{"id":"d3s4q14","concept":"internal-residency-procurement","type":"single","stem":"A company's internal policy limits Claude to its CIO-cleared cloud vendor, but engineering prefers the direct API for new features. What decides?","options":["The route that the engineering team benchmarks highest across all workloads","The route with the earliest availability of newly shipped features and models","Whichever route measures the best latency in the team's own benchmarks","The CIO-cleared approved vendor, because it is procurement rather than engineering"],"correct":[3],"explanation":"Internal data-residency policy rules out routes outside the approved list regardless of convenience; the right route is the one the CIO has cleared.","mnemonic":"Procurement picks the pipe."},{"id":"d3s4q15","concept":"five-layers","type":"multi","stem":"Which THREE are among the five layers of an enterprise Claude integration? Select THREE.","options":["Model tier selection","Prompt caching design","Identity and SSO","Compliance and regulated-industry constraints","Observability and audit logging"],"correct":[2,3,4],"explanation":"The five layers are compliance, identity/SSO, authorization/policy, data handling/PII, and observability/audit. Model tier and caching are separate decisions.","mnemonic":"Comply, identify, authorise, minimise, observe."},{"id":"d3s4q16","concept":"not-legal-advice","type":"single","stem":"How should an architect treat the constraint-to-integration matrix?","options":["A replacement for the firm's own privilege review process","A certification that every listed pattern is automatically compliant","Valid indefinitely, since authorisations never change over time","Guidance to verify with Anthropic and legal counsel, not legal advice"],"correct":[3],"explanation":"The matrix is not legal guidance, and authorisation scope must be verified with Anthropic before committing.","mnemonic":"Matrix informs; counsel decides."},{"id":"d3s4q17","concept":"fedramp-impact-levels","type":"single","stem":"A defense workload must run at DoD Impact Level 4/5. Subject to verifying current authorization scope with Anthropic, which authorized path fits?","options":["Vertex Assured Workloads, covering FedRAMP High and DoD IL4/5","Claude for Government, covering DoD IL4/5 for defense workloads","Bedrock GovCloud, covering FedRAMP High and DoD IL4/5","Claude Enterprise on the direct API with audit logs enabled"],"correct":[2],"explanation":"Bedrock GovCloud is the path listed for FedRAMP High and DoD IL4/5. Vertex Assured Workloads is listed for FedRAMP High and IL2, and Claude for Government for FedRAMP High civilian workloads. Authorization scope must be verified with Anthropic before committing.","mnemonic":"IL4/5 rides GovCloud; Vertex stops at IL2; C4G serves civilians."},{"id":"d3s4q18","concept":"fedramp-impact-levels","type":"multi","stem":"Which TWO pairings of authorized government path and coverage are correct, pending verification of current authorization scope? Select TWO.","options":["Claude for Government: FedRAMP High for civilian workloads","Vertex Assured Workloads: DoD IL4/5 for defense workloads","Claude for Government: DoD IL4/5 for defense workloads","Vertex Assured Workloads: FedRAMP High and DoD IL2","Claude Enterprise direct API: FedRAMP High with audit logs"],"correct":[0,3],"explanation":"Claude for Government is listed for FedRAMP High civilian workloads, and Vertex Assured Workloads for FedRAMP High and IL2. IL4/5 belongs to Bedrock GovCloud, and Claude Enterprise on the direct API is not an authorized government path.","mnemonic":"C4G civilian, Vertex IL2, GovCloud IL4/5."},{"id":"d3s4q19","concept":"gdpr-not-residency","type":"single","stem":"A partner with no separate residency policy says 'GDPR means every request must run in an EU region.' Which response is accurate?","options":["GDPR does not require EU residency; transfers with a valid mechanism are lawful","Correct; GDPR compliance requires EU-pinned model execution","Correct; set inference_geo to an EU value on the direct API","GDPR applies only to cloud routes, not to the direct Claude API"],"correct":[0],"explanation":"GDPR compliance does not itself require EU residency, because cross-border transfers are lawful with a valid transfer mechanism; a cloud route is needed only where a deployment has an EU residency requirement. inference_geo supports only 'us' and 'global', so it cannot pin EU in any case.","mnemonic":"GDPR is not geography: a valid transfer mechanism, not blanket EU pinning."},{"id":"d3s4q20","concept":"gdpr-not-residency","type":"single","stem":"In a GDPR deployment pinned to an approved region, when may personal data be moved outside that region?","options":["Whenever the cloud route's default global endpoint is selected","Never, since GDPR forbids all transfers outside the EU","Whenever the DPA is signed directly with Anthropic","Only with a documented legal basis, built in when explicitly justified"],"correct":[3],"explanation":"Personal data is processed within the pinned region, and moving it across borders requires a documented legal basis and is built in only when explicitly justified. GDPR does not forbid all transfers, and neither a global endpoint default nor the DPA counterparty creates a legal basis.","mnemonic":"Crossing the border needs a passport: a documented legal basis."},{"id":"d3s4q21","concept":"matrix-observability","type":"multi","stem":"Which TWO pairings of governing constraint and logging requirement match the constraint-to-integration matrix? Select TWO.","options":["GDPR: logs record who accessed data, the legal basis and deletion timing","HIPAA: logs exclude user identity to keep PHI out of the record","FedRAMP: logs go to a separate system outside the authorized boundary","Internal residency policy: logs feed the partner's existing logging infrastructure","Attorney-client privilege: logs are kept by Anthropic rather than the firm"],"correct":[0,3],"explanation":"GDPR logs record who accessed what, the legal basis and when it will be deleted, and an internal residency policy feeds logs into the partner's existing infrastructure rather than a new system. HIPAA logs do capture user identity, FedRAMP logs meet agency continuous monitoring, and privilege logs live at the firm's own gateway.","mnemonic":"GDPR logs the why and the when-deleted; internal policy logs into what exists."}]},{"id":"d3s5","title":"Claude Code layers and observability for integrations","learn":["Shaping layers (CLAUDE.md, Skills, subagents, MCP servers) change what the agent knows and does; governing layers (hooks, permission boundaries and approval flows, sandboxing) limit what it may touch.","Hooks fire on lifecycle events as deterministic gates the model cannot skip; use them when the guarantee must come from code rather than prompting.","Six permission modes: default, acceptEdits, plan, auto, dontAsk, bypassPermissions. dontAsk suits locked-down CI; bypassPermissions is for containers or CI only.","Sandboxing enforces the boundary in the environment, so approval prompts are not the only backstop.","Log request, response, context and outcome, built at design time: logging retrofitted after an incident cannot answer its root cause. Observability is the precondition for agents; an unlogged action cannot be allowed.","LLM systems fail quietly, so standard error logging misses wrong-but-fluent output; choose MCP over raw API tool use by reuse across clients."],"traps":["CLAUDE.md as a gate: instructions in a shaping layer can be skipped; only hooks and permissions guarantee behaviour.","Mode mix-ups: bypassPermissions skips every check and belongs in containers or CI only; dontAsk is the locked-down CI mode.","Prompts as sandbox: relying on approval prompts or the agent's judgment when the environment itself should enforce the boundary.","Error-log confidence: dashboards showing no errors or crashes can still hide confident wrong answers.","Logging gaps: enabling an agent surface without checking which actions its audit logs record."],"questions":[{"id":"d3s5q01","concept":"shaping-vs-governing","type":"multi","stem":"Which THREE belong to the governing group of Claude Code layers rather than the shaping group? Select THREE.","options":["Sandboxing and restricted execution","MCP servers for external tools","Permission boundaries and approval flows","CLAUDE.md standing instructions","Hooks on lifecycle events"],"correct":[0,2,4],"explanation":"CLAUDE.md, Skills, subagents and MCP shape what the agent knows and does. Hooks, permissions and approval flows, and sandboxing govern what it is allowed to touch.","mnemonic":"Shape what it knows; govern what it touches."},{"id":"d3s5q02","concept":"hooks-deterministic","type":"single","stem":"A team requires a lint and secrets scan before every file write. Their CLAUDE.md asks for it, but the agent occasionally skips the step. What is the best fix?","options":["Implement the check as a hook, a deterministic gate the agent cannot skip","Move the instruction into a Skill the agent may choose to invoke","Make the CLAUDE.md instruction longer and more emphatic in its tone and wording","Add the instruction to a subagent's system prompt text instead"],"correct":[0],"explanation":"When the guarantee has to come from code rather than prompting, use a hook. CLAUDE.md, Skills and subagents are shaping layers and can be skipped.","mnemonic":"Hooks are gates; prompts are hopes."},{"id":"d3s5q03","concept":"hooks-deterministic","type":"single","stem":"Why can a hook enforce a rule that a CLAUDE.md instruction cannot?","options":["It runs as code on lifecycle events, independent of the model following instructions","It is chosen by the model whenever it seems relevant to the task","It is a procedure the agent invokes on demand when it decides to","It is loaded into context at session start like any other standing instructions"],"correct":[0],"explanation":"Hooks fire on events such as before or after a tool runs as deterministic gates. CLAUDE.md loads into context and relies on the model complying.","mnemonic":"Code runs; prose gets read."},{"id":"d3s5q04","concept":"permission-modes","type":"single","stem":"A team runs Claude Code in a locked-down CI pipeline and wants anything outside explicit allow rules to be refused without prompting. Which mode fits?","options":["bypassPermissions, which skips all checks so that nothing can block the pipeline run","plan, which locks the session to read-only until a plan is approved","dontAsk, which auto-denies anything that would prompt and runs only allow-listed actions","acceptEdits, which approves file edits and common filesystem commands automatically"],"correct":[2],"explanation":"dontAsk is the mode for locked-down CI. bypassPermissions skips all checks and is scoped to containers or CI, not a restriction mode.","mnemonic":"Locked-down CI: dontAsk."},{"id":"d3s5q05","concept":"permission-modes","type":"single","stem":"Which statement about bypassPermissions is accurate?","options":["It uses a classifier to block risky actions before they run","It skips all permission checks and is scoped to containers or CI","It is the recommended default setting for developer laptops","It prompts only for file deletions and nothing else"],"correct":[1],"explanation":"bypassPermissions removes every check, so it belongs only where the environment itself contains the blast radius. The classifier belongs to auto mode.","mnemonic":"Bypass only inside a box."},{"id":"d3s5q06","concept":"permission-modes","type":"multi","stem":"Which TWO descriptions of permission modes are accurate? Select TWO.","options":["dontAsk prompts the user once and then remembers the answer given","default mode auto-approves file edits and common filesystem commands","auto uses a classifier to approve safe actions and block risky ones","acceptEdits approves every Bash command without ever prompting the user","plan locks the session to read-only until the user approves a plan"],"correct":[2,4],"explanation":"acceptEdits covers file edits and common filesystem commands only, and other Bash commands still prompt. Default asks before each action, and dontAsk denies rather than prompts.","mnemonic":"Plan reads, auto classifies."},{"id":"d3s5q07","concept":"sandboxing","type":"single","stem":"A deployment's wrong actions would have real consequences and the team relies on approval prompts. What is the better design?","options":["Add sandboxing so the environment itself enforces filesystem, network and command limits","Rely on logging to detect any misuse after it has occurred in production","Trust the agent's judgment more by writing a much longer CLAUDE.md file","Increase the number of approval prompts shown to the user during a session"],"correct":[0],"explanation":"Approval prompts alone are not a sufficient backstop; the environment should enforce the boundary, not only the agent's judgment.","mnemonic":"Contain it in the environment."},{"id":"d3s5q08","concept":"observability-precondition","type":"single","stem":"A security reviewer must decide whether to approve an autonomous agent that performs actions on several surfaces. Which standard should guide the decision?","options":["Audit logs become optional once deterministic hooks have been installed on the agent","Approval depends only on the model's published accuracy benchmarks and evaluation scores","An action not logged cannot be allowed, so per-surface audit coverage must be checked","Audit coverage is identical across every surface, interface and Anthropic product"],"correct":[2],"explanation":"Observability is treated as the precondition for enabling agents. Coverage varies by surface, so verify which agentic actions are recorded.","mnemonic":"Unlogged means unallowed."},{"id":"d3s5q09","concept":"observability-precondition","type":"single","stem":"Which review-checklist item reflects observability as a precondition for agents?","options":["Confirm the agent has access to every tool for flexibility","Confirm the system prompt exceeds a minimum required length","Verify which agentic actions the audit logs record on each chosen surface","Confirm the agent is using the largest available context window"],"correct":[2],"explanation":"Without a trustworthy audit trail, an autonomous system is not approved to act; coverage differs between surfaces.","mnemonic":"Check the log before the launch."},{"id":"d3s5q10","concept":"what-to-log","type":"single","stem":"A team wants to record whether the downstream system accepted Claude's output and any rejection signals. Which log category covers this?","options":["The outcome category","The response category","The context category","The request category"],"correct":[0],"explanation":"The four categories are request (model version, input tokens, prompt id), response (output tokens, latency, stop reason), context (user role, session ID, caching) and outcome (downstream acceptance or rejection).","mnemonic":"Request, response, context, outcome."},{"id":"d3s5q11","concept":"what-to-log","type":"multi","stem":"Which TWO fields belong in the response log category? Select TWO.","options":["Session ID","Prompt identifier","Stop reason","Whether caching was applied","Output token count"],"correct":[2,4],"explanation":"Response fields are output token count, latency and stop reason. Prompt identifier belongs to the request; session ID and caching belong to context.","mnemonic":"Response: tokens out, time, stop."},{"id":"d3s5q12","concept":"quiet-failure","type":"single","stem":"Dashboards show normal latency and no errors, yet customers report subtly wrong answers. What explains why monitoring stayed green?","options":["LLM systems fail quietly: wrong but fluent answers slip past error and timeout logging","Latency monitoring reliably detects hallucinated answers in real time, so none exist","The model crashes silently and then recovers before the next call arrives","The context window resets between calls and so hides every earlier error"],"correct":[0],"explanation":"An LLM system does not crash when something goes wrong; it returns a subtly incorrect response. Detecting that needs outcome signals and evaluation, not just error logs.","mnemonic":"No crash does not mean no wrong."},{"id":"d3s5q13","concept":"quiet-failure","type":"single","stem":"Why is an LLM-based system harder to debug than a traditional service?","options":["Its latency cannot be measured by any of the standard monitoring tools","It always throws an exception whenever it receives unexpected or invalid input","It exposes no stop reason that engineers can inspect after the response","It can give a plausible wrong answer with no error that logging flags"],"correct":[3],"explanation":"Standard logging captures errors and timeouts; it cannot see a quietly incorrect answer with real business consequences, hence the outcome field and evals.","mnemonic":"Wrong but fluent slips past logs."},{"id":"d3s5q18","concept":"mcp-reuse","type":"single","stem":"An internal ticketing tool must be callable from Claude.ai, Claude Code and a partner-facing app. What is the right choice?","options":["Build one MCP server and connect it to each client","Run the Agent SDK separately in every client that needs the tools","Write separate raw API tool definitions inside each of the three clients","Embed the tool descriptions in a CLAUDE.md file shared across clients"],"correct":[0],"explanation":"MCP pays back when one tool entry point is needed from multiple Claude clients: build once, connect everywhere.","mnemonic":"Build once, connect everywhere."},{"id":"d3s5q15","concept":"mcp-reuse","type":"single","stem":"What is the deciding factor between MCP and raw API tool use?","options":["Whether the partner has signed a BAA with Anthropic","Which delivery route the partner is already using","How often the tools will be reused across multiple Claude clients","The size of the output returned by the tool"],"correct":[2],"explanation":"Choose MCP when tools must be reachable from several clients, and raw API tool use when they live inside one product.","mnemonic":"Reuse decides: many clients, MCP."},{"id":"d3s5q19","concept":"shaping-layer-placement","type":"single","stem":"A team's CLAUDE.md now holds full step-by-step procedures for onboarding a new service, rotating test fixtures and preparing a hotfix, and every session starts with a bloated context. Where should those procedures live instead?","options":["In hooks, which fire on lifecycle events and load procedures into every session","In MCP servers, which make the procedures reusable from Claude.ai and other clients","In Skills, invoked on demand rather than loaded upfront, keeping the main context lean","In permission rules, which decide which procedure steps may run without prompting"],"correct":[2],"explanation":"CLAUDE.md loads at session start and suits persistent context every task needs. Repeatable workflows the team should not have to spell out each time belong in Skills, which load only when invoked and keep the main context lean. Hooks and permissions are governing layers, not places to store procedures.","mnemonic":"Always-needed in CLAUDE.md; sometimes-needed in a Skill."},{"id":"d3s5q17","concept":"shaping-layer-placement","type":"multi","stem":"Which TWO pairings of content and Claude Code shaping layer are correct? Select TWO.","options":["Repo layout and coding standards every task needs: CLAUDE.md","A dependency-upgrade procedure used occasionally: CLAUDE.md, loaded at every start","A codebase exploration that would clutter the main thread: a subagent","A read-only code review with its own system prompt: a Skill in the main thread","Standing team conventions for every session: a subagent with restricted tools"],"correct":[0,2],"explanation":"CLAUDE.md carries persistent context such as repo layout and standards. Subagents are isolated context helpers for bounded tasks, or work needing read-only tools or a different system prompt, such as exploration or code review. Occasional procedures belong in Skills, not in CLAUDE.md.","mnemonic":"Standing facts: CLAUDE.md. Side quests: subagent. Procedures: Skill."},{"id":"d3s5q20","concept":"observability-design-time","type":"single","stem":"A team ships a Claude integration and plans to add request, response, context and outcome logging once it has been live for a while. A data-handling incident hits in week two. What is the main consequence?","options":["Little, because the provider retains full conversation content for incident review","Root cause must be reconstructed from a system not set up to answer it","Only latency analysis suffers, since error and timeout logs already cover correctness","The incident can be fully reconstructed afterwards by replaying production traffic"],"correct":[1],"explanation":"Observability added after the first incident means the root cause must be reconstructed from a system that was not set up to answer the question, and building it later always costs more. Conversation content is not retained by default, and error logs miss quietly wrong answers.","mnemonic":"Log before the incident, or guess after it."},{"id":"d3s5q21","concept":"observability-design-time","type":"single","stem":"When should a team decide what its Claude integration needs to log, and how deeply?","options":["After the first production incident, once the real failure pattern is known","When the audit team requests specific fields at its next scheduled review","Once usage passes the volume at which logging costs become worth paying","At design time, by asking what must be reconstructable after an incident"],"correct":[3],"explanation":"Decide what you will need to reconstruct after an incident and build logging to answer those questions before you need to ask them. Building observability after the first incident always costs more than building it before.","mnemonic":"Ask the incident questions before the incident."}]}]},{"domain":4,"subjects":[{"id":"d4s1","title":"Evals as acceptance criteria and the grading ladder","learn":["Evals are written before production code; this forces measurable success criteria, early exposure of design assumptions, and a gate for model swaps, prompt changes and retrieval changes.","Five-stage workflow: define the task, build a golden dataset, run automated checks, score with a judge, then interpret and act on per-category results.","Grading ladder: code-based checks first (cheap, never drift), LLM-as-judge for interpretation, human review as the last resort for high-stakes or novel behavior.","Judge rigor: detailed rubrics, constrained verdicts, calibration against human-labeled outputs, a different grader model than the one evaluated, and reasoning alongside the score.","Thresholds come from the business requirement, not the prototype; failure modes and adversarial inputs become dataset categories.","Every change needs an eval gate with a delta threshold set in advance; stale or unrepresentative suites give false confidence."],"traps":["Build-then-test: treating evals as an end-of-project QA step, when they define success and gate every change from the start.","Calibration skipped: an uncalibrated judge looks trustworthy and is therefore worse than no automated grade at all.","Prototype-derived thresholds: setting pass marks at whatever the first prototype achieves instead of what the business requirement demands.","Stale suite: passing evals after a prompt change prove nothing if the dataset still reflects the old behavior.","Mean-score comfort: a higher average can hide a quiet regression on edge cases or adversarial inputs, so read the per-category breakdown."],"questions":[{"id":"d4s1q01","concept":"evals-before-code","type":"multi","stem":"Writing the eval suite before any production code is the recommended approach. Which THREE outcomes does this ordering force? Select THREE.","options":["It requires success to be stated in measurable terms","It provides a gate for judging a model swap, prompt change or retrieval change","It guarantees the golden dataset will stay representative as traffic evolves","It removes the need to calibrate any judge model against human labels","It exposes design assumptions while they are still cheap to change"],"correct":[0,1,4],"explanation":"Writing evals first forces measurable success criteria, early exposure of assumptions, and a ready-made gate for later changes. It does not remove judge calibration or keep the dataset current; those remain ongoing maintenance duties.","mnemonic":"Evals first: define success, expose assumptions, gate every change."},{"id":"d4s1q02","concept":"evals-before-code","type":"single","stem":"A team plans to build the assistant, eyeball a few outputs, and add an eval suite as a QA step before launch. What is the core problem with this plan?","options":["Evals written afterwards cannot use a golden dataset, so they must rely solely on slow human reviewers","Eval suites cannot be written until production code exists, because they need real system outputs to compare against","Late evals are more expensive per item, because model-based graders cost more once the system is deployed","With no eval for a behavior there is no reliable way to measure it, so changes during the build go unverified"],"correct":[3],"explanation":"If you cannot write an eval for a behavior you have no reliable way to tell whether it is present, so changes during the build cannot be verified. Evals do not require finished code, and their per-item cost does not depend on timing.","mnemonic":"No eval, no proof: unmeasured behavior means unverifiable changes."},{"id":"d4s1q03","concept":"grading-ladder","type":"single","stem":"A pipeline must verify that every output is valid JSON matching a schema, and also that each reply keeps an empathetic tone. Which grading design follows the ladder?","options":["Human reviewers for both checks, because people are the most reliable graders for anything involving a schema","A calibrated judge model for both checks, since one grader is simpler to maintain than a code check plus a judge","Schema check in code for validity, a calibrated judge model for tone, and human review only for high-stakes or novel cases","A code-based regex for both checks, since deterministic grading is cheapest and never drifts across runs"],"correct":[2],"explanation":"Reach for the cheapest reliable method first: code for unambiguous checks like schema validity, a judge model for interpretation such as tone, and humans last. Code cannot judge tone, and humans for everything is the costliest option.","mnemonic":"Code first, judge second, human last."},{"id":"d4s1q04","concept":"judge-calibration","type":"single","stem":"Why is an uncalibrated LLM judge considered worse than having no automated grade?","options":["It cannot return reasoning alongside its score, so every verdict is impossible to audit","It produces confident scores that look trustworthy even when they do not track human judgment","It is limited to deterministic checks, so it fails on tone, helpfulness and reasoning quality","It always costs more per item than a human reviewer, which wastes the evaluation budget"],"correct":[1],"explanation":"A judge can be wrong, and without calibration against human-labeled outputs its confident scores create false assurance. The judge can give reasoning, and interpreting tone is exactly what it is for, so those distractors misstate the problem.","mnemonic":"Uncalibrated judge: confident noise that looks like signal."},{"id":"d4s1q05","concept":"judge-rigor","type":"multi","stem":"Which TWO practices make an LLM-as-judge grader more rigorous? Select TWO.","options":["Use constrained verdicts drawn from a small fixed set of labels","Use the same model as the generator so the judge understands the intended style","Grade with a different model than the one whose outputs are being evaluated","Keep the rubric brief so the judge is not anchored by too many criteria","Ask for a free-form score between 1 and 100 so small differences are captured"],"correct":[0,2],"explanation":"Rigorous judging uses detailed rubrics, constrained verdicts, calibration against human labels, and a different grader model to avoid self-preference. Free-form scores, a same-model judge and a thin rubric all weaken consistency.","mnemonic":"Few labels, fresh grader: constrain verdicts, never self-grade."},{"id":"d4s1q06","concept":"judge-rigor","type":"single","stem":"A team uses the same model to generate answers and to grade them, and scores look suspiciously high. Which risk does this setup create, and what is the remedy?","options":["Schema drift; replace the judge with a regex that checks whether the answer matches an expected string","Context overflow; shorten the judge prompt until it no longer includes the original question or rubric","Token skew; route the longest outputs to humans because judges cannot handle above-average lengths","Self-preference; grade with a different model than the one being evaluated, calibrated against human labels"],"correct":[3],"explanation":"Grading with the same model risks self-preference, so the judge should be a different model and its verdicts calibrated against human-labeled examples. Removing the question or rubric from the judge prompt would only make grading worse.","mnemonic":"Don't let the model mark its own homework."},{"id":"d4s1q22","concept":"threshold-before-data","type":"single","stem":"A team's first working build scores 91% on field accuracy, and the lead proposes adopting 91% as the pass mark. What is the flaw in this approach?","options":["Pass marks should be set by the judge model once it has been calibrated against the build's own outputs","Pass marks should be fixed at 100% on every metric, since any lower figure knowingly accepts errors","Pass marks should come from the business requirement, not from what the first prototype happens to achieve","Pass marks should wait for live production traffic, because a prototype's score is never stable enough"],"correct":[2],"explanation":"Thresholds are decided from what the business requirement demands; adopting the prototype's score simply ratifies whatever was built. They are revisited when the system's requirements change, not when results come in. A judge model scores outputs but does not set the standard, and waiting for production means shipping without a pass mark.","mnemonic":"The business sets the bar; the prototype just tries to clear it."},{"id":"d4s1q23","concept":"adversarial-inputs","type":"multi","stem":"A golden dataset was assembled from the tidiest inputs the team had on hand, and the system scores very well against it. Which TWO changes would make the scores meaningful? Select TWO.","options":["Raise the pass threshold so the tidy inputs leave less room for error","Add the edge cases and counterexamples the system will meet in production","Swap the code-based checks for a judge model, which copes with messy inputs","Turn each known failure mode into its own category in the dataset","Trim the dataset to a few cases graded carefully by hand"],"correct":[1,3],"explanation":"If the dataset is not representative, the scores are not meaningful: a set of clean inputs will not predict production performance. Include edge cases, counterexamples and adversarial inputs, and make each failure mode a dataset category. A stricter threshold on unrepresentative data still measures the wrong system, and a few hand-graded cases cut coverage.","mnemonic":"Tidy data, flattering scores: add the edge cases, give each failure mode a bucket."},{"id":"d4s1q24","concept":"stale-eval","type":"single","stem":"At which point is a production Claude system at the highest risk of a regression slipping through undetected?","options":["When an eval suite exists but is out of date with the system it measures","When no eval suite has been built yet and every change is checked by hand","During the first proof of concept, while traffic is low and inputs are clean","Right after the judge model has been calibrated against human-labeled outputs"],"correct":[0],"explanation":"An out-of-date suite gives false confidence: it signals that a change is safe while checking behavior the system no longer has, so the highest-risk moment is when evals are present but stale. With no suite at all, nobody mistakes the missing evidence for a pass. Calibration makes a judge more trustworthy, not less.","mnemonic":"A stale suite is a green light wired to nothing."},{"id":"d4s1q25","concept":"eval-gate-every-change","type":"single","stem":"A team plans to change only its retrieval configuration and argues the eval suite exists to gate model swaps, so it can be skipped this time. What is the right response?","options":["Agree, because retrieval changes affect only latency, which monitoring will catch after release","Agree, but run a manual spot-check of a few known queries before deploying the change","Every change, including retrieval and context-strategy updates, runs through the evals before production","Run the evals only if the change also touches the prompt, since prompts drive output behavior"],"correct":[2],"explanation":"Model swaps, prompt revisions, context strategy changes and retrieval configuration updates should all go through the eval suite during development before reaching production; it is the only reliable way to know whether a change improved the system. Running evals before every change also keeps the eval set current. Spot-checks only confirm the inputs someone thought of.","mnemonic":"Model, prompt, context, retrieval: every change passes the eval gate."},{"id":"d4s1q11","concept":"mean-hides-regression","type":"single","stem":"A prompt change raises the overall mean eval score from 0.88 to 0.91. Which step best checks whether the change is really an improvement?","options":["Lower the pass threshold so the new version comfortably clears it on every individual category","Re-run the same eval with a larger judge model until the mean rises further above the threshold","Review the per-category breakdown and edge-case or adversarial results for any quiet regression","Approve it because the mean exceeds the old score, and monitor user complaints for a week"],"correct":[2],"explanation":"Interpreting results means looking beyond the aggregate: a rising mean can hide degraded edge-case, adversarial or single-category performance. Moving the threshold afterwards just rewrites the acceptance criteria.","mnemonic":"Mean up, tail down: always read the per-category breakdown."},{"id":"d4s1q12","concept":"multi-turn-evals","type":"single","stem":"A single-turn eval suite passes, but the assistant forgets earlier details and invents facts in long conversations. What addition does this require?","options":["More single-turn prompts with longer inputs, since the conversation behavior is just a long prompt","A multi-turn eval with a golden dataset of full conversation transcripts and known-good responses at each turn","A judge prompt that scores each reply in isolation, without access to any earlier turns","A larger set of schema-validation checks on the final turn of each conversation only"],"correct":[1],"explanation":"Multi-turn evals score a whole conversation (context retention, no invented details, quality over length) and need conversation-level golden data covering follow-ups, topic shifts and lengths. Isolated replies cannot reveal context failures.","mnemonic":"Conversations need transcripts: the unit scored is the whole dialogue."},{"id":"d4s1q26","concept":"threshold-before-data","type":"single","stem":"A team is about to run its eval set against a proposed model swap. When should it set the delta threshold below which the swap will not ship?","options":["Before running the eval, so the result is judged against a standard set in advance","After reviewing the results, so the threshold reflects what the new model can realistically reach","Once the swap is live, so real production traffic sets a more reliable baseline than a test set","Only if the overall mean drops, since a rising mean shows the swap is at least as good"],"correct":[0],"explanation":"A model swap is a release, gated by a curated test set covering the real distribution, a grading function, and a delta threshold fixed before the eval runs. Set afterwards, it is not a standard but acceptance criteria written after the build. A rising mean can still hide a regression in particular categories.","mnemonic":"Draw the line before the data arrives."},{"id":"d4s1q14","concept":"judge-reasoning-and-prompt","type":"single","stem":"A team's LLM judge returns only a numeric score for each item. Reviewers suspect it grades borderline cases inconsistently but cannot confirm it. Which change most directly helps?","options":["Switch the judge to free-form scores on a wider numeric scale","Replace the judge with code-based checks for every behavior","Require the judge to return its reasoning alongside each score","Run the same judge twice and average the two scores"],"correct":[2],"explanation":"Judge models can be inconsistent on borderline cases, and without reasoning produced alongside the score that inconsistency is hard to detect. Free-form scores move away from constrained verdicts, and code-based checks cannot assess behaviors that need interpretation.","mnemonic":"No 'why', no spy: the judge's reasoning exposes its wobble on borderline cases."},{"id":"d4s1q15","concept":"judge-reasoning-and-prompt","type":"multi","stem":"Which TWO statements about model-based (LLM judge) evals are accurate? Select TWO.","options":["A judge costs nothing extra because it reuses the production model call","The judge prompt is itself a prompt that must be engineered and tested","A judge is best reserved for format and schema compliance checks","A judge receives the original prompt, the system output and a scoring rubric","A judge never drifts, so it can replace human calibration entirely"],"correct":[1,3],"explanation":"A judge is given the original prompt, the output and a rubric, and its own prompt needs engineering and testing like any other. Each judged item is an extra API call, schema checks belong in code, and it is code-based checks (not judges) that never drift.","mnemonic":"Prompt, output, rubric in; the judge's own prompt needs testing too."},{"id":"d4s1q16","concept":"volume-over-perfection","type":"single","stem":"A team can afford either 40 cases graded carefully by hand or 2,000 automatically gradable cases that run on every change. Which choice reflects sound eval practice?","options":["The 2,000 automated cases, since broad cheap coverage catches more regressions","The 40 hand-graded cases, since human grading is the most trustworthy","The 40 hand-graded cases, run only before each major release","Neither, until a judge model is fine-tuned on the domain"],"correct":[0],"explanation":"Favor volume over perfection: many automatically gradable cases catch more regressions than a small painstaking set and can run on every change. Human grading is the last rung of the ladder, reserved for high-stakes or novel behaviors, not the default.","mnemonic":"Many cheap checks beat a few perfect ones: volume catches regressions."},{"id":"d4s1q17","concept":"volume-over-perfection","type":"multi","stem":"Why is a large set of automatically gradable eval cases preferred over a handful of manually graded ones? Select TWO.","options":["Hand grading is prohibited for high-stakes or novel behaviors","Broad, cheap coverage catches more regressions than a small set","Automated grading removes the need to calibrate any judge","Automatically gradable cases can run on every change","Small hand-graded sets cannot capture a schema check"],"correct":[1,3],"explanation":"Broad automated coverage catches more regressions and is cheap enough to run on every change. Human grading is still the right tool for high-stakes or novel cases, and any LLM judge still needs calibration against human labels.","mnemonic":"Wide and cheap, run every change: breadth beats a boutique hand-graded set."},{"id":"d4s1q18","concept":"eval-cost-secondary","type":"single","stem":"A finance sponsor asks the team to cut its model-graded eval set from 1,500 items to 100 to save on judge API calls. What is the best architect response?","options":["Agree, since judge API calls are the dominant cost of an eval program","Size the set for confidence; an escaped regression costs far more than calls","Agree, but compensate by raising the pass threshold on the 100 items","Replace the judge with manual spot-checks on a handful of outputs"],"correct":[1],"explanation":"Cost is worth watching but should not drive the eval set below what the use case warrants; a production-breaking change slipping through an undersized suite costs far more than extra API calls. A higher threshold on a tiny set does not restore coverage, and spot-checks are not evals.","mnemonic":"Skimp on evals, pay in incidents: confidence sizes the set, cost comes second."},{"id":"d4s1q19","concept":"eval-cost-secondary","type":"single","stem":"When sizing a golden dataset for a production Claude system, how should the cost of model-based evals be treated?","options":["As the primary constraint that caps the number of eval items","As irrelevant, because eval calls are billed at a discounted rate","As a reason to grade only items that failed in production","As a secondary constraint behind confidence in the results"],"correct":[3],"explanation":"Size the dataset against what gives you confidence in the results and treat cost as secondary, because under-evaluating is the bigger risk. Cost is not irrelevant, since every model-based eval is an API call, but it should not be the primary cap.","mnemonic":"Confidence first, cost second: an undersized suite is the expensive one."},{"id":"d4s1q20","concept":"spot-checks-not-evals","type":"single","stem":"A team declares its assistant ready because it answered every input they tried correctly during the demo. Why are these manual spot-checks not a substitute for an eval suite?","options":["They are slower than a judge model and cost more per item","They cannot check format compliance or schema validity","They confirm specific known inputs but say nothing about unknown inputs","They must be repeated by a different person to avoid self-preference"],"correct":[2],"explanation":"Spot-checks show that a particular input yields a particular output, but cannot show correct behavior on inputs nobody thought of, and production surfaces exactly those. Speed and format checking are not the core problem; coverage of the real input distribution is.","mnemonic":"Spot-checks prove the inputs you thought of; production brings the rest."},{"id":"d4s1q21","concept":"eval-workflow-sequence","type":"single","stem":"Which sequence matches the eval workflow, in which each stage's output feeds the next?","options":["Build the golden dataset, define the task, score with a judge, run automated checks, interpret and act","Define the task, run automated checks, build the golden dataset, interpret and act, score with a judge","Score with a judge, define the task, build the golden dataset, run automated checks, interpret and act","Define the task, build the golden dataset, run automated checks, score with a judge, interpret and act"],"correct":[3],"explanation":"The task specification and pass criteria come first, then the labeled golden dataset, then cheap automated checks for unambiguous behavior, then a judge for behaviors needing interpretation, and finally aggregate interpretation with a per-category breakdown. Building data before defining the task produces a vague eval.","mnemonic":"Define, Data, Deterministic checks, Judge, Decide: spec to dataset to scores to action."}]},{"id":"d4s2","title":"POC to production: cost, latency and reliability","learn":["Cost, latency, reliability and failure modes are invisible in a demo; capture the business-metric signal during the POC as well.","Cost model inputs: call volume from the business, token budget per request (input plus output), and model tier; token distributions are skewed, so averages underestimate.","Design to p95 latency; prompt caching helps with long stable prompts but creates a consistency window for live state.","Backoff sits close to the API call, circuit breakers at the service boundary, fallback chains in the orchestration layer.","Failure modes by architecture: agent (unbounded tool use), RAG (retrieval drift), document pipeline (no exception path), orchestrator-workers (blurred boundaries).","Pin model versions, watch the deprecation page, keep a runbook; model Batch API as a cost alternative when asynchronous is acceptable, verifying current pricing and BAA coverage for regulated data."],"traps":["Demo-as-model: treating a low-volume POC bill as a production cost estimate, when it answers only whether the system can do the task; it informs the estimate only once scaled to production volume with error bounds.","Average thinking: sizing on mean tokens or median latency when a small tail drives most of the spend and SLA breaches.","Wrong layer: putting retries, circuit breakers or fallbacks at the wrong layer protects the wrong part of the system.","Untested failure: without fallback or circuit breaker the primary endpoint is a single point of failure, so one peak outage takes the whole workflow down; design these controls in from the start, as retrofitting them is much harder.","Batch assumption: sending regulated data through Batch without verifying BAA coverage for that configuration."],"questions":[{"id":"d4s2q01","concept":"poc-four-dimensions","type":"single","stem":"Which four dimensions of production readiness does a demo or POC typically fail to reveal?","options":["Model tier, context window, tokenizer and temperature","Cost, latency, reliability and failure modes","Throughput, storage, networking and licensing","Accuracy, tone, brand safety and prompt length"],"correct":[1],"explanation":"A POC runs low volume, with clean inputs and a patient user, so it hides cost, latency (p95 under load), reliability (no retries or fallback) and architecture-specific failure modes. The others are not the four named gaps.","mnemonic":"Demo hides four: cost, latency, reliability, failure modes."},{"id":"d4s2q02","concept":"poc-business-metric","type":"single","stem":"A POC's projected monthly cost fits the budget, but nobody measured whether it improves the metric the partner cares about. How should this be judged?","options":["A cost profile that fits on a system with no measurable improvement in the business metric is still a failed deployment","Business-metric measurement belongs to the partner and has no place in the architect's POC scope","The deployment is sound, because meeting the cost ceiling is the only requirement a POC must demonstrate","The metric can be measured after launch once volume is high enough to produce stable and reliable results"],"correct":[0],"explanation":"The POC should deliberately capture the outcome signal the partner cares about on its sample. Cost alone does not prove value; a budget-fitting system that does not move the metric still fails.","mnemonic":"Cheap but useless is still failure: measure the metric in the POC."},{"id":"d4s2q03","concept":"cost-model-inputs","type":"single","stem":"Which three inputs let you estimate monthly cost against a budget ceiling before writing code?","options":["Prompt length, golden dataset size, and judge model choice","Latency target, retry count, and number of fallback models","Region, authentication method, and number of connected tools","Call volume, token budget per request, and model tier"],"correct":[3],"explanation":"Monthly cost comes from call volume (from the business owner), the token budget per request (input plus expected output) and the model tier. The distractors are valid design concerns but not the cost-model inputs.","mnemonic":"Volume times tokens times tier gives the bill."},{"id":"d4s2q19","concept":"token-skew","type":"single","stem":"A team sizes monthly cost from the mean token count of its sample, in which most inputs are short but a few are very long. What is the likely error?","options":["Cost is underestimated, often by a factor of two or three, because the long tail is averaged away","Cost is overestimated, because the few very long inputs inflate the mean above typical requests","Cost is accurate on aggregate, since short and long requests cancel out over a full month of traffic","Only latency is affected, because token count drives response time but not the per-request price"],"correct":[0],"explanation":"Token distributions are often skewed: a tail of long requests consumes a disproportionate share of total cost, so an average-based model can underestimate by a factor of two or three. Model the distribution, including the extremes, and test sensitivity to a shift toward the tail. The mean does not cancel the tail out; it hides it.","mnemonic":"Averages hide the tail; the tail eats the budget."},{"id":"d4s2q05","concept":"token-skew","type":"single","stem":"An ROI model takes the run cost from the average token cost per request instead of the sizing distribution, on a workflow with heavy-tailed inputs. What is the effect?","options":["Recurring cost is overstated, so the payback period looks longer than it is","Recurring cost is understated, so the net value and apparent payback are overstated","Cost is accurate, because averages and distributions give the same total over many requests","Latency is understated, so the SLA appears to be met when it is not"],"correct":[1],"explanation":"Using an average understates recurring cost where a small fraction of large requests drives most spend, which in turn inflates net value. The error shows up as a budget surprise after launch.","mnemonic":"Average cost in, inflated ROI out."},{"id":"d4s2q06","concept":"p95-design-target","type":"single","stem":"Why is p95 latency a better design target than median latency for a user-facing workflow?","options":["The slow tail drives SLA breaches, and p95 is the value below which 95% of requests complete","The median is distorted by caching, whereas p95 measures only requests that bypass the prompt cache entirely","p95 measures cost per request, which is the main cause of slow responses at production volume","p95 is always lower than the median, which gives the team a more comfortable and achievable target"],"correct":[0],"explanation":"The median describes the middle request, while the slowest 5% above p95 are what breach SLAs. A demo's single-request latency says little about p95 under concurrent load.","mnemonic":"Median flatters; p95 tells the truth about the slow 5%."},{"id":"d4s2q07","concept":"p95-design-target","type":"single","stem":"A POC measured 650 ms median latency with one request at a time, against an 900 ms SLA. What is the main risk in concluding the SLA is met?","options":["Single-request tests overstate latency because the prompt cache is cold during every demo run","Median latency is always higher than p95, so the real figure is probably worse than 650 ms","Latency only matters for batch workloads, so the SLA applies to throughput rather than response time","The slowest 5% under concurrent load can exceed the SLA, so p95 under load is the number to check"],"correct":[3],"explanation":"A demo runs one request at a time, and p95 under concurrent load is a different number than median latency. SLA breaches come from the slow tail, so p95 is the design target.","mnemonic":"One demo request proves nothing about the slow 5%."},{"id":"d4s2q08","concept":"caching-lever","type":"multi","stem":"Which TWO statements about prompt caching as a cost and latency lever are correct? Select TWO.","options":["It is most effective when the system prompt is long and stable and reused frequently","It is most effective for short, frequently changing prompts that are rarely reused","It can create a consistency window if cached content must reflect live state","Cached responses may differ from uncached ones, so quality must be re-evaluated after enabling it","It works automatically with no request markers, and cache writes cost the same as standard input"],"correct":[0,2],"explanation":"Caching stores the reusable prompt prefix, giving the largest savings for long stable prompts, but live-state requirements may clash with the consistency window. The response is identical with or without caching, and writes cost more.","mnemonic":"Long, stable prefix pays; live state breaks the window."},{"id":"d4s2q09","concept":"reliability-placement","type":"single","stem":"A downstream dependency is degrading and slow timeouts are consuming the calling service's capacity. Which control fits, and where should it sit?","options":["A fallback chain placed next to the API call that retries the same endpoint with doubled delays","A circuit breaker at the service boundary that trips on error rate and fails requests immediately","Exponential backoff in the orchestration layer so each workflow retries the dependency until it recovers","Retry logic at the service boundary that holds requests until the dependency's error rate drops"],"correct":[1],"explanation":"Circuit breakers measure error rate on a dependency and fail fast once tripped, sitting at the service boundary. Retries belong close to the API call and fallbacks in orchestration; misplacing them protects the wrong part of the system.","mnemonic":"Backoff near the call, breaker at the border, fallback upstairs."},{"id":"d4s2q10","concept":"backoff-transient","type":"multi","stem":"Which TWO errors are the best candidates for retry with exponential backoff? Select TWO.","options":["A schema mismatch in the model's output format","An authorization failure caused by a missing credential","A 429 rate-limit response signalling temporary throttling","A 4xx response caused by a malformed request body","A 503 response from a briefly overloaded server"],"correct":[2,4],"explanation":"Rate limits (429), timeouts and 5xx server errors are transient and usually resolve on retry with growing delays. Client-side 4xx problems such as malformed requests will not be fixed by waiting.","mnemonic":"Retry the transient 429 and 5xx, never the client's own mistake."},{"id":"d4s2q20","concept":"fallback-chain","type":"single","stem":"Which statement about fallback chains in a production Claude system is accurate?","options":["They sit beside the API call and retry the same endpoint with progressively longer delays","They are best added after the first production incident, once the real failure pattern is finally known","They reroute to another model tier or a cached response instead of erroring, and evals test them","They trip on a downstream error rate and fail requests immediately rather than waiting for timeouts"],"correct":[2],"explanation":"If the primary model or endpoint is unavailable, a fallback chain routes the request to an alternative such as a different tier or a cached response rather than raising an error to the user. Fallbacks live in the orchestration layer and their behavior is tested in the eval suite. Retrying near the call is backoff, failing fast on error rate is a circuit breaker, and reliability is far harder to retrofit after an incident.","mnemonic":"Fall back, don't fall over: reroute in orchestration, and test the reroute."},{"id":"d4s2q12","concept":"failure-modes-by-architecture","type":"multi","stem":"Which TWO pairings of architecture and mitigation are correct? Select TWO.","options":["Orchestrator-workers: give each subagent its own independent trace so failures stay isolated","Agent: remove all stopping criteria so the loop can finish every task it starts","Document pipeline: add confidence scoring and route low-confidence extractions to a human review queue","RAG: raise the temperature so retrieved chunks are paraphrased and stale facts are less visible","Agent: set turn and token budgets, tool-call limits and explicit stopping criteria, and eval stopping behavior"],"correct":[2,4],"explanation":"Agents risk unbounded tool use and growing context, so budgets and stop criteria matter; pipelines need an exception path for low-confidence output. RAG needs retrieval precision and recall monitored, and orchestrators need a shared trace ID.","mnemonic":"Agents need brakes; pipelines need a human lane."},{"id":"d4s2q13","concept":"failure-modes-by-architecture","type":"single","stem":"A RAG system's answers degrade after documents are added and removed without reindexing, and a live inventory question returns stale data. Which mitigation fits?","options":["Add confidence scoring to the generation step and route every low-confidence answer to a human queue","Monitor retrieval precision and recall as system metrics and separate live-state queries from static knowledge queries","Set per-turn token budgets and maximum tool-call counts so the retrieval step cannot grow without bound","Create a shared trace ID across all agents so results equal the units that were submitted"],"correct":[1],"explanation":"RAG's first failure is retrieval quality drift, so retrieval belongs in the eval loop and live state needs a direct lookup instead of an index snapshot. The distractors belong to the document-pipeline, agent and orchestrator patterns.","mnemonic":"RAG rots at retrieval; live state skips the index."},{"id":"d4s2q14","concept":"failure-modes-by-architecture","type":"single","stem":"An orchestrator submitted 40 sub-tasks, but the final synthesis silently covered only 37 because three subagents dropped without raising errors. Which control prevents this?","options":["Reconcile coverage at synthesis so results equal the units submitted, with a shared trace ID and clear recoverable boundaries","Switch every subagent to the largest model tier so none of them can drop a task","Retry the whole orchestration run with exponential backoff until all 40 results appear","Increase the orchestrator's token budget so it can read longer subagent outputs without truncating them"],"correct":[0],"explanation":"Orchestrator-workers failures blur boundaries and a dropped subagent can fail silently at synthesis; define retry-or-flag versus orchestrator-level failures, share a trace ID, and check coverage. A bigger model or blind retries do not detect missing units.","mnemonic":"Count what went out, count what came back."},{"id":"d4s2q15","concept":"model-pinning","type":"single","stem":"Which practice set describes model version pinning as an operational discipline?","options":["Always call the newest alias so the system automatically benefits from every model improvement","Pin the version during the POC, then unpin at launch so rollout follows the provider's schedule","Pin versions only for agents, since RAG and document pipelines are insensitive to model changes","Pin versions in configuration, monitor the model deprecation page, and keep a version-update runbook"],"correct":[3],"explanation":"Pinning applies to every architecture equally and is paired with deprecation monitoring and a runbook for updates. Floating aliases make a model change an unreviewed deployment.","mnemonic":"Pin it, watch the deprecations, keep the runbook."},{"id":"d4s2q21","concept":"batch-api","type":"single","stem":"A nightly job summarizes protected health records and has no latency requirement. Which approach reflects the guidance on cost alternatives?","options":["Avoid Batch API entirely, since it suits only workloads that need real-time, low-latency responses","Model Batch API as a cost alternative, verifying current pricing and BAA coverage for that configuration first","Use Batch API only after enabling prompt caching, which supplies the compliance coverage batch lacks","Route it through Batch API at once, since asynchronous processing is automatically covered by the existing BAA"],"correct":[1],"explanation":"Where the SLA permits asynchronous processing, Batch API is modelled as a cost alternative, with the current discount and limits verified on the pricing page. For regulated data, BAA coverage is configuration-specific, so confirm batch processing is covered before routing PHI through it. Assuming existing coverage extends to a new configuration is the trap.","mnemonic":"Async can go batch, but check the price page and the BAA before PHI does."},{"id":"d4s2q17","concept":"backoff-purpose-and-placement","type":"single","stem":"A service retries every failed model call immediately and without limit. During a brief rate-limit episode the retries keep the endpoint saturated far longer than the original hiccup. What is the correct design?","options":["Exponential backoff with growing waits, capped attempts and a capped total wait","A fallback chain that sends every failed request straight to a cached response","Immediate retries spread across several API keys to raise the rate limit","A circuit breaker placed close to the API call that never retries"],"correct":[0],"explanation":"Exponential backoff lengthens the delay between attempts so a flood of retries does not turn a brief hiccup into a prolonged outage, with maximum attempts and total wait set by the use case's delay tolerance. Circuit breakers belong at the service boundary, not beside the API call.","mnemonic":"Back off, don't pile on: doubling waits and capped tries keep a hiccup a hiccup."},{"id":"d4s2q18","concept":"backoff-purpose-and-placement","type":"multi","stem":"Which TWO pairings of reliability control and placement in the call stack are correct? Select TWO.","options":["Circuit breakers: close to the API call","Fallback chains: at the service boundary","Retries with exponential backoff: close to the API call","Retries with exponential backoff: in the orchestration layer","Fallback chains: in the orchestration layer"],"correct":[2,4],"explanation":"Retries sit close to the API call, circuit breakers at the service boundary, and fallback chains in the orchestration layer. Putting a control in the wrong layer protects the wrong part of the system and leaves the right part exposed.","mnemonic":"Retry at the call, break at the boundary, fall back in orchestration."},{"id":"d4s2q22","concept":"poc-bill-scaling","type":"single","stem":"A team presents its POC's monthly bill, from about 30 requests a day, to the sponsor as the expected production cost. What is the main problem?","options":["The bill is valid only if every POC request used the same model tier planned for production","The bill overstates production cost, because prompt caching only warms up after the POC period ends","The POC bill is only a sample; it must be scaled to expected production volume with error bounds","The bill becomes acceptable once a fixed ten percent margin is added for growth and retries"],"correct":[2],"explanation":"A POC bill at low volume is a sample and does not reflect production spend. It can inform a production cost estimate only if the numbers are scaled to expected production volume with appropriate error bounds; presenting raw demo costs without that extrapolation is where the risk lives. A flat margin or matching the model tier does not replace that scaling.","mnemonic":"POC bill is a sample: scale to production volume, with error bounds."},{"id":"d4s2q23","concept":"reliability-initial-design","type":"single","stem":"A team plans to launch without retry, fallback or circuit-breaker logic and to add those controls after the first production incident. What is the main problem with this plan?","options":["Deferral is sound because the controls add latency, and the first incident shows which ones are needed","Only circuit breakers must exist at launch; retries and fallback chains can be added later at low cost","The plan is fine while provider availability is high, since outages are then too rare to matter in practice","These controls are much harder to retrofit than to design in, and meanwhile the primary endpoint is a single point of failure"],"correct":[3],"explanation":"Retries, fallback chains and circuit breakers are much harder to add to a system that wasn't designed for them, so reliability should be built in from the start rather than fixed after the first production incident. Until then the system has one point of failure, the primary model endpoint: when it goes down at peak load the whole user-facing workflow fails instead of degrading gracefully.","mnemonic":"Design reliability in from day one; retrofitting is harder, and the endpoint stays a single point of failure."},{"id":"d4s2q24","concept":"reliability-initial-design","type":"multi","stem":"An architect argues that reliability controls belong in the initial design of a production Claude system, not in a later hardening phase. Which TWO statements support that position? Select TWO.","options":["Retries, fallback chains and circuit breakers are much harder to add to a system not designed for them","Fallback chains remove the need to test failure handling in the eval suite, which shortens later phases","Without a fallback or circuit breaker, a primary endpoint outage at peak takes the whole workflow down","Reliability controls protect the system equally at any layer, so their placement can safely be settled later"],"correct":[0,2],"explanation":"Reliability controls are much harder to retrofit into a system that wasn't designed for them, and a system with no fallback and no circuit breaker has one point of failure, the primary model endpoint, so an outage at peak takes the entire workflow down. Fallback behaviour should itself be tested in the eval suite, and placement matters: retries near the API call, circuit breakers at the service boundary, fallbacks in the orchestration layer.","mnemonic":"Build retries, fallbacks, breakers in early: retrofit is hard; without them one endpoint fails all."}]},{"id":"d4s3","title":"A/B testing and shadow testing","learn":["A usable A/B test has a specific falsifiable hypothesis naming treatment, primary metric, threshold and constraints.","Assignment is random and consistent per user or session; the primary metric is defined before the run to avoid outcome-shopping.","Sample size is calculated from minimum detectable effect, baseline metric value and confidence level, and LLM output variance makes it larger.","Statistical significance is not practical significance; before declaring a winner, ask whether the effect justifies operational overhead and whether any secondary metric degraded.","Interaction effects: align the test period and input distribution, since edge cases may spike seasonally.","Shadow testing runs a copy of live traffic offline with no user exposure but no downstream signal; live A/B needs bounded exposure and high traffic."],"traps":["Vague hypothesis: without a falsifiable statement naming treatment, metric direction and constraints, any result can be read as a win.","Outcome-shopping: picking the metric that moved after seeing results turns an experiment into a search.","Underpowered wins: a small comparison run until it looks good cannot separate a real effect from noise, and ships false positives.","Significance equals value: a statistically significant gain can still be too small, or too costly, to ship.","Shadow overreach: shadow outputs never reach users, so they give no downstream behavior signal."],"questions":[{"id":"d4s3q15","concept":"ab-hypothesis","type":"single","stem":"Which hypothesis is ready for an A/B test of a prompt change?","options":["Adding two worked examples to the classification prompt will lift routing accuracy at least 3 points without raising cost per request","The revised classification prompt is clearer than the current one, and users will probably find its answers more helpful","The new prompt should ship if it looks good in a handful of internal demos run by the team over the next week","The new prompt will improve overall quality, which we will judge from whichever metrics end up improving in the results"],"correct":[0],"explanation":"A usable hypothesis is a specific, falsifiable statement naming the treatment, the expected direction of the primary metric with a success threshold, and a constraint on secondary metrics. The other options give no threshold, or leave the metric to be chosen after the fact, so any result could be read as a win.","mnemonic":"Name treatment, metric, threshold, constraint."},{"id":"d4s3q16","concept":"ab-hypothesis","type":"single","stem":"A team starts an experiment on a revised system prompt with no written hypothesis, planning to see what improves. What is the main risk?","options":["The experiment cannot use random assignment, because assignment rules have to be derived from the hypothesis","The required sample size shrinks, so the test ends before any real effect has had time to appear","Any result can be read as a win, since some metric will move the right way after the fact","The control group must also receive the revised prompt, which removes the baseline needed for comparison"],"correct":[2],"explanation":"Without a hypothesis, any result can be interpreted as a win: look at enough metrics after the fact and one will have moved in the right direction. A specific, falsifiable hypothesis and a primary metric fixed in advance prevent this outcome-shopping. A missing hypothesis does not change assignment or shrink the sample.","mnemonic":"If nothing can falsify it, everything confirms it."},{"id":"d4s3q03","concept":"random-assignment","type":"single","stem":"In an A/B test the treatment group happened to receive more complex queries, and the new version looked worse. What assignment principle was violated?","options":["Requests should be randomly assigned to treatment or control, consistently for a given user or session","Assignment should favor the treatment with extra traffic so the sample reaches significance faster","Assignment should be based on query complexity so each version receives only the inputs it handles best","Both versions should be tested on the same request sequentially to remove any difference in inputs"],"correct":[0],"explanation":"Random, consistent assignment makes the groups comparable and avoids contamination; otherwise an apparent win or loss may be an artifact of input distribution. Hand-picking inputs breaks comparability.","mnemonic":"Randomize, and keep each user in one arm."},{"id":"d4s3q04","concept":"primary-metric-before","type":"single","stem":"A team compares several metrics after the run and reports the one that favored the new version. What is this called, and what should have happened?","options":["Statistical power; extend the experiment until every metric favors the new version","Contamination; assign users inconsistently so each metric receives independent samples","Interaction effect; split the metrics by input type before the experiment runs","Outcome-shopping; define a single primary metric before the experiment runs"],"correct":[3],"explanation":"Choosing the metric after seeing results turns a test into a retrospective search for whatever moved. The primary metric (such as task success, cost per completion or p95) must be fixed in advance.","mnemonic":"Pick the metric first, or you will pick the winner."},{"id":"d4s3q05","concept":"sample-size","type":"multi","stem":"Which THREE inputs determine the required sample size for an A/B test? Select THREE.","options":["The number of engineers who will review the results","The required confidence level for the conclusion","How long the team is willing to wait","The minimum detectable effect the team needs to be able to see","The baseline value of the metric being measured"],"correct":[1,3,4],"explanation":"Sample size is calculated from minimum detectable effect, baseline metric value and the required confidence level, and for LLM systems the higher output variance pushes the number up. Reviewer count and patience are not inputs.","mnemonic":"Effect, baseline, confidence: three levers size the test."},{"id":"d4s3q06","concept":"sample-size","type":"single","stem":"A team stops its experiment the moment the treatment pulls ahead. What is the danger?","options":["Early stopping lowers the baseline metric, which makes the minimum detectable effect impossible to compute at all","An underpowered run cannot separate a real effect from noise, so a lead may be only chance","Stopping early changes random assignment, so users are no longer consistently routed to one arm","Early stopping guarantees that secondary metrics such as cost or latency degrade in the treatment arm"],"correct":[1],"explanation":"Without a sample size set in advance, stopping on a favorable reading mistakes noise for signal. LLM outputs are probabilistic, so variance is high and the required sample is larger.","mnemonic":"Stop on a lead and you chase noise."},{"id":"d4s3q07","concept":"llm-variance","type"
