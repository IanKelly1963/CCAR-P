:"single","stem":"Why do LLM A/B tests generally need larger samples than tests of deterministic software?","options":["Model outputs are probabilistic, so variance is higher and effects are harder to separate from noise","Model outputs are deterministic, so each request must be repeated many times to confirm the same result","Token costs vary per request, so cost noise is the main driver of the sample requirement","Prompt caching splits traffic across prefixes, which shrinks the effective sample in each arm"],"correct":[0],"explanation":"LLM outputs are probabilistic, which makes results noisier and interaction effects harder to control, so the required sample grows. Cost variation and caching are not the stated reasons.","mnemonic":"Probabilistic outputs, noisy metrics, bigger samples."},{"id":"d4s3q08","concept":"significance-vs-value","type":"single","stem":"A new prompt shows a statistically significant but tiny task-success gain. What is the right next question?","options":["Should the experiment be rerun with a smaller sample to see whether the gain remains?","Can the metric be changed to one with a larger observed difference before the decision is made?","Is the p-value small enough to be reported, since significance alone is sufficient to decide?","Is the effect large enough to justify the operational cost of shipping and maintaining the new version?"],"correct":[3],"explanation":"Statistical significance only says the result is unlikely to be chance; practical significance is a separate question about whether the gain outweighs operational overhead. Switching metrics would be outcome-shopping.","mnemonic":"Significant is not the same as worth shipping."},{"id":"d4s3q17","concept":"significance-vs-value","type":"multi","stem":"A treatment beats control on the primary metric with statistical significance. Which TWO questions should be answered before declaring it the winner? Select TWO.","options":["Which of the tracked metrics moved the most in the treatment's favor during the run?","Is the effect large enough to justify the overhead of maintaining the new version?","Would a different primary metric show an even larger gain for the treatment?","Did any secondary metric, such as cost or latency, degrade?","Is the p-value below a cut-off chosen after seeing the results?"],"correct":[1,3],"explanation":"Significance says the result is unlikely to be chance, not that it matters. Before declaring a winner, ask whether the effect justifies the operational overhead of maintaining the new version and whether any secondary metric degraded, since a success gain with higher cost may not be a net win. Hunting for the biggest mover or a post-hoc cut-off is outcome-shopping.","mnemonic":"Big enough to maintain? Nothing else broke? Only then crown the winner."},{"id":"d4s3q10","concept":"interaction-effects","type":"single","stem":"A prompt improves results on typical inputs during a quiet test period, then degrades on edge cases in a seasonal spike. What does this illustrate?","options":["A shadow-testing artifact caused by serving users the current version's response","An interaction effect with input type; align the test period and input distribution with later traffic","Judge miscalibration, which would be fixed by comparing the judge against human labels","A sample-size error that disappears if the quiet-period test is simply repeated with the same inputs"],"correct":[1],"explanation":"LLM experiments can show interaction effects where a change helps common inputs and hurts rare ones that surge later. Test period and input distribution alignment matters more than in most software tests.","mnemonic":"Quiet-season win, peak-season loss: match the test to the traffic."},{"id":"d4s3q18","concept":"experiment-preregistration","type":"multi","stem":"A team is preparing an A/B test of a revised system prompt. Which THREE should be fixed before the test starts? Select THREE.","options":["A specific, falsifiable hypothesis naming treatment and threshold","A list of every metric, to pick the best mover afterwards","A single primary metric for judging the result","A stop rule of ending the test once the treatment leads","The required sample size, from effect, baseline and confidence"],"correct":[0,2,4],"explanation":"Identify the primary metric and the sample size before running any experiment, alongside a hypothesis naming the treatment, metric direction and threshold. Sample size comes from the minimum detectable effect, baseline value and confidence level. Picking the best mover afterwards is outcome-shopping, and stopping once the treatment leads gives an underpowered result that cannot separate effect from noise.","mnemonic":"Hypothesis, metric, sample size: lock all three before the first session."},{"id":"d4s3q12","concept":"shadow-mechanism","type":"single","stem":"What defines shadow testing of a new prompt or model version?","options":["It serves the new version to a small share of users and measures how they respond to the answers","It replays old requests from a golden dataset against the new version, with no connection to live traffic","It runs the new version first and falls back to the current version only if the new one errors","It receives a copy of live requests, users still get the current version's answer, and outputs are logged and scored offline"],"correct":[3],"explanation":"In shadow testing the new version sees live traffic copies, but its outputs are never returned; they are scored offline, so the deployment decision is made before any user sees it. Serving some users is a live A/B test.","mnemonic":"Shadow: sees the traffic, never shows the user."},{"id":"d4s3q13","concept":"shadow-vs-ab","type":"single","stem":"A regulated-industry deployment cannot expose users to an unvalidated model change, and traffic is modest. Which approach fits, and what is the trade-off?","options":["Live A/B testing; the cost is that results arrive faster because the sample reaches significance sooner","Live A/B testing; the cost is a lack of control over input distribution compared with shadow traffic","Shadow testing; the cost is no downstream signal, since scoring relies on an offline rubric or golden answers","Shadow testing; the cost is that regressions can still reach a small fraction of users before closing"],"correct":[2],"explanation":"Shadow testing suits high-risk or low-traffic cases where exposure is unacceptable or a live split cannot reach a meaningful sample, but with no users receiving outputs there is no real behavior signal. Live A/B exposes users to bounded risk.","mnemonic":"Risky or quiet? Shadow it, and score offline."},{"id":"d4s3q14","concept":"shadow-vs-ab","type":"single","stem":"When is a live A/B test preferred over shadow testing?","options":["When traffic is too low to support a live split and the change is needed quickly","When the deployment can absorb bounded exposure to a worse version and traffic is high enough to reach a meaningful sample","When a single bad output would carry too much risk and the change must be validated before any user sees it","When the deployment is regulated and unvalidated model changes may not be permitted at all"],"correct":[1],"explanation":"A live A/B test measures real user behavior, including acceptance and follow-up signals, but requires tolerance for limited exposure and enough traffic. The other conditions point to shadow testing.","mnemonic":"High traffic, bounded risk, want real behavior: go live."}]},{"id":"d4s4","title":"Observability at scale and diagnosing failures","learn":["Observability must answer: what is the system doing, how well, when did it change, and why.","Request-level traces capture model, version, token counts, latency, stop reason and tool calls; aggregates add cost per request, p50/p95, task success and error rate by type.","Per-request decomposition matters because healthy aggregates can hide a small fraction of requests consuming most of the budget.","Alerts: set thresholds on the metrics that matter, such as cost spikes and p95 beyond SLA; gradual drift needs periodic distribution comparison.","Attribute changes to model drift, data drift or model update; each has a different fix. Classify failures as prompt, hallucination, model mismatch or orchestrator-workers.","A translation layer built at design time maps technical metrics to business metrics; log request, response, context and outcome."],"traps":["Healthy dashboard: aggregate metrics look fine while a small share of requests burns the budget.","Threshold-only drift: gradual output drift will not trip fixed alerts, and needs periodic distribution comparison.","Wrong fix: treating data drift, model drift and a model update the same produces the wrong remedy.","Instruct away hallucination: stronger instructions do not fix ungrounded content; grounding does.","Retrofit instrumentation: adding logging after the first incident means the root cause cannot be answered from existing data."],"questions":[{"id":"d4s4q01","concept":"four-questions","type":"single","stem":"Production observability for a Claude system must answer which four questions?","options":["What is the token limit, how many users exist, what is the SLA, and when is the next deployment","Which model is best, which prompt is shortest, what is the p95, and who approved the release","Who is using it, where is it hosted, what does it cost, and which team owns it","What is it doing, how well is it performing, when did it change, and why did it change"],"correct":[3],"explanation":"The four questions are what, how well, when and why, and each needs a different instrumentation layer (tracing, metrics, anomaly detection, change attribution).","mnemonic":"What, how well, when, why: four questions, four layers."},{"id":"d4s4q02","concept":"observability-logging","type":"single","stem":"Which record belongs in a request-level trace for a Claude call?","options":["The golden dataset and judge prompt version used to score the model offline in staging","Only the final answer text and the user's satisfaction rating collected after the session ends","Model and version, input and output token counts, latency, stop reason and any tool calls","The team's cost ceiling, the SLA target and the business owner's name and contact details"],"correct":[2],"explanation":"Traces are the raw material for metrics and capture model, version, token counts, latency, stop reason and tool calls. Without them, root cause cannot be answered from existing data.","mnemonic":"Trace the call: model, tokens, time, stop, tools."},{"id":"d4s4q03","concept":"per-request-decomposition","type":"single","stem":"Dashboards show a healthy average cost per request, yet monthly spend keeps overrunning budget. What is the best next step?","options":["Switch the dashboard from p95 to median latency, which better reflects typical request cost","Decompose cost per request to find the small fraction of requests consuming most of the budget","Add more aggregate panels, such as weekly averages, since a larger window smooths out irregular spikes","Lower the alert threshold on average cost so smaller deviations from the mean trigger notifications"],"correct":[1],"explanation":"Aggregate metrics can look healthy while a small share of requests dominates spend and produces wrong outputs. Per-request decomposition exposes the non-obvious cases that averages hide.","mnemonic":"Averages hide the hogs; break cost down per request."},{"id":"d4s4q04","concept":"per-request-decomposition","type":"multi","stem":"Which THREE metrics should a Claude dashboard aggregate from request-level trace data? Select THREE.","options":["Average prompt length across all users","Latency at p50 and p95","The temperature setting used per request","Cost per request","Error rate broken down by error type"],"correct":[1,3,4],"explanation":"Request-level data rolls up into cost per request, p50 and p95 latency, task success (where the downstream system supplies an acceptance signal) and error rate by type; decomposition then guards against hidden outliers.","mnemonic":"Roll up four: cost, p50/p95, success, errors by type."},{"id":"d4s4q16","concept":"anomaly-thresholds","type":"multi","stem":"A team wants alerting that warns it when users start hitting SLA breaches and that also catches gradual change in model outputs. Which TWO design choices fit? Select TWO.","options":["A threshold alert on median latency, since it reflects the typical user's experience","A threshold alert that fires when latency p95 crosses the SLA threshold","A tight threshold alert on output length to catch gradual model drift early","Periodic comparison of the output distribution over time to surface gradual drift","An alert on average token count, which tracks how quickly requests complete"],"correct":[1,3],"explanation":"Set threshold alerts on the metrics that matter for the deployment, such as latency p95 crossing the SLA, because breaches come from the slow tail rather than the median. Model drift is a gradual shift that threshold alerts catch poorly, so it needs periodic distribution comparison. Token count is a cost signal, not a latency alert.","mnemonic":"Alarms for p95 past SLA; slow drift needs a side-by-side distribution check."},{"id":"d4s4q06","concept":"drift-detection","type":"single","stem":"Model outputs have been gradually shifting in distribution over several weeks without tripping any threshold alert. Which approach suits this?","options":["Tighten the cost and p95 alert thresholds, since gradual drift always appears as a latency or cost excursion","Disable alerting on cost and rely on a monthly manual review of a few sampled outputs","Periodic distribution comparison of outputs over time, since threshold alerts are poor at catching gradual drift","Wait for task success rate to fall below the SLA, which is the only reliable indicator of drift"],"correct":[2],"explanation":"Model drift is harder to detect with threshold alerts and benefits from periodic comparison of output distributions. Waiting for success to collapse means users already saw the problem.","mnemonic":"Slow drift slips past alarms; compare distributions."},{"id":"d4s4q07","concept":"change-attribution","type":"single","stem":"Task success fell but the model version is unchanged and the model behaves the same on a fixed set of old inputs. Traffic now includes many new document types. Which cause and fix fit?","options":["Hallucination; replace the instructions with a stronger and more emphatic warning to the model","Data drift; update the golden dataset, prompts or routing for the new input distribution","Model update effect; wait for the provider's next release to restore previous behavior","Model drift; roll back to the previous model version and wait for behavior to stabilize"],"correct":[1],"explanation":"When the model is unchanged and behaves the same on stable inputs, the cause is a shifted input distribution (data drift), which calls for data-side changes. Mixing up the three causes produces the wrong fix.","mnemonic":"Same model, new inputs: that is data drift."},{"id":"d4s4q08","concept":"change-attribution","type":"single","stem":"Metrics shifted right after the team moved to a new model version, with input distribution unchanged. How should this be attributed?","options":["As a model update effect: the new version behaves differently on old inputs, so use eval-gated selection","As model drift, where the same model gradually changed, to be handled by raising alert thresholds","As data drift, to be handled by reindexing the knowledge base and refreshing the golden dataset","As a prompt failure, to be handled by shortening the system prompt to reduce ambiguity"],"correct":[0],"explanation":"A changed model version behaving differently on existing inputs is a model update effect. The version recorded in each trace makes this attribution possible and differentiates it from drift on stable inputs.","mnemonic":"New version, old inputs: blame the update."},{"id":"d4s4q09","concept":"failure-taxonomy","type":"single","stem":"A model confidently states a policy detail that appears nowhere in the supplied documents. What is the correct remedy?","options":["Treat it as model mismatch and swap to a higher tier without running an eval","Treat it as a prompt failure and add stronger instructions telling the model never to guess","Treat it as data drift and refresh the golden dataset with this month's inputs","Treat it as hallucination and fix grounding through retrieval, tool use or verification"],"correct":[3],"explanation":"Hallucination is confident, fluent content not grounded in input or a reliable source, and stronger instruction will not resolve it; grounding through retrieval, tools or verification does.","mnemonic":"Ungrounded fluency needs grounding, not louder instructions."},{"id":"d4s4q10","concept":"failure-taxonomy","type":"multi","stem":"Which TWO failure-class and fix pairings are correct? Select TWO.","options":["Model mismatch: the tier is wrong or was swapped unevaluated, so fix selection, gated by an eval","Orchestrator-workers failure: fix by examining only the orchestrator's trace, since subagents are recoverable","Prompt failure: fix by swapping to a larger model tier before ever changing the wording","Hallucination: fix by strengthening instruction wording so the model avoids any unsupported statements","Prompt failure: the instruction was ambiguous, so fix the prompt"],"correct":[0,4],"explanation":"Prompt failures are fixed in the prompt and model mismatch by eval-gated model selection. Hallucination needs grounding rather than instruction, and orchestrator-workers diagnosis needs a trace spanning both orchestrator and subagents.","mnemonic":"Prompt fix, grounding fix, eval-gated tier fix, full trace."},{"id":"d4s4q11","concept":"orchestrator-trace","type":"single","stem":"In a multi-agent system, a metric degraded and the team can only see orchestrator logs. Why is attribution difficult?","options":["Subagent failures always surface as 4xx errors at the orchestrator, which standard logging already identifies","A recoverable subagent failure looks different from an unrecoverable orchestrator failure, and attribution needs a trace spanning both","Orchestrators never log token counts, so cost anomalies cannot be assigned to any specific component","Spanning traces are only needed for single-agent systems where tool calls are made sequentially"],"correct":[1],"explanation":"Attribution in orchestrator-workers designs requires a trace that spans the orchestrator and its subagents, so retry-or-flag subagent failures can be told apart from unrecoverable orchestrator failures.","mnemonic":"Trace both ends of the orchestra."},{"id":"d4s4q12","concept":"discernment","type":"single","stem":"What does Discernment mean when applied to a production Claude system?","options":["Classifying outputs as acceptable, needs revision or needs override, and feeding that judgment back into evals and monitoring","Detecting hallucination automatically with a regex and blocking any flagged answer before it reaches users","Reporting technical metrics weekly to executives so they can approve each model update","Selecting the cheapest model tier that meets latency targets, then recording the choice in the architecture document"],"correct":[0],"explanation":"Discernment is judging the quality of model output rather than accepting it, and feeding that back into evals and monitoring. A team without it watches metrics move and never asks whether outputs were good.","mnemonic":"Judge the output: accept, revise, or override."},{"id":"d4s4q17","concept":"translation-layer","type":"single","stem":"A finance sponsor tracks the average number of days to pay a supplier invoice, while the team monitors latency, task success and error rate. What should be built, and when?","options":["A second dashboard of raw request traces for the sponsor, added once the first business review asks questions","A mapping from model tiers to budget lines, built after the first billing cycle shows the real spend","A report written after each business review that reconstructs which technical change moved the number","A translation layer that maps the technical metrics to the sponsor's business KPI, built at design time"],"correct":[3],"explanation":"Funders read the KPI the deployment was meant to improve, not the trace, so the observability stack needs a translation layer linking technical metrics to that business metric. Build it when the system is designed; otherwise the first business review needs a retrospective reconstruction instead of a live query. Raw traces do not answer a business question.","mnemonic":"Map tech metrics to the sponsor's KPI on day one, not after the review."},{"id":"d4s4q14","concept":"rag-refresh-diagnosis","type":"single","stem":"A RAG assistant returns confident but incorrect answers after a document refresh, while latency and model version are unchanged. Where should investigation start?","options":["The temperature setting, which may have become too low after the refresh","The model weights, which may have silently changed during the document refresh","The retrieval and indexing step, which may be returning irrelevant or stale chunks","The context window size, which may have shrunk when documents were refreshed"],"correct":[2],"explanation":"With model and latency unchanged, confident wrong answers after a refresh point to retrieval feeding poor context, such as a broken re-index or mismatched representation. The other causes are not triggered by a refresh.","mnemonic":"Refresh then wrong? Suspect the index first."},{"id":"d4s4q15","concept":"observability-logging","type":"single","stem":"An LLM system rarely crashes; it just returns subtly wrong answers. Which logging design best supports diagnosing this?","options":["Log the final answer text only, and review a random sample of answers manually each quarter","Log the request, the response, the context, and the outcome including whether the downstream system accepted the output","Log the response, the context and only the cost, since outcome signals belong to the downstream system","Log only errors and timeouts, since those are the events that reveal incorrect behavior most reliably"],"correct":[1],"explanation":"Standard logging catches errors and timeouts but not quietly incorrect responses, so log the request (model version, input tokens, prompt id), response (output tokens, latency, stop reason), context (user role, session, cache) and outcome (acceptance or rejection).","mnemonic":"Request, response, context, outcome: four logs, no blind spots."}]}]},{"domain":5,"subjects":[{"id":"d5s1","title":"Layered safety: what training enforces versus what you own","learn":["Claude is trained against a constitution; the priority order is broadly safe, ethical, guideline-compliant, then helpful, applied holistically rather than as a strict sequence.","Training-time alignment reduces broad classes of harm but is general by design and does not know your domain policy, data rules or authorization model.","Four layers: trained behaviour (Anthropic), system prompt instruction, runtime screening and authorisation (all architect-owned), each with its own coverage and blind spot.","Inference-time control means system instructions, input and output checks, tool permissions and human review gates; instructions steer but are not enforcement.","Each added layer costs latency and engineering; four layers are four places to design, version and test, and the system prompt and screening logic drift apart if not governed together."],"traps":["Strict ordering: the priority order is holistic, so higher goals generally win but are weighed together with the rest.","Red-team confidence: passing every harmful-prompt test shows broad-harm handling, not that your partner's policy is enforced.","Prompt as control: a system prompt rule is an instruction an adversarial input can talk around, not enforcement.","Silent assumption: the dangerous failure is believing Claude enforces a rule it was never given, since nothing then prevents violation."],"questions":[{"id":"d5s1q01","concept":"priority-order-holistic","type":"single","stem":"When goals conflict, which priority order does Claude's constitution set for the model's behaviour?","options":["Genuinely helpful first, then guideline-compliant, then ethical, then broadly safe for operators in each conflict","Broadly safe first, then ethical, then guideline-compliant, then genuinely helpful to operators and users","Ethical first, then broadly safe, then genuinely helpful, then compliant with operator guidelines","Guideline-compliant first, then broadly safe, then ethical, then genuinely helpful to all users"],"correct":[1],"explanation":"The constitution orders goals as broadly safe, ethical, guideline-compliant, then helpful, because a helpful answer is sometimes unsafe. Putting helpfulness first inverts the ordering and is the strongest distractor.","mnemonic":"Safe, Ethical, Guideline, Helpful: S-E-G-H, safety leads."},{"id":"d5s1q02","concept":"priority-order-holistic","type":"single","stem":"An architect claims the constitution's priority order is a strict sequence, so lower goals are ignored whenever a higher one is touched. What is the correct correction?","options":["The ordering is strict for safety only, and every other goal is applied holistically by the model and then rank them","The ordering is a default that operators override per deployment through the system instructions they write","The ordering is holistic: higher priorities generally win in a conflict, but the model weighs all goals together","The ordering applies only at training time and has no influence on the responses Claude produces"],"correct":[2],"explanation":"The notes describe the ordering as holistic rather than strict: higher goals generally take precedence but are weighed together with the others. Treating it as operator-overridable is not supported.","mnemonic":"Priorities lean, they do not lock: weighed together, not ranked rigidly."},{"id":"d5s1q03","concept":"general-by-design","type":"single","stem":"Why does training-time alignment not know a partner's data-handling or authorization policy?","options":["It is set before any deployment exists, so it is general by design rather than tailored to one domain","It is deliberately disabled whenever an operator supplies a system prompt describing deployment-specific rules","It only covers consumer applications, and enterprise integrations fall outside the scope of the constitution","It is refreshed only when a partner submits its policy, which has not happened for this deployment"],"correct":[0],"explanation":"Because alignment is shaped before deployment, it reduces broad harm for everyone but cannot know your domain rules. The distractors invent switches or scopes that the notes never describe.","mnemonic":"Trained before you existed, so general by design."},{"id":"d5s1q17","concept":"draw-layer-boundary","type":"single","stem":"Before adding any controls to a new Claude deployment, why should the architect first establish what the model's training already covers?","options":["Because training can be tuned per deployment, so the boundary shows which trained behaviours to switch off","Because the system prompt replaces trained behaviour, so the boundary marks what the prompt must restate","Because once training is mapped, input and output screening become unnecessary for the domain policy","To avoid duplicate protections and to avoid assuming the model enforces a rule it never saw"],"correct":[3],"explanation":"Drawing the boundary between trained behaviour and the layers you build stops you duplicating protections and stops the silent failure of assuming Claude enforces a rule it was never given. Training is general by design and is not tuned per deployment, and mapping it never removes the need to enforce your own domain policy.","mnemonic":"Map what training covers first: no double guards, no imaginary rules."},{"id":"d5s1q05","concept":"four-layer-blind-spots","type":"multi","stem":"Which TWO pairings of layer and blind spot are correct? Select TWO.","options":["Trained behaviour does not cover your domain policy, data rules or authorization model","System prompt instruction cannot be talked out of its constraints by unusual or adversarial input","Runtime screening authorizes side-effecting actions for a specific caller in a specific context","Authorisation is the layer that judges content quality and fairness of the model's output","Runtime screening misses novel attacks that its classifier was not built to detect"],"correct":[0,4],"explanation":"Trained behaviour is general, and screening can miss novel attacks and does not authorize actions. Instructions can be talked out of (not enforcement), and authorisation does not judge content quality.","mnemonic":"Each layer's blind spot is the next layer's job."},{"id":"d5s1q18","concept":"instructions-not-enforcement","type":"single","stem":"Only verified account holders may change a delivery address through an assistant's update_address tool. Which control actually enforces this rule?","options":["A system prompt sentence telling Claude never to change addresses for unverified users","A deterministic identity and scope check that runs before the update_address tool executes","Reliance on Claude's trained refusals, which already decline requests that look unsafe","An output tone guideline that keeps Claude polite and inside the approved support script"],"correct":[1],"explanation":"Whether a side-effecting action is permitted for this caller in this context is the authorisation layer's job, and that check should be deterministic. A system prompt sentence steers Claude but is not enforcement, and training never saw this deployment's rule.","mnemonic":"Instructions ask; an identity check before the tool enforces."},{"id":"d5s1q07","concept":"silent-failure-risk","type":"multi","stem":"Which TWO statements correctly describe the silent-failure risk in a layered safety design? Select TWO.","options":["The rule exists in no layer, so nothing prevents a violation when the request arrives","Assuming training covers a domain rule leads the team to skip building any enforcement control","The failure shows up as loud errors in the logs, so it is caught before users are affected","The risk only arises in systems that stack more than four layers of controls on one path","A longer system prompt removes the risk by moving the rule into the trained behaviour layer"],"correct":[0,1],"explanation":"The most dangerous failure is silent: Claude is assumed to enforce a rule that lives in no layer. The risk is not loud, not tied to layer count, and a longer prompt does not move a rule into training.","mnemonic":"Silent means no alarm: a missing rule looks like a safe system."},{"id":"d5s1q08","concept":"authorisation-layer","type":"single","stem":"Which layer covers the blind spot that runtime input and output screening leave open for actions with side effects?","options":["Trained behaviour, which refuses dangerous requests before any tool in the deployment is called","Authorisation, which decides whether a specific action is permitted for this caller in this context","System prompt instruction, which states the role and constraints Claude follows inside one request","A second screening classifier on the output, which scores whether the generated text was acceptable"],"correct":[1],"explanation":"Screening does not authorize actions; authorisation does. A second output classifier still judges text, not the side effect.","mnemonic":"Screening reads text; authorization gates actions."},{"id":"d5s1q09","concept":"cannot-enforce-unseen-rule","type":"single","stem":"A reviewer says Claude passed every red-team prompt, so the partner's data policy is covered. What is the best response?","options":["Agree, because the constitution includes guidelines that automatically extend to each partner's own policy","Agree, but add a stronger system prompt sentence so the model remembers the policy during long sessions","Red-team refusals show broad-harm handling, so the partner policy still needs an enforcement layer you build","Disagree, and ask Anthropic to retrain the model on the partner policy before the deployment goes live"],"correct":[2],"explanation":"Training covers broad harm, not deployment-specific rules. A stronger prompt is still only an instruction, not enforcement.","mnemonic":"Passing red-team proves general safety, not your policy."},{"id":"d5s1q10","concept":"general-by-design","type":"single","stem":"Which request is most likely to satisfy Claude's general alignment while still violating a deployment-specific rule?","options":["A request for step-by-step help creating a dangerous weapon through the support assistant","A request that asks the assistant to ignore its role and produce clearly hateful content","A request that is plainly crafted to trigger a refusal in a streaming classifier category","An in-domain request asking for another customer's order information from a support assistant"],"correct":[3],"explanation":"Nothing in a cross-customer lookup looks generally harmful, so trained behaviour would not block it, yet it breaks a deployment rule. The other requests are broad harms that training addresses.","mnemonic":"Normal-looking and out-of-policy: training can't see it."},{"id":"d5s1q11","concept":"inference-time-controls","type":"multi","stem":"Which TWO are inference-time controls that the architect configures for a deployment? Select TWO.","options":["Tool permissions limiting which actions the model may take","A human review gate on high-stakes decisions","Using the constitution to rank candidate responses during training","Steering Claude to refuse dangerous requests by default","Revising the published constitution over time"],"correct":[0,1],"explanation":"Tool permissions and human review gates are runtime guardrails the architect configures. The other three are training-time activities owned by Anthropic.","mnemonic":"Runtime is yours: permissions and reviewers; training is theirs."},{"id":"d5s1q12","concept":"instructions-not-enforcement","type":"single","stem":"An unusual adversarial input talked Claude out of a constraint written in the system prompt. What is the correct interpretation?","options":["The prompt wording was too brief, and a longer and more emphatic version would have enforced the constraint","Trained alignment failed on this request, and the model should be replaced by one with stronger refusals","Instructions shape behaviour but are not enforcement, so the rule needs pairing with screening, authorization or review","The constraint belonged in the trained behaviour layer, which Anthropic owns and the architect cannot change"],"correct":[2],"explanation":"System instructions steer a single request but can be talked around; deployment policy is enforced only with runtime controls. More emphatic wording is still only an instruction.","mnemonic":"A prompt is a request, not a lock."},{"id":"d5s1q13","concept":"constitution-shapes-not-catches","type":"single","stem":"A stakeholder argues that because Claude is trained against a constitution, harmful outputs will be caught before they reach users, so no output check is needed. What is the most accurate correction?","options":["The constitution shapes how the model responds, but it does not necessarily catch bad outputs","The constitution catches bad outputs only for requests that fall inside a partner's own domain","The constitution is applied at inference time, so a system prompt can switch it off","The constitution catches bad outputs reliably, but only on the most recent model release"],"correct":[0],"explanation":"The constitution is used during training to shape how Claude responds to ambiguous or sensitive requests, but it does not necessarily catch bad outputs, so runtime checks are still yours to build. It is not an inference-time filter that a system prompt toggles, and it knows nothing of a partner's domain.","mnemonic":"Constitution steers the driver; it is not the brakes on the car."},{"id":"d5s1q14","concept":"constitution-shapes-not-catches","type":"single","stem":"How is Claude's constitution used, and what follows for the architect's control design?","options":["It is enforced as a runtime filter on every response, so output screening becomes redundant","It is loaded into each system prompt, so editing the prompt changes the priority order","It generates training examples and ranks candidate responses, so runtime checks remain yours","It defines each partner's domain rules in advance, so deployment policy is already covered"],"correct":[2],"explanation":"The constitution is used in training to generate examples and rank candidate responses. That shapes behaviour before deployment but is not a runtime filter, so screening, authorization and review remain the architect's job. Treating it as a runtime filter is the trap, because it never inspects a live response.","mnemonic":"Trained to rank, not stationed to check: runtime guards are on you."},{"id":"d5s1q15","concept":"layer-owners","type":"multi","stem":"In the four-layer safety view (trained behaviour, system prompt, runtime screening, authorisation), which TWO statements about ownership and coverage are correct? Select TWO.","options":["Anthropic owns runtime screening, since its classifiers run on every request by default","Anthropic owns trained behaviour, while the architect owns prompt, screening and authorisation","The system prompt layer is owned by Anthropic, as it forms part of trained behaviour","Authorisation does not cover content quality or fairness, which other controls must address","Authorisation covers content quality and fairness because it checks every caller's action"],"correct":[1,3],"explanation":"Only trained behaviour is Anthropic's; the system prompt, runtime screening and authorisation are all architect-owned. Authorisation decides whether a side-effecting action is permitted for this caller, but it says nothing about content quality or fairness. Runtime screening is a layer you build, not an Anthropic default.","mnemonic":"Anthropic owns one layer, you own three; authorisation guards actions, not fairness."},{"id":"d5s1q16","concept":"prompt-screening-drift","type":"single","stem":"Six months after launch, the system prompt was edited to allow a new topic, but the screening rules were never updated, so the two layers now contradict each other. Which risk of the layered design does this show?","options":["Trained behaviour has overridden the system prompt, so the classifier must be retrained","Authorisation has failed open, so screening is compensating for missing access checks","System prompt and screening logic drift independently when they are not governed together","Runtime screening is model-based, so it cannot be versioned or tested like other layers"],"correct":[2],"explanation":"Four layers mean four places to design, version and test, and the system prompt and screening logic drift independently unless they are governed together. Nothing here involves an authorisation failure, and screening can be versioned and tested like any other layer.","mnemonic":"Four layers, four versions: govern prompt and screen together or they drift apart."}]},{"id":"d5s2","title":"Risk categories and the guarded request path","learn":["Five risk categories: direct injection, indirect injection via retrieved content or tool outputs, token-budget exhaustion, tool and action abuse, and data exposure.","Risk assessment is a written artifact: category, component, likelihood and impact, mitigation control with owner and evidence.","Three control points (input screening, output screening, tool-call authorization) answer different questions; authorization must be deterministic, auditable and replayable.","Chain model-based and deterministic checks in series; screen retrieved content and tool outputs before they enter context.","Fail open versus fail closed applies to operator-built components: choose the direction explicitly and fail closed where a wrong pass causes harm; stop_reason \"refusal\" with stop_details needs tolerant handling and a context reset."],"traps":["Single end filter: an output classifier judges text, so a side-effecting tool can run before anything checks it.","User-input-only screening: retrieved documents and tool outputs inject instructions after input screening has passed.","Default behaviour: an undecided guardrail error usually lets traffic through, giving the look of protection without the function.","Wrong fail scope: Anthropic's built-in controls are not operator-configurable and do not fail open; the choice applies to what you build.","Model for authorization: classifiers are evadable and not replayable, so authorization belongs to deterministic allowlist, identity and scope checks."],"questions":[{"id":"d5s2q01","concept":"indirect-injection","type":"single","stem":"A malicious instruction hidden in a retrieved document reached the model after the user's request passed input screening. Which risk category is this?","options":["Indirect prompt injection via retrieved content, which input screening on the user's message does not catch","Direct prompt injection, because the user's own message must have contained the hidden instruction","Token-budget exhaustion, because the retrieved document padded the context with oversized content in the retrieval step","Data exposure, because sensitive fields from the document entered the context window unintentionally"],"correct":[0],"explanation":"Instructions arriving through retrieved content or tool outputs are indirect injection, after user input screening already passed. Direct injection is crafted by the user in their own input.","mnemonic":"Direct comes from the user; indirect comes from the data."},{"id":"d5s2q02","concept":"indirect-injection","type":"single","stem":"In a RAG and agentic deployment, which control addresses the dominant enterprise injection vector that user-input screening misses?","options":["Run the same user-input screen again on the final model output before it reaches the user","Screen retrieved content and tool outputs with a classifier before they are appended to the model's context","Lengthen the system prompt with a warning that retrieved documents may contain hostile instructions","Rely on Claude's trained refusals to ignore instructions found inside tool responses and documents in every response"],"correct":[1],"explanation":"The source differs, so the blind spot differs: screen retrieved content and tool responses before they enter context. Output screening acts too late, after the model has already been influenced.","mnemonic":"Screen what you fetch before it enters the context."},{"id":"d5s2q03","concept":"three-control-points","type":"multi","stem":"Which TWO pairings of control point and the question it answers are correct? Select TWO.","options":["Input screening decides whether the request should reach the model at all","Output screening decides whether this caller may perform this side-effecting action","Tool-call authorization decides whether this caller may perform this action in this context","Input screening decides whether the response the model produced is safe to return","Tool-call authorization decides whether the retrieved context is free of hostile instructions"],"correct":[0,2],"explanation":"Each control sits at a different point and answers a different question; input screening gates the request, authorization gates the action, and output screening judges the response. Mixing them is the trap.","mnemonic":"In, out, act: three gates, three different questions."},{"id":"d5s2q04","concept":"authorization-deterministic","type":"single","stem":"Which kind of check should tool-call authorization almost always use, and why?","options":["A judge model scoring each call, because language understanding is needed to weigh the caller's intent","A lightweight classifier, because it adapts to novel phrasing that fixed rules would otherwise miss","Deterministic allowlist, identity and scope checks, because the decision must be auditable and replayable","A sampled human review, because deterministic rules cannot be trusted with actions that have side effects"],"correct":[2],"explanation":"Authorization must be a decision you can prove and replay, so it should be deterministic: allowlist, identity and scope validation. A classifier can be evaded and is not replayable.","mnemonic":"Authorization you cannot replay, you cannot prove."},{"id":"d5s2q28","concept":"guarded-path-order","type":"single","stem":"Which sequence describes the full guarded request path?","options":["Model call, then output screening, then input screening of the next turn, with tool calls authorized after the response returns","Input screening, output screening, then the model call, with tool calls authorized only when output screening flags the reply","Model call, then tool execution, then input screening of the tool result, with only passed gates logged for later audit","Input screening, model call, output screening, with each tool call authorized before it runs and blocked or failed gates logged"],"correct":[3],"explanation":"A request arrives, input screening decides whether it reaches the model, the model responds, output screening decides whether the response is returned, and any tool call passes authorization before it runs. Every blocked or failed gate is logged so an incident can be reconstructed. Authorizing a tool after it runs, or logging only passed gates, leaves both the side effect and the record unguarded.","mnemonic":"Screen in, call, screen out; authorize before acting; log every block and fail."},{"id":"d5s2q06","concept":"fail-open-default","type":"single","stem":"A screening service errors under load and the team never decided how it should behave. What does the system most likely do?","options":["It falls back to the unprotected path, because the surrounding code usually lets requests through by default","It blocks every request until the service is healthy, because failing closed is the usual default","It routes each request to human review, because errors automatically trigger the review gate and keeps retrying quietly","It retries until success, because guardrails are wrapped in the same retry logic as model calls"],"correct":[0],"explanation":"If the choice is not made explicitly, the code decides, and the default is almost always to let requests through. A failing guardrail can still look healthy.","mnemonic":"Undecided means open: errors default to let-through."},{"id":"d5s2q07","concept":"fail-open-scope","type":"single","stem":"A reviewer asks whether Anthropic's built-in model safety controls might fail open under load. How should the architect answer?","options":["They can fail open, so the architect should add an operator-built wrapper that mirrors the same controls","They are not operator-configurable and do not fail open; the fail-open risk applies to components your team builds","They fail closed only when the architect sets the policy through a flag in the system prompt","They share the failure behaviour of operator classifiers, so one fail direction covers every component"],"correct":[1],"explanation":"The fail open versus closed choice belongs to the architect for operator-built components. Anthropic's controls are outside the operator's configuration and do not fail open.","mnemonic":"Fail direction is yours only for what you build."},{"id":"d5s2q08","concept":"refusal-handling","type":"multi","stem":"A Messages API response returns stop_reason \"refusal\". Which TWO handling practices does the guidance support? Select TWO.","options":["Read the stop_details category and route refusal classes differently, tolerating an absent object on older models","Reset the context by removing or rephrasing the triggering turn before sending the next request","Resend the same conversation unchanged, since a second attempt usually clears the classifier","Hardcode the category list at build time so routing never depends on current documentation","Treat every refusal as one undifferentiated event and show a generic error without reading any fields"],"correct":[0,1],"explanation":"The category and explanation may be null or absent, so handlers must tolerate that, and the next request on a refused context returns further refusals. Hardcoding categories is discouraged; re-check at publish time.","mnemonic":"Read the category, tolerate null, then reset the context."},{"id":"d5s2q09","concept":"chain-in-series","type":"single","stem":"Why are model-based and deterministic checks deployed in series rather than choosing the single best one?","options":["Running them in series halves latency, because the cheaper deterministic check always runs first and decides","The strongest judge model catches everything, so the deterministic check only provides a fallback record","Each fails differently, with classifiers evadable and rules brittle, so each gap is covered by a different control","Deterministic rules are always brittle while classifiers are never evaded, so combining them is redundant"],"correct":[2],"explanation":"No single control catches everything: a classifier can be phrased around, a rule only blocks what it anticipated. Chaining means each blind spot is deliberately covered.","mnemonic":"Every check has a hole; stack them so holes don't line up."},{"id":"d5s2q10","concept":"risk-assessment-artifact","type":"single","stem":"Which set of fields should each entry in a written risk assessment record?","options":["Category, model version, token cost, and a description of the mitigation written by the vendor for the audit","Component, severity colour, date of discovery, and the name of the engineer who found the issue","Category, likelihood only, a design diagram, and a sign-off from the product manager on scope","Category, affected component, likelihood and impact, and a mitigation control with an owner and an evidence artifact"],"correct":[3],"explanation":"The assessment is the artifact a security reviewer signs off on, so each risk needs category, component, likelihood-and-impact, and mitigation with owner and evidence. A diagram or sign-off does not prove a control.","mnemonic":"Category, component, odds, control, owner, evidence."},{"id":"d5s2q11","concept":"single-filter-coverage","type":"single","stem":"A design review shows one output classifier at the end of the path and the reviewer calls the design complete. What is missing?","options":["A second output classifier from another vendor so that two models score every generated response","Input screening before the model and deterministic tool-call authorization before any side-effecting action","A longer system prompt so that Claude refuses to call tools unless the output classifier approves","Logging of passed responses only, since blocked gates do not need to be reconstructed later"],"correct":[1],"explanation":"One filter at the end is not a guarded path; the three control points answer different questions. A second output classifier still leaves input and actions uncontrolled.","mnemonic":"One filter at the end guards nothing upstream."},{"id":"d5s2q12","concept":"deterministic-vs-model-check","type":"single","stem":"For input screening, when is a deterministic check preferable to a model-based one?","options":["When the rule is clear and defined, such as a blocklist, regex, or length or format check","When intent is ambiguous and you must catch jailbreak patterns that rules cannot exhaustively list across the whole request path","When you must judge qualities such as toxicity that need language understanding to evaluate","When a side-effecting action needs approval, because only a deterministic check can approve it"],"correct":[0],"explanation":"Defined rules are faster, predictable and cannot be talked out of a decision. Ambiguous intent and language-quality judgements need a model-based check.","mnemonic":"Clear rule, plain check; fuzzy intent, model check."},{"id":"d5s2q13","concept":"risk-categories","type":"multi","stem":"Which TWO scenarios are correctly matched to a risk category? Select TWO.","options":["Oversized, padded inputs consume the context or output budget, which is token-budget exhaustion","Sensitive fields appear in logs independent of model behaviour, which is data exposure","A user message that overrides instructions is indirect prompt injection","A tool response carrying hostile instructions is direct prompt injection","The model induced to call a side-effecting tool is data exposure"],"correct":[0,1],"explanation":"Token-budget exhaustion and data exposure are matched correctly. Overriding user input is direct injection, tool-carried instructions are indirect, and induced tool calls are tool and action abuse.","mnemonic":"Padding burns budget; logs leak data."},{"id":"d5s2q14","concept":"log-every-gate","type":"single","stem":"Which logging practice supports reconstructing an incident on the guarded request path?","options":["Log only the final responses returned to users, since they are the only visible output","Log failed gates only, since a blocked request has already been stopped safely","Log every blocked or failed gate so the incident can be reconstructed from the record","Log gate decisions at the end of each week, since real-time records are costly to keep"],"correct":[2],"explanation":"Each gate can pass, block or fail, and every blocked or failed gate is logged for reconstruction. Logging only successes loses the evidence.","mnemonic":"Blocked or failed, it gets logged."},{"concept":"fail-open-default","type":"single","stem":"An operator-built input classifier times out under load. Which design choice is more dangerous?","options":["Blocking requests until the classifier recovers, with each block written to the log","Passing requests through unscreened without logging, so traffic flows and the control seems healthy","Routing requests to a deterministic blocklist while the classifier is unreachable","Failing closed for harmful decisions and alerting the owning team about the outage"],"correct":[1],"explanation":"A guardrail that silently passes traffic when it errors gives reassurance of control with none of the protection, which is worse than blocking. The choice must be made explicitly rather than inherited.","mnemonic":"Silent pass-through: the control looks alive and does nothing.","id":"d5s2q15"},{"concept":"authorization-deterministic","type":"single","stem":"An auditor wants to replay exactly why a refund tool call was permitted last month. Which design supports this?","options":["A judge model that scored each call, with its raw scores retained","A lightweight classifier whose threshold the team tuned after the incident","A deterministic allowlist with identity and scope checks, giving a provable and replayable decision","An output validator that inspected the text of each response before release"],"correct":[2],"explanation":"Authorization must be a decision you can prove and replay, which only a deterministic allowlist, identity and scope check gives. Retained scores from a model are not a replayable rule.","mnemonic":"Same inputs, same verdict: only rules replay.","id":"d5s2q16"},{"id":"d5s2q17","concept":"output-check-type","type":"single","stem":"Responses must never contain an internal account-number field, and they must also comply with a nuanced tone policy. Which output-screening design fits each requirement?","options":["A judge model for the forbidden field and a deterministic validator for the tone policy","A deterministic validator for the forbidden field and a judge model for the tone policy","A judge model for both, since output screening always needs language understanding","A deterministic validator for both, since output checks must be auditable and replayable"],"correct":[1],"explanation":"A known forbidden field is something a validator catches with certainty, while tone or policy compliance needs language understanding, so a judge model scores it. Requiring auditable, replayable decisions is the rule for tool-call authorization, not for every output check.","mnemonic":"Known string? Validator. Needs nuance? Judge."},{"id":"d5s2q18","concept":"output-check-type","type":"multi","stem":"Which TWO pairings of output-screening need and check type are well matched? Select TWO.","options":["Detecting a known forbidden string: a judge model scoring the response","Assessing policy compliance in free text: a regex blocklist on the reply","Detecting a schema violation in the response: a deterministic validator","Checking a response for toxicity: a length and format check on the reply","Scoring a response for toxicity: a judge model that understands language"],"correct":[2,4],"explanation":"Schema violations, known strings and forbidden fields are certain catches for a deterministic validator. Toxicity and policy compliance need language understanding, so a judge model scores them. A regex or a length check cannot judge nuanced compliance, and a judge is unnecessary for an exact string.","mnemonic":"Schema to the validator, toxicity to the judge."},{"id":"d5s2q19","concept":"choose-fail-direction","type":"single","stem":"An architect is setting the failure behaviour of an operator-built output screener for a payments assistant, where a wrong pass would cause harm. What is the recommended decision?","options":["Fail open, so customers are not blocked while the screener recovers under load","Leave it to the surrounding code, which handles errors consistently across services","Fail closed, and decide it explicitly, since a wrong pass here causes real harm","Fail open but log the error, since logging makes an unscreened pass acceptable"],"correct":[2],"explanation":"Control errors should fail closed for decisions where a wrong pass causes harm, and the direction must be chosen explicitly. Leaving it to surrounding code usually means falling back to the unprotected path. Logging an unscreened pass records the gap but does not close it.","mnemonic":"Harm if wrong? Shut the door when the guard faints."},{"id":"d5s2q20","concept":"choose-fail-direction","type":"single","stem":"Why should a guardrail's behaviour under failure be decided explicitly, in the same way retries and circuit breakers are designed around model calls?","options":["A failing dependency should degrade deliberately rather than inherit whatever keeps requests flowing","Anthropic's built-in safety controls can fail open, so the architect must cover them","Circuit breakers on model calls also shield the screening service from its own errors","Failing closed always adds less latency than failing open under heavy production load"],"correct":[0],"explanation":"A guardrail is a dependency that can time out or error, and if no choice is made the surrounding code usually lets requests through. Deciding the direction deliberately follows the same reasoning as circuit breakers. Anthropic's built-in controls are not operator-configurable and do not fail open.","mnemonic":"Guardrails are dependencies too: choose how they break, or code chooses for you."},{"id":"d5s2q21","concept":"control-point-spec","type":"multi","stem":"A guarded request path is more to build and test than a single filter. Which THREE elements must be specified for each of its control points? Select THREE.","options":["Its check type, model-based or deterministic","A confidence score the model reports for itself","Its fail direction when the control errors","A separate system prompt for that control point","A log line recording blocked or failed gates"],"correct":[0,2,4],"explanation":"Each of the three control points has a check type, a fail direction and a log line, which is why the path is materially more to build than one filter. Confidence scores belong to human-review routing, and control points do not each need their own system prompt.","mnemonic":"Every gate: Type, Tilt, Trail (check type, fail direction, log line)."},{"id":"d5s2q22","concept":"refusal-category-null","type":"single","stem":"A refusal handler reads stop_details on a response with stop_reason \"refusal\". On one refusal, the category and the explanation are both null. What does this indicate, and how should it be handled?","options":["The model lacks stop_details support, so the same request should be retried unchanged","The streaming classifier failed open, so the response can be treated as safe to return","The category list has changed, so the handler should fall back to the cyber category","The refusal maps to no named category, so it should go through generic refusal handling"],"correct":[3],"explanation":"Both fields are null when a refusal does not map to a named category, so the handler falls back to generic handling. An unsupported model would omit the object, not null its fields, and resending on the refused context brings further refusals. Verify current behaviour against platform.claude.com at publish time.","mnemonic":"Null category means no named class: route it to the generic refusal path."},{"id":"d5s2q23","concept":"refusal-category-null","type":"single","stem":"A developer hardcodes the refusal categories currently returned in stop_details (cyber, bio, frontier_llm, reasoning_extraction) as a fixed enum. What is the best guidance?","options":["Keep the enum, since the category set is fixed by the Messages API contract","Verify the category set against the stop-reasons documentation at publish time, not hardcode it","Replace the enum with one refusal path, since categories carry no routing value","Map every unknown category to bio, the most restrictive class, so it fails safe"],"correct":[1],"explanation":"The category set is enumerated in the stop-reasons documentation and may change, so re-check it at publish time rather than hardcoding it. Categories do carry routing value: different refusal classes should be routed differently rather than collapsed into one path.","mnemonic":"Refusal categories move: read the docs at publish time, never freeze the enum."},{"id":"d5s2q24","concept":"vulnerability-walk","type":"single","stem":"An architect is running a system vulnerability assessment for a RAG assistant with tools. Which approach is prescribed?","options":["Red-team the user prompt only, since that is where adversaries interact with the system","Review the model's published safety evaluations, since training covers broad attack classes","Audit the output filter, since it is the last point before a response reaches the user","Walk the request and data paths together, checking each entry point for an attack and its control"],"correct":[3],"explanation":"The assessment walks the request and data paths together. At each entry point it asks what an adversary could do and which control stands in the way, looking for places with a plausible attack and no control. Testing only the user prompt misses retrieved content, tool outputs and logs.","mnemonic":"Walk every door on the path; any door with no guard is a finding."},{"id":"d5s2q25","concept":"vulnerability-walk","type":"multi","stem":"During a system vulnerability assessment, which THREE are entry points to examine along the request and data paths? Select THREE.","options":["The model provider's training data","Retrieved content entering the context","Tool outputs returned to the model","The published constitution document","The logs the system writes"],"correct":[1,2,4],"explanation":"The named entry points are user input, retrieved content, tool outputs, the model's own output and the logs. The provider's training data and the constitution sit upstream in a layer Anthropic owns, so they are not entry points in your request and data paths.","mnemonic":"Inputs, retrievals, tool returns, outputs, logs: five doors to walk."},{"id":"d5s2q26","concept":"risk-categories","type":"single","stem":"An agent is manipulated into calling a side-effecting tool outside policy. Which risk category is this, and which control exists to stop it?","options":["Tool and action abuse, stopped by the action-authorization control","Direct prompt injection, stopped by output screening of generated text","Data exposure, stopped by minimizing fields in logs and the context","Token-budget exhaustion, stopped by length checks on the input"],"correct":[0],"explanation":"Inducing the model to call a side-effecting tool outside policy is tool and action abuse, the failure the action-authorization control exists to stop. Output screening judges text, not actions, so it cannot stop a tool that has already run.","mnemonic":"Abused tool? Authorization is the lock on the action."},{"id":"d5s2q27","concept":"screening-cost","type":"single","stem":"A team adds a judge model to screen every output turn. What cost effect should the architect plan for?","options":["A negligible increase, since judge models reuse the cached prompt prefix","A one-time setup cost, since screening runs only when a request is flagged","Roughly double the model cost for each screened turn, plus added latency","Lower total cost, since screening reduces refusals and retries downstream"],"correct":[2],"explanation":"Each screening point adds a call or rule evaluation to every request, and a judge model on output roughly doubles the model cost for that turn while adding latency. It runs on every turn it screens, not only on flagged requests, so it is a recurring cost.","mnemonic":"A judge on every reply means two model bills per turn."}]},{"id":"d5s3","title":"Skill supply-chain security","learn":["Skills are distributable code plus instructions, so they are a supply-chain risk; hidden malicious instructions evade input filters because the threat is upstream in the bundle.","Audit the bundle for anomalous calls (network, shell, file system, credential reads) and out-of-scope operations measured against the skill's stated purpose.","A clean audit is not proof of safety because a skill can fetch code at runtime; use least privilege and a sandbox with limited file and network access and no standing credentials.","Trusted-source policy: vetted internal registry, verified publishers, signed releases; do not assume the platform screens skills, verify its scope.","Every audit ends in a recorded verdict: approve, reject, or remediate (strip the call, sandbox it, pin a safer version, re-audit)."],"traps":["Output monitoring: it catches effects only after the skill's code has run, so it is too late as the main defence.","Clean audit equals safe: the audit shows the bundle you read, not code fetched later at runtime.","Platform trust: assuming the platform screens skills without verifying the scope of the scanning leaves a gap.","Sandbox instead of audit: confinement contains misses but audit decides what gets in; you need both.","Unrecorded review: an informal 'looks fine' is not a verdict; approve, reject or remediate must be written down."],"questions":[{"id":"d5s3q01","concept":"supply-chain-risk","type":"single","stem":"Why are skills treated as a supply-chain risk?","options":["They are reusable, distributable code paired with instructions, so an untrusted bundle can run commands or reach the network","They are always hosted on public registries, so every skill inherits the weaknesses of its publisher on the host","They replace the system prompt entirely, so a skill can disable the trained behaviour layer of the model","They run only after output monitoring completes, so any exploit is detected before it can execute"],"correct":[0],"explanation":"A skill is distributed code plus instructions dropped into your environment, and may execute commands, network calls or file access when invoked. It does not replace the system prompt.","mnemonic":"Skills are code you import: treat them like packages."},{"id":"d5s3q02","concept":"defence-earlier","type":"single","stem":"A skill carries hidden malicious instructions baked into its bundle. Why do input filters and prompt screening fail to see them?","options":["They only screen the model's output, so instructions inside the bundle are never examined at all and therefore stay silent","They watch the conversation, but the threat was embedded in the bundle upstream before any conversation began","They are disabled for skills by default, because the platform has already screened the bundle","They detect only direct injection, and hidden instructions are always classed as indirect injection"],"correct":[1],"explanation":"Filters and prompt screening observe the conversation; the bundle's contents sit upstream, so the defence must move earlier to auditing. The platform is not to be assumed to screen skills.","mnemonic":"Filters watch chat; the threat sits in the bundle."},{"id":"d5s3q03","concept":"audit-anomalous-calls","type":"multi","stem":"When auditing a skill bundle for anomalous calls, which TWO are on the list of things to look for? Select TWO.","options":["Shell execution of commands on the host","Reads of stored credentials or secrets","A README longer than the skill's code","A version number that has been incremented","Instruction text written in a formal tone"],"correct":[0,1],"explanation":"The audit looks for network requests, shell execution, file-system access and credential reads. Documentation length, version numbers and tone are not anomalous calls.","mnemonic":"Network, shell, files, credentials: the four red flags."},{"id":"d5s3q04","concept":"out-of-scope-baseline","type":"single","stem":"What serves as the baseline for deciding whether a skill's behaviour is out of scope?","options":["The publisher's reputation score, since trusted publishers are permitted wider behaviour than others","The skill's stated purpose: anything beyond the job it claims to perform is a finding to investigate","The permissions the sandbox already grants, since any allowed operation counts as in scope","The average behaviour of similar skills in the registry, since outliers are the only real concern"],"correct":[1],"explanation":"The stated purpose is the audit baseline: any operation beyond the job a skill claims to perform, such as an unexpected network call or file write, is a finding to investigate. Sandbox permissions and publisher reputation are not the baseline.","mnemonic":"Stated purpose is the yardstick."},{"id":"d5s3q05","concept":"audit-plus-sandbox","type":"single","stem":"A skill passes the bundle audit clean but later fetches code at runtime that was never in the package reviewed. Which compensating control addresses this?","options":["Repeat the audit more often, since a clean first audit proves the skill cannot change at runtime","Add an output filter on the skill's text, since fetched code always surfaces in generated responses","Pin the skill to its current version, since a pinned bundle cannot fetch any code at runtime","Run skills with least privilege in a sandbox: limited file access, limited network and no standing credentials"],"correct":[3],"explanation":"An audit tells you what is in the bundle, not what it fetches later, so runtime confinement contains what the audit misses. Output filters see text, not executed code, and pinning does not stop runtime fetches.","mnemonic":"Audit decides what gets in; sandbox contains what slips."},{"id":"d5s3q06","concept":"trusted-source","type":"single","stem":"Which policy shrinks the surface you must audit and stops untrusted bundles before they reach review?","options":["A trusted-source policy: a vetted internal registry, verified publishers and signed releases only","A policy of auditing only skills that users report as suspicious after they have been invoked","A policy of accepting any skill whose description matches the task described by the requesting team","A policy of trusting skills installed from the platform because it screens every bundle for you"],"correct":[0],"explanation":"Restricting origin to a vetted registry, verified publishers and signed releases reduces what needs auditing. Matching descriptions and platform trust are not substitutes.","mnemonic":"Vetted registry, verified publisher, signed release."},{"id":"d5s3q07","concept":"verify-platform-screening","type":"single","stem":"A colleague says skills are safe because the platform screens them. What should the architect do?","options":["Accept the statement, since platform screening removes the need for a bundle audit or sandbox","Ask the publisher for a written assurance, since publishers know the contents of their own bundles","Verify what automated vetting exists by reading the documentation and confirming the scope of any scanning","Run a single output test on the skill, since a passing result confirms the platform screened it"],"correct":[2],"explanation":"The notes say not to assume the platform screens skills; verify the scope of any scanning and what it does and does not catch. Publisher assurances and one test are not verification.","mnemonic":"Don't assume screening; read the docs and check."},{"id":"d5s3q08","concept":"remediate-actions","type":"multi","stem":"An audit finds a fixable problem in a skill. Which TWO actions belong to the remediate verdict? Select TWO.","options":["Strip the offending call from the bundle","Pin a safer version of the skill and re-audit it","Approve the skill now and rely on output monitoring afterwards","Reject the skill and omit the decision from the record","Grant the skill standing credentials so it can finish its work"],"correct":[0,1],"explanation":"Remediate means fix and re-audit: strip the call, sandbox the operation or pin a safer version. Approving on the strength of later monitoring is too late, and standing credentials add risk.","mnemonic":"Strip, sandbox, pin, re-audit."},{"id":"d5s3q09","concept":"defence-earlier","type":"single","stem":"Why is output monitoring an insufficient defence against a malicious skill?","options":["It cannot read generated text, so it has no visibility into anything that a skill produces","It can catch a downstream effect only after the fact, by which time the skill's code has already run","It blocks the skill before execution, which stops the skill from completing its legitimate work","It only monitors the platform's own components, which leaves operator-installed bundles out of scope"],"correct":[1],"explanation":"Monitoring sits downstream, so the harm may have occurred already; the defence must move earlier into audit and confinement. It can read text, but that is the problem: it is too late.","mnemonic":"Monitoring sees the crime after the code has run."},{"id":"d5s3q10","concept":"recorded-verdict","type":"single","stem":"A team reviewed a skill informally and said it looked fine, with no written outcome. What is missing?","options":["A second model-based classifier scoring the skill's instruction text for hostile phrasing","A user acceptance test run in production, since only live traffic proves the skill is safe","A summary of the skill's popularity, since adoption data is the audit's formal evidence","An explicitly recorded verdict of approve, reject or remediate for the audit"],"correct":[3],"explanation":"Every audit must end in a recorded verdict. Approve means cleared, reject means it never enters the environment, and remediate means fix and re-audit.","mnemonic":"Every audit ends in a recorded verdict."},{"id":"d5s3q15","concept":"out-of-scope-baseline","type":"single","stem":"During an audit, a skill advertised as a unit converter is found reading files in the user's home directory and a stored credential file. How should this be classified?","options":["As acceptable once the skill runs in a sandbox, since confinement removes the need to investigate","As normal behaviour, because converters commonly cache reference data in user directories","As a prompt injection issue, because file reads always originate from hostile user-supplied input","As an out-of-scope finding, because reading files and credentials goes beyond its stated purpose"],"correct":[3],"explanation":"A skill's stated purpose is the audit baseline, and file-system access and credential reads are anomalous calls; anything beyond the claimed job is a finding to investigate. A sandbox contains what an audit misses but does not excuse an out-of-scope operation.","mnemonic":"A converter reading your keys has left its job description: finding."},{"id":"d5s3q12","concept":"trusted-source","type":"single","stem":"A team wants to install a skill from an unsigned public download because it matches their task. Which response best follows the supply-chain guidance?","options":["Decline it under the trusted-source policy and obtain it from a vetted internal registry or verified publisher","Install it in a sandbox and skip the audit, since sandboxing alone covers the bundle's contents","Install it and watch the output closely, since monitoring will flag any harmful behaviour","Accept it if the description matches, since the audit only applies to skills that fail testing for convenience"],"correct":[0],"explanation":"Untrusted bundles should be stopped before review by a trusted-source policy. Sandboxing without an audit and relying on monitoring both skip the gate.","mnemonic":"Unsigned and unvetted never reaches review."},{"id":"d5s3q13","concept":"least-privilege-sandbox","type":"single","stem":"Which configuration best expresses least privilege for running an approved skill?","options":["Full file access and open network access, but with every credential rotated at the end of each day","Limited file access, limited network access, and no standing credentials that the skill does not need","Read-only file access and open network access, because writes are the only real risk to the host","Limited network access with the team's standing credentials, so that the skill can authenticate quickly"],"correct":[1],"explanation":"Least privilege in a sandbox means limited file access, limited network and no unneeded standing credentials. Rotating credentials or leaving the network open does not confine the skill.","mnemonic":"Little file, little network, no standing keys."},{"concept":"audit-plus-sandbox","type":"single","stem":"Which statement correctly relates the bundle audit to runtime confinement for skills?","options":["Audit decides what gets in, and confinement contains it if the audit misses something, so use both","A thorough audit makes confinement unnecessary, because it shows everything a skill can ever do","Confinement makes the audit unnecessary, because a sandbox removes any harm from a hostile bundle","The audit applies to internal skills and confinement to third-party skills, so each skill needs one"],"correct":[0],"explanation":"The notes say no single control works perfectly without the other: the audit gates entry, runtime confinement contains what slips through, for example code fetched at runtime.","mnemonic":"Audit is the door; sandbox is the room.","id":"d5s3q14"}]},{"id":"d5s4","title":"Fairness, transparency and decision logging","learn":["Fairness is architectural: unequal outcomes enter via the retrieval corpus, prompt framing, few-shot examples and downstream routing, each inspectable.","Three audiences need different slices: affected user (inputs and reason), regulator (queryable record), build team (full trace).","Decision logging captures inputs, retrieved context, model output and routing, and reuses the production observability with a different retention and query path.","If you cannot reconstruct a decision you cannot reliably explain it; Discernment is the AI Fluency competency of judging outputs, and a transparency record lets a reviewer spot a skewed outcome.","The decision log is itself in scope for compliance: apply minimization, retention limits and access co
