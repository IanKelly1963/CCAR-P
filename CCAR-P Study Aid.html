ligned. Which element is still missing before the approval is truly informed?","options":["The cost to the business of reversing the choice once the system depends on it","A detailed diagram of every component in the production route and its dependencies","A comparison of the prompt styles used in the pilot and their eval scores","The list of engineers who attended the design sessions and their responsibilities"],"correct":[0],"explanation":"Reversal cost is the third element of the frame, and without it the approver cannot judge what a wrong choice would cost later. A diagram or attendee list does not address the consequence of reversing a decision.","mnemonic":"Gain and give-up are half a decision; reversal cost completes it."},{"id":"d6s2q06","concept":"decision-package","type":"single","stem":"Which set of contents makes up the decision package presented to a stakeholder?","options":["Options considered, criteria weighed, a recommendation, and the risks that remain","A recommendation, a diagram, a delivery date, and a cost estimate","Options considered, a vendor comparison, a demo script, and a budget","A recommendation, a rejected alternative, a test plan, and an owner"],"correct":[0],"explanation":"The package is options, criteria, recommendation and remaining risks, so the stakeholder accepts a decision they can defend to their own leadership. The other lists omit criteria or remaining risks.","mnemonic":"Options, criteria, recommendation, risks: the package, not the verdict."},{"id":"d6s2q07","concept":"description-competency","type":"multi","stem":"Which TWO practices belong to applying the Description competency when communicating with stakeholders? Select TWO.","options":["Lead with the architecture so the stakeholder sees the engineering depth","Frame the system's limitations honestly, since clearly stated limits build trust","Remove limitations from the summary to keep the message positive","Lead with the business outcome rather than the architecture","Use the same technical vocabulary for every audience to stay precise"],"correct":[1,3],"explanation":"Description means leading with the business outcome and framing limitations honestly, matched to the audience's AI familiarity without losing accuracy. Hiding limits or leading with architecture works against stakeholder trust and understanding.","mnemonic":"Outcome first, limits honest, justification in hand."},{"id":"d6s2q08","concept":"peer-proof-demand","type":"single","stem":"A security director will need to justify the chosen design to the leadership team afterwards. What should the architect ensure at the end of the conversation?","options":["The director has approved the design verbally in the room","The director leaves with the justification they can use with their own peers","The director has seen the full list of model parameters used","The director has deferred the justification to the architect for later meetings"],"correct":[1],"explanation":"Anticipating the peer-proof demand means the stakeholder leaves with the justification needed to defend the choice to others. A verbal yes without usable justification risks the approval later being withdrawn.","mnemonic":"Approval travels only if the justification travels with it."},{"id":"d6s2q09","concept":"context-vs-retrieval-caching","type":"single","stem":"A design keeps a static policy document in the prompt on every call instead of building retrieval. What should the architect state about per-call cost?","options":["It is fixed by the model tier, so only building a retrieval layer can lower it","It will drop automatically as production volume grows, so no action is needed","It becomes irrelevant once the full document stays in view on every call","Prompt caching can recover much of the input cost on static content, so evaluate it first"],"correct":[3],"explanation":"Larger context gains simplicity but gives up per-call cost and speed at scale, and caching static content can recover much of the input cost. Treating per-call cost as fixed ignores that lever.","mnemonic":"Static document in context? Check caching before blaming cost."},{"id":"d6s2q10","concept":"logging-vs-latency","type":"single","stem":"A team proposes reducing logging detail to gain faster responses in a regulated workload. What does the trade-off map say a wrong, reversed choice could cost?","options":["A slower response that users will tolerate","A potential compliance gap requiring remediation","A larger prompt cache that raises storage cost","A change of model tier at the next renewal"],"correct":[1],"explanation":"Less logging buys speed but reduces visibility into each interaction, and in a regulated workload that can create a compliance gap needing remediation. The other options are not the stated consequence.","mnemonic":"Trim the logs for speed, and compliance sends the bill."},{"id":"d6s2q11","concept":"single-route-vs-multi","type":"single","stem":"A team picks one delivery route for lower build complexity. Which reversal cost should the architect name for the stakeholder?","options":["Higher authentication complexity across several different logging profiles in production","A loss of the one consistent logging profile that the single route provided","A delayed or blocked cutover if the route cannot meet a late residency requirement","A permanent ban on adding another platform once the first route is live"],"correct":[2],"explanation":"A single route gains simplicity and one consistent auth and logging profile, but gives up flexibility; the reversal cost is a delayed or blocked cutover when a residency or deployment need appears late. Added complexity is what the multi-platform option costs instead.","mnemonic":"One road is simple until residency closes it."},{"id":"d6s2q12","concept":"false-alignment","type":"single","stem":"What is 'false alignment' in a tradeoff presentation?","options":["A decision looks approved in the room, but reversal cost was never made explicit","Two stakeholders approve different options during the same meeting without noticing the conflict","An architect presents an option that the delivery team has not yet built or tested","A stakeholder rejects the recommendation in the room but still approves the budget"],"correct":[0],"explanation":"False alignment is an apparent yes where the reversal cost was never named, so the real consequence only appears after commitment. Disagreement among stakeholders is a different problem.","mnemonic":"A yes in the room can still be a no on the invoice."},{"id":"d6s2q15","concept":"context-vs-retrieval-caching","type":"multi","stem":"On the tradeoff translation map, a team chooses a larger context window per call over retrieval. Which TWO costs does the map list if this choice proves wrong and must be reversed? Select TWO.","options":["Reworking the architecture after cost spikes in production","A compliance gap from reduced logging that needs remediation","A blocked cutover when a late residency requirement appears","The credibility hit of explaining an avoidable expense surprise","Losing the full document in view on every single call"],"correct":[0,3],"explanation":"For larger context over retrieval, the reversal cost is reworking the architecture after cost spikes in production plus the credibility hit of an avoidable expense surprise. A compliance gap belongs to the logging-versus-latency row, and a blocked cutover to the single-route row.","mnemonic":"Big context reversed: rebuild after the spike, and own the surprise."},{"id":"d6s2q16","concept":"false-alignment","type":"single","stem":"When is it most important for an architect to name the reversal cost explicitly in a tradeoff presentation?","options":["Only when the stakeholder asks a direct question about cost","When the recommended design feels like the obviously simpler choice","Only when the workload sits in a regulated environment","Only after the first production invoice has been received"],"correct":[1],"explanation":"Name all three elements every time, and name the reversal cost especially when the design feels obviously simpler, because an approval given without understanding reversal cost is not an informed choice. Waiting for a cost question or an invoice is how false alignment forms.","mnemonic":"The simpler it looks, the louder you name the cost of going back."},{"id":"d6s2q17","concept":"decision-frame-questions","type":"single","stem":"For a non-regulated internal tool, an architect's trade-off slide covers what the option gains and what reversing it later would cost. Which decision-frame question is still unanswered?","options":["Which vendor released this option most recently?","How many engineers are needed to build it?","What do we give up by choosing this option?","Which competitor has already chosen this option?"],"correct":[2],"explanation":"The simple decision frame asks what we gain, what we give up, and what happens if we choose now and must reverse later, plus compliance posture in regulated settings. The slide skips the give-up question; vendors, headcount and competitors are not part of the frame.","mnemonic":"Gain, give up, go back: skip the give-up and the trade-off vanishes."}]},{"id":"d6s3","title":"Feedback loops and SLAs","learn":["Live deployments drift: quality erodes gradually rather than breaking dramatically, and teams without a feedback loop may not notice until users feel it.","The feedback loop is a decision layer above observability: Signals, Triage, Decide, Act, Review. Decide chooses between team fix, stakeholder review or no action.","An SLA names what is measured, what counts as a breach, and what happens on breach. Thresholds trace to tangible sources: latency to UX expectation, availability to business criticality, quality to eval results and acceptance criteria.","Cost is the expectation that breaks most after launch: production volume often runs one to two orders of magnitude above pilot; give a forecast, name spend controls (caching, model tiering, budget alerts) before the first invoice.","Regulated deployments add scheduled review checkpoints independent of incidents; a governance table maps signal to trigger, architect action and regulated checkpoint."],"traps":["Dashboards equal feedback: observability collects signals, but without a rule mapping signal to trigger and owner, a slow drift stays invisible.","Hard-failure alerting only: a slow quality drift may never cross an error threshold, so the governance table must map slow drifts as well as hard failures to triggers.","Arbitrary thresholds: a number that cannot be tied to UX expectation, business criticality or eval results is just a target someone chose.","Cost shock: pilot cost looks trivial; production volume turns it into a five-figure monthly line unless forecast and controls were framed first.","Incident-only reviews: regulated checkpoints must run on a schedule even when nothing has gone wrong."],"questions":[{"id":"d6s3q25","concept":"drift-without-monitoring","type":"single","stem":"An internal policy Q&A tool has been live for a year with no feedback loop. Which pattern of degradation should the architect expect?","options":["A single dramatic outage that alerts the whole team at once","A sudden quality drop on the day a model update is released","Quality that holds steady until the first quarterly review","Gradual erosion of quality that may go unseen until users feel it"],"correct":[3],"explanation":"Drift is hard to catch because nothing breaks dramatically: quality erodes gradually, and a team without a feedback loop may not see the decline until users already feel it. A single outage or a sudden drop would be noticed; the slow slide is what goes unseen.","mnemonic":"Drift is a slow leak, not a burst pipe."},{"id":"d6s3q02","concept":"loop-vs-observability","type":"single","stem":"How does the feedback loop relate to the observability stack?","options":["It replaces the stack by producing its own latency and error metrics","It is a decision layer above the stack that turns signals into triage, decisions and actions","It is a reporting tool that formats the stack's output for quarterly review","It is a sub-feature of the stack that raises alerts when thresholds are crossed"],"correct":[1],"explanation":"Observability supplies the raw signals; the feedback loop decides which need attention, who acts and what changes. It is not another metrics source or a formatting step.","mnemonic":"Observability measures; the feedback loop decides."},{"id":"d6s3q03","concept":"five-stage-loop","type":"single","stem":"Which is the correct order of the feedback loop's five stages?","options":["Signals, Decide, Triage, Act, Review","Triage, Signals, Decide, Review, Act","Signals, Triage, Decide, Act, Review","Signals, Triage, Act, Decide, Review"],"correct":[2],"explanation":"The loop runs Signals, Triage, Decide, Act, Review, where Review checks whether the response worked and whether the rule needs to change. Acting before deciding skips the judgement step.","mnemonic":"STDAR: Signals, Triage, Decide, Act, Review."},{"id":"d6s3q04","concept":"sla-three-parts","type":"multi","stem":"Which THREE things must an SLA make clear? Select THREE.","options":["What is being measured","Which cloud region hosts the monitoring tools","What counts as a breach","What happens when a breach occurs","Which engineer wrote the first prompt"],"correct":[0,2,3],"explanation":"An SLA names the measure, the breach definition and the consequence of a breach. Hosting region and prompt authorship are not part of the SLA definition.","mnemonic":"Measure, breach, consequence: the SLA triangle."},{"id":"d6s3q05","concept":"threshold-sources","type":"single","stem":"Where should a latency threshold in an SLA come from?","options":["The best p95 the team achieved during load testing","The default value suggested by the monitoring tool","The latency of the previous system, regardless of user needs","The user experience expectation identified earlier in discovery"],"correct":[3],"explanation":"Latency thresholds should reflect the UX expectation set earlier, which keeps the SLA defensible. A number chosen because it was achievable or because it was a default has no tangible source.","mnemonic":"Latency limit comes from what users expect, not what tools suggest."},{"id":"d6s3q06","concept":"threshold-sources","type":"single","stem":"An architect must set availability and quality thresholds for a claims deployment. Which pairing of source to threshold is correct?","options":["Availability from business criticality; quality from eval results and acceptance criteria","Availability from the cloud provider's published figure; quality from user complaints","Availability from the pilot's uptime; quality from the cost budget","Availability from the UX expectation; quality from business criticality"],"correct":[0],"explanation":"Availability reflects how critical the deployment is to the business, and quality reflects the eval results and acceptance criteria already established. Mixing the sources breaks the traceability that keeps an SLA defensible.","mnemonic":"Uptime follows criticality; quality follows the evals."},{"id":"d6s3q07","concept":"arbitrary-threshold","type":"single","stem":"A proposed SLA sets a 98% quality target, but nobody can say where the figure came from. What is the most accurate assessment?","options":["It is acceptable because round numbers are easier to communicate","It is probably just a target someone chose because it sounded reasonable","It is acceptable if the monitoring tool can measure it","It should be raised to match the best result in testing"],"correct":[1],"explanation":"If a threshold cannot be tied to a tangible source such as eval results or acceptance criteria, it is probably an arbitrary target. Measurability does not make it defensible.","mnemonic":"No source, no SLA: an untraceable number is a guess."},{"id":"d6s3q08","concept":"cost-breaks-most","type":"single","stem":"Which expectation most often breaks after launch, and why?","options":["Latency, because networks slow down noticeably once the full user base is onboarded","Cost, because production volume often runs one to two orders of magnitude above pilot","Availability, because cloud providers change their commitments soon after a launch","Quality, because the eval suite is retired once the pilot has ended"],"correct":[1],"explanation":"Cost is the expectation that breaks most; a trivial pilot cost can become a five-figure monthly line at production volume. The other expectations can degrade, but cost is the one that breaks most often after launch.","mnemonic":"Pilot pennies, production pounds: one to two orders of magnitude."},{"id":"d6s3q09","concept":"cost-breaks-most","type":"multi","stem":"To pre-empt the cost surprise after launch, which TWO actions should the architect take before the first invoice? Select TWO.","options":["Provide a consumption forecast at expected production volume","Wait for the first invoice, then explain the model-tiering narrative","Name the spend-control posture such as caching, model tiering and budget alerts","Quote only the pilot's per-call cost to keep the message simple","Raise the SLA latency threshold to reduce spend"],"correct":[0,2],"explanation":"Give a forecast at production volume and state the spend-control posture, framing model tiering before the first invoice rather than after it. Quoting only pilot cost or waiting for the invoice reproduces the surprise.","mnemonic":"Forecast first, controls named, narrative before the invoice."},{"id":"d6s3q10","concept":"regulated-scheduled-checkpoints","type":"single","stem":"How do regulated deployments differ in feedback-loop design?","options":["They only review output when an incident or a complaint has been reported","They replace SLAs entirely with thresholds supplied directly by the regulator","They add scheduled review checkpoints that run even when nothing has gone wrong","They skip triage because every signal in a regulated system must be escalated"],"correct":[2],"explanation":"Some reviews, such as periodic output audits or residency confirmations, must happen on a defined schedule regardless of incidents. They are design-time obligations, not tasks to add later.","mnemonic":"Regulated means the calendar triggers the review, not the alarm."},{"id":"d6s3q11","concept":"governance-table-actions","type":"single","stem":"In the governance table, an output quality score crosses the threshold drawn from the eval suite. What is the architect's action?","options":["Diagnose prompt, data or model drift, then decide whether to iterate or re-architect","Raise the threshold to match the new score and continue operating as normal","Escalate straight to the regulator and trigger a periodic output audit immediately","Switch to a cheaper model tier in order to restore the previous score"],"correct":[0],"explanation":"The architect diagnoses prompt, data or model drift and decides whether to iterate or re-architect. The regulated audit runs on its own schedule regardless of score.","mnemonic":"Score drops: prompt, data or model? Diagnose, then iterate or rebuild."},{"id":"d6s3q26","concept":"loop-vs-observability","type":"single","stem":"Observability shows a one-off latency spike, a sustained eval-score decline and an intermittent tool error. Why can't the team simply act on each signal as it arrives?","options":["Each signal needs the vendor's approval before any corrective change can be made","Only error-rate signals are actionable, so the remaining signals should be ignored","A signal is not a decision: some are noise, others matter only if they recur","Every signal must first be escalated straight to the business stakeholder for review"],"correct":[2],"explanation":"Observability supplies raw material such as latency, error rates and eval scores, but a signal by itself is not yet a decision: one spike may be noise, another may point to a real problem, and a third may matter only if it keeps happening. The feedback loop is the decision layer that triages them.","mnemonic":"Signals are raw material; the loop turns them into decisions."},{"id":"d6s3q27","concept":"monitoring-not-loop","type":"single","stem":"A team has live dashboards and configured alerts and concludes that stakeholder feedback is therefore covered. What is missing to make this a feedback loop?","options":["More latency percentiles and detailed error breakdowns added to the existing dashboards","A lower error-rate threshold, so that the existing alerts fire earlier than now","A longer launch review attended by the full stakeholder group and the vendor","A governance table mapping every signal, slow drifts included, to trigger, action and owner"],"correct":[3],"explanation":"A dashboard collects and displays signals; a feedback loop maps each signal to a trigger, an owner and a required action, covering slow drifts as well as hard failures. A slow drift may never cross an error threshold, so tighter alerts or more charts still leave it with no trigger.","mnemonic":"Table, not dashboard: signal, trigger, action, owner."},{"id":"d6s3q14","concept":"regulated-scheduled-checkpoints","type":"single","stem":"In the governance table, what is the review trigger for the data-residency configuration signal?","options":["A cost-per-interaction budget breach that exceeds the envelope agreed in discovery","A latency p95 crossing the user-experience budget set during design","A drop in the eval score below the threshold drawn from the eval suite","Scheduled confirmation, with posture recorded and any drift flagged immediately"],"correct":[3],"explanation":"Residency is checked on a scheduled confirmation, with the posture recorded and any drift flagged immediately. The other triggers belong to cost, latency and quality signals.","mnemonic":"Residency is checked on the calendar, not after the breach."},{"id":"d6s3q15","concept":"loop-stage-content","type":"single","stem":"In the feedback loop, which stage determines whether an issue needs a team fix, a stakeholder review or no action?","options":["Triage","Act","Decide","Review"],"correct":[2],"explanation":"Decide chooses among a team fix, a stakeholder review or no action. Triage comes earlier and only sorts what needs attention now from what can wait; Act then carries out the correction, guardrail update or escalation.","mnemonic":"Triage sorts, Decide chooses who, Act does, Review checks the rule."},{"id":"d6s3q16","concept":"loop-stage-content","type":"multi","stem":"Which TWO pairings of feedback-loop stage and the question it answers are correct? Select TWO.","options":["Signals: does the issue need a team fix or a stakeholder review?","Triage: what needs attention now, and what can wait?","Act: what is the system showing us across its dashboards?","Review: did the response work, and does the rule need to change?","Decide: which guardrail update has already been deployed?"],"correct":[1,3],"explanation":"Triage separates what needs attention now from what can wait, and Review asks whether the response worked and whether the rule itself needs to change. Signals asks what the system is showing; Decide chooses between a team fix, a stakeholder review or no action.","mnemonic":"Review closes the loop by questioning the rule, not just the fix."},{"id":"d6s3q17","concept":"governance-table-rows","type":"single","stem":"Latency p95 crosses the budget set from user-experience requirements. Investigation shows the system is well tuned and the budget itself was unrealistic. What does the governance table direct?","options":["Re-architect the deployment until it meets the original p95 budget","Escalate to a stakeholder review, since the budget itself is wrong","Raise the p95 budget quietly so the alert stops firing every week","Trigger a periodic output audit against the documentation standard"],"correct":[1],"explanation":"The latency row says investigate the bottleneck, then tune, or escalate to a stakeholder review if the budget itself is wrong. The budget came from user-experience requirements the stakeholder owns, so quietly changing it or re-architecting to an unrealistic number bypasses that decision.","mnemonic":"Wrong budget? Not your number to move: take it back to the stakeholder."},{"id":"d6s3q18","concept":"governance-table-rows","type":"single","stem":"Cost per interaction crosses the budget envelope agreed in discovery. What is the architect's action according to the production-signal governance table?","options":["Switch every call to the cheapest model tier at once, then report the saving to the stakeholder","Treat it as a regulated checkpoint and run a residency confirmation before any other change","Identify the driver, then bring a tradeoff to the stakeholder if the budget needs revisiting","Wait for the quarterly review, since cost is not a quality signal and rarely needs attention"],"correct":[2],"explanation":"The cost row says identify the driver, then bring a tradeoff to the stakeholder if the budget envelope needs revisiting. Cutting every call to the cheapest tier skips both diagnosis and the stakeholder decision, and cost usually carries no regulated checkpoint.","mnemonic":"Cost over the envelope: find the driver, then table a tradeoff."},{"id":"d6s3q19","concept":"governance-table-rows","type":"multi","stem":"Which TWO statements about the production-signal governance table are correct? Select TWO.","options":["Latency p95 always carries a regulated checkpoint, whatever the logging setup","The cost trigger is a budget chosen after launch from observed spend","Regulated output quality gets a periodic audit on schedule, regardless of the eval score","Data residency is reviewed only when an alert fires on configuration drift","The latency trigger is the budget set from user-experience requirements"],"correct":[2,4],"explanation":"The regulated checkpoint for output quality is a periodic audit against the documentation standard on a set schedule, regardless of score, and the latency trigger is the budget drawn from user-experience requirements. Latency usually has no regulated checkpoint unless it masks a logging gap, and residency is confirmed on a schedule, not on alert.","mnemonic":"Audits run on the calendar, not on the score."},{"id":"d6s3q28","concept":"signal-noise-judgment","type":"single","stem":"Which part of running a feedback loop can observability tooling NOT do for the architect?","options":["Collect latency, error-rate and usage metrics from the live system","Display eval scores and trends on shared team dashboards","Fire an alert when a configured threshold has been crossed","Judge which signals deserve attention and which are just noise"],"correct":[3],"explanation":"The hardest part of the loop is deciding which signals deserve attention and which are noise, because observability tooling cannot make that judgment. Collecting metrics, displaying them and firing threshold alerts are exactly what the tooling already does.","mnemonic":"Tools collect and alert; only judgment separates signal from noise."},{"id":"d6s3q29","concept":"loop-cost","type":"single","stem":"A sponsor questions the ongoing Architect time a feedback loop needs after launch. Which justification is strongest?","options":["It removes the need to run an observability stack in production at all","It costs less than discovering decline at a quarterly review after every dashboard looked good","It is a one-off setup cost that ends once the governance table is written","Regulators require a fixed weekly hours budget for every live AI deployment"],"correct":[1],"explanation":"The loop does create ongoing Architect effort, but that is cheaper than discovering decline in a quarterly review after every dashboard looked good. It sits on top of observability rather than replacing it, and it is ongoing work, not a one-off setup.","mnemonic":"Pay a little every week, or pay a lot at the quarterly review."},{"id":"d6s3q22","concept":"governance-design-time","type":"single","stem":"A healthcare deployment's documentation obligation requires periodic output audits. The team plans to set them up 'once the system is stable'. What is wrong with this plan?","options":["Periodic audits are only needed after an eval score crosses its threshold, so none are due yet","Scheduled checkpoints are design-time obligations; built late they cost far more once proof is requested","Output audits belong to the compliance team, so the architect has no role in scheduling them","Stability is the right trigger, since audits during early drift would only measure launch noise"],"correct":[1],"explanation":"Regulated review checkpoints run on a schedule even when nothing has gone wrong, and they are design-time obligations; if not built early they become far more expensive to establish when someone asks for proof. Tying audits to an eval threshold misses that they run regardless of score.","mnemonic":"Checkpoints are built in, not bolted on."},{"id":"d6s3q23","concept":"governance-design-time","type":"single","stem":"When should the production-signal governance table, mapping each signal to its trigger, action and regulatory checkpoint, exist?","options":["After the first quarterly review, once real signals show which ones matter","After the first SLA breach, so triggers reflect a failure that really occurred","During handoff, so the inheriting engineer can tailor it to their own routine","Before launch, as the mechanism that turns policy into an operating routine"],"correct":[3],"explanation":"The governance table should exist before launch; it is the mechanism that turns policy into an operating routine. Waiting for a quarterly review or a breach leaves slow drifts with no trigger, so signals exist but nothing decides they matter.","mnemonic":"Table before takeoff: policy becomes routine on day one."},{"id":"d6s3q24","concept":"unwired-checkpoint-risk","type":"single","stem":"When designing a feedback loop for a regulated deployment, which failure mode carries the biggest risk?","options":["An alert threshold set too tightly, so the team is flooded with noise from minor spikes","A compliance checkpoint never wired to a trigger, so a standard violation runs for weeks","A dashboard showing too many signals, so stakeholders stop reading the weekly reports","A latency budget set from the pilot, so production traffic breaches it on launch day"],"correct":[1],"explanation":"The biggest failure mode is a compliance checkpoint that was never wired to a trigger, letting a documented-standard violation run for weeks before a routine review catches it. Noisy alerts are a real complexity cost, but deciding signal versus noise is the hard part, not the biggest risk.","mnemonic":"An unwired checkpoint is a silent alarm."}]},{"id":"d6s4","title":"Documentation for handoff and audit","learn":["One document serves three readers: the inheriting engineer, the auditor, and the returning architect. Serving only one makes it incomplete.","Handoff recipients need rejected alternatives and the rationale for each rejection; compliance reviewers need obligation, control, owner and evidence artifact (the control register carried forward), not assertions.","Returning architects need dated decisions, assumptions labelled as assumptions, and open items with owners and resolution criteria.","Completeness test: can a competent architect who was not in the room make a safe change after reading it?","Checklist fields: decision, rejected alternatives, tradeoff named, owner, evidence artifact, audit-ready status. Documentation is the handoff stage; the feedback loop is the monitoring-and-iteration stage."],"traps":["Recording what, not why: a design without its rationale cannot be safely changed, so a successor may reverse a load-bearing decision and reintroduce a constraint violation.","Assertions as evidence: a statement that a control exists is not enough; the reviewer needs an evidence artifact showing it operating.","Assumptions as facts: embedding assumptions in the text as settled facts leaves the returning architect unable to tell what was confirmed.","Right decision, wrong reason: without rejected alternatives, a successor reverses the right decision for the wrong reason or defends the wrong one.","Writing it later: rationale not recorded at design time leaves with the architect and is reconstructed from email threads, if at all."],"questions":[{"id":"d6s4q01","concept":"three-readers","type":"multi","stem":"Which THREE readers must architecture documentation serve to be considered complete? Select THREE.","options":["The inheriting engineer who had no part in the build","The end user who submits requests to the system","The auditor looking for evidence that a control is operating","The returning architect who has lost the design context","The vendor's account executive preparing a renewal"],"correct":[0,2,3],"explanation":"The three readers are the inheriting engineer, the auditor and the returning architect. A document built for only one of them is incomplete even when detailed.","mnemonic":"Inheritor, auditor, returner: three readers, one document."},{"id":"d6s4q02","concept":"three-readers","type":"single","stem":"A handoff document is highly detailed for the engineer taking over but has no control evidence and no dated decisions. How should it be judged?","options":["Complete, because detail is the measure of documentation quality for any reader","Complete, because auditors read separate material in any case and need nothing here","Incomplete, because a document built for only one reader is incomplete even when detailed","Incomplete only if the deployment sits in a regulated industry with formal audits"],"correct":[2],"explanation":"Serving one reader but not the others leaves the document incomplete regardless of detail. The returning architect and the auditor each need things this document lacks.","mnemonic":"Detail for one reader still leaves two readers stranded."},{"id":"d6s4q03","concept":"rejected-alternatives","type":"single","stem":"Why must a handoff document record rejected alternatives and the reason each was rejected?","options":["So the auditor can see how many different options were considered during design","So the successor can tell which trade-off the design resolved and not reverse it wrongly","So the sales team can reuse the comparison in later proposals for other customers","So the document reaches the minimum length a compliance reviewer normally expects to see"],"correct":[1],"explanation":"Rejected options explain why the design is shaped as it is; without them a successor cannot tell which trade-off a decision was resolving. The count of options is not what matters.","mnemonic":"The road not taken explains the road you're on."},{"id":"d6s4q04","concept":"evidence-not-assertion","type":"single","stem":"For the compliance reviewer, which set of items must the document carry for each regulatory obligation?","options":["The obligation, the satisfying control, its owner, and the evidence artifact showing it operates","The obligation, the vendor's compliance certificate, the project cost, and the go-live date","The control, the rejected alternative, the named tradeoff, and the planned reversal date","The obligation, the control, the monitoring dashboard, and the log of open assumptions"],"correct":[0],"explanation":"The reviewer needs obligation, control, owner and evidence artifact, which is the control register carried forward into the living document. They do not accept a statement that a control exists.","mnemonic":"Obligation, control, owner, evidence: no proof, no pass."},{"id":"d6s4q05","concept":"evidence-not-assertion","type":"single","stem":"A reviewer asks about request logging. The document says only, 'Logging is enabled on all calls.' What is the issue?","options":["The statement is too short; it needs a diagram of the whole logging route","It names the control but gives no owner and no evidence artifact showing it operates","The statement should be removed because logging is merely a low-level technical detail","The statement is sufficient because reviewers accept the architect's attestation at face value"],"correct":[1],"explanation":"A reviewer requires evidence, not assertions, so the control needs an owner and an evidence artifact. A diagram would still only show what exists, not that it operates.","mnemonic":"'Enabled' is a claim; the artifact is the proof."},{"id":"d6s4q06","concept":"returning-architect","type":"multi","stem":"Which THREE features make a document navigable for an architect returning months later? Select THREE.","options":["Decisions are dated so the sequence of choices can be followed later","Assumptions are explicitly labelled as assumptions, not embedded as settled facts","Open items have named owners and criteria for what counts as resolved","A short summary that leaves out rejected options to save the reader time","Technical vocabulary assumed to be familiar to the original design team members"],"correct":[0,1,2],"explanation":"The returning architect needs dated decisions, assumptions labelled as such, and open items with owners and resolution criteria. Omitting rejected options or assuming shared vocabulary makes the document harder to use without a briefing.","mnemonic":"Dated, labelled, owned: a document that needs no briefing."},{"id":"d6s4q07","concept":"completeness-test","type":"single","stem":"What is the practical test for whether architecture documentation is complete?","options":["Whether it passes a length and formatting review by the compliance team","Whether the original architect agrees that it matches the design they built","Whether every component in the deployment appears somewhere in the architecture diagram","Whether a competent architect absent from the design sessions could make a safe change"],"correct":[3],"explanation":"The test is whether a competent architect who was not in the room can make a safe change. A complete diagram or the original architect's approval does not show that.","mnemonic":"If a stranger can't change it safely, it isn't finished."},{"id":"d6s4q08","concept":"checklist-field-readers","type":"multi","stem":"Which TWO checklist fields primarily serve the handoff recipient? Select TWO.","options":["Evidence artifact showing the control is operating","Rejected alternatives and why each was set aside","Audit-ready status of the available evidence","Tradeoff named, with gains, costs and reversal implications","Decision date, serving only the compliance reviewer"],"correct":[1,3],"explanation":"Rejected alternatives primarily serve the handoff recipient, and the named tradeoff serves the handoff recipient and the returning architect. Evidence artifact and audit-ready status primarily serve the compliance reviewer.","mnemonic":"Rejected options and named trade-offs are for the heir."},{"id":"d6s4q09","concept":"checklist-field-readers","type":"single","stem":"Which checklist field records whether the available evidence is current and sufficient for review?","options":["Decision, recording the architectural choice made and its date","Audit-ready status, recording whether evidence is current and sufficient","Tradeoff named, recording gains, costs and reversal implications","Owner, recording who is responsible for the control going forward"],"correct":[1],"explanation":"Audit-ready status captures whether the available evidence is current and sufficient, and it serves the compliance reviewer. Owner names who is responsible for the decision or control going forward.","mnemonic":"Audit-ready status: is the proof fresh enough to show?"},{"id":"d6s4q13","concept":"rationale-why-not-what","type":"single","stem":"Why is design rationale easy to leave out of architecture documentation?","options":["Auditors prefer that rationale is kept out of the formal design record","Architecture diagrams already capture the reasoning behind every decision","Recording why, not just what, feels redundant to whoever lived the reasoning","Rationale belongs only in the customer outcome document written at close"],"correct":[2],"explanation":"The discipline is recording why, not just what, and labelling assumptions as assumptions, which is easy to skip when the reasoning feels obvious to the person who lived it. A diagram records what was built; the why has to be written down separately.","mnemonic":"Obvious to you today, invisible to your successor tomorrow."},{"id":"d6s4q14","concept":"rationale-why-not-what","type":"single","stem":"When should the decision, the rejected alternatives and the tradeoff each resolved be written down?","options":["At design time, while the architect still holds the reasoning","At handoff, reconstructed from the project's email threads","When an auditor first requests evidence for a specific control","After the first production change shows which decisions mattered"],"correct":[0],"explanation":"Write the rationale at design time, while you still hold the reasoning. Reconstructing it later from email threads, or failing to, costs a wrong reversal in production; if it is never written, it leaves with you.","mnemonic":"Write the why while you still know it, or it leaves with you."},{"id":"d6s4q12","concept":"lifecycle-stage-mapping","type":"single","stem":"In lifecycle terms, which mapping of artifacts to stages is correct?","options":["Documentation is the discovery stage; the feedback loop is the design stage","Documentation is the handoff stage; the feedback loop is the monitoring-and-iteration stage","Documentation is the monitoring stage; the feedback loop is the handoff stage","Documentation is the design stage; the feedback loop is the discovery stage"],"correct":[1],"explanation":"Documentation that survives your absence is the handoff stage, while the feedback loop keeps the live deployment healthy in the monitoring-and-iteration stage. The other mappings swap the stages.","mnemonic":"Write it for handoff; loop it for monitoring and iteration."}]},{"id":"d6s5","title":"Entry-point selection in production and outcome documents","learn":["In a live multi-platform deployment the route question becomes which entry point performs best across latency, cost and compliance, not just which survives the compliance pre-filter.","Cross-platform problems: model identifier strings differ, features can lag on cloud-provider routes, and Bedrock/Vertex need explicit regional configuration; defaulting to a global endpoint commonly breaks residency.","An entry-point-responsibility map says which entry point owns which task and why, preventing task creep; draw it before the first line of integration code.","Decision matrix: direct API by default unless procurement or residency points elsewhere; Bedrock or Vertex for AWS or GCP standardised partners; Foundry, verify residency and coverage per hosting form.","Outcome document: use case with scope boundary, metric before, metric after using the same definition, control making the comparison auditable, and measurement owner. Capture the before metric at the start.","Each entry-point boundary in a multi-entry-point workflow is an integration point with its own authentication, logging and failure-mode profile; the responsibility map makes those boundaries explicit."],"traps":["Global endpoint default: leaving a Bedrock or Vertex region unconfigured is the common way a residency requirement quietly breaks.","Assuming parity: model IDs differ across routes, and cloud-provider routes can lag direct API features.","Task creep: without a responsibility map, an entry point chosen for one task gradually takes on another.","Platform-name assumption: Foundry coverage depends on hosting form, so verify residency per route rather than from the name.","Easy metrics: technical metrics exported from the observability stack show the system runs, not what it changed; without a before metric on the business outcome there is no case for expansion."],"questions":[{"id":"d6s5q01","concept":"route-question-in-production","type":"single","stem":"How does the entry-point question change once a deployment is live across more than one platform?","options":["It becomes only a procurement question settled by the customer's cloud contract alone","It no longer matters because the compliance pre-filter already decided the route","It becomes a question of which model name is cheapest on each platform","It becomes which route performs best across latency, cost and compliance in live use"],"correct":[3],"explanation":"Earlier, route selection was a compliance pre-filter; with the full production picture the question is performance across latency, cost and compliance. Procurement is one input, not the whole question.","mnemonic":"Pre-filter picks who qualifies; production asks who performs."},{"id":"d6s5q02","concept":"cross-platform-problems","type":"single","stem":"A team ports a working integration from the direct API to a cloud-provider route and it fails to find the model. Which cross-platform issue is the most likely cause?","options":["Model identifier strings differ across routes, so the identifier must be changed","Prompt caching is disabled on every cloud-provider route by default","The logging profile is identical across routes, which causes naming conflicts","The regional endpoint is always global on cloud-provider routes"],"correct":[0],"explanation":"Model identifier strings differ across entry points, so a configuration that works on one route may not work on another. The other options are not stated cross-platform behaviours.","mnemonic":"Same model, different name: IDs change with the route."},{"id":"d6s5q03","concept":"cross-platform-problems","type":"multi","stem":"Which TWO problems does a deployment spanning more than one entry point expose that a single-entry-point system does not? Select TWO.","options":["Feature availability can lag on a cloud-provider route versus the direct API","Eval scores can no longer be compared between releases on different routes","Regional availability on Bedrock and Vertex requires explicit configuration","Every route must share one authentication method and one logging profile","Latency budgets no longer apply to deployments that span multiple routes"],"correct":[0,2],"explanation":"Features can lag on cloud-provider routes, and Bedrock and Vertex regions need explicit configuration. Each route keeps its own authentication and logging profile, so a shared auth method is not required.","mnemonic":"IDs differ, features lag, regions need explicit setting."},{"id":"d6s5q04","concept":"global-endpoint-residency","type":"single","stem":"Which common configuration pattern most often breaks a data-residency requirement on a Bedrock or Vertex deployment?","options":["Using a different model identifier than the direct API","Defaulting to a global endpoint instead of explicitly configuring the region","Running two entry points inside the same workflow","Keeping the policy document in the prompt rather than in retrieval"],"correct":[1],"explanation":"Regional availability needs explicit configuration, and defaulting to a global endpoint is the common residency breaker. Model identifiers affect compatibility rather than data location.","mnemonic":"Global by default means residency by accident."},{"id":"d6s5q05","concept":"global-endpoint-residency","type":"single","stem":"A deployment passes testing, but a quarterly confirmation finds requests are being served outside the required region. Which cause should be investigated first?","options":["A global endpoint default instead of an explicitly configured region","A model tier chosen above the pilot's needs, raising the monthly cost","An eval score drifting below the threshold set from the eval suite","A missing before metric in the outcome document written at close"],"correct":[0],"explanation":"On Bedrock and Vertex, regional execution needs explicit configuration, and a global endpoint default is the usual way residency quietly breaks. The other options concern cost, quality and reporting.","mnemonic":"Residency drift? Check for a quiet global endpoint."},{"id":"d6s5q06","concept":"responsibility-map","type":"single","stem":"What does an entry-point-responsibility map record, and when should it exist?","options":["Which entry point owns which task and why; before writing any integration code","Which entry point had the lowest cost; compiled after the first invoice arrives","Which team approved each route; recorded after the production cutover is done","Which entry point holds the logs; produced once an auditor asks for them"],"correct":[0],"explanation":"The map says which entry point handles which task and why, and it should precede integration code because each boundary has its own auth, logging and failure profile. Writing it later invites undocumented routing.","mnemonic":"Map the owners before you write the integration."},{"id":"d6s5q07","concept":"responsibility-map","type":"single","stem":"Over a year, a cloud-provider entry point set up for one regulated workflow starts handling unrelated tasks nobody planned. Which missing artifact most directly allowed this?","options":["A consumption forecast at expected production volume for each entry point","A governance table of production signals, triggers and owners for the loop","An entry-point-responsibility map stating which entry point owns which task and why","A measurement owner named in the outcome document after the engagement closes"],"correct":[2],"explanation":"Task creep is the common multi-entry-point failure when routing logic was never documented; the responsibility map prevents it. The other artifacts address cost, drift and outcome measurement.","mnemonic":"Undocumented routing lets one entry point creep into another's job."},{"id":"d6s5q08","concept":"matrix-direct-default","type":"single","stem":"No procurement rule or residency requirement points elsewhere for a new deployment. Which entry point does the decision matrix suggest?","options":["AWS Bedrock, because it is region-configurable for every deployment","GCP Vertex AI, because it fits any procurement path a partner has","The direct Anthropic API, the default unless procurement or residency says otherwise","Microsoft Foundry, because its platform name implies full residency coverage"],"correct":[2],"explanation":"The direct API is the default, with newest features first and the fewest extra hops, unless a procurement or residency rule points elsewhere. Foundry coverage cannot be assumed from the platform name.","mnemonic":"Direct first, unless procurement or residency says otherwise."},{"id":"d6s5q09","concept":"matrix-csp-routes","type":"single","stem":"A partner has standardised on AWS and needs in-region execution. Which entry point does the decision matrix favour, with what condition?","options":["The direct API, with no regional configuration required","Microsoft Foundry, with residency assumed from the platform","GCP Vertex AI, with the region left at its default","AWS Bedrock, configured explicitly for the required region"],"correct":[3],"explanation":"Bedrock fits AWS-centric procurement and region rules when configured explicitly, though features may lag the direct API. Vertex is the equivalent for GCP-standardised partners.","mnemonic":"AWS shop, in-region need: Bedrock, region set explicitly."},{"id":"d6s5q10","concept":"foundry-verify-per-route","type":"single","stem":"A partner requires Microsoft Foundry for procurement reasons. How should the architect handle data residency?","options":["Assume the partner's Azure environment hosts inference for every model","Verify residency and coverage per hosting form, since hosted-on-Azure and hosted-on-Anthropic models differ","Treat residency as satisfied because Foundry is an Azure platform","Default to the global endpoint and confirm residency after cutover"],"correct":[1],"explanation":"Foundry varies by hosting form: hosted-on-Azure models run inference in the partner's Azure environment, whereas hosted-on-Anthropic models route to Anthropic infrastructure. Residency must be verified per route, not assumed from the name.","mnemonic":"Foundry: check the hosting form, never the brand name."},{"id":"d6s5q11","concept":"outcome-document-fields","type":"multi","stem":"Which THREE fields belong in a customer outcome document? Select THREE.","options":["The use case with its scope boundary","Monthly request volume as the headline result","The business metric before deployment and after it, using the same definition","The control that makes the comparison auditable","Average latency as the proof of value"],"correct":[0,2,3],"explanation":"The document records the use case with scope boundary, the before and after metric on the same definition, the control making the comparison auditable, and a measurement owner. Volume and latency are technical metrics, not business outcomes.","mnemonic":"Scope, before and after, control, owner: outcomes beat throughput."},{"id":"d6s5q17","concept":"outcome-document-fields","type":"single","stem":"Whom is a customer outcome document chiefly written for, and what must it let them do?","options":["The on-call engineer, so incidents can be debugged after the engagement closes","The sponsor outside the build, to justify the deployment upward with business outcomes","The observability vendor, so that metric exports can be tuned to the use case","The original build team, as a change log of the releases made during delivery"],"correct":[1],"explanation":"The outcome document makes the deployment's value understandable to people who were not on the build, chiefly the sponsor who must justify it upward. Technical metrics alone cannot do that; the before-and-after business outcomes can, and a metrics-only document cannot justify expansion.","mnemonic":"Written for the sponsor to take upstairs: business before-and-after, not uptime."},{"id":"d6s5q13","concept":"before-metric-at-start","type":"single","stem":"When should the architect capture the before metric for the outcome document?","options":["At the start of the engagement, before the deployment changes anything","At project close, by estimating it back from the measured after result","At the first SLA review, pulled from the observability stack exports","Whenever the sponsor asks for funding to expand the deployment"],"correct":[0],"explanation":"Without the before number there is no story, so it must be captured at the start. Reconstructing it afterwards leaves the comparison an assertion.","mnemonic":"No before, no story: baseline on day one."},{"id":"d6s5q14","concept":"control-makes-auditable","type":"single","stem":"Why does the outcome document include a control in place alongside the before and after metrics?","options":["To assign an owner for the monitoring dashboards","To list the guardrails used in the prompts","To make the before-and-after comparison auditable rather than merely asserted","To record which entry point served each request"],"correct":[2],"explanation":"Without a control, the after number is an assertion; the control lets a sponsor defend the comparison upward. The measurement owner is a separate field.","mnemonic":"Without a control, the after number is just a claim."},{"id":"d6s5q15","concept":"measurement-owner","type":"single","stem":"An engagement closes with an outcome document showing before and after metrics and an auditable control. Six months later nobody knows whether the gains have held. Which outcome-document field was missing?","options":["Use case with scope boundary: what the deployment does and does not do","Metric after: the same business metric measured using the same definition","Measurement owner: who owns ongoing measurement after the engagement closes","Control in place: what makes the comparison auditable rather than asserted"],"correct":[2],"explanation":"The measurement owner field names who is responsible for ongoing measurement once the engagement closes. The before and after metrics and the control were present, so the gap is that nobody owned keeping the measurement going.","mnemonic":"Engagement ends, measurement doesn't: name its owner."},{"id":"d6s5q16","concept":"measurement-owner","type":"single","stem":"Whom should the measurement owner field in a customer outcome document name?","options":["The architect who built the deployment, since they defined the original metrics","The person or team responsible for ongoing measurement once the engagement closes","The CFO who approves expansion, since they consume the before-and-after figures","The observability vendor, since its stack exports the technical metrics automatically"],"correct":[1],"explanation":"The field records who owns ongoing measurement after the engagement closes. The building architect leaves with the engagement, and the CFO consumes the result rather than measuring it.","mnemonic":"Owner outlasts the build team."},{"id":"d6s5q18","concept":"entry-point-boundaries","type":"single","stem":"A workflow reaches Claude through two entry points: one serves back-end inference, the other a data path with stricter compliance rules. How should the architect treat the boundary at each entry point?","options":["As one shared integration point that inherits the main route's auth and logging","As a separate integration point with its own authentication, logging and failure-mode profile","As an internal routing detail that needs no documentation once requests succeed","As a cost line only, since authentication and logging are identical across routes"],"correct":[1],"explanation":"Each entry-point boundary is an integration point with its own authentication, logging and failure-mode profile, and the entry-point-responsibility map makes those boundaries explicit. Assuming shared or identical profiles hides exactly the differences the map exists to document.","mnemonic":"Every entry-point boundary brings its own auth, logs and failure modes."},{"id":"d6s5q19","concept":"entry-point-boundaries","type":"multi","stem":"An enterprise workflow integrates three Claude entry points. Which TWO statements about its entry-point boundaries are correct? Select TWO.","options":["All boundaries share one logging profile once they sit in the same workflow","Each boundary has its own authentication, logging and failure-mode profile","Boundaries only need attention after a failure has reached production","The entry-point-responsibility map is what makes those boundaries explicit","The boundaries are documented once the integration code is finished"],"correct":[1,3],"explanation":"Multi-entry-point routing multiplies integration points, each with its own auth, logging and failure profile, and the responsibility map, drawn before integration code, keeps them explicit and understandable. Shared profiles and after-the-fact documentation are the opposite of the guidance.","mnemonic":"More entry points, more boundaries; the map keeps each one's auth, logs, failures visible."}]}]},{"domain":7,"subjects":[{"id":"d7s1","title":"Team environment, rollout and spend","learn":["A team environment is a shared project-level baseline: shared CLAUDE.md, agreed tools and MCP servers, and a permission posture, reviewed and versioned.","Rollout runs through a champion per team who gets access first, proves a real workflow, then seeds adoption batch by batch.","Spend posture is set before the first bill: model defaults, allowlists, effort guidance and spend, rate or per-user caps.","Server-managed settings come from Anthropic's servers on authentication, refresh hourly, and are not a Skills distribution path.","Shaping layers (CLAUDE.md, skills, subagents, MCP) differ from governing layers (hooks, permissions, sandboxing); six permission modes control prompting."],"traps":["All-hands switch-on: team adoption rarely succeeds that way; without champions absorbing early friction, the Architect becomes the only person answering questions.","Inherited spend defaults: unmanaged model choice quietly multiplies a costlier tier across every member.","Settings versus Skills: server-managed settings do not distribute Skills.","Prompt versus gate: CLAUDE.md shapes behavior, only hooks guarantee a check cannot be skipped.","Mode mix-ups: bypassPermissions is for containers or CI only; dontAsk is the locked-down CI mode."],"questions":[{"id":"d7s1q01","concept":"team-baseline","type":"single","stem":"Which description best fits a team environment for Claude Code?","options":["Each developer's personal setup, tuned over time and shared informally between colleagues on request","A reviewed, versioned project baseline: shared CLAUDE.md, agreed tools and MCP servers, and a permission posture","A vendor-supplied default configuration the team adopts unchanged and never customizes locally","A single administrator's configuration that every developer's session inherits without anyone reviewing it"],"correct":[1],"explanation":"A team environment is a shared project-level baseline that can be reviewed, versioned and improved once for everyone. Personal setups drift apart, which is exactly what the baseline prevents.","mnemonic":"One baseline, reviewed and versioned; personal setups drift."},{"id":"d7s1q15","concept":"rollout-champions","type":"single","stem":"An organization wants Claude Code adopted across several engineering teams. Which rollout approach is most likely to succeed?","options":["Switch everyone on together so all teams begin from the same day","Let the keenest volunteers adopt it and others follow whenever they choose","Champion per team gets access first, proves a real workflow, then seeds batches","Have the Architect run central training for every team and answer all questions personally"],"correct":[2],"explanation":"Team adoption rarely succeeds as a single all-hands switch-on. A champion per team is granted access first, proves the workflow in practice and seeds adoption batch by batch, absorbing early friction along the way. Central training alone leaves the Architect as the only person who can answer questions.","mnemonic":"One champion per team proves it first, then batches follow."},{"id":"d7s1q03","concept":"rollout-champions","type":"multi","stem":"Which TWO responsibilities does a department champion take on during rollout? Select TWO.","options":["Waits for the broad rollout before trying the workflow in practice","Owns organization billing and sets the shared per-user spend caps","Approves every permission-mode change across the whole organization","Absorbs early friction and builds local examples for peers","Acts as first-line support so the Architect is not the sole answerer"],"correct":[3,4],"explanation":"The champion absorbs early friction, builds local examples, and becomes first-line support. Spend caps and permission posture remain admin and Architect decisions, and a champion who waits defeats the purpose.","mnemonic":"Champions soak up friction and answer first."},{"id":"d7s1q04","concept":"spend-posture","type":"single","stem":"When should admins set model defaults, model allowlists, effort guidance and spend caps for a team?","options":["Only for champions, since later batches inherit them automatically","Once the champion batch has shown real usage patterns","Before the first bill, set intentionally rather than inherited as defaults","After the first monthly bill shows which teams overspent"],"correct":[2],"explanation":"Spend posture is part of team setup and must be decided up front. Waiting for a bill means the cost has already multiplied across every member and request.","mnemonic":"Set the guardrails before the bill, not after."},{"id":"d7s1q05","concept":"spend-posture","type":"single","stem":"A 60-developer team's Claude spend doubled in a month with no growth in usage. Developers had been free to pick any model for every task. What is the most likely root cause?","options":["Unmanaged model choice sending routine work to a costlier tier, multiplied","Server-managed settings refreshing hourly and re-running sessions repeatedly","Too many champions generating examples that every later batch then reran","Permission modes prompting too often and lengthening every single session"],"correct":[0],"explanation":"Leaving model choice unmanaged quietly sends work to a more capable, more expensive tier than needed, and at team scale that choice multiplies across every member and request. Defaults, allowlists and caps prevent it.","mnemonic":"One unmanaged model pick, times every developer."},{"id":"d7s1q06","concept":"server-managed-settings","type":"single","stem":"How are server-managed settings for Claude Code delivered?","options":["Read from Organization settings > Skills at the start of every session","From Anthropic's servers on authentication, refreshed on an hourly polling cycle","Committed to .claude/ in the repository and applied at checkout","Pushed once at install time and changed only when an admin re-uploads"],"correct":[1],"explanation":"Server-managed settings come from Anthropic's servers when users authenticate and refresh hourly. The repository and Skills settings are different channels.","mnemonic":"Authenticate, fetch, refresh hourly: settings from the server."},{"id":"d7s1q07","concept":"server-managed-settings","type":"single","stem":"A colleague proposes using server-managed settings to roll out the team's commit-message skill to every engineer. What is the best response?","options":["It is a settings mechanism, not Skills distribution; use a plugin, org Skill or project Skill","It works well, and the hourly refresh gives the skill built-in version rollback for free","It works only for API Skills, which are the sole Skills that settings can carry","It is correct, provided the skill is also placed in the repository's CLAUDE.md file"],"correct":[0],"explanation":"Server-managed settings centrally manage Claude Code configuration but are not a way to distribute Skills. Skills go through org-provisioning, plugins, project .claude/skills/ or the API.","mnemonic":"Settings are not Skills: different pipe."},{"id":"d7s1q08","concept":"shaping-vs-governing","type":"single","stem":"A team needs a guarantee that a check runs before a tool executes and that the agent cannot skip it. Which Claude Code layer fits?","options":["An MCP server exposing the check","A subagent with a restricted prompt","CLAUDE.md standing instructions","A hook on the lifecycle event"],"correct":[3],"explanation":"Hooks are scripts on lifecycle events that act as deterministic gates, so the guarantee comes from code rather than prompting. CLAUDE.md and subagents shape behavior but do not enforce it.","mnemonic":"Prompts persuade; hooks enforce."},{"id":"d7s1q09","concept":"shaping-vs-governing","type":"multi","stem":"Which TWO Claude Code layers govern what the agent is allowed to touch, rather than shaping what it knows and does? Select TWO.","options":["Hooks firing on lifecycle events","CLAUDE.md standing project instructions","Subagents with isolated context windows","Permission boundaries and approval flows","MCP servers exposing external tools"],"correct":[0,3],"explanation":"Governing layers are hooks, permissions and approval flows, and sandboxing. CLAUDE.md, skills, subagents and MCP servers are shaping layers.","mnemonic":"Shape: know and do. Govern: touch and gate."},{"id":"d7s1q10","concept":"permission-modes","type":"single","stem":"Which permission mode suits a locked-down CI job that should run only what the allow rules explicitly cover?","options":["plan mode","default","acceptEdits","dontAsk"],"correct":[3],"explanation":"dontAsk auto-denies anything that would prompt and runs only what allow rules cover, making it the mode for locked-down CI. Default prompts before each action, which CI cannot answer.","mnemonic":"dontAsk: no asking, only allow-list, built for CI."},{"id":"d7s1q11","concept":"permission-modes","type":"multi","stem":"Which TWO statements about Claude Code permission modes are accurate? Select TWO.","options":["acceptEdits approves every Bash command of any kind as well as all file edits","bypassPermissions skips all checks and is scoped to containers or CI only","Default mode approves common filesystem commands without prompting the user at all","Plan mode locks the session to read-only until the user approves a plan"],"correct":[1,3],"explanation":"Plan mode is read-only until a plan is approved, and bypassPermissions skips every check so it belongs only in containers or CI. acceptEdits covers edits and common filesystem commands only, and default asks before each action.","mnemonic":"Plan reads, bypass only in boxes."},{"id":"d7s1q12","concept":"spend-guardrail-controls","type":"single","stem":"An admin wants every new Claude Code session to begin on a mid-tier model, while still letting developers switch to a stronger model when a task needs it. Which spend guardrail sets the starting model?","options":["A per-user spend cap applied across the whole team","A model default, which fixes the model a session starts on","A model allowlist naming which models the team may use","Effort guidance setting how hard the model works per task"],"correct":[1],"explanation":"The model default decides which model a session starts on. An allowlist or restriction governs which models the team may switch to, so it limits choice rather than setting the starting point; caps and effort guidance bound consumption and effort.","mnemonic":"Default is where you start; allowlist is where you may go."},{"id":"d7s1q13","concept":"spend-guardrail-controls","type":"multi","stem":"A team lead wants to stop developers switching to the most expensive model tier and to bound how much any single person can consume. Which TWO spend guardrails address these needs? Select TWO.","options":["Model allowlists and restrictions on which models the team may switch to","Per-user caps that keep each person's consumption within a set bound","A shared CLAUDE.md that asks developers to prefer cheaper models","A model default that sets which model each session starts on","Effort guidance describing how hard the model should work on a task"],"correct":[0,1],"explanation":"Allowlists and restrictions control which models people may switch to, and per-user caps bound individual consumption. A model default only sets the starting model, so developers can still switch up; a CLAUDE.md request is guidance, not a guardrail.","mnemonic":"Allowlist fences the tiers; per-user cap fences the person."},{"id":"d7s1q16","concept":"team-setup-cost","type":"single","stem":"A manager questions spending time on a shared configuration, a rollout plan and skills packaging before developers start using Claude Code. Which response best reflects the cost trade-off?","options":["It is overhead worth skipping for small teams, who can each tune their own personal setups","It should wait until the first bill shows which teams actually use the tool","It costs setup time now, but is far cheaper than reconciling drifted configurations later","It only pays off for teams that call Claude through API Skills in products"],"correct":[2],"explanation":"Standing up a team environment costs setup time for shared config, a rollout plan and skills packaging, but it is far cheaper than later reconciling many individual configurations that have drifted apart. Waiting for the first bill also contradicts setting the spend posture up front.","mnemonic":"Pay setup once now, or reconcile drifted configs later."}]},{"id":"d7s2","title":"Distributing Skills to a team","learn":["Org-provisioned Skills reach everyone at once; users can toggle them off but not remove them; no version pinning or native rollback, so updates need manual re-upload.","Plugins assigned to a group or org give group targeting, install preferences and version-controlled updates from a connected repo: the strongest governance.","Claude Code project Skills live in .claude/skills/, version and roll back with the repo, and are scoped to its projects.","API Skills are called programmatically by partner products, support explicit version pinning, and are machine-to-machine.","Choose by who needs access and how much control and rollback is needed; packaging a local practice makes it a team standard."],"traps":["Unversioned shared asset: a skill or config with no versioning or rollback lets one bad change reach the whole team before anyone can stop it.","Wrong channel: server-managed settings are not a Skills distribution path.","Org-wide overshoot: org-provisioned reaches everyone and cannot be natively rolled back.","Plugin-only assumption: API Skills and project Skills also have a path back to a prior version.","Missing owner: shared assets need a named owner, not just a distribution path."],"questions":[{"id":"d7s2q01","concept":"org-provisioned","type":"single","stem":"A Skill uploaded under Organization settings > Skills reaches everyone at once. What can individual users do with it?","options":["Pin it to a specific version","Toggle it off but not remove it","Remove it from their own account permanently","Roll it back to the earlier version"],"correct":[1],"explanation":"Org-provisioned Skills are owner-managed: users can toggle individual skills off but cannot remove them. There is no version pinning or native rollback.","mnemonic":"Toggle off, never remove: owner holds the switch."},{"id":"d7s2q02","concept":"org-provisioned","type":"single","stem":"An org-provisioned Skill gets a bad edit and every employee sees degraded output. What is the recovery path?","options":["Manually re-upload a corrected version, as no pinning or rollback exists","Roll back natively to the last pinned version of the skill","Reassign the plugin to a different group of employees","Wait for the hourly settings refresh to restore the earlier version"],"correct":[0],"explanation":"Org-provisioned Skills lack version pinning and native rollback, so updates and fixes require manual re-upload. The hourly refresh belongs to server-managed settings, not Skills.","mnemonic":"Org-wide upload: fix means re-upload by hand."},{"id":"d7s2q03","concept":"plugin-governance","type":"single","stem":"Which Skills distribution mechanism offers the strongest governance for group-scoped distribution?","options":["An API Skill called programmatically from a partner's own product","A plugin assigned to a group, with install preferences and versioned updates","A Claude Code project Skill stored under .claude/skills/ in the repository","An org-provisioned Skill uploaded under Organization settings > Skills"],"correct":[1],"explanation":"Plugins combine group targeting, install preferences and version-controlled updates from a connected repository. Org-provisioned Skills lack pinning and rollback.","mnemonic":"Plugin: group, preference, version. The governed route."},{"id":"d7s2q04","concept":"plugin-install-prefs","type":"multi","stem":"Which TWO capabilities does distributing Skills through a plugin provide? Select TWO.","options":["Skills that exist only as files in a project's .claude/skills/ folder","Version-controlled updates from a connected repository","Install preferences such as required, installed-by-default, available or not available","Users removing the plugin permanently from the organization","Explicit version pinning inside a Messages API container"],"correct":[1,2],"explanation":"Plugins offer install preferences and version-controlled updates from a connected repo, plus group targeting. Container version pinning belongs to API Skills and .claude/skills/ files are project Skills.","mnemonic":"Plugin knobs: install preference plus repo-versioned updates."},{"id":"d7s2q05","concept":"project-skills","type":"single","stem":"One team wants a coding convention skill shared across its own repositories, versioned with the code. Which mechanism fits?","options":["An API Skill with explicit version pinning","Organization settings > Skills upload","A Claude Code project Skill in .claude/skills/","A plugin assigned to the whole organization"],"correct":[2],"explanation":"Project Skills are filesystem artifacts in the repo, so they version with it, are scoped to the projects that carry them, and roll back with the repository.","mnemonic":"Skills in the repo travel and roll back with the repo."},{"id":"d7s2q06","concept":"rollback-paths","type":"single","stem":"A partner's own product calls a capability programmatically and needs to pin an exact version. Which mechanism fits?","options":["Plugin installed by default","API Skill","Server-managed settings","Org-provisioned Skill"],"correct":[1],"explanation":"API Skills are called programmatically in machine-to-machine reuse and support explicit version pinning, governed in the calling system.","mnemonic":"API Skill: machine caller, pinned version."},{"id":"d7s2q17","concept":"plugin-governance","type":"single","stem":"A data-science group needs a shared analysis procedure that only its members receive, updated from a connected repository, with a way back if an update misbehaves. Which distribution choice fits best?","options":["Upload it under Organization settings > Skills so it reaches the group at once","Have each member copy it into a personal skills folder and update it by hand","Deliver it through server-managed settings on the hourly polling cycle","Bundle it in a group-assigned plugin and decide who can update or revoke it"],"correct":[3],"explanation":"Group targeting, version-controlled updates from a connected repository and a path back are plugin features, and per-asset governance decides who can update and revoke it. An org-provisioned upload reaches everyone and has no native rollback; server-managed settings are not a Skills distribution path.","mnemonic":"Group scope plus rollback means plugin, governed per asset."},{"id":"d7s2q18","concept":"shared-asset-liability","type":"single","stem":"A team's shared Claude Code configuration is edited in place and pushed to every developer, with no version history and no way to revert. What is the biggest risk of this setup?","options":["Spend caps run out sooner because every developer reloads the full configuration daily","Developers lose the ability to toggle the configuration off for themselves","One bad change propagates to the whole team before anyone can stop it","Only the configuration's original author can start sessions that apply its settings"],"correct":[2],"explanation":"The biggest failure mode in team setup is a shared asset, whether a skill or a config, with no versioning or rollback, so one bad change reaches the whole team before anyone can stop it. Spend caps and user toggles are separate concerns.","mnemonic":"Shared, unversioned, no undo: one bad edit reaches everyone."},{"id":"d7s2q19","concept":"plugin-governance","type":"single","stem":"A legal team has three related Skills that only its own members should be able to use. How should the Architect distribute them?","options":["Upload them org-wide and ask everyone else to toggle them off","Bundle them into one plugin and assign it to the legal group","Deliver them to the legal team through server-managed settings","Expose them as API Skills that the legal members call from their own sessions"],"correct":[1],"explanation":"Bundling one or more Skills into a plugin assigned to a group means only that group's members can access them. An org-provisioned Skill reaches everyone and users can only toggle it off, not remove it; server-managed settings do not distribute Skills.","mnemonic":"Select members only? Plugin to the group, not upload to all."},{"id":"d7s2q10","concept":"shared-asset-liability","type":"single","stem":"Why is a shared Skill with no version and no rollback a liability for a team?","options":["It consumes the team's spend caps faster than versioned shared assets would do","It cannot be toggled off by individual users once it is published","Once several people depend
