,"It prevents any use of tools or retrieval at inference time"],"correct":[0],"explanation":"Fine-tuning locks you to a fixed model version and narrows your options without much to show for it, so treat it as the last step of a deliberate progression. Lower inference cost at very high volume is actually one of the reasons it can be justified.","mnemonic":"Fine-tune and you freeze the version."},{"id":"d1s4q34","concept":"control-flow-location","type":"single","stem":"Why do non-deterministic failures concentrate in the agent pattern in production?","options":["Agents cannot call tools reliably once a conversation runs long","Agents always run on the largest and least predictable model tier","Agent runs cannot be logged at all by current observability tooling","The trajectory is the control flow, leaving no code boundary for guards"],"correct":[3],"explanation":"In an agent the model's trajectory is the control flow, so there is no code boundary where a deterministic guard can sit, and that is where non-deterministic failures concentrate. Agent trajectories can be logged, but they read like transcripts that most current tooling is not built to alert on.","mnemonic":"No code between the steps means nowhere to put a guard."},{"id":"d1s4q35","concept":"control-flow-location","type":"single","stem":"Operations must be able to reconstruct which step made each decision in a process whose steps are known in advance. Which pattern fits, and why?","options":["An agent, because its trajectory reads like a readable transcript","A workflow, because control flow in code can be logged and tested","An augmented call, because one call is easy to log and inspect","Multi-agent, because every subagent keeps its own separate log"],"correct":[1],"explanation":"A workflow keeps control flow in your code, so you can log it, test it and reason about it like any other software; it fits when error cost is real, observability matters and the steps can be determined in advance. An agent's trajectory reads like a transcript that most tooling cannot alert on, and a single augmented call is easy to log but opaque inside.","mnemonic":"Need to replay every decision? Keep the control flow in code."}]},{"id":"d1s5","title":"Multi-agent systems and reference architectures","learn":["Orchestrator owns the goal: decomposes, delegates, synthesizes, and never does sub-task work. Subagents own scoped sub-tasks in their own context. Design decomposition, result structure and conflict resolution explicitly.","Fan-out: split a large item into independent units, one subagent per unit, parallel where independent, then synthesize. Gains clean contexts and concurrency but multiplies token spend.","Recoverable: subagent failures (retry, re-route, flag). Often unrecoverable: orchestrator loses goal or synthesis state (checkpoint it). Shared trace ID across agents; coverage check at synthesis so results equal units dispatched.","HITL gate before any irreversible or high-stakes action a subagent would take; sample lower-stakes actions. Placement is part of orchestration design.","Start from the five reference architectures before inventing your own (teams already learned what breaks); adapt them, they are references, not blueprints: agent, RAG, document pipeline with evaluator-optimizer, routing/triage, coding agent. Failures: unbounded autonomy, retrieval for live state, no exception path, no escalation, no review gate.","Use one pattern unless two parts break differently; separate eval sets per architecture. Live state needs a call to the system that owns it; a better embedding model or shorter refresh will not fix it."],"traps":["Counting only returned results: a confident summary can sit over dropped units; reconcile results returned against units dispatched.","Silent subagent failure: a malformed or empty result is recoverable only if each result is validated and the unit retried, re-routed or recorded as a gap.","Retrieval for live state: fix it by calling the system that owns the live state; a better embedding model or shorter refresh interval will not.","One eval set for a composed system: each reference architecture carries its own eval contract, and a healthy top level can mask a failing component.","Second pattern by indecision: add one only when parts break differently, not because the problem is undecided; composing two roughly doubles the surface to maintain, so when in doubt pick one."],"questions":[{"id":"d1s5q01","concept":"orchestrator-role","type":"single","stem":"What is the orchestrator's job in a multi-agent system?","options":["Cache subagent outputs and replay them on later requests","Own the goal: decompose, delegate and synthesize results","Run only the lowest-risk sub-tasks and hand the rest to a human","Perform each sub-task itself and use subagents for validation"],"correct":[1],"explanation":"The orchestrator owns the goal, decomposes the work, delegates and synthesizes; it does not do the sub-task work itself. Subagents run scoped sub-tasks in their own contexts.","mnemonic":"Orchestrator splits, sends, stitches; never does the piece."},{"id":"d1s5q19","concept":"fanout-pattern","type":"multi","stem":"An orchestrator splits a work item too large for one context into independent units, with one subagent per unit. Which TWO benefits does this fan-out shape deliver? Select TWO.","options":["Each subagent works in a clean context sized to its unit","Total token spend falls compared with a single agent","Independent units run concurrently instead of one after another","The orchestrator no longer needs a synthesis step at the end","Silent unit failures become impossible, so coverage needs no check"],"correct":[0,2],"explanation":"Fan-out's win is twofold: each subagent works in a clean context sized to its unit, and independent units run concurrently. It multiplies token spend rather than reducing it, the orchestrator still synthesizes, and a dropped unit can still hide unless coverage is checked.","mnemonic":"Fan-out pays twice: clean context per unit, and units running side by side."},{"id":"d1s5q03","concept":"recoverable-vs-unrecoverable","type":"single","stem":"Which failure is described as usually recoverable, and which as often unrecoverable?","options":["Both are recoverable because outputs are idempotent","Both are unrecoverable unless the run restarts from scratch","Orchestrator failure is recoverable; subagent failure is unrecoverable","Subagent failure is recoverable; orchestrator losing state is often unrecoverable"],"correct":[3],"explanation":"A failed subagent unit can be retried, re-routed or dropped with the gap flagged while other work proceeds. If the orchestrator loses its goal or synthesis state, the whole run fails, so protect and checkpoint its state.","mnemonic":"Lose a worker, retry; lose the boss, restart."},{"id":"d1s5q20","concept":"coverage-check","type":"single","stem":"Which multi-agent failure is the most dangerous, and what guards against it?","options":["A slow subagent delaying the run; give the orchestrator a bigger window","Conflicting subagent results; restart the whole run from the beginning","A dropped unit hidden under confident synthesis; reconcile coverage at synthesis","High token spend across subagents; cache every subagent's output"],"correct":[2],"explanation":"The dangerous failure is the silent one: a subagent drops a unit and the orchestrator synthesizes a confident, complete-looking answer over incomplete work. Validate coverage rather than assume it, reconciling results against the units submitted. Conflicting results are recoverable at synthesis with a resolution rule or human escalation, not by restarting.","mnemonic":"Count what came back against what went out before trusting the summary."},{"id":"d1s5q21","concept":"coverage-check","type":"multi","stem":"Which TWO practices stop a fan-out from presenting incomplete work as complete? Select TWO.","options":["Have the orchestrator redo any failed unit's work directly itself","Validate each result and record any failed unit as a gap","Share one context window across all subagents to keep state","Refresh the retrieval index more often during each run","Reconcile results returned against the units that were dispatched"],"correct":[1,4],"explanation":"Validate each result at the subagent boundary, retrying or re-routing failed units and recording any gap, and reconcile coverage at synthesis so results returned equal units dispatched. The orchestrator never does sub-task work itself, and a shared context would throw away the clean-context benefit of fan-out.","mnemonic":"Check every unit, count every unit: validate at the boundary, reconcile at synthesis."},{"id":"d1s5q06","concept":"shared-trace-id","type":"single","stem":"Traces fragment across an orchestrator and its subagents, so a single run cannot be reconstructed. What is the design response?","options":["Log only the orchestrator's final answer","Propagate a shared trace identifier across all agents","Move the orchestrator to a smaller model tier","Reduce the number of subagents to one"],"correct":[1],"explanation":"Fragmented traces are a cross-cutting observability failure; a shared trace identifier makes one run reconstructable end to end. Logging only the final answer discards the information needed.","mnemonic":"One run, one trace ID, every agent."},{"id":"d1s5q07","concept":"hitl-checkpoint","type":"single","stem":"Where should a human-in-the-loop gate sit in a multi-agent system?","options":["Before every single subagent call, regardless of the stakes","Only when two subagents return conflicting results to synthesis","Before any irreversible or high-stakes action a subagent takes alone","After the final synthesis step only, once the output is complete"],"correct":[2],"explanation":"Gate placement is set by risk and reversibility: before irreversible or high-stakes actions, with lower-stakes actions sampled rather than each gated. Conflicts may also escalate to a human but that is not the placement rule.","mnemonic":"Gate the irreversible; sample the rest."},{"id":"d1s5q22","concept":"rag-live-state","type":"single","stem":"An assistant's answers about account balances change after each index refresh and sometimes contradict the database. What is the correct fix?","options":["Call the system that owns the balances through a tool","Switch to a better embedding model for the balance documents","Shorten the refresh interval so the index stays current","Raise the similarity threshold on retrieved balance chunks"],"correct":[0],"explanation":"Stale chunks, results that shift with each refresh and answers that contradict the database are the symptoms of retrieval applied to live state. A better embedding model or a shorter refresh interval will not fix it; call the system that owns the live state directly instead of retrieving a cached version of it.","mnemonic":"Shifting with every refresh? Stop indexing live state and call its owner."},{"id":"d1s5q09","concept":"rag-live-state","type":"single","stem":"Which statement captures the retrieval principle for reference architectures?","options":["Retrieval is for stable knowledge; tool use is for live state","Retrieval and tool use are interchangeable if refreshed often","Retrieval is for live state; tool use is for stable knowledge","Retrieval should replace tool use whenever similarity exceeds a threshold"],"correct":[0],"explanation":"Retrieval suits things true yesterday and tomorrow (FAQs, policies, manuals); tool use suits state whose current value is owned by a system and changes independently of the index.","mnemonic":"RAG for what stays; tools for what changes."},{"id":"d1s5q10","concept":"architecture-failure-modes","type":"single","stem":"A document processing pipeline sends low-confidence extractions through the same flow as clean documents. Which failure from the reference architectures is this?","options":["Treating the whole job as a conversation, not a pipeline","No exception path or human gate for low-confidence extractions","Retrieval applied to live state instead of a tool call","Unbounded autonomy with state-changing tools and no review"],"correct":[1],"explanation":"Document pipelines with an evaluator-optimizer go wrong when there is no exception path: low-confidence extractions need a human review gate or queue rather than flowing downstream.","mnemonic":"Low confidence gets a human lane, not the main road."},{"id":"d1s5q11","concept":"architecture-failure-modes","type":"multi","stem":"Which TWO are named failure modes for the coding agent and customer-service routing reference architectures? Select TWO.","options":["Letting the agent edit and commit without a human review gate","Using retrieval for live order status instead of calling the API","Gating a sampled share of low-risk edits with human review","Using a vector index over a stable document corpus of manuals","Keeping classification and handling as two separate routed steps"],"correct":[0,1],"explanation":"The coding agent goes wrong with no review gate before edit and commit; triage goes wrong by using retrieval for live order status and having no human escalation path. The other options describe sound practice.","mnemonic":"Coder needs a gate; triage needs the API, not the index."},{"id":"d1s5q12","concept":"one-vs-several-patterns","type":"single","stem":"When is it justified to combine a second reference architecture with the first?","options":["When the eval set for the first pattern is too small","When stakeholders want a more impressive architecture diagram","When two parts of the problem break in different ways worth managing separately","When the team has not yet decided what problem it is solving"],"correct":[2],"explanation":"Draw on a second pattern when the parts break differently; otherwise adapt one pattern, since combining roughly doubles the surface area to maintain. Reaching for a second pattern out of indecision just defers a design decision.","mnemonic":"Add a pattern only for a different failure; else pick one."},{"id":"d1s5q23","concept":"one-vs-several-patterns","type":"single","stem":"A system combines a RAG layer for documentation questions with a document extraction pipeline, and the team evaluates it with one end-to-end eval set. What is the main risk?","options":["Running the eval set costs more tokens than the system itself","The retrieval index stops refreshing while evals are running","Extraction becomes non-deterministic once retrieval is added","A healthy overall score can hide a failure in one component"],"correct":[3],"explanation":"Each reference architecture carries its own eval contract, so a composed system needs separate eval sets per architecture rather than one for the whole. A system that looks healthy at the top level can be masking failures in one of its components.","mnemonic":"Compose the system, split the evals."},{"id":"d1s5q14","concept":"multi-agent-failure-responses","type":"single","stem":"Two subagents return conflicting findings on the same contract clause. What design response fits this failure?","options":["Keep whichever result arrived first, since later results are usually retries","Restart the whole run from scratch so both subagents produce fresh results","Let the orchestrator redo the clause review itself to break the tie","Give the orchestrator an explicit conflict-resolution rule, or escalate to a human"],"correct":[3],"explanation":"Conflicting results land at the synthesis step and are recoverable: give the orchestrator an explicit conflict-resolution rule or escalate the conflict to a human. The orchestrator owns delegation and synthesis and never does the sub-task work itself.","mnemonic":"Conflict at synthesis? Rule it, or refer it to a human."},{"id":"d1s5q15","concept":"multi-agent-failure-responses","type":"multi","stem":"Subagent failures are usually recoverable and orchestrator failures usually are not. Which TWO design choices follow from this asymmetry? Select TWO.","options":["Have the orchestrator do sub-task work itself to avoid failures","Make subagent work idempotent so failed units can be retried","Fail the whole run whenever any one subagent returns empty","Give every subagent the full goal and the synthesis state","Checkpoint orchestrator progress so a failed run can resume"],"correct":[1,4],"explanation":"Design for the asymmetry: make subagent work idempotent and retryable, and protect orchestrator state by checkpointing so a failed run can resume rather than restart. Failing the whole run on one empty result turns a recoverable failure into an unrecoverable one.","mnemonic":"Subagents: retry freely. Orchestrator: checkpoint fiercely."},{"id":"d1s5q16","concept":"multi-agent-failure-responses","type":"single","stem":"One subagent in a 40-unit fan-out returns a malformed result. What is the recommended handling?","options":["Fail the entire run, since any malformed result invalidates the synthesis","Validate the result, retry or re-route the unit, and record any remaining gap","Accept the result as returned, since synthesis will smooth over it","Escalate the full run to a human before any other unit proceeds"],"correct":[1],"explanation":"A malformed or empty result is a recoverable failure at the subagent boundary: validate each result, retry or re-route the failed unit, and record the gap rather than failing the run. Accepting it silently is how a confident summary ends up built over incomplete work.","mnemonic":"Bad unit back? Validate, retry, and write down the hole."},{"id":"d1s5q17","concept":"coding-agent-two-phase","type":"single","stem":"Which shape does a well-built coding-agent reference architecture take?","options":["A single agent loop that explores, edits and commits in one open conversation","A fixed workflow for both phases, since codebase exploration can be scripted","Agentic investigation of the codebase, then deterministic parse, plan, propose, test and review steps","Retrieval over the repository first, then one augmented call that writes the patch"],"correct":[2],"explanation":"The work splits in two: agentic investigation, because the path through an unfamiliar codebase cannot be written in advance, then deterministic edit steps of parse, plan, propose, test and review. Treating the whole thing as one conversation rather than a structured pipeline is a named failure mode.","mnemonic":"Explore like an agent, edit like a pipeline."},{"id":"d1s5q18","concept":"coding-agent-two-phase","type":"multi","stem":"A team reviews a coding agent and a ticket-triage system against the reference architectures. Which TWO practices are named failure modes? Select TWO.","options":["Not tracking regression rates against an eval set per language or framework","Splitting the work into agentic investigation and deterministic edit steps","Routing high-consequence actions to a separate human approval layer","Deploying an agent variant before the simpler routed workflow is measured","Calling a transactional API for live state such as order status"],"correct":[0,3],"explanation":"Coding agents go wrong when regression rates are not tracked against an eval set for each language or framework, and triage systems go wrong when an agent variant ships before the simpler routed workflow is properly measured. The other three options describe what good looks like.","mnemonic":"Track regressions per language; measure the router before buying the agent."},{"id":"d1s5q24","concept":"reference-arch-start","type":"single","stem":"A team plans to design a bespoke architecture from scratch for a recurring class of problem, such as triaging support tickets. What is the best advice?","options":["Implement the closest reference architecture exactly as drawn","Combine all five reference architectures to cover every case","Design from scratch, since every partner workload is unique","Start from the reference architecture that fits, then adapt it"],"correct":[3],"explanation":"Reach for the tested reference architectures before inventing your own: they are documented because other teams already learned what breaks in each. They are references, not blueprints, so take the shape that fits and adapt it to the workload. Workloads being unique is a reason to adapt a pattern, not to implement one as drawn or to start from nothing.","mnemonic":"Borrow the proven shape, then tailor it: reference, not blueprint, never blank page."},{"id":"d1s5q25","concept":"reference-arch-start","type":"single","stem":"What makes the documented reference architectures worth starting from rather than inventing a new design?","options":["Other teams have already learned what breaks in each one","They are certified designs that need no further adaptation","They remove the need for separate per-architecture eval sets","They guarantee the lowest token cost for any given workload"],"correct":[0],"explanation":"The reference architectures are documented because other teams have already learned what breaks in each, which is why each comes with a characteristic failure mode. They still have to be adapted to the workload, and each one carries its own eval contract, so they neither skip adaptation nor remove per-architecture eval sets.","mnemonic":"Reference architectures are scar tissue: someone else already found what breaks."},{"id":"d1s5q26","concept":"one-vs-several-patterns","type":"single","stem":"A team is still unsure what its system will need to handle, so it proposes composing two reference architectures to cover both possibilities. What should the architect recommend?","options":["Compose both now and drop the weaker one after launch","Compose both, but share one end-to-end eval set to save cost","Adapt a single architecture; composing roughly doubles upkeep","Add a third architecture so that every possibility is covered"],"correct":[2],"explanation":"When you are still uncertain what the system will need to handle, pick one and adapt it: composing two reference architectures roughly doubles the surface area you must maintain, and reaching for a second pattern out of indecision defers a design decision. Combine only when parts of the problem break differently, and then give each architecture its own eval set.","mnemonic":"In doubt, pick one: two architectures, twice the surface to maintain."}]},{"id":"d1s6","title":"Feasibility, sizing and business value","learn":["Scoping sequence: business requirement, capability list, architecture sketch (who owns each), boundary conditions, then the SOW containing those boundary conditions. Feasibility is a verdict plus the constraints that make it true.","Sizing inputs: call volume (from the business owner), token budget per request (input plus output, modelled as a distribution), model tier, plus sensitivity analysis. Input and output tokens are priced at different rates; caching needs cache_control, with write cost and a 5-minute default TTL.","Average token counts underestimate cost when a tail of long requests dominates; design to p95 latency, not the median. Batch API suits asynchronous SLAs but check BAA coverage for regulated data.","Verdicts: feasible as scoped (state assumptions); feasible with constraints (constraints are part of the architecture: document each and its failure mode, or production violations make it infeasible); not feasible (name the disqualifying constraint and any scope reduction that changes it).","ROI mapping: baseline measured in a business unit, post state in the same unit including human review cost, subtract run cost from sizing, state payback and sensitivity. Five pillars: efficiency, transformation, productivity, solution cost, performance SLAs.","Run every capability through all four AI properties; asking only 'can Claude do this' is a capability check. Working memory is most overlooked: small, clean development inputs rarely hit the window, production inputs do (chunk, load progressively, or pipeline)."],"traps":["Capability before constraints: issuing a verdict before gathering volume, input size and latency requirements, or building before the cost model; a projection over the ceiling changes the architecture before code, not after the first bill.","Average instead of distribution: a tail of long requests consumes a disproportionate share of spend, so averages can understate cost by two or three times.","Full automation assumed: if the design needs a human review gate, labour is reduced, not eliminated.","Estimated baseline: a baseline from intuition collapses when finance asks for the source; use the business owner's operational data.","POC bill as production model: low-volume demos reveal nothing about cost, latency under load, reliability or failure modes."],"questions":[{"id":"d1s6q01","concept":"scoping-sequence","type":"single","stem":"Which is the correct order of the scoping discovery sequence?","options":["Requirement, capability list, architecture sketch, boundary conditions, SOW","Architecture sketch, capability list, requirement, boundary conditions, SOW","Requirement, boundary conditions, capability list, architecture sketch, SOW","Capability list, SOW, architecture sketch, requirement, boundary conditions"],"correct":[0],"explanation":"Scoping runs from business requirement to capability list, then architecture sketch assigning owners, then boundary conditions, then the SOW that contains them. Skipping a step produces a commitment that will not survive the next conversation with the business owner.","mnemonic":"Need, list, sketch, bounds, SOW."},{"id":"d1s6q24","concept":"scoping-sequence","type":"single","stem":"An architecture handles typed forms reliably but not handwritten ones. Where should that limit be recorded?","options":["In the post-launch retrospective report","In the model deprecation runbook","In the system prompt, as an instruction","In the SOW, as a boundary condition"],"correct":[3],"explanation":"Boundary conditions state when the architecture works and when it does not, and the SOW contains them so the development team and the business owner both know what is out of scope. Telling the model in a prompt does not record the limit for the people committing to the scope.","mnemonic":"Works for some inputs, not others? Write the boundary into the SOW."},{"id":"d1s6q03","concept":"sizing-inputs","type":"single","stem":"Which three inputs form the basis of the monthly cost estimate before any code is written?","options":["Number of subagents, hook count and retry limit","Team size, sprint length and delivery route","Call volume, token budget per request, and model tier","Dataset size, embedding dimensions and chunk overlap"],"correct":[2],"explanation":"Call volume, token budget per request (input plus expected output) and model tier drive the estimate, with sensitivity analysis on top. The other options are not sizing inputs.","mnemonic":"Volume times tokens times tier gives the bill."},{"id":"d1s6q04","concept":"token-distribution-tail","type":"single","stem":"A cost model used the average document's token count. After launch, the longest documents consumed most of the token spend. What was the modelling error?","options":["Applying output token rates to the input tokens","Choosing the wrong delivery route for the traffic","Ignoring the Batch API discount in the model","Assuming a uniform distribution instead of modelling the tail"],"correct":[3],"explanation":"Token distributions are often skewed: a tail of long requests consumes a disproportionate share, so average-based models can underestimate cost by two or three times. Model the distribution, not just the average.","mnemonic":"Mean hides the tail; the tail eats the budget."},{"id":"d1s6q05","concept":"token-distribution-tail","type":"single","stem":"Why is p95 a better latency design target than the median?","options":["SLA breaches are usually caused by the slowest requests at the high end","p95 measures output length in tokens rather than elapsed time","The median is always below the SLA, so it needs no monitoring","Only the slowest 5% of requests can ever exceed the median"],"correct":[0],"explanation":"P95 is the value below which 95% of requests complete, and SLA breaches typically come from the slower tail. The median reflects the middle of the pack and hides those breaches.","mnemonic":"Breaches live in the tail; design to p95."},{"id":"d1s6q06","concept":"feasibility-verdicts","type":"single","stem":"A design works only if document length stays under a threshold and the retrieval index is refreshed on a defined schedule. Which verdict is this, and what must be done?","options":["Feasible as scoped; state the assumptions only","Feasible with constraints; document each constraint and its failure mode","Feasible as scoped; add a hook to enforce the refresh schedule","Not feasible; end the engagement at this point"],"correct":[1],"explanation":"A design that works only under enforced conditions is feasible with constraints, and each constraint must be documented with its failure mode. An undocumented constraint becomes an infeasible system when violated in production.","mnemonic":"Works if, so write the ifs down."},{"id":"d1s6q07","concept":"feasibility-verdicts","type":"single","stem":"At least one capability faces a property limitation that cannot be compensated within scope and budget. What should the verdict document?","options":["A list of tools the team might try at a later stage","The expected payback period under optimistic volume assumptions","The disqualifying constraint, and any scope reduction that changes the verdict","Only that the model tier selected was too small"],"correct":[2],"explanation":"A not-feasible verdict is a correct assessment that saves a more expensive failure later. State which constraint disqualifies and why, and name a scope reduction that would change it so the business owner can choose.","mnemonic":"Not feasible: name the blocker, offer the smaller scope."},{"id":"d1s6q08","concept":"four-properties-feasibility","type":"multi","stem":"Match feasibility questions to properties: which TWO are correct pairings? Select TWO.","options":["Knowledge: does the task require choosing a delivery route?","Working memory: is the output schema valid JSON?","Next token prediction: does the task depend on the latency p95?","Steerability: are the instructions specific, concrete and verifiable?","Working memory: do the inputs fit the context window in aggregate?"],"correct":[3,4],"explanation":"Working memory asks whether inputs fit the window; steerability asks whether instructions are specific and verifiable. Knowledge asks whether information is rare, contested or recent, and next-token prediction asks about precision on specific values.","mnemonic":"Memory asks fit; steerability asks specific; knowledge asks fresh; tokens ask precision."},{"id":"d1s6q09","concept":"roi-mapping","type":"single","stem":"Which sequence correctly describes the four-step ROI mapping?","options":["Choose the pillars, set the performance SLA, subtract only build cost, then skip sensitivity analysis","Take run cost from the average token cost, subtract the baseline, then quote total revenue as the value of the system","Estimate the baseline from intuition, assume full automation, ignore the run cost, quote one optimistic payback period","Name the baseline in a business unit, predict the post state in that unit, subtract run cost, state payback with sensitivity"],"correct":[3],"explanation":"Baseline in a business unit from the owner's operational data, post state in the same unit including human review, subtract the sizing run cost, then state payback with sensitivity. The other options contain the named ROI errors.","mnemonic":"Baseline, after, minus run cost, payback with sensitivity."},{"id":"d1s6q10","concept":"roi-errors","type":"single","stem":"A value case assumed claims review labour disappears entirely, yet the design includes a human review gate for low-confidence outputs. What happens after launch?","options":["Actual analyst hours fall less than the business case promised","The baseline is recalculated automatically by the finance team","Run cost drops well below the sizing model's estimate","The token distribution shifts toward the average request length"],"correct":[0],"explanation":"With a human review gate, labour is reduced but not eliminated. Modelling it as eliminated overstates value and surfaces in the first operational period when analyst hours fail to fall as promised.","mnemonic":"Review gate means reduced labour, not zero labour."},{"id":"d1s6q11","concept":"roi-errors","type":"multi","stem":"Which TWO are among the most common ROI map errors? Select TWO.","options":["Using the sizing distribution for the run cost","Stating payback with a sensitivity analysis","Taking run cost from an average rather than the distribution","Measuring both states in the same business unit","Estimating the baseline instead of measuring it"],"correct":[2,4],"explanation":"Estimated baselines and average-based run costs both overstate net value, the latter concentrating in heavy-tailed workflows. The other options describe correct practice.","mnemonic":"Measured baseline, distributed cost: never guessed, never averaged."},{"id":"d1s6q12","concept":"five-value-pillars","type":"single","stem":"Which list names the five value pillars used to frame an ROI claim?","options":["Baseline, projection, run cost, payback, sensitivity","Efficiency, transformation, productivity, solution cost, performance SLAs","Accuracy, safety, latency, scale, compliance","Entry point, interface, route, primitive, pattern"],"correct":[1],"explanation":"Efficiency (same work faster or cheaper), transformation (previously infeasible work), productivity (more output from same people), solution cost, and performance SLAs. Each ROI claim should map to the pillar it advances.","mnemonic":"E-T-P-C-S: efficiency, transformation, productivity, cost, SLAs."},{"id":"d1s6q25","concept":"constraints-before-verdict","type":"single","stem":"A prototype works well and the business owner is eager to proceed. Why should the architect hold off on confirming feasibility?","options":["Feasibility means little until volume and SLA constraints are applied at scale","The model version must be pinned before any verdict can be issued","A delivery route must be chosen before feasibility can be assessed","The ROI payback period must be calculated before feasibility is judged"],"correct":[0],"explanation":"'Technically feasible' is meaningless unless the constraints are applied at the expected scale; confirming feasibility from a working demo before gathering volume and SLA constraints is the trap. ROI mapping follows the feasibility verdict rather than preceding it.","mnemonic":"A working demo isn't a verdict: apply the constraints at scale first."},{"id":"d1s6q26","concept":"constraints-before-verdict","type":"multi","stem":"Which TWO constraints must be applied at the expected scale before a use case is confirmed as feasible? Select TWO.","options":["Call volume","Team size","SLA latency requirement","Preferred delivery route","Demo pass rate"],"correct":[0,2],"explanation":"Confirming feasibility before gathering the volume and SLA constraints feels efficient, but 'technically feasible' is meaningless until those constraints are applied at the expected scale. A working demo shows capability, not feasibility; team size and the preferred delivery route are not the constraints the verdict rests on.","mnemonic":"Volume and SLA at real scale first; a working demo is not a verdict."},{"id":"d1s6q15","concept":"feasible-as-scoped-assumptions","type":"single","stem":"A use case is judged feasible as scoped: every capability favors Claude, cost is under the ceiling and p95 is inside the SLA. What must the verdict document?","options":["Nothing further, since no compensating control changes the architecture","Each failure mode for every constraint the design could violate","Its assumptions, since changed assumptions can make it feasible with constraints","The scope reduction that would make the verdict not feasible"],"correct":[2],"explanation":"A feasible-as-scoped verdict should state its assumptions clearly, because it becomes feasible with constraints when those assumptions change. Documenting each constraint's failure mode belongs to the feasible-with-constraints verdict, and naming a scope reduction belongs to not feasible.","mnemonic":"Feasible as scoped stands on assumptions: write them down before they shift."},{"id":"d1s6q27","concept":"feasible-as-scoped-assumptions","type":"single","stem":"A design was judged feasible as scoped on the stated assumption that every input arrives in English. The business now wants to add three more languages. How should the verdict be viewed?","options":["It still holds, because feasibility was approved at project sign-off","It becomes not feasible automatically, so the project must stop","It must be reassessed, since a stated assumption no longer holds","It is unaffected, because input language is an implementation detail"],"correct":[2],"explanation":"A feasible-as-scoped verdict states its assumptions because it changes when they change; the new requirement becomes a documented constraint with its failure mode. Sign-off does not freeze the verdict, a changed assumption does not stop the project automatically, and input language is a scoping assumption, not an implementation detail.","mnemonic":"Assumption breaks, verdict reopens: reassess and document the new constraint."},{"id":"d1s6q17","concept":"working-memory-overlooked","type":"single","stem":"Which of the four AI properties is most often overlooked in a feasibility assessment, and why?","options":["Working memory, since small, clean development inputs rarely hit the window","Knowledge, since domain gaps only appear after the model is updated","Steerability, since instructions always look concrete during scoping","Next token prediction, since extraction errors are visible in demos"],"correct":[0],"explanation":"Working memory is the most overlooked property because it rarely shows up during development on small, clean inputs, yet it surfaces in production. Skipping any property risks missing a constraint that changes the design.","mnemonic":"Memory hides in small demos: working memory bites only at production size."},{"id":"d1s6q18","concept":"working-memory-overlooked","type":"single","stem":"A multi-document review tool passed every development test on short sample files. In production, requests combining dozens of long documents begin to fail. Which feasibility check was most likely skipped, and what compensates?","options":["The knowledge check; fine-tune the model on the document corpus","The steerability check; add more few-shot examples to the prompt","The next token check; raise the sampling temperature for variety","The working memory check; chunking, progressive loading or a pipeline"],"correct":[3],"explanation":"When inputs in aggregate exceed the context window, the working memory property applies, compensated by chunking, progressive context loading, summarization across turns or a pipeline architecture. Knowledge and steerability address different limits and would not fix an input that does not fit.","mnemonic":"Too much to hold? Chunk it, stage it, pipeline it."},{"id":"d1s6q28","concept":"sizing-volume-and-sensitivity","type":"single","stem":"An architect is sizing an invoice-processing workflow before any code is written. Where should the call-volume figure come from?","options":["The request count observed in the POC sample dataset","The business owner, based on the business requirement","The developer's estimate, based on similar past projects","The documented rate limit per minute for the model tier"],"correct":[1],"explanation":"Call volume comes from the business requirement and the business owner, not from the developer's intuition or a sample dataset. A POC sample reflects demo traffic, not the production figure the cost model needs.","mnemonic":"Volume comes from the owner, not the sample or the developer's hunch."},{"id":"d1s6q20","concept":"sizing-volume-and-sensitivity","type":"multi","stem":"A sizing model is complete except for step four, the sensitivity analysis. Which TWO questions does that step ask? Select TWO.","options":["Which model tier did the POC happen to use?","What happens to cost if call volume doubles?","How many engineers are needed to build the system?","What happens if the token distribution shifts toward the tail?","Which vendor has the lowest list price this quarter?"],"correct":[1,3],"explanation":"Sensitivity analysis asks how cost moves if volume doubles or the token distribution shifts toward the tail, revealing how fragile the model is and which assumptions to verify with the business owner. The POC's tier and staffing do not test the model's fragility.","mnemonic":"Double the volume, fatten the tail: sensitivity shows where the cost model snaps."},{"id":"d1s6q21","concept":"roi-payback-period","type":"single","stem":"In the four-step ROI mapping, where should the one-off build cost be accounted for?","options":["Subtracted with run cost from the monthly operational gain","Folded into the baseline state as a cost of today's process","In the payback period, alongside accumulated gain and run cost","Excluded, since only recurring run cost affects the value case"],"correct":[2],"explanation":"Step three subtracts only the recurring run cost taken from the sizing model; build cost is handled separately in step four, where payback is the time for accumulated gain to cover build and run cost. Excluding build cost entirely would overstate the case.","mnemonic":"Run cost in step three, build cost in the payback: keep the bills apart."},{"id":"d1s6q22","concept":"roi-payback-period","type":"single","stem":"A value statement reports a net monthly gain and a single payback period of seven months, with nothing further. What is the main weakness?","options":["It should report the payback period in tokens rather than months","It omits the latency p95, which belongs in the payback figure","It should use the POC bill as the run cost for accuracy","It lacks sensitivity on how payback shifts if volume or gain assumptions fail"],"correct":[3],"explanation":"A payback period should come with sensitivity showing how it moves if volume or gain-per-task assumptions are wrong; a single figure invites decisions on one optimistic scenario. Using the POC bill as run cost would repeat the demo-cost mistake.","mnemonic":"One payback number is a wish; payback plus sensitivity is a plan."},{"id":"d1s6q29","concept":"caching-cost-model","type":"single","stem":"A sizing model assumes prompt caching will cut input cost for a long, stable system prompt, but requests arrive only about every 20 minutes. What should the architect expect?","options":["Little saving: the default 5-minute TTL expires between requests","Full savings, since caching applies automatically without request markers","Free cache reads, so input cost drops to almost nothing","Larger savings as traffic falls, since fewer writes are needed"],"correct":[0],"explanation":"With the default 5-minute cache TTL, workloads whose requests arrive less often than the TTL will not realize consistent caching savings, and cache writes cost more per token than standard input, so the cost model must include the first-use write cost. Caching also needs explicit cache_control markers; it is not automatic.","mnemonic":"Cache lives five minutes: sparse traffic keeps paying for writes, never banking savings."},{"id":"d1s6q30","concept":"cost-model-timing","type":"single","stem":"Sizing shows the projected monthly cost exceeds the budget ceiling. The prototype works, but no production code has been written yet. What should happen?","options":["Build as designed and optimise after the first billing cycle","Change the architecture now, such as tier, caching or Batch","Raise the budget ceiling to match the projected monthly cost","Ship as designed and rely on budget alerts to cap the spend"],"correct":[1],"explanation":"If the cost projection exceeds the ceiling, the architecture needs to change before a line of code is written, using levers such as model tier, caching or Batch API where the SLA permits. Model costs before committing to an architecture, not after the first billing cycle; otherwise the architecture must be renegotiated after deployment.","mnemonic":"Over the ceiling on paper? Redesign on paper, not after the invoice."},{"id":"d1s6q31","concept":"cost-model-timing","type":"single","stem":"At what point in a project should the cost and latency model be built?","options":["After the first billing cycle, using real production invoices","During the POC, by reading the demo's monthly bill directly","After launch, once p95 latency can be measured under load","Before the architecture is finalised and any code is written"],"correct":[3],"explanation":"The cost and latency model is built before you finalize the architecture, from call volume, token budget per request and model tier, so cost can be checked against the budget ceiling before any code is written. A POC bill at low volume is only a sample, and waiting for production invoices means renegotiating the architecture after deployment.","mnemonic":"Numbers first, architecture second, code third, invoice never a surprise."},{"id":"d1s6q32","concept":"constraints-load-bearing","type":"single","stem":"A design was approved as feasible with constraints, but the constraints were agreed verbally and never written into the design or SOW. What is the most likely outcome?","options":["Nothing changes, since the verdict itself was a positive one","Only the run cost rises, since constraints affect budget alone","It becomes an infeasible system once production violates one","The verdict reverts to feasible as scoped after the launch"],"correct":[2],"explanation":"A feasible-with-constraints verdict that is not documented becomes an infeasible system when the constraints are violated in production. The constraints are part of the design and carry the same weight as the architecture they qualify, so each must be documented with its failure mode and carried into the SOW.","mnemonic":"Unwritten constraints are missing walls: the first production breach brings the design down."}]}]},{"domain":2,"subjects":[{"id":"d2s1","title":"Model selection and gating model changes","learn":["Opus, Sonnet and Haiku trade cost, latency and capability; Sonnet is the default start, with moves up or down made only on eval evidence.","A model swap is a release: it needs a curated test set, a grading function and a delta threshold set before the eval runs.","No eval set means no rollback signal: a regression discovered in production was never detected, because the user saw it first.","Not choosing a model tier is choosing the most expensive one; an eval set makes the tier decision defensible during design, not just at release.","Moving to Opus or Haiku is a deliberate decision with the same gate as any release: an eval set defining 'better' and a rollback criterion set before the swap.","Extended thinking bills thinking tokens as output and adds latency; enable it only for a measured accuracy gap. Adaptive thinking with effort is current; budget_tokens is removed on Sonnet 5 (400 error)."],"traps":["Best-available reflex: defaulting to the most capable model without eval evidence is an unmeasured choice with a recurring cost.","Threshold after the data: setting the delta or rollback threshold after seeing results is writing acceptance criteria after the build.","Unrepresentative test set: a swap eval that does not cover the real distribution of work certifies behavior on inputs production will not send.","Thinking cannot hurt: extended thinking adds billed output tokens and latency on every call, so it needs a measured accuracy gap.","One-line swap: a model change looks like configuration but changes product behavior, so it is a release, not a tweak."],"questions":[{"id":"d2s1q01","concept":"model-start-sonnet","type":"single","stem":"A new document-summarization service is being designed and no eval data exists yet. Which model starting point best matches sound practice?","options":["Begin on Opus because output quality is the hardest property to recover once users arrive.","Begin on whichever tier the partner demo used, then review the choice each quarter.","Begin on Haiku because cost overruns are the hardest problem to recover once volume grows.","Begin on Sonnet; move up or down only when an eval set shows the need."],"correct":[3],"explanation":"Sonnet is the default starting point; Opus is justified only when evals show Sonnet misses the quality bar, and Haiku only when evals confirm the trade-off is acceptable. Starting on Opus is a reflexive choice with no evidence behind it.","mnemonic":"Sonnet first; evals send you up or down."},{"id":"d2s1q02","concept":"model-start-sonnet","type":"single","stem":"A stakeholder argues the team should ship on Opus 'to be safe' since nobody has measured Sonnet. What is the strongest architect response?","options":["Build an eval set first; move to Opus only if Sonnet misses the quality bar.","Agree, but also enable extended thinking so that quality is fully protected.","Agree, because Opus is the most capable tier and downgrading later is easy enough.","Disagree, and pick Haiku so that cost discipline is enforced from the very start."],"correct":[0],"explanation":"Model moves should be measured, not reflexive. Without an eval set the choice cannot be defended, and downgrading later carries change-management cost.","mnemonic":"No eval, no upgrade."},{"id":"d2s1q03","concept":"eval-gate-three-parts","type":"multi","stem":"A team is preparing to gate a model swap like a code deployment. Which THREE elements are the minimum they need? Select THREE.","options":["A curated test set with known-good outputs covering the real work distribution","A grading function, either model-graded against a rubric or programmatic","A published vendor benchmark score for the candidate model","A delta threshold below which the change does not ship, set in advance","A one-week production canary with no predefined pass mark"],"correct":[0,1,3],"explanation":"The minimum gate is a representative test set, a grading function and a pre-set delta threshold. Public benchmarks do not reflect your distribution, and a canary with no pass mark is just observation.","mnemonic":"Set, Grader, Threshold: three legs of the release stool."},{"id":"d2s1q04","concept":"threshold-before-data","type":"single","stem":"When should the delta threshold for a model-swap eval be decided?","options":["After reviewing the first results so it reflects realistic model behavior.","After a pilot with real users, once complaints show what matters most.","Jointly with the vendor once both sets of scores are available.","Before the eval runs, so it is a standard rather than post-hoc acceptance criteria."],"correct":[3],"explanation":"A threshold set after the data is writing acceptance criteria after the build. Setting it first makes it a standard, not a target that moves to fit the numbers.","mnemonic":"Draw the finish line before the race."},{"id":"d2s1q14","concept":"no-eval-no-rollback","type":"single","stem":"A team plans to change the model behind a live assistant without building an eval set, intending to 'watch for complaints' after launch. What is the core risk in this plan?","options":["The only real risk is cost, since output quality is fixed by the system prompt.","There is no rollback signal; any regression is found by users rather than detected.","Complaint volume is a reliable rollback signal as long as it is triaged every day.","The risk is limited to latency, because a model swap is only a configuration change."],"correct":[1],"explanation":"No eval set means no rollback signal: a regression discovered in production is one that was never detected, because by the time the team sees it the user already has. Complaint triage is not a substitute, and a swap changes product behavior, not just cost or latency.","mnemonic":"No eval, no alarm: users find the regression first."},{"id":"d2s1q15","concept":"eval-gate-three-parts","type":"single","stem":"A team gates a model change using a few dozen hand-picked showcase prompts, a rubric-based model grader, and a delta threshold agreed before the run. Which part of this gate is weakest?","options":["The grader, because a rubric-based model grader cannot be used to gate a swap.","The threshold, because it should be tuned once the first results are available.","The test set, because showcase prompts do not cover the real distribution of work.","The process, because a published vendor benchmark should replace the eval."],"correct":[2],"explanation":"The minimum gate needs a curated test set with known-good outputs that covers the real distribution of work the system sees, and hand-picked showcase prompts do not. A model-graded rubric is an accepted grading function, and setting the threshold in advance is correct, not a weakness.","mnemonic":"Test what production sends, not what the showcase shows."},{"id":"d2s1q16","concept":"tier-decision-explicit","type":"multi","stem":"Which TWO statements about an eval set's role in choosing a model tier are accurate? Select TWO.","options":["It is only needed after launch, once real traffic reveals the cost","It makes the tier choice defensible during design, not only at release","A public vendor benchmark can stand in for it when choosing a tier","Without one, a proposal to use the top tier cannot be challenged with evidence","It is only needed when moving down a tier, never when moving up"],"correct":[1,3],"explanation":"Evals are defined before production code is written, so they ground the tier choice during design, and a move up or down a tier is made only when an eval set says so. Without one, a push for the top tier has nothing to be weighed against. Moves in both directions need the same gate, and a vendor benchmark does not reflect your own workload.","mnemonic":"Evals win the design argument, not just the release gate."},{"id":"d2s1q17","concept":"tier-decision-explicit","type":"single","stem":"A team leaves model choice unmanaged: nobody decides which tier each call should use, and developers pick whatever model they like. What is the most likely cost consequence?","options":["Work quietly drifts to a more capable, more expensive tier than tasks need.","The API assigns the cheapest suitable tier to each step automatically at runtime.","Nothing is decided until the first eval runs, so the omission stays neutral.","Each step falls back to Haiku, because no tier was requested explicitly."],"correct":[0],"explanation":"Leaving model choice unmanaged can quietly route work to a more capable, more expensive tier than the task requires, so model defaults and allowlists should be set deliberately. The default start is Sonnet, moving up or down only on eval evidence; the API does not pick tiers for you, and an unmade choice is not neutral.","mnemonic":"Unmanaged model choice drifts upmarket: set the default deliberately."},{"id":"d2s1q18","concept":"swap-is-release","type":"single","stem":"An engineer wants to change the model ID in a configuration file and push it without review, calling it 'a one-line change'. What is the best architect response?","options":["Approve it, since no application code changes and config edits can be reverted.","Approve it if median latency improves during the first day of live traffic.","Treat it as a release gated by an eval, because it changes product behavior.","Approve it now and add the new model to a quarterly review of settings."],"correct":[2],"explanation":"A model swap looks like a one-line configuration change but rewrites how the whole product behaves, so it is treated as a release: a representative test set, a grading function and a threshold set in advance. Watching latency after launch is not a gate, and any regression it misses reaches users first.","mnemonic":"One line of config, a whole new product: gate it."},{"id":"d2s1q10","concept":"thinking-billing","type":"single","stem":"Which statement about extended thinking is accurate?","options":["Thinking tokens are billed at a discounted rate because they are internal.","Thinking is free when only a summary of the reasoning is returned.","Thinking adds latency only; billing covers just the visible answer.","Thinking tokens are billed as output tokens and add latency to the call."],"correct":[3],"explanation":"Thinking tokens bill at the model's output rate for the tokens actually consumed, regardless of how short the returned summary is, and generating them adds latency.","mnemonic":"Think tokens are output tokens: you pay by the thought."},{"id":"d2s1q11","concept":"thinking-budget-tokens","type":"single","stem":"A team sends a manual budget_tokens thinking configuration to Claude Sonnet 5 and gets an HTTP 400. What is the correct remediation?","options":["Raise budget_tokens above the model's minimum threshold.","Move the request to Haiku, which still accepts budget_tokens.","Retry with exponential backoff, since 400s are usually transient.","Switch to adaptive thinking and set the effort parameter instead."],"correct":[3],"explanation":"Manual budget_tokens is deprecated on the 4.6 generation and removed on Sonnet 5, where it errors. Adaptive thinking with effort is the recommended control. A 400 is a request error, not a transient one.","mnemonic":"Sonnet 5: effort in, budget_tokens out."},{"id":"d2s1q12","concept":"thinking-measured-gap","type":"single","stem":"A product lead wants extended thinking on every call 'since it can't hurt'. What is the best architect response?","options":["Approve it, since it only improves accuracy and the added cost is negligible at scale.","Approve it on the classifier only, where added latency matters least to users.","Reject it permanently, since extended thinking is unsuitable for production workloads of any kind.","Run evals without it first; enable it only if a measured accuracy gap remains."],"correct":[3],"explanation":"Thinking is a cost and latency tradeoff paid on every call. The case should come from a measured gap, not an assumption.","mnemonic":"Prove the gap, then pay for the think."},{"id":"d2s1q19","concept":"thinking-measured-gap","type":"single","stem":"An extraction step misses its accuracy target in evals run without extended thinking, and the prompt itself has not yet been revised. What should happen next?","options":["Enable extended thinking on every call so the target is met before launch.","Work on the prompt and re-run the eval; consider thinking only if a gap remains.","Move the step to Opus, since a missed target shows Sonnet lacks the capability.","Lower the accuracy target to the score the current prompt already reaches."],"correct":[1],"explanation":"Run evals without extended thinking first; if accuracy still misses requirements after the prompt itself has been worked on, then consider enabling it. Thinking tokens and latency are paid on every call, so thinking should close a measured gap that prompt work could not, and lowering the target after seeing results moves the goalposts.","mnemonic":"Fix the prompt first; think only for the gap left."}]},{"id":"d2s2","title":"Context window and context strategy","learn":["The context window is the model's only active attention space and resets between calls; continuity is application-managed via state, summaries or memory layers.","Retrieval augments the window; persistent state (orders, balances) needs a tool call. Budget for the largest realistic conversation: the window is a ceiling, not a target.","Measure with the usage field and token counting, not fixed characters-per-token ratios.","Monolithic, progressive, retrieval and compaction each earn a place and break down differently; production systems combine them.","Context strategy and context sizing are separate decisions that interact but do not determine each other; treating them as one is where most designs go wrong.","Compaction is largely one-way and can drop load-bearing detail such as exact identifiers, numbers and prior decisions."],"traps":["Memory illusion: the model has no native memory between calls; anything that persists was stored and passed back in by your application.","Fill the window: designing towards the full window means hitting the working-memory cliff in production.","Silent creep: monolithic accumulation across turns inflates cost and latency with no visible signal until billing.","One strategy fits all: production systems almost always combine strategies, because each handles a different dimension of the context problem.","Lossy summary: compaction that drops a once-mentioned identifier or decision cannot be recovered later."],"questions":[{"id":"d2s2q01","concept":"no-native-memory","type":"single","stem":"A support chatbot must remember a customer's earlier sessions. Which statement correctly describes where that continuity comes from?","options":["The model retains a session history between calls and reloads it automatically.","The context window persists across calls until it is explicitly cleared.","The application stores summaries and passes them back into each new call.","The model retrieves it from weights updated by earlier conversations."],"correct":[2],"explanation":"The model has no native memory between calls. Continuity exists only because the application stored it and supplied it again, which makes it an architectural choice rather than a model capability.","mnemonic":"Models forget; your app remembers."},{"id":"d2s2q02","concept":"state-needs-tool-call","type":"single","stem":"An assistant must report a customer's current order status and account balance. What is the correct design?","options":["Embed the records in the system prompt and refresh it nightly.","Expose a tool call that fetches the live records from the system of record.","Rely on the model's memory of earlier conversations about the account.","Index the records in a vector store and retrieve the closest chunk."],"correct":[1],"explanation":"Persistent application state is owned by your system, and the model has no inherent access to it; it needs a tool call. Retrieval and static prompt content risk stale answers for live values.","mnemonic":"Live state lives in the app: call the tool."},{"id":"d2s2q03","concept":"working-memory-cliff","type":"single","stem":"Why is the context window described as having a 'working-memory cliff'?","options":["Quality declines gently and predictably as the window gradually fills with tokens.","Things work until the limit, then fail abruptly; outside the window nothing exists.","Cost drops sharply once the window passes a certain token count threshold.","The window shrinks automatically as the conversation history keeps on growing."],"correct":[1],"explanation":"Inside the window attention is available; outside it the model has no access at all. The edge is hard, so designs that creep towards the limit fail abruptly in production.","mnemonic":"Inside: seen. Outside: gone. The edge is a cliff."},{"id":"d2s2q04","concept":"budget-ceiling","type":"single","stem":"How should an architect size the token budget for a multi-turn assistant?","options":["Allocate the full window so conversations never need any trimming or summarizing.","Size for the average conversation seen during the pilot phase of the project.","Size for the largest realistic conversation plus retrieval, prompt, scratch and margin.","Size for the system prompt alone, since conversation history is billed separately."],"correct":[2],"explanation":"The window is a ceiling, not a target. Budget for the largest realistic case plus all other context components and margin; designing towards the ceiling means hitting it in production.","mnemonic":"Window is a ceiling, never a target."},{"id":"d2s2q05","concept":"budget-ceiling","type":"single","stem":"A team plans to let conversations grow until the window is nearly full because 'we paid for the space'. What is the main flaw?","options":["Long windows cannot be combined with a system prompt in the same request.","Nearly full windows disable prompt caching altogether for the whole conversation.","Window space is billed per call regardless of how much of it is used.","It hits the cliff in production, and every token is billed on every call."],"correct":[3],"explanation":"The window limit is a hard edge, and you are billed per token on every API call, so fill-level drives cost and risk. Plan margin below the ceiling.","mnemonic":"Aim below the ceiling or crash through it."},{"id":"d2s2q06","concept":"measure-usage","type":"single","stem":"How should a team find out how many tokens a request really consumed?","options":["Read the actual token counts in the API response usage field.","Use a tokenizer from an older model generation as a close approximation.","Divide the character count by a fixed characters-per-token ratio.","Estimate from the word count of the longest prompt in the test set."],"correct":[0],"explanation":"Characters per token varies by model generation, tokenizer and language. Measured counts in the usage field are what the limit and billing apply to.","mnemonic":"Count it, do not guess it: usage field."},{"id":"d2s2q07","concept":"measure-usage","type":"multi","stem":"Which TWO practices correctly handle token measurement in a production sizing exercise? Select TWO.","options":["Treat any fixed characters-per-token ratio as a rough illustration only","Count only the user message, since other content is not billed","Record measured usage and use it for limit and cost planning","Apply the English-text ratio to all languages for consistency","Assume tokenizer behavior is identical across model generations"],"correct":[0,2],"explanation":"System prompt, history, retrieved documents, tool outputs and responses all count as tokens, and ratios vary by model generation, tokenizer and language. Measured counts are authoritative.","mnemonic":"Everything enters as tokens; measure, never assume."},{"id":"d2s2q18","concept":"strategies-combine","type":"multi","stem":"When designing a context system, which TWO pairings of design question and context layer are correct? Select TWO.","options":["'What does the model need at the start?' drives the compaction policy","'What might it need to fetch on demand?' drives the retrieval layer","'What does it need from the latest steps?' drives the monolithic baseline","'What can be compressed without losing decision detail?' drives the compaction policy","'What might it need to fetch on demand?' drives the progressive window"],"correct":[1,3],"explanation":"Each layer answers its own question: start needs drive the monolithic baseline, recent steps drive the progressive window, on-demand needs drive the retrieval layer, and material that can be compressed without losing decision-relevant detail drives the compaction policy. Asking these questions separately is how the layers get combined deliberately.","mnemonic":"Start, recent, fetch, compress: monolithic, progressive, retrieval, compaction."},{"id":"d2s2q19","concept":"strategies-combine","type":"single","stem":"A design review asks a team to name 'the one context strategy' for a new production assistant. What is the strongest architect response?","options":["Layer strategies deliberately, since each handles a different dimension of the problem.","Choose monolithic context, since one stable prompt is simplest to cache and debug.","Choose retrieval, since it scales to any corpus and keeps every call small.","Choose whichever strategy the largest available context window comfortably allows."],"correct":[0],"explanation":"Production systems almost always combine strategies, because each handles a different dimension of the context problem; a well-designed system layers them deliberately rather than picking one. Monolithic context alone grows towards the working-memory cliff, and window size is a sizing decision, not a strategy.","mnemonic":"Layer the strategies; no single one carries production."},{"id":"d2s2q20","concept":"monolithic-creep","type":"single","stem":"A multi-turn tool loop resends its entire growing history on every call. Per-call spend climbs steadily as conversations get longer, with no code change and no errors. What is the most likely cause?","options":["The platform moved the workload to a larger model tier automatically.","Each turn pays a fresh cache write surcharge on the system prompt.","Retrieval returns more chunks as the indexed corpus keeps growing.","Monolithic accumulation is silently inflating the input sent on each call."],"correct":[3],"explanation":"Monolithic context that accumulates across turns grows per-call cost and latency with the conversation, and there is no visible signal until it shows up in billing. Progressive context or compaction limits what is carried forward; nothing in the scenario points to a tier change or retrieval.","mnemonic":"Resend it all, pay for it all, every turn."},{"id":"d2s2q11","concept":"retrieval-earns-place","type":"multi","stem":"For which TWO situations is retrieval (RAG) the strongest context strategy? Select TWO.","options":["Sources that change faster than the prompt is redeployed","Queries that need synthesis across every document at once","A small, fixed policy that every request needs","Knowledge bases too large to fit in context","Tasks whose key detail is split across many chunks"],"correct":[0,3],"explanation":"Retrieval earns its place for large corpora, fast-changing sources, small query slices and citation needs. It breaks down on cross-document synthesis and chunking that splits units, and a small fixed policy fits a stable prefix.","mnemonic":"Too big or too fresh: retrieve."},{"id":"d2s2q12","concept":"compaction-lossy","type":"single","stem":"A long-running agent compacts its transcript, and later a decision depends on an exact order number mentioned once early on. What is the most likely issue?","options":["The context window has silently reset between the two model calls.","The summary dropped the load-bearing identifier; compaction is largely one-way.","Retrieval scored the identifier chunk too low and missed the top-k.","Extended thinking truncated the earlier turns in the stored transcript."],"correct":[1],"explanation":"Summaries can drop exact identifiers, numeric values, prior decisions and edge cases mentioned once. Because compaction is largely one-way, the original detail is not recoverable from the summary.","mnemonic":"Summaries shed detail; the shed detail stays shed."},{"id":"d2s2q13","concept":"compaction-lossy","type":"single","stem":"Which risk is specific to compaction as a context strategy?","options":["Chunking splits tables and code blocks across several retrieved results.","Cost and latency scale with every turn of the full transcript.","Prompt caching becomes harder when carried context mutates every turn.","The summarizer is a model call, and its fidelity is hard to measure."],"correct":[3],"explanation":"The summarizer adds latency, cost and failure modes, and measuring summary fidelity against the original transcript is an unsolved evaluation problem. The other options describe retrieval, monolithic and progressive risks.","mnemonic":"Summarizer is a model too: fidelity unmeasured."},{"id":"d2s2q14","concept":"strategy-vs-sizing","type":"multi","stem":"A design review conflates context strategy with context sizing. Which TWO statements correctly separate them? Select TWO.","options":["Choosing retrieval as the strategy fixes how large the token budget should be","Sizing sets how much window to use; strategy sets how context arrives","Large windows make the strategy choice unnecessary for most production workloads","The two decisions interact but do not determine each other","A progressive strategy guarantees the window will not fill during long sessions"],"correct":[1,3],"explanation":"Strategy and sizing are separate decisions that interact; treating them as one is where most context designs go wrong. A big window does not remove the need for strategy.","mnemonic":"How context arrives is not how much fits."},{"id":"d2s2q15","concept":"progressive-breakdown","type":"single","stem":"A support agent uses a progressive context strategy that carries forward only a rolling summary of recent turns. Engineers investigating a bad answer at turn 14 cannot rebuild what the model actually received. Which known weakness of progressive context is this?","options":["Cost and latency scale linearly with total input length on every single turn","The correct source document never enters the top-k retrieved results for the query","The exact input at a given step is no longer reconstructable, which complicates debugging","The output contract stops validating because the summary drops all formatting rules"],"correct":[2],"explanation":"In progressive context the carried-forward material changes every turn, so the exact input the model saw at step N cannot be rebuilt, which makes debugging harder. Linear growth in cost and latency is the monolithic failure, and top-k misses belong to retrieval.","mnemonic":"Progressive moves on; step N's input is gone."},{"id":"d2s2q16","concept":"progressive-breakdown","type":"multi","stem":"Which TWO tasks are poor fits for a purely progressive context strategy? Select TWO.","options":["An agent loop where each step depends mainly on the most recent state","A review whose verdict needs long-range coherence across the full history","A workflow decomposed into stages with narrow, well-defined handoffs","A decision that hinges on a detail dropped several turns earlier","Multi-turn iterative refinement of a single draft document"],"correct":[1,3],"explanation":"Progressive context fails when a task needs long-range coherence across the whole history, or when a decision depends on detail dropped in an earlier turn. Agent loops driven by recent state, staged workflows and iterative refinement are where progressive context earns its place.","mnemonic":"Progressive forgets the far past: long-range or dropped detail breaks it."},{"id":"d2s2q17","concept":"monolithic-attention-degrade","type":"single","stem":"A team loads a 150-page contract set into one prompt. Token counts show it fits well inside the context window, so they mark the working-memory risk as closed. What does this overlook?","options":["The window limit applies only to output tokens, so inputs are never truncated","Attention quality can degrade on very long contexts well before the hard limit","Monolithic prompts cannot use prompt caching, so the prefix is rewritten each call","Contracts must be chunked into a retrieval index before the model can read them"],"correct":[1],"explanation":"Fitting under the hard limit does not guarantee quality, because attention can degrade on very long contexts before the limit is reached. Monolithic prompts with a stable prefix actually benefit from caching, so that distractor reverses the guidance.","mnemonic":"Fits in the window is not focused in the window."}]},{"id":"d2s3","title":"System prompts, templates and technique selection","learn":["An enterprise system prompt states role and scope, constraints (must and must not), and an output contract naming the response shape.","A template is fixed scaffolding plus parameterized slots, so filling a slot cannot remove a constraint and the safe path is the default.","Description competency: name the scope, the format and the constraints; underspecification makes the model improvise differently each time.","An underspecified guardrail is worse than none because it creates the appearance of a control without the substance.","Technique progression is zero-shot, then few-shot, then chain-of-thought; each step adds tokens and latency, so use the lightest that works.","Prompts do not transfer unchanged across models, so a model swap needs an eval; leading phrasing, unbalanced and stale few-shot examples bias outputs."],"traps":["Hope as spec: if a requirement is hoped for rather than stated, the model fills the gap differently on each request.","Decorative guardrail: a vague constraint the model can route around looks like a control but is not one.","Heavy by habit: chain-of-thought on a task that does not need it is a recurring token and latency tax.","Prompt portability: a prompt tuned for one model is only a starting point for another; the prompt-model pairing is what ships.","Invisible bias: leading phrasing and one-sided examples bias outputs in aggregate, and stale few-shot examples quietly steer wrongly."],"questions":[{"id":"d2s3q01","concept":"system-prompt-structure","type":"single","stem":"Which structure best describes a system prompt designed for enterprise reuse?","options":["A short persona line, with details left to the model's judgment","A long list of examples with no explicit rules","A role and scope statement, constraints, and an output contract","A copy of the user manual, with formatting left optional"],"correct":[2],"explanation":"A reusable system prompt states role and scope, the constraints the model must hold, and an output contract naming the response shape. At scale, ambiguity is a defect multiplied across every request.","mnemonic":"Role, rules, result shape."},{"id":"d2s3q02","concept":"template-safe-default","type":"single","stem":"What is the main design goal of a prompt template with fixed scaffolding and parameterized slots?","options":["Filling a slot cannot remove a constraint, so the safe path is default.","Every slot can be rewritten by users so that teams keep complete flexibility.","Fixed scaffolding lowers token count enough that caching can be skipped entirely.","Slots let each team replace the output contract to suit local needs."],"correct":[0],"explanation":"The scaffolding carries the consistency and safety guarantees, so users supply variable content and inherit the guardrails without re-authoring them. Templates also concentrate complexity where it can be governed.","mnemonic":"Fixed frame, free slots, safe by default."},{"id":"d2s3q03","concept":"description-competency","type":"multi","stem":"Applying the Description competency to prompt design, which THREE things should a production prompt name? Select THREE.","options":["The scope: what is in and out of bounds","The exact output format or contract","The expected temperature value","The constraints that must never be violated","The name of the model that wrote the prompt"],"correct":[0,1,3],"explanation":"Description covers scope, format and constraints. That is what separates a prompt that holds in production from one that works in a demo.","mnemonic":"Scope, Format, Constraints: describe before you deploy."},{"id":"d2s3q04","concept":"underspecification-improvises","type":"single","stem":"A reused prompt says 'summarize the ticket' and the summaries vary in length and structure from call to call. What is the underlying failure?","options":["The model has insufficient capability for the task and needs a larger tier.","The prompt is underspecified, so the model fills gaps with different assumptions each time.","The context window is too small to hold the whole ticket text reliably.","Few-shot examples are missing, which always causes variation in output length."],"correct":[1],"explanation":"Where the prompt is silent the model improvises, and improvisation is the non-determinism you do not want in a reused asset. The fix is to state the format, scope and constraints explicitly.","mnemonic":"Silence in the prompt becomes guessing in the output."},{"id":"d2s3q05","concept":"underspecification-improvises","type":"single","stem":"A reviewer asks, for each requirement the output must meet, whether the prompt states it or merely hopes f
