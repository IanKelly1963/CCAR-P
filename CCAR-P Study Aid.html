ntrols and map it as a named control."],"traps":["Vendor owns fairness: provider bias evaluations cannot see your own corpus, prompt framing, few-shot examples or routing.","Healthy aggregate: the overall metric can look fine while harm concentrates in a subgroup.","One log for all: users, regulators and builders need different slices of the same record.","Log versus privacy: transparency and compliance are not in conflict; the same log is governed with minimization and access controls.","No reconstruction: if you cannot replay a decision, you cannot reliably explain it or rule out where a skew entered."],"questions":[{"id":"d5s4q01","concept":"fairness-architectural","type":"single","stem":"What does it mean to say fairness is an architectural property rather than only a model property?","options":["Unequal outcomes enter at identifiable points you control, so each can be inspected and instrumented","The model provider's bias evaluations transfer fully to any system built around the model","Fairness can be set by a single system prompt line that instructs Claude to treat all users equally","Fairness is checked once at launch against an aggregate metric and then assumed to hold afterwards"],"correct":[0],"explanation":"Fairness enters at specific points in your system, such as corpus, framing, examples and routing, which is what makes it designable. A provider's evaluations cannot see your corpus.","mnemonic":"Skew has addresses: find the entry points."},{"id":"d5s4q02","concept":"four-entry-points","type":"multi","stem":"Which TWO are among the four common entry points where unequal outcomes enter a Claude system? Select TWO.","options":["A retrieval corpus that over-represents some groups of cases","Downstream routing that sends some groups down different paths","The stop_reason handler that resets context after a refusal","The token-budget limit applied to oversized inputs","The constitution's priority order for conflicting goals"],"correct":[0,1],"explanation":"The four entry points are the retrieval corpus, prompt framing, few-shot examples and downstream routing. The refusal handler, token budget and priority order are not listed as fairness entry points.","mnemonic":"Corpus, framing, few-shot, routing: four doors for skew."},{"id":"d5s4q03","concept":"audience-slices","type":"single","stem":"Which audience needs a durable, queryable record of inputs, outputs and decision path to show comparable cases are treated consistently?","options":["A regulator, who needs evidence of consistent treatment and the ability to reconstruct a decision on demand","An affected user, who needs the complete trace including every internal routing step","The build team, who need a digest in terms an affected user can act on without technical detail","The reviewer on the queue, who needs the full log of every historical decision in the system"],"correct":[0],"explanation":"The regulator needs queryable evidence of consistency and reconstruction. The affected user needs an actionable explanation, and the build team needs the full trace.","mnemonic":"User: why. Regulator: prove it. Builder: full trace."},{"id":"d5s4q04","concept":"decision-log-contents","type":"single","stem":"To replay and explain a single automated decision, what should the decision log capture?","options":["The final response text and the timestamp, since these are what the user saw and can dispute","The inputs that drove it, the retrieved context, the model output, and the routing it went through","The system prompt and model name only, since the rest can be regenerated by rerunning the request","The aggregate fairness metric and the outcome rate, since individual decisions need not be replayed"],"correct":[1],"explanation":"Replay needs inputs, retrieved context, output and routing. Outputs alone cannot be reconstructed, and aggregate metrics cannot explain one decision.","mnemonic":"Inputs, context, output, routing: replay needs all four."},{"id":"d5s4q05","concept":"aggregate-hides-subgroup","type":"single","stem":"The overall outcome metric looks healthy after launch. What risk does the guidance warn about?","options":["A healthy aggregate proves every subgroup is treated comparably, so no further checks are needed in every group","Aggregate metrics are inflated by logging, so they overstate fairness for every subgroup measured","Harm can be concentrated in one subgroup while the aggregate looks fine, especially at an unmeasured injection point","Healthy aggregates cause regulators to request more logs, which raises the cost of the system"],"correct":[2],"explanation":"The outcome metric can look fine overall while harm concentrates in a subgroup, and an unmeasured entry point can hide unfairness until someone outside the team finds it.","mnemonic":"Fine on average can still hurt one group."},{"id":"d5s4q17","concept":"four-entry-points","type":"multi","stem":"A team rebalanced its retrieval corpus, yet outcomes still lean toward one group. Which TWO remaining entry points could still carry the skew? Select TWO.","options":["The fail-closed setting chosen for the operator-built input classifier","The framing of the prompt, which can encode a skewed assumption","The toxicity threshold configured on the output-screening judge model","The few-shot examples, which can repeat the corpus's original skew","The context reset performed after a stop_reason refusal response"],"correct":[1,3],"explanation":"The four entry points are the retrieval corpus, prompt framing, few-shot examples and downstream routing, so rebalancing the corpus still leaves framing, examples and routing to inspect. Screening thresholds, fail direction and refusal handling govern safety controls, not where unequal outcomes enter.","mnemonic":"Fixed the corpus? Framing and few-shot can still tilt the scale."},{"id":"d5s4q07","concept":"log-compliance-scope","type":"single","stem":"Logged inputs and retrieved context contain sensitive personal data in HIPAA or GDPR contexts. How should the decision log be treated?","options":["As a named control in the compliance register, with minimization, retention limits and access controls applied","As exempt from compliance, since logs are operational telemetry rather than regulated records","As a store to be deleted immediately after each request, since logging conflicts with compliance","As freely shareable with the build team, since the team needs the full trace for debugging"],"correct":[0],"explanation":"The log is itself in scope: map it as a named control and govern minimization, retention and access. Logging for transparency and governing it for compliance use the same log.","mnemonic":"The audit log is itself audited."},{"id":"d5s4q08","concept":"discernment","type":"single","stem":"Which AI Fluency competency is about judging whether a model output is acceptable, needs revision or needs override, including spotting unequal treatment?","options":["Diligence, which maintains explicit human accountability checkpoints in deployed workflows","Discernment, which evaluates AI outputs and behaviours rather than accepting them","Delegation, which decides which tasks to hand to the model and which tasks to keep","Description, which communicates the task and constraints to the model in precise terms"],"correct":[1],"explanation":"Discernment is evaluating outputs, and a transparency record is what makes recognizing a skewed outcome possible. Diligence is the competency behind human review checkpoints.","mnemonic":"Discernment discerns the output; Diligence guards the gate."},{"id":"d5s4q18","concept":"cant-reconstruct","type":"single","stem":"A team wants to give affected users explanations for automated decisions, but it stores only each final response. What is the gap?","options":["Without inputs, retrieved context and routing, it cannot reconstruct a decision or reliably explain it","None, because the stored response already states the reason for each decision it made","Aggregate outcome metrics would cover it, since explanations rely on overall approval rates","The vendor's bias evaluations can supply the explanation, since they cover every decision"],"correct":[0],"explanation":"To replay and explain a single decision you need the inputs that drove it, the retrieved context, the model output and the routing it went through; if you cannot reconstruct a decision you cannot reliably explain it. Aggregate metrics and vendor evaluations cannot account for one specific decision.","mnemonic":"Output alone is a verdict without evidence: log inputs, context and routing too."},{"id":"d5s4q10","concept":"audience-slices","type":"single","stem":"Which slice of the record does the build team need to find why a flagged decision went wrong?","options":["A plain-language summary of the main inputs and the reason in terms an affected user can act on","A queryable aggregate showing that comparable cases were decided consistently across groups","A signed attestation from the model provider confirming its fairness evaluation results","The full trace: prompt, retrieved context, model output and every routing step, tied to existing observability"],"correct":[3],"explanation":"Each audience needs a different slice of the same record; the build team needs the full trace. The summary suits the affected user and the aggregate suits the regulator.","mnemonic":"Builders need the whole trace."},{"id":"d5s4q19","concept":"fairness-architectural","type":"single","stem":"Input and output screening pass every response a system produces. Why does that not show the system treats people fairly?","options":["Screening is disabled for fairness-related topics, so those outputs are never checked at all","Screening runs only on tool calls, so text responses are never compared across user groups","An output can pass every check yet produce different outcomes for different people, looking normal","Passing screens does prove comparable treatment, provided the aggregate outcome metric is healthy"],"correct":[2],"explanation":"Runtime controls stop disallowed outputs from leaving the system, but they do not account for an output that passes every check yet produces different outcomes for different people. Because that failure looks like a normal output, it is harder to detect and attribute. A healthy aggregate can also hide harm concentrated in one subgroup.","mnemonic":"Clean screens, unequal outcomes: fairness failures look like normal output."},{"id":"d5s4q12","concept":"log-compliance-scope","type":"single","stem":"Which statement about logging for transparency and data minimization for compliance is correct?","options":["They conflict, so the team must choose between full decision logs and compliance with privacy rules","They are not in conflict: they require the same log, governed with minimization, retention limits and access controls","They are resolved by logging only outputs, because inputs are never regulated personal data for the build team","They are resolved by keeping logs indefinitely, since retention limits would defeat the purpose of the log"],"correct":[1],"explanation":"The notes say logging everything for transparency and pinning data for compliance use the same log, governed differently. Indefinite retention violates retention limits.","mnemonic":"One log, governed tightly, serves both."},{"id":"d5s4q20","concept":"audience-slices","type":"single","stem":"A person affected by an automated decision asks why it went against them. What must the system have captured to answer well?","options":["The full raw routing trace for every step, delivered unedited to the person who asked","An aggregate query showing that comparable cases were decided consistently over the past year","The model provider's bias evaluation results, showing the model passed its fairness testing","The decision's driving inputs and its reason, in terms the person can act on"],"correct":[3],"explanation":"An affected user needs a clear explanation of why the decision was made, in terms they can act on, which requires capturing the inputs that drove it and the reason in a digestible form. The full trace is the build team's slice, and the consistency query is what a regulator needs.","mnemonic":"User asks why: give the inputs and the reason they can act on."},{"id":"d5s4q21","concept":"discernment","type":"multi","stem":"Which TWO statements about Discernment applied to fairness are correct? Select TWO.","options":["It means approving any output that has already passed input and output screening checks","It replaces decision logging, since a discerning reviewer can judge outputs without records","A transparency record is what makes recognising a skewed outcome possible in the first place","It is the competency for maintaining explicit human accountability checkpoints in workflows","It means recognising a skewed or unjustified outcome, not only confirming a value was produced"],"correct":[2,4],"explanation":"Discernment is the AI Fluency competency of evaluating outputs; applied to fairness it lets a reviewer recognise a skewed or unjustified outcome instead of only confirming a value was produced, and a transparency record makes that possible. Maintaining accountability checkpoints is Diligence, and discernment depends on the record rather than replacing it.","mnemonic":"Discernment spots the skew, but only if the record shows it."},{"id":"d5s4q15","concept":"decision-log-vs-observability","type":"single","stem":"A team already runs production observability that tells them whether the system is healthy. They now need decision logging for fairness and explainability. What changes?","options":["Nothing changes, since health dashboards already explain individual decisions to regulators","A separate instrumentation stack is needed, because fairness signals cannot share traces","Only aggregate metrics are kept longer, since individual decisions cannot be reconstructed","Same instrumentation, but different retention and query path, to explain why one decision happened"],"correct":[3],"explanation":"Decision logging applies the same instrumentation to a different question: why a specific decision happened rather than whether the system is healthy. The retention and query path differ. A separate stack is unnecessary, and aggregates alone cannot reconstruct a single decision.","mnemonic":"Same wires, new question: health asks 'is it OK?', decisions ask 'why this?'"},{"id":"d5s4q16","concept":"decision-log-vs-observability","type":"multi","stem":"Which TWO statements about the cost and complexity of decision-level logging are correct? Select TWO.","options":["Its cost stays fixed once the log schema is defined, regardless of request volume","Storage and query cost grows with traffic rather than staying fixed","One audit-log slice serves users, regulators and the build team without changes","Retention can stay at platform defaults, since decision logs are out of compliance scope","The retention policy must itself be governed, since decision data is held longer for a purpose"],"correct":[1,4],"explanation":"Capturing decision-level logs on every request adds storage and a query path whose cost grows with traffic. Because decision data is held longer for a specific purpose, its retention policy must be governed. Each audience needs a different slice of the record, and the log is in scope for the compliance register.","mnemonic":"Decision logs scale with traffic and need their own retention rules."},{"id":"d5s4q22","concept":"vendor-owns-fairness","type":"single","stem":"A team building a case-triage assistant cites the model provider's published bias evaluations as its evidence that the deployment is fair. What does this leave unmonitored?","options":["The model's training data alone, which the team should request from the provider for review","The output screening layer alone, since filtering responses is where unequal outcomes get removed","Its own corpus, prompt framing, few-shot examples and routing, which the provider never tested or saw","The decision log's retention period alone, since that is all a fairness audit inspects"],"correct":[2],"explanation":"Unequal outcomes arise at points the architect controls: the corpus, prompt framing, examples and routing. The provider's bias evaluations never see these, so treating fairness as the vendor's responsibility leaves them unmonitored; instrument and log decisions at those points instead. Training data, output screening and log retention are not where the team's own skew enters.","mnemonic":"Vendor evals never see your corpus, framing, examples or routing; those fairness points are yours."}]},{"id":"d5s5","title":"Human-in-the-loop routing by stakes","learn":["Human review is a budget; stakes come from reversibility and the cost of a wrong decision, while confidence is a third variable useful only if calibrated.","Routing rule: low confidence and irreversible or high cost goes to a human; confident, reversible, low-cost decisions run; when variables conflict weight cost and reversibility.","Placement tradeoffs: pre-action approval is safe but slow, post-action audit suits reversible work, sampled review monitors quality without guarding each outcome.","Reviewers must see inputs, output and the reason for the flag; consent fatigue motivates plan-level review rather than per-step approval.","Diligence is the competency behind human review; gate before irreversible agent actions and sample lower-stakes ones."],"traps":["Volume routing: sending everything to review overwhelms reviewers until they click through without reading.","Half a fix: volume and missing context fail independently, so route by stakes and also show the inputs and flag reason; either fix alone still leaves review failing.","Trusting confidence: a model can be confidently wrong, so confidence helps only if calibrated.","Wrong placement: post-action audit or sampling on an irreversible action lets harm take effect before it is caught.","Per-step approval: sign-off on every action adds friction without safety gain and causes consent fatigue."],"questions":[{"id":"d5s5q01","concept":"stakes-definition","type":"single","stem":"Which two variables set the stakes of a decision when deciding whether a person should review it?","options":["Reversibility and the cost of a wrong decision; hard to undo and expensive when wrong means high stakes","Confidence and request volume; a low confidence score on a large queue alone makes any decision high stakes","Model size and token cost; larger models make higher-cost decisions that always need human review","Latency and reviewer availability; stakes rise whenever a reviewer is free to examine the decision"],"correct":[0],"explanation":"Reversibility and the cost of a wrong decision set the stakes. Confidence sits on top and estimates how likely the output is wrong; it does not change the stakes.","mnemonic":"Stakes = undo-ability plus price of error."},{"id":"d5s5q02","concept":"confidence-calibrated","type":"single","stem":"When is a confidence score a reliable input to a routing rule?","options":["Always, because the score is produced by the model about its own output and so reflects its accuracy","Only to the degree it is calibrated, because a model can be confidently wrong","Whenever it exceeds a fixed threshold, because high scores guarantee a decision is correct","Only when the decision is irreversible, because reversible decisions make confidence irrelevant"],"correct":[1],"explanation":"Confidence is useful only if calibrated; confirming calibration is a task of its own. A high score can still be confidently wrong.","mnemonic":"Uncalibrated confidence is just confident noise."},{"id":"d5s5q03","concept":"routing-rule","type":"single","stem":"Which decisions does the routing rule send to a person?","options":["All decisions above a volume threshold, since the busiest paths carry the greatest aggregate risk","All low-confidence decisions regardless of cost, since confidence alone sets the stakes of any decision","Low-confidence decisions that are irreversible or high cost; confident, reversible, low-cost ones run without a human","All decisions that touch personal data, since privacy risk replaces reversibility and cost in the rule"],"correct":[2],"explanation":"The rule combines confidence with reversibility and cost: low confidence plus irreversible or high-cost goes to a person. Routing by volume or confidence alone ignores stakes.","mnemonic":"Unsure and unrecoverable? Send it to a human."},{"id":"d5s5q04","concept":"conflict-weighting","type":"single","stem":"A decision is high cost but easily reversed, while confidence is low. Which variables should weigh more when they conflict?","options":["Confidence, because the score is the only variable the system itself measures about its output","Volume, because the review budget is fixed and busier paths should be reviewed first","Reviewer preference, because the reviewer decides which decisions deserve extra attention","Cost and reversibility, since they set the consequences of a mistake; confidence sets unreviewed volume"],"correct":[3],"explanation":"When variables conflict, give greater weight to cost and reversibility. Confidence then decides how much of the high-stakes volume can safely pass unreviewed.","mnemonic":"Consequences trump confidence."},{"id":"d5s5q05","concept":"post-action-audit","type":"single","stem":"Which placement suits reversible, lower-cost decisions where throughput must stay high?","options":["Post-action audit: the action runs immediately and a person reviews it afterward","Pre-action approval: nothing takes effect until a person approves each routed decision","Sampled review as the only guard: a fraction is checked, so every individual outcome is protected","Pre-action approval for all traffic: since it scales to high volume when staffed with enough reviewers"],"correct":[0],"explanation":"Post-action audit keeps throughput high but the action has already taken effect when caught, so it only suits reversible, lower-cost decisions.","mnemonic":"Act first, audit later only when you can undo."},{"id":"d5s5q06","concept":"pre-action-cost","type":"single","stem":"What is the main cost of pre-action approval?","options":["It lets a wrong action take effect before it is caught, so it suits only reversible decisions","It adds latency to every routed decision and needs an available person, so it does not scale to high volume","It samples a fraction of decisions, so a bad decision can slip through unreviewed","It removes the reviewer's access to inputs, so approval becomes a blind click on the output"],"correct":[1],"explanation":"Pre-action approval is safest but slow and needs reviewer availability. The other options describe post-action audit, sampled review and a context failure.","mnemonic":"Safest placement, slowest queue."},{"id":"d5s5q07","concept":"sampled-review","type":"single","stem":"What is sampled review best described as?","options":["A way to guard each irreversible action, since sampling guarantees no bad decision passes","A replacement for pre-action approval on high-stakes actions, since it is cheaper to run on any single decision","A way to monitor system quality, not to guard individual outcomes, since unsampled bad decisions can slip through","A way to review every decision after the fact, since the sample covers the full queue"],"correct":[2],"explanation":"Sampled review monitors the system without slowing the process, but a bad decision can slip through unsampled. It does not guard individual outcomes.","mnemonic":"Sampling watches the system, not each decision."},{"id":"d5s5q08","concept":"reviewer-context","type":"multi","stem":"What must a reviewer see for the review to be accurate? Select THREE.","options":["The inputs that drove the decision being reviewed","The model's output on that decision","The reason the item was flagged for review","The reviewer's own approval rate from the previous week","The token count consumed by the request"],"correct":[0,1,2],"explanation":"Without inputs the reviewer cannot tell whether the output is correct, and without the flag reason cannot tell an edge case from routine traffic. Approval rate and token count do not inform the judgement.","mnemonic":"Inputs, output, flag reason: the reviewer's three."},{"id":"d5s5q09","concept":"consent-fatigue","type":"single","stem":"What problem does plan-level review address, as used in Claude Code, where a person approves the plan rather than each step?","options":["Latency in the model, where each step approval adds a call that doubles the cost of the turn","Calibration of confidence, where scores drift away from actual accuracy over a long session","Credential exposure, where each approval prompt reveals secrets to the reviewing person","Consent fatigue, where dozens of approvals in a row lead reviewers to click through without reading"],"correct":[3],"explanation":"Requiring sign-off on every action adds friction without meaningful safety gain, so review moves to higher-value checkpoints such as plan review or exception handling.","mnemonic":"Approve the plan, not every step."},{"id":"d5s5q21","concept":"volume-routing-risk","type":"single","stem":"To save reviewer time, a team sends only its highest-volume workflow to human review, while a low-volume workflow that closes customer accounts irreversibly runs with no gate. Which risk does this show?","options":["Consent fatigue from plan-level review, since reviewers approve whole plans without reading","Miscalibrated confidence, since the low-volume workflow produces scores the team cannot trust","Over-reliance on post-action audit, which suits the account closures because they are rare","Routing by volume rather than stakes, which leaves a high-stakes, irreversible action with no gate"],"correct":[3],"explanation":"Routing by volume rather than stakes fails two ways: it overwhelms reviewers, or it lets a high-stakes, irreversible action through with no gate at all. Stakes come from reversibility and cost, so irreversible closures need a gate however rare they are. Post-action audit only suits reversible, lower-cost decisions.","mnemonic":"Rare but irreversible still needs a gate: route by stakes, not by volume."},{"id":"d5s5q11","concept":"gate-before-irreversible","type":"single","stem":"How should an agent workflow place human checkpoints across actions of different risk?","options":["Gate every action equally, since uniform gating is the easiest control to defend to an auditor for every action","Gate before any irreversible or high-stakes action and sample the lower-stakes actions instead of gating each one","Sample the irreversible actions and gate the low-stakes ones, since errors in low stakes are costly","Remove gates entirely once confidence is high, since confident agents rarely take wrong actions"],"correct":[1],"explanation":"A gate pauses execution for review based on the task's risk and reversibility; lower-stakes actions are sampled. Uniform gating recreates the volume problem.","mnemonic":"Gate the irreversible; sample the rest."},{"id":"d5s5q12","concept":"volume-routing-risk","type":"single","stem":"A team routes every model output to review as the conservative default. Why does this approach undermine oversight?","options":["It lets irreversible actions run unreviewed, since routing everything bypasses the gate on high-stakes items","It produces miscalibrated confidence scores, since the score is retrained on every reviewer approval","Oversight that covers everything reviews nothing, because reviewers disengage to keep up with the volume","It reduces reviewer cost, since a larger queue means fewer separate review sessions are needed"],"correct":[2],"explanation":"Routing everything feels safe because it avoids drawing the line, but volume above what a person can read collapses review into approval. Routing should be by stakes.","mnemonic":"Review everything and you review nothing."},{"id":"d5s5q13","concept":"confidence-calibrated","type":"single","stem":"A model reports 97 percent confidence on a refund decision, but earlier checks show its high-confidence answers are often wrong. What is the correct design response?","options":["Let all high-confidence decisions through, since the score is the model's own estimate of correctness","Route every decision to a human, since any confidence score is meaningless in a routing rule","Raise the confidence threshold to 99 percent, since a stricter cutoff repairs an uncalibrated signal","Do not trust the score alone: confirm calibration and weigh cost and reversibility when routing"],"correct":[3],"explanation":"Confidence is only as useful as it is calibrated, and a model can be confidently wrong. A stricter threshold on an uncalibrated score does not fix it.","mnemonic":"Confidently wrong is still wrong."},{"id":"d5s5q14","concept":"reviewer-context","type":"single","stem":"A reviewer approves flagged items quickly because they cannot tell edge cases from routine traffic. Which change best addresses the specific cause?","options":["Show the reason the item was flagged alongside the inputs and the output","Add a second reviewer to each item so that errors are caught by the other person","Hide the model's output so that the reviewer judges the inputs independently","Shorten the queue by sampling, with no change to the reviewer's view of each item"],"correct":[0],"explanation":"Without the flag reason a reviewer cannot distinguish an edge case from routine traffic; showing it plus the inputs fixes the context failure. Sampling fixes volume only.","mnemonic":"Show why it was flagged."},{"id":"d5s5q15","concept":"routing-rule","type":"single","stem":"A confident, easily reversed, low-cost classification decision arrives. What should the routing rule do?","options":["Let it through without a human, since confident, reversible, low-cost decisions can usually run unreviewed","Send it to pre-action approval, since every automated decision needs a person before it takes effect","Send it to a human because of the model's own limitations, regardless of how the decision scores","Hold it until a sampled review confirms it, since sampling is required before release"],"correct":[0],"explanation":"Confident, reversible, low-cost decisions can usually run without a human. Reviewer attention is a budget to spend on high-stakes items.","mnemonic":"Confident, reversible, cheap: let it run."},{"id":"d5s5q16","concept":"diligence","type":"single","stem":"Which AI Fluency competency is about maintaining explicit human accountability checkpoints and auditing workflows for gaps where AI acts without review?","options":["Discernment, which evaluates whether outputs are acceptable, need revision or need override","Diligence, which keeps explicit human accountability checkpoints as automation scales up","Delegation, which decides which tasks should be given to the model in the first place","Description, which sets out the task and constraints so the model understands the goal"],"correct":[1],"explanation":"Diligence is the competency behind human review: checkpoints, spotting oversight erosion under automation pressure, and auditing for review gaps. Discernment judges outputs.","mnemonic":"Diligence keeps humans accountable as automation grows."},{"concept":"placement-tradeoffs","type":"multi","stem":"Which TWO statements about where the human sits in the flow are correct? Select TWO.","options":["Pre-action approval means nothing irreversible happens unreviewed, at the cost of latency","Sampled review monitors quality rather than guarding individual outcomes","Post-action audit is the right placement for irreversible, high-cost decisions","Pre-action approval scales well to high volume because reviewers work in parallel","Sampled review guarantees that no bad decision passes through unreviewed"],"correct":[0,1],"explanation":"Pre-action approval is safest but adds latency and needs available people; sampled review monitors the system. Post-action audit only suits reversible, lower-cost decisions.","mnemonic":"Approve before, audit after, sample to monitor.","id":"d5s5q17"},{"id":"d5s5q18","concept":"log-vs-routing-rule","type":"single","stem":"A team says its decision log already makes high-stakes automated decisions safe, because every one can be explained afterwards. What is missing?","options":["A longer retention period so explanations stay available to regulators","A routing rule that stops wrong decisions before they take effect","A sampled review of logged decisions, which guards each individual outcome","Re-instrumentation of the system, since logs cannot feed a reviewer view"],"correct":[1],"explanation":"A log explains decisions after the fact, but it does not decide which decisions a person should weigh in on before they take effect. A routing rule does that. Sampled review monitors the system rather than guarding individual outcomes, and the existing log can feed the reviewer view without re-instrumenting.","mnemonic":"The log explains the crash; the routing rule stops the car first."},{"id":"d5s5q19","concept":"log-vs-routing-rule","type":"single","stem":"When designing the reviewer's view for routed decisions, how should the architect relate it to the decision log already in place?","options":["Replace the log, since reviewer screens need their own separate instrumentation","Ignore the log, since reviewers should judge only the model's final output","Treat the log as raw material and decide what to surface from it and when","Rely on the log alone, since any logged decision can be explained afterwards"],"correct":[2],"explanation":"The decision log is the raw material for the reviewer view, so the work is deciding what to surface and when, not instrumenting again from the start. Showing only the output fails reviewers, who also need the inputs and the flag reason.","mnemonic":"Don't rewire: mine the log you already have for the reviewer's screen."},{"id":"d5s5q20","concept":"autonomy-checkpoints","type":"multi","stem":"Anthropic's research on agent autonomy (verify the current framing at publish time) found that sign-off on every action adds friction without meaningful safety gain. Which TWO practices does it favour instead? Select TWO.","options":["Keep approval on every step, but give reviewers faster approve buttons","Have a person monitor what is happening and step in when needed","Remove the human role entirely once per-step sign-off has been dropped","Move review to higher-value checkpoints such as plan or exception review","Replace every pre-action gate, including irreversible ones, with sampled audit"],"correct":[1,3],"explanation":"The research favours a person monitoring what happens and stepping in when needed, with per-step approvals reduced and review moved to higher-value checkpoints such as plan review or exception handling. That does not remove the human, and the exact design still depends on the workflow's risk.","mnemonic":"Watch and step in; review the plan and the exceptions, not every click."}]},{"id":"d5s6","title":"Compliance obligations as controls with evidence","learn":["Choosing a route that survives HIPAA, GDPR or FedRAMP is a pre-filter, not proof; a regulation states an outcome and you supply the control.","Every obligation needs three things: a technical control, a named owner and an evidence artifact (the most-missed element); a control with neither owner nor evidence eventually stops operating and fails at audit.","Mappings: HIPAA to BAA, admin setting and eligible features (security lead); FedRAMP to authorized route and record (platform owner); residency to regional config and data-flow record (data owner); transparency to decision log and sample reconstruction (architect).","Training use and retention are different claims; data excluded from training may still be retained or monitored.","Reviewers accept proof a control is live, not design documents; revalidate on a cadence because configurations drift."],"traps":["Route equals compliance: a compliant entry point is only a prerequisite for the controls, owners and evidence.","Design document as proof: reviewers accept a signed agreement, config screen, authorization record or log query, not a plan.","Training equals retention: excluded from training does not mean not stored, logged or monitored.","One-time mapping: configurations drift, so unrevalidated artifacts go stale and controls silently fail.","Residency copies: pinning processing to a region is not enough; validate that logs, caches, monitoring and retention paths stay inside the approved boundary."],"questions":[{"id":"d5s6q01","concept":"prefilter-not-proof","type":"single","stem":"A team chose a delivery route that survives HIPAA constraints and considers compliance settled. What is wrong with that conclusion?","options":["The route is a prerequisite, not proof; each obligation still needs a control, a named owner and an evidence artifact","The route must be re-chosen yearly, since regulations replace the permitted routes each year","Compliance is the vendor's responsibility, so the team's only task is to keep the contract on file","Design documents are sufficient evidence once the route is chosen, so the register can be skipped"],"correct":[0],"explanation":"Surviving the pre-filter yields an allowed route, but reviewers also ask who owns the control and what evidence shows it holding in practice.","mnemonic":"Route is the ticket, not the proof."},{"id":"d5s6q02","concept":"regulation-outcome","type":"single","stem":"GDPR, HIPAA and FedRAMP state what must be true. What does the architect own as a result?","options":["A policy statement, a project sponsor, and a risk rating for the quarterly steering meeting for the executives","A specific technical control, an accountable owner, and an evidence artifact showing the control is live","A vendor attestation, a legal reviewer, and a design document describing the intended controls","A model configuration, an escalation contact, and a training record for the engineering team"],"correct":[1],"explanation":"Regulations state outcomes and leave the technical control to you, so each obligation becomes control, owner and evidence. Documents and attestations alone are not evidence of a live control.","mnemonic":"Control, owner, evidence: the compliance trio."},{"id":"d5s6q03","concept":"evidence-most-missed","type":"single","stem":"Which element of the control, owner, evidence triple is most often missed?","options":["The technical control itself, since teams rarely implement anything for an obligation in each project","The named owner, since owners are always assigned only after the first audit finding","The evidence artifact that shows the control is live, which is what the reviewer checks","The framework reference, since teams rarely record which regulation applies to a control"],"correct":[2],"explanation":"The notes stress always including the evidence artifact; a control no one can demonstrate is indistinguishable from one that is not running.","mnemonic":"No evidence, no control, as far as an auditor knows."},{"id":"d5s6q04","concept":"hipaa-mapping","type":"multi","stem":"Which TWO items are evidence a reviewer accepts for the HIPAA obligation? Select TWO.","options":["The signed Business Associate Agreement","The admin setting showing HIPAA compliance enabled, plus the eligible-feature list","A design document describing the intended HIPAA architecture","A statement that the model was trained without the data","The residency configuration showing the approved region"],"correct":[0,1],"explanation":"For HIPAA the evidence is the signed BAA and the admin setting showing compliance enabled, plus the eligible-feature list; the owner is the security lead. Residency evidence belongs to a different obligation.","mnemonic":"BAA plus the switch plus the feature list."},{"id":"d5s6q05","concept":"fedramp-mapping","type":"single","stem":"For a US government workload at the required impact level, what do the technical control and evidence consist of?","options":["Any compliant-looking entry point, plus the vendor's marketing statement on certification coverage","A regional configuration for the approved boundary, plus a data-flow record covering logs and caches","The decision log retained for the required period, plus a sample reconstruction of one decision in the register","An Anthropic-documented authorized route, plus its authorization record and confirmation that the workload runs exclusively on it"],"correct":[3],"explanation":"FedRAMP maps to delivery through an authorized route with an authorization record and confirmation of exclusive use; the owner is the platform owner. The other options are residency and transparency evidence.","mnemonic":"Authorized route, authorization record, exclusive use."},{"id":"d5s6q06","concept":"residency-dataflow","type":"single","stem":"Which evidence best supports a data-residency obligation?","options":["The residency configuration alone, since pinning processing to the approved region covers all copies","The residency configuration and a data-flow record showing where every copy lives, including logs, caches and monitoring","A signed Business Associate Agreement, since it states where data can be processed and stored","An authorization record for the delivery route, since the route determines where every copy lands"],"correct":[1],"explanation":"Residency needs regional configuration and validation that logs, caches, monitoring and retention paths stay within the boundary; the owner is the data owner. Configuration alone misses secondary copies.","mnemonic":"Prove every copy, not just the main store."},{"id":"d5s6q07","concept":"training-vs-retention","type":"single","stem":"A vendor says data is excluded from model training by default. What follows for the retention claim?","options":["Retention is also off, since excluding data from training means that nothing is stored at all to the contract","Retention is limited to 30 days, since training exclusion implies a fixed short retention window","Nothing automatically; data may still be retained or monitored for logging, abuse prevention, legal compliance or audit","Retention is irrelevant to compliance, since only training use of data is regulated by the frameworks"],"correct":[2],"explanation":"Training use and retention are two distinct claims and must not be collapsed. The notes give no fixed retention window.","mnemonic":"Not trained on is not the same as not kept."},{"id":"d5s6q08","concept":"evidence-live","type":"single","stem":"A security and legal reviewer asks for proof of a control. Which artifact do they accept?","options":["A signed agreement, a configuration screen, an authorization record or a returned log query showing the control is live","A design document that names the control but lists no owner and no operating evidence","A diagram of the compliant entry point, annotated with the framework clause it addresses","A statement that the team intends to enable the control before the next scheduled audit"],"correct":[0],"explanation":"Reviewers accept proof that a control is live, not design documents; a control no one can demonstrate looks the same as one that is not running.","mnemonic":"Show it live, not on paper."},{"id":"d5s6q09","concept":"revalidate-cadence","type":"single","stem":"Why must the compliance register be revalidated on a regular cadence?","options":["Frameworks are rewritten annually, so each control must be redesigned to match the new text","Configurations drift and artifacts go stale, so a control true at design time can be false in production","Evidence artifacts expire automatically after one audit, so they must be regenerated every cycle","Owners change role regularly, so control ownership must be reassigned on each cycle"],"correct":[1],"explanation":"Producing and maintaining evidence is ongoing work because configurations drift and artifacts go stale, so a control that was real at design time can become silently false in production. Annual framework rewrites and automatic evidence expiry are not the reason for revalidation.","mnemonic":"Configs drift; evidence must be re-proved."},{"id":"d5s6q18","concept":"unowned-control-risk","type":"single","stem":"A compliance register lists a control for every obligation, but none has a named owner or an evidence artifact. What is the main risk?","options":["The delivery route becomes unauthorized, so the workload must move to a different entry point","A control can stop operating with no one accountable, and the gap surfaces only at audit","The register must be rewritten for each framework every year, so mappings are always out of date","Liability for any failed control passes to the model provider, since no internal owner is named"],"correct":[1],"explanation":"A control with no owner and no evidence is invisible at the audit: it can stop operating with no one accountable, and the gap surfaces in review rather than in design, the most expensive place to find it. Missing owners do not change whether the route is authorized, and accountability does not pass to the provider.","mnemonic":"No owner, no evidence: the control dies quietly and the audit finds it."},{"id":"d5s6q11","concept":"transparency-mapping","type":"single","stem":"For the transparency obligation, what is the technical control and the evidence a reviewer accepts?","options":["The retained, queryable decision log, with a sample reconstruction of one decision from the live log as evidence","The authorized delivery route, with an authorization record confirming exclusive use of that route","The regional configuration, with a data-flow record covering logs, caches and monitoring paths","The signed agreement, with an admin setting and a list of eligible features that remain in scope"],"correct":[0],"explanation":"Transparency maps to decision logging retained for the required period, evidenced by a sample reconstruction; the owner is the architect.","mnemonic":"Reconstruct one decision from the live log."},{"id":"d5s6q19","concept":"governance-spans-owners","type":"single","stem":"Why is turning each obligation into a control with an owner and a living evidence artifact more complex than choosing a compliant entry point?","options":["Each framework needs its own delivery route, so every obligation adds another entry point to run","The vendor must produce the evidence artifacts, so each one needs a separate contract negotiation","Owners can be assigned only after the first audit, so the mapping must be redone once it closes","It spans security, legal and platform owners, who must agree on who holds what for each obligation"],"correct":[3],"explanation":"A control, an owner and a living evidence artifact per obligation is more governance than an entry-point choice, and it spans security, legal and platform owners who must each agree on who holds what. The evidence is the team's to produce and keep current, and owners belong in the design rather than after an audit.","mnemonic":"One route is one choice; controls need security, legal and platform agreeing who holds what."},{"id":"d5s6q20","concept":"transparency-mapping","type":"single","stem":"For the obligation that decisions be reconstructable on demand, a team offers a design document describing its decision log. What would a reviewer accept instead?","options":["A signed copy of the same design document, approved by the named control owner","A diagram of the logging pipeline, annotated with the retention period it targets","A sample reconstruction of one decision pulled from the live decision log","A written commitment that decision logging will be switched on before the audit"],"correct":[2],"explanation":"Reviewers accept proof that a control is live, such as a returned log query, and for transparency the accepted evidence is a sample reconstruction of one decision from the live log. A signed or diagrammed design still only describes a control, and a control no one can demonstrate is indistinguishable from one that is not running.","mnemonic":"Don't describe the log; replay one decision from it."},{"id":"d5s6q14","concept":"owner-mapping","type":"single","stem":"Which pairing of obligation and owner matches the mapping?","options":["HIPAA with the security lead, FedRAMP with the platform owner, and data residency with the data owner","HIPAA with the data owner, FedRAMP with the security lead, and data residency with the platform owner","HIPAA with the architect, FedRAMP with the data owner, and data residency with the security lead","HIPAA with the platform owner, FedRAMP with the architect, and data residency with the data owner"],"correct":[0],"explanation":"The mapping assigns HIPAA to the security lead, FedRAMP to the platform owner, data residency to the data owner, and transparency to the architect.","mnemonic":"HIPAA security, FedRAMP platform, residency data."},{"id":"d5s6q15","concept":"revalidate-cadence","type":"single","stem":"Which practice best prevents a residency control from silently breaking after a configuration change?","options":["Re-read the original design document each quarter to confirm the intended region has not changed","Rely on the delivery route's authorization record to guarantee that all copies stay in the region","Disable logging in non-approved regions only once an auditor has raised a specific finding","Name an owner and revalidate the data-flow record on a regular cadence to detect drift"],"correct":[3],"explanation":"Configurations drift, so an owner and a living, revalidated evidence artifact are what catch a change. A design document or route record does not track where data lands.","mnemonic":"Owner plus cadence catches drift."},{"concept":"training-vs-retention","type":"multi","stem":"Which TWO statements about training use and retention are correct? Select TWO.","options":["They are two distinct claims that must not be collapsed into one","Data excluded from training by default may still be retained or monitored for abuse prevention or audit","Excluding data from training means the data is not stored or logged anywhere","Retention is regulated only when the retained data is also used for training","Retention is automatically capped at the same period as the training exclusion"],"correct":[0,1],"explanation":"Training use and retention differ; data excluded from training may still be retained or monitored for logging, abuse prevention, legal compliance or configured audit purposes.","mnemonic":"Not trained on is not the same as not kept.","id":"d5s6q16"},{"id":"d5s6q17","concept":"owner-mapping","type":"single","stem":"In the mapping of compliance obligations to controls and owners, who owns the control that makes decisions reconstructable on demand?","options":["The security lead, who owns the HIPAA control","The data owner, who owns the residency data-flow record","The platform owner, who owns the authorized route","The architect, who owns the retained, queryable decision log"],"correct":[3],"explanation":"The cross-framework transparency obligation is met by the decision log from the fairness work, retained and queryable, and the architect owns it. The security lead owns HIPAA, the platform owner owns FedRAMP and the data owner owns residency.","mnemonic":"Who built the decision log owns its proof: the architect."}]}]},{"domain":6,"subjects":[{"id":"d6s1","title":"Structured discovery and the translation table","learn":["Discovery is a three-step filter: listen to the business goal, translate it into requirements, assumptions and unresolved constraints, and write it down before the conversation moves on.","A stated preference ('seamless', 'easy', 'fast') hides a constraint; ask what would break the experience, what the user must never notice, what happens behind the scenes, and what must hold when something fails.","Four buckets: what the system must do, must NOT do, must cost, and must PROVE. Stakeholders rarely volunteer the must-not-do items.","A translation-table row holds: stakeholder statement as said, implied constraint, required architectural decision, and the assumption documented while unconfirmed. One row per item keeps the reasoning intact into design.","The expensive failure is an unstated constraint that surfaces at legal or compliance review. Finish the four-category question set before proposing anything; a confident sketch is the moment the questions stop."],"traps":["Recording the word: writing 'seamless' as the requirement captures the summary, not a testable, bounded constraint the design can be built against.","Sketching early: a plausible architecture makes the stakeholder assume you have the information, and the questions stop at exactly the wrong moment.","Review dismissal: treat every 'it's just a review' as a constraint to chase down; it may be a required architectural gate, not an optional convenience.","Over-assigning to Claude: the must-do bucket separates the work Claude owns from the work that stays with an existing system or a human.","Forgetting must-prove: proof obligations in regulated workflows are requirements and are far cheaper to find in discovery than in a legal review weeks later."],"questions":[{"id":"d6s1q01","concept":"preference-hides-constraint","type":"single","stem":"A stakeholder says the new assistant must 'feel seamless'. Which next move best reflects structured discovery?","options":["Record 'seamless' as the requirement and move on to design so momentum is kept","Ask what would make the experience feel not seamless, to surface the hidden constraints","Commit to a sub-second latency target immediately and ask the stakeholder to sign off","Ask the stakeholder to rank the product features they care about most"],"correct":[1],"explanation":"A stated preference sits on top of constraints. Asking what would make it feel not seamless exposes constraints such as a latency budget the user should not notice, an uninterrupted handoff and a failure state that hides system internals. Picking a latency number straight away guesses at one constraint and ignores the rest.","mnemonic":"Seamless is the label; 'what would break it?' opens the box."},{"id":"d6s1q02","concept":"preference-hides-constraint","type":"single","stem":"In a kickoff, a claims director says the tool should be 'simple and intuitive' for adjusters. What is the best way to treat this statement?","options":["Add 'simple and intuitive' to the requirements list verbatim, since the director owns the wording of the goal","Choose a single delivery route, because fewer platforms is what simple means in architectural terms","Defer the wording to the design review, where the UX team will define what simple should mean","Treat it as a signal: ask what would break it, what users must never notice, and failure behaviour"],"correct":[3],"explanation":"Experience words like simple, easy, fast and intuitive signal that more discovery is needed. Ask what would break the experience, what the user must never notice and what happens when something fails. Writing the word down verbatim leaves the design inheriting your assumptions.","mnemonic":"Easy, fast, simple, seamless: each word is a question mark, not a requirement."},{"id":"d6s1q03","concept":"listen-translate-write","type":"single","stem":"Which sequence describes the three-step filter a discovery conversation should function as?","options":["Listen, sketch the architecture, then confirm the sketch with the stakeholder","Gather features, estimate cost, then present a recommended pattern","Listen to the goal, translate it into requirements and assumptions, then write it down","Write the requirements first, then listen for corrections, then translate for the design team"],"correct":[2],"explanation":"Discovery is listen, translate, write down, and the write-down happens before the conversation moves on. Without it the design inherits the architect's assumptions. Sketching during the call replaces the translation step with a guess.","mnemonic":"Listen, translate, write down: ears, brain, paper."},{"id":"d6s1q04","concept":"four-buckets","type":"multi","stem":"Which TWO of the following are among the four question buckets used to turn a vague stakeholder statement into requirements? Select TWO.","options":["What the system must prove","Which cloud vendor the stakeholder prefers","Which model tier the team enjoys most","What the system must not do","Which team will own the sales relationship"],"correct":[0,3],"explanation":"The four buckets are must do, must not do, must cost and must prove. Vendor preference and sales ownership are not discovery buckets; a vendor preference may emerge from them but is not one of the four questions.","mnemonic":"Do, Don't, Dollars, Demonstrate: the four D-questions of discovery."},{"id":"d6s1q05","concept":"must-not-do-explicit","type":"single","stem":"Which discovery bucket do stakeholders rarely volunteer, so the architect must ask for it explicitly?","options":["What the system must do, expressed as business outcomes the stakeholder describes naturally","What the system must cost, expressed as a latency target or per-interaction ceiling","What the system must not do, including boundaries and cases that must route to a human","How the system will be hosted, expressed as a cloud preference for the program"],"correct":[2],"explanation":"Boundaries, prohibited actions and human-routed cases are rarely volunteered, so they have to be asked for. Must-do capabilities are what stakeholders talk about naturally, so they surface unprompted.","mnemonic":"Nobody volunteers the 'don't': ask for the fence before the field."},{"id":"d6s1q06","concept":"must-not-do-explicit","type":"single","stem":"After a call, an architect's notes list only capabilities the stakeholders want. What is the most significant gap in the discovery record?","options":["No cost ceiling, since a per-interaction budget is always set later by finance teams","No explicit prohibited actions or human-routed cases, because nobody was asked for them","No preferred model name, which blocks the design from starting in the next sprint","No ranking of requested features by how many users asked for each of them"],"correct":[1],"explanation":"Stakeholders describe what they want and seldom the boundaries, so a capabilities-only record signals the must-not-do bucket was never asked. Cost is also a bucket, but the gap named here is the one that stakeholders almost never fill on their own.","mnemonic":"Capabilities-only notes mean the fence questions were never asked."},{"id":"d6s1q24","concept":"translation-table-structure","type":"single","stem":"Why does the discovery translation table hold exactly one row per discovery item?","options":["It keeps each item's reasoning intact from discovery into design and keeps assumptions visible","It keeps the table short enough for an executive sponsor to approve in one sitting","It lets each row be assigned to a separate delivery team as a work package","It lets the table replace the production-signal governance table after launch"],"correct":[0],"explanation":"Each discovery item becomes one row capturing the statement as said, the implied constraint, the decision it forces and any assumption. One row per item keeps the reasoning intact as the work moves into design and keeps assumptions top of mind. The governance table is a separate artifact for the live deployment.","mnemonic":"One item, one row: the reasoning travels intact from discovery into design."},{"id":"d6s1q25","concept":"unstated-constraint-cost","type":"single","stem":"A sponsor wants discovery cut to one short call so the team can start building sooner. What is the architect's best response?","options":["Agree, because hidden constraints are cheaper to find and fix during the build itself","Agree, because the legal and compliance review will supply any requirements still missing","Agree, because a quick prototype will reveal every constraint the stakeholder forgot to mention","Push back: finding the real constraints now costs far less than redesigning after compliance review"],"correct":[3],"explanation":"A discovery call that runs long enough to identify the real constraints is far cheaper than redesigning after a hidden constraint emerges in legal or compliance review. Relying on the build or the compliance review to surface constraints is how they become production blockers, when change costs most.","mnemonic":"A longer call is cheap; a late redesign is not."},{"id":"d6s1q26","concept":"discovery-purpose","type":"single","stem":"Which outcome should an architect leave a discovery call with?","options":["An agreed architecture sketch the stakeholder has already approved in the room","A firm prototype date that keeps the stakeholder's momentum going after the call","A record of the constraints hidden in the business description that the design can follow","A ranked list of the product features the stakeholder mentioned most often during the call"],"correct":[2],"explanation":"Discovery reveals whether you are solving the right problem: listen to what the business is trying to achieve, identify the constraints hidden in that description, and leave with a record the design can follow. An approved sketch on the call is the moment the questions stop, not the goal of the call.","mnemonic":"Leave discovery with a record, not a rendering."},{"id":"d6s1q10","concept":"unstated-constraint-cost","type":"single","stem":"Which description best captures the expensive failure mode of weak discovery?","options":["A discovery call that runs long enough to uncover the real constraints early","A translation table with so many rows that the design team cannot read it","An assumption labelled as an assumption that is later confirmed by the owner","An unstated constraint that survives until legal or compliance review, when change costs most"],"correct":[3],"explanation":"The costly failure is the constraint nobody stated that appears at the production review blocker stage, when changing course is slowest and most expensive. A longer discovery call is the cheaper alternative, not the failure.","mnemonic":"Hidden constraints grow pricier every week they stay hidden."},{"id":"d6s1q11","concept":"unstated-constraint-cost","type":"single","stem":"Six weeks into a build, compliance demands an audit trail the design never included. Which discovery question would most directly have caught this earlier?","options":["What must the system prove, and to whom, in a regulated workflow?","What must the system cost, stated as a per-interaction ceiling or volume forecast?","What must the system do, stated as business outcomes rather than product features?","What would make the experience feel not seamless to the end user?"],"correct":[0],"explanation":"Proof obligations belong in the must-prove bucket, and finding them in discovery is far cheaper than in a legal review weeks later. The cost and must-do questions would not reveal an evidence requirement.","mnemonic":"Must-prove asked early beats must-prove demanded late."},{"id":"d6s1q27","concept":"must-prove-obligation","type":"single","stem":"An architect is running discovery for a consumer lending workflow. When should the evidence the deployment must produce for regulators be identified?","options":["After the pilot proves business value, so effort is not spent on a use case that may be dropped","At the first external audit, when the regulator states exactly which evidence it expects to see","When the outcome document is written at close, since that is where controls are first recorded","During discovery, as part of the requirement set, because a later legal review costs far more"],"correct":[3],"explanation":"What the system must prove is part of the requirement set in regulated workflows, so proof obligations are identified in discovery; finding them in a legal review weeks later is far more expensive. Waiting for the pilot or an audit lets the missing evidence become a production blocker.","mnemonic":"Regulated? Ask 'what must we prove?' on day one, not in legal review."},{"id":"d6s1q28","concept":"listen-translate-write","type":"multi","stem":"In the discovery filter, the second step translates the stakeholder's business goal into which THREE things? Select THREE.","options":["Requirements the design must support","An architecture sketch ready for stakeholder sign-off","Assumptions that still need confirmation","A shortlist of candidate delivery routes","Unresolved constraints that could block the solution"],"correct":[0,2,4],"explanation":"Translation turns the stated goal into requirements, assumptions and unresolved constraints, showing what the design must support, what still needs confirmation and what could block the solution later. A sketch or a route shortlist is design work, and starting it mid-call is what stops the questions.","mnemonic":"Translate into three: must support, must confirm, might block."},{"id":"d6s1q14","concept":"four-bucket-contents","type":"single","stem":"During discovery, a stakeholder gives a three-second p95 response target, a ceiling of two cents per interaction and a forecast of 80,000 calls a month. Which discovery bucket do these answers belong in?","options":["What the system must prove, as evidence obligations for later review","What the system must cost, as budget constraints the stakeholder controls","What the system must not do, as boundaries and prohibited actions","What the system must do, as capabilities the deployment delivers"],"correct":[1],"explanation":"The must-cost bucket holds the budget constraint expressed in terms the stakeholder controls, which includes a latency target, a per-interaction cost ceiling and a volume forecast. Must-do is tempting because the volume describes usage, but must-do captures capabilities as business outcomes, not budgets.","mnemonic":"Cost bucket holds the clock, the cents and the count: latency, ceiling, volume."},{"id":"d6s1q15","concept":"four-bucket-contents","type":"single","stem":"An architect fills the 'must do' discovery bucket with features such as 'summarize button' and 'auto-tagging'. What should this bucket capture instead?","options":["The per-interaction cost ceiling and volume forecast that bound each capability","The prohibited actions and cases that must be routed to a human reviewer","The evidence artifacts the deployment must produce for a later legal review","Capabilities stated as business outcomes, separating Claude's work from systems and humans"],"correct":[3],"explanation":"Must-do captures the capabilities the deployment must deliver, expressed as business outcomes rather than features, and is where Claude's work is separated from work that stays with an existing system or a human. The cost ceiling and volume forecast belong in the must-cost bucket.","mnemonic":"Must-do speaks outcomes, not buttons."},{"id":"d6s1q16","concept":"four-bucket-contents","type":"multi","stem":"Which TWO statements about the four discovery buckets are correct? Select TWO.","options":["The must-prove bucket can wait for legal review, since evidence is a later concern","The must-do bucket states capabilities as business outcomes rather than features","The must-not-do bucket is usually volunteered by stakeholders without prompting","The must-cost bucket includes latency targets and volume forecasts as well as cost ceilings","The must-cost bucket is expressed in token counts the engineering team controls"],"correct":[1,3],"explanation":"Must-do is expressed as business outcomes, and must-cost covers latency targets, per-interaction cost ceilings and volume forecasts in terms the stakeholder controls. Must-prove obligations are far cheaper to find in discovery than in a later legal review, and must-not-do items are rarely volunteered.","mnemonic":"Do = outcomes; Cost = clock, cents, count, in the stakeholder's terms."},{"id":"d6s1q29","concept":"preference-hides-constraint","type":"multi","stem":"After a discovery call, which TWO items in the record are ready for the design to be built against? Select TWO.","options":["The stakeholder's word 'seamless', recorded exactly as it was said","A p95 response-time target the stakeholder confirmed in follow-up questions","A ranked wish list of features gathered from several user interviews","A per-interaction cost ceiling stated in terms the stakeholder controls","The architect's preferred integration pattern from a previous engagement"],"correct":[1,3],"explanation":"A testable, bounded constraint is what the design can be built against, and a confirmed p95 target and a cost ceiling both qualify. A preference word recorded verbatim only tells you where to investigate, and a wish list or a favourite pattern is not a constraint at all.","mnemonic":"Preferences point the way; bounded, testable constraints are what you build against."},{"id":"d6s1q30","concept":"preference-hides-constraint","type":"multi","stem":"A stakeholder says the new tool must be 'fast and easy'. Which THREE follow-up questions help turn this into design constraints? Select THREE.","options":["Which model tier is the newest one we could use today?","What would break that experience for the user?","What must the user never notice happening?","Which features do competitors already ship?","What must still be true when something goes wrong?"],"correct":[1,2,4],"explanation":"Experience words such as fast, easy, seamless, simple and intuitive signal that more discovery is needed. Ask what would break the experience, what the user must never notice, what has to happen behind the scenes and what must still be true when something goes wrong. Model tiers and competitor features do not surface the constraint.","mnemonic":"Break it, hide it, fail it: three questions under every experience word."},{"id":"d6s1q19","concept":"translation-table-structure","type":"single","stem":"Which set of columns makes up each row of the discovery translation table?","options":["Requirement, capability list, architecture sketch, boundary conditions, and the statement of work","Options considered, criteria weighed, the recommendation, and the risks that remain afterwards","Stakeholder statement as said, implied constraint, required architectural decision, and the assumption documented","Signal type, review trigger, architect action, and the regulated-industry checkpoint for it"],"correct":[2],"explanation":"Each discovery item becomes one row holding the statement as it was said, the constraint it implies, the architectural decision that constraint forces, and any assumption documented while the constraint is unconfirmed. The other options describe the scoping sequence, the decision package and the governance table.","mnemonic":"Said, implied, decided, assumed: four columns per row."},{"id":"d6s1q31","concept":"translation-table-structure","type":"single","stem":"A stakeholder says all users sit in one country, but nobody has confirmed this with the data owner. How should the discovery record handle the statement?","options":["Record it as a row with its decision, and label the assumption explicitly for confirmation","Leave it out of the record until the data owner confirms it, so nothing unverified enters","Write it into the record as a settled fact, since the stakeholder knows their own user base","Defer it to the compliance review, where the data owner will be asked to settle the point"],"correct":[0],"explanation":"Each discovery item becomes a row, and when its constraint is not yet confirmed the row documents the assumption so it stays visible until confirmed. Leaving the item out loses it; writing it as a settled fact hides an assumption, which is how the design inherits unverified beliefs.","mnemonic":"Unconfirmed goes in the row, labelled 'assumption: confirm', never as fact."},{"id":"d6s1q21","concept":"sketch-ends-questions","type":"single","stem":"Partway through a discovery call, an architect sketches a confident design and the stakeholder happily agrees. Why is this moment dangerous?","options":["Stakeholders tend to reject sketches early, so momentum is lost before requirements are set","A sketch locks in a model tier before eval data exists, which raises later running costs","A plausible sketch signals the architect already has the information needed, so the questions stop","The stakeholder may confuse the sketch with a finished design and expect a working prototype immediately"],"correct":[2],"explanation":"Plausibility is what makes it dangerous: a stakeholder who hears a confident architecture assumes the architect has the information to build it, so the questions that would surface hidden constraints never get asked. The problem is not rejection.","mnemonic":"A pretty sketch stops the questions."},{"id":"d6s1q22","concept":"sketch-ends-questions","type":"single","stem":"Which practice best protects a discovery call from turning into a premature design session?","options":["Propose a design early so the stakeholder can react, then collect missing constraints during the build","Keep the call short and leave constraint gathering to the legal and compliance review that follows","Agree a prototype date on the call, then add review steps once the stakeholder sees the output","Finish the four-category question set before proposing anything, and chase every 'just a review' as a constraint"],"correct":[3],"explanation":"The protective move is deliberately boring: complete the four question categories before proposing any design, and treat every 'it's just a review' as a constraint to chase down. Deferring constraints to the build or to compliance review is exactly how hidden constraints become expensive blockers.","mnemonic":"Four buckets full before one box is drawn."},{"id":"d6s1q32","concept":"listen-translate-write","type":"single","stem":"Why should items surfaced in a discovery call be written down before the conversation moves on?","options":["So the stakeholder can sign a statement of work before the call has ended","Because written notes are needed only later, for the project's billing records","So the call can be shortened, since written items need no further questions","Without the record, the design inherits the architect's assumptions and mismatches surface late"],"correct":[3],"explanation":"The design needs a clear record to follow. Without the write-down step, the design inherits the architect's assumptions, and the mismatch may only appear much later, when changing trajectory is slower, harder and more expensive. A shorter call is not the point; capturing what was heard is.","mnemonic":"Unwritten discovery becomes the architect's guesswork, found out late."}]},{"id":"d6s2","title":"Communicating trade-offs","learn":["The architect's job is to make decisions possible, not to resolve the trade-off in advance; present a package of options, criteria, recommendation and remaining risks.","Decision frame: what do we gain, what do we give up, what happens if we choose now and must reverse later, and (regulated) what it does to compliance posture. Reversal cost is the one most often skipped.","Description competency for stakeholders: lead with the business outcome, frame limitations honestly, and anticipate the peer-proof demand so the stakeholder can justify the choice to others.","Trade-off map examples: large context vs retrieval (evaluate prompt caching for static content), logging detail vs latency (compliance gap), single route vs multi-platform (blocked cutover).","False alignment: a decision looks approved in the room but reversal cost was never made explicit; name the reversal cost especially when the design feels obviously simpler."],"traps":["Pre-resolved verdicts: presenting only the conclusion looks decisive but leaves the stakeholder approving something without understanding what came with it.","Answering only what was asked: an accurate technical answer can still miss the approver's real question, what happens to the business if the choice is wrong and must be reversed.","Treating per-call cost as fixed: for static documents held in context, evaluate prompt caching before accepting the cost as given.","Technical precision as sufficiency: an accurate recommendation can still be unusable if the approver cannot translate it into business consequence.","Room agreement as proof: a yes at the end of a complete presentation can still be false alignment."],"questions":[{"id":"d6s2q01","concept":"make-decisions-possible","type":"single","stem":"Which statement best describes the architect's role when presenting a significant design trade-off to a stakeholder?","options":["Resolve the trade-off before the meeting and present the single best technical answer","Describe the options clearly enough that the stakeholder can make an informed choice","Present as many options as possible without a recommendation to stay neutral","Hold back the downsides until the stakeholder has agreed to the direction"],"correct":[1],"explanation":"The job is to make decisions possible, which means describing options clearly enough for an informed choice. Presenting only the conclusion makes the decision look clear but weak.","mnemonic":"Don't hand down a verdict; hand over a decision."},{"id":"d6s2q02","concept":"make-decisions-possible","type":"single","stem":"An architect arrives with a single recommended design and a polished justification, and no alternatives. Why is this approach weak?","options":["The recommendation may be technically wrong, and stakeholders prefer an unfinished proposal to a polished one","Executives dislike recommendations, so they should always be left to the stakeholders to form themselves","If the downside appears later, the stakeholder feels they approved a recommendation without understanding its price","A single design cannot be documented using a translation table or a decision record afterwards"],"correct":[2],"explanation":"Presenting only the conclusion hides the trade-off, so when the downside shows up the stakeholder feels they did not make an informed choice. A recommendation is still wanted, but inside a package that includes options, criteria and risks.","mnemonic":"A verdict without its price tag becomes a grievance later."},{"id":"d6s2q03","concept":"decision-frame-questions","type":"multi","stem":"Which THREE questions belong to the simple decision frame for presenting a trade-off? Select THREE.","options":["What do we gain?","Which engineer on the team will implement it?","What happens if we choose this now but have to reverse it later?","In regulated environments, what does this do to our compliance posture?","Which competitor has already chosen the same option?"],"correct":[0,2,3],"explanation":"The frame asks what we gain, what we give up, what happens if we must reverse later, and the compliance impact in regulated environments. Who implements it and what competitors did are not part of the frame.","mnemonic":"Gain, give up, go back, guard compliance: four G-questions."},{"id":"d6s2q04","concept":"reversal-cost","type":"single","stem":"Of the decision-frame questions, which is the one most often skipped, and often the one that changes the meeting?","options":["What do we gain from the option, in the stakeholder's own goal terms?","What do we give up by choosing it, in cost, latency or risk?","What is the vendor's roadmap for features over the next year?","What happens if we choose this now but have to reverse it later?"],"correct":[3],"explanation":"The reversal question is skipped most often, and it shifts the discussion from the better technical answer to the better business choice. Gains and give-ups are the questions people usually remember to answer.","mnemonic":"The skipped question is the cost of going back."},{"id":"d6s2q05","concept":"reversal-cost","type":"single","stem":"A review covers what a design gains and what it gives up, and the room feels a
