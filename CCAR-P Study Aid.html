 on it, one bad change reaches all before it stops","It only functions for the single Architect who originally wrote the skill"],"correct":[2],"explanation":"The risk is propagation: a shared asset without versioning lets a single bad change spread to the whole team. Spend and toggling are separate concerns.","mnemonic":"No version, no way back: one slip hits all."},{"id":"d7s2q11","concept":"packaging-as-standard","type":"single","stem":"Why does packaging a team's local workflow as a distributable skill matter?","options":["It turns undocumented know-how into one governed artifact updated through versioning","It lets individual developers keep their working practice private to themselves","It removes the need for any review of the workflow before release","It guarantees that the workflow itself never needs updating in future"],"correct":[0],"explanation":"A packaged skill carries the procedure as one governed artifact instead of undocumented know-how, so a good local practice becomes a team standard.","mnemonic":"Package the practice, and it becomes the standard."},{"id":"d7s2q12","concept":"rollback-paths","type":"multi","stem":"Besides plugins, which TWO mechanisms provide a path back to a prior version? Select TWO.","options":["Server-managed settings, through their hourly refresh cycle","Org-provisioned Skills, through native built-in rollback","Claude Code project Skills, rolling back with the repository","API Skills, through explicit version pinning"],"correct":[2,3],"explanation":"API Skills support explicit version pinning and project Skills roll back with the repo that carries them. Org-provisioned Skills have no native rollback and server-managed settings are not a Skills channel.","mnemonic":"Pin the API, revert the repo; org upload has neither."},{"id":"d7s2q13","concept":"per-asset-distribution-governance","type":"single","stem":"An Architect is setting up distribution for a team's migration-checklist skill, a coding-conventions skill and a shared configuration. What is the hard part, and at what level should it be decided?","options":["Which single mechanism suits every asset, decided once for the team","How to write each skill's prompt, decided by the department champions","Which model each skill runs on, decided by the spend posture","Who can reach, update and revoke each asset, decided per asset"],"correct":[3],"explanation":"Distribution governance, meaning who can reach, update and revoke each shared asset, is the hard part and is decided on a per-asset basis. Picking one mechanism for everything ignores that assets differ in audience and in who should govern them.","mnemonic":"Reach, update, revoke: decide it asset by asset."},{"id":"d7s2q14","concept":"per-asset-distribution-governance","type":"multi","stem":"Which THREE considerations should drive the choice of distribution mechanism for a given team skill? Select THREE.","options":["What the tool is and what job it performs","Which model tier the skill author tested it on","Who will use it, whether everyone or one group","Who has access to govern, update and revoke it","How long the SKILL.md instructions file has grown"],"correct":[0,2,3],"explanation":"The mechanism should account for what the tool is, who uses it and who has access to govern it. The authoring model tier and the length of the instructions do not determine whether a skill should be org-wide, group-scoped, project-scoped or API-called.","mnemonic":"What, who uses, who governs: three questions pick the channel."},{"id":"d7s2q15","concept":"org-provisioned-best-when","type":"single","stem":"A security-awareness skill must reach every member of the organization, and its owner is comfortable managing updates by hand. Which distribution mechanism is the simplest fit?","options":["A Claude Code project Skill committed to each repository","An org-provisioned Skill uploaded under Organization settings > Skills","An API Skill pinned to an explicit version in a container","Server-managed settings pushed on the hourly polling cycle"],"correct":[1],"explanation":"An org-provisioned Skill becomes available to everyone in the organization at once, the simplest path when a capability genuinely should reach all members; updates require manual re-upload. Server-managed settings are a settings channel, not a Skills distribution path.","mnemonic":"Everyone, simply: upload it in Organization settings."},{"id":"d7s2q16","concept":"api-skill-governance","type":"single","stem":"A partner's billing product calls a document-classification Skill programmatically through the Messages API. Where does governance of that Skill primarily live?","options":["In the admin UI's install preferences for the group using it","In Organization settings, where users can toggle it off","In the calling system, with explicit version pinning, machine to machine","In the project repository's .claude/skills/ directory with the code"],"correct":[2],"explanation":"API Skills are governed in the calling system and support explicit version pinning; their reuse is machine-to-machine rather than human-facing. Install preferences belong to plugins, and toggling belongs to org-provisioned Skills.","mnemonic":"API Skill: the caller governs, the version is pinned."}]},{"id":"d7s3","title":"AI-assisted developer workflows and diligence","learn":["Integrate assistance into the existing editor, review and test loop; team knowledge in people's heads becomes Skills and project configuration.","Stage discipline: writing code needs correctness and security review; reviewing treats AI flags as input; debugging verifies hypotheses against evidence.","Two failure modes: lumpy adoption (few heavy users) and stalling at basic chat; access is not adoption.","Diligence is responsibility for verifying and vouching for outputs; AI code meets the same standards as any other code.","The verification checklist covers correctness, security, maintainability and human understanding, backed by automated regression tests and eval gates."],"traps":["Green tests as proof: passing checks and plausible code do not show anyone understands the change.","Verdict trap: AI review flags are input to human judgment, not a verdict.","Access equals adoption: giving a team access does not move it past basic chat.","Lighter bar for AI: faster output tempts teams to review it less, which is judgment erosion.","Volume blind spot: cheaper code production raises review volume, so checks need to be automated."],"questions":[{"id":"d7s3q01","concept":"integrate-workflow","type":"single","stem":"Where does AI tooling pay off most for a development team?","options":["In a weekly session where one expert runs prompts for others","In a standalone tool that replaces the team's review process","Inside the existing workflow: editor, review process and test loop","In a separate chat window developers visit when stuck"],"correct":[2],"explanation":"Assistance should live inside the workflow the team already uses, with the Architect finding where it removes real friction. A separate chat window is visited occasionally and rarely changes the process.","mnemonic":"Put Claude in the loop, not in a side window."},{"id":"d7s3q02","concept":"integrate-workflow","type":"single","stem":"How does integrating Claude into the workflow help encode a team's knowledge?","options":["Conventions and procedures held in people's heads become Skills and project configuration","The model infers team standards automatically with no configuration needed at all","Reviewers store every past decision in chat history for later keyword search","Developers are asked to memorize prompts so the practice stays personal to them"],"correct":[0],"explanation":"Conventions, review standards and procedures that usually live in heads become Skills and project config, so good practice travels with the tooling.","mnemonic":"Head knowledge becomes skills and config."},{"id":"d7s3q03","concept":"writing-code-discipline","type":"single","stem":"Claude drafts a first-pass implementation from a clear spec. Which review discipline does the writing stage still require?","options":["None, if the spec was clear and the draft compiles","Only a style check, since logic follows from the spec","Review by a second AI session in place of the author's understanding","Correctness and security review, and the author must understand what was generated"],"correct":[3],"explanation":"Generated code still needs correctness and security review, and the author must be able to explain it. A clear spec does not remove that duty.","mnemonic":"Clear spec, still review: author must understand."},{"id":"d7s3q04","concept":"ai-review-input","type":"single","stem":"Claude summarizes a diff and flags three likely issues in a pull request. How should the reviewer treat the flags?","options":["As a final verdict that replaces human review","As unnecessary, since reviewing is the one stage AI cannot help","As input to the reviewer's judgment, not a verdict","As authoritative if more than two issues are flagged"],"correct":[2],"explanation":"In the reviewing stage Claude summarizes, flags and explains, but human judgment makes the call. AI flags are input, not a verdict.","mnemonic":"Flags inform; humans decide."},{"id":"d7s3q05","concept":"debug-verify","type":"single","stem":"Claude proposes a hypothesis for a production bug from a stack trace. What should the engineer do before acting on it?","options":["Ask Claude to repeat the hypothesis more confidently","Escalate to the Architect before any investigation","Apply the fix at once, since the trace supports it","Verify the hypothesis against evidence before acting"],"correct":[3],"explanation":"For debugging, Claude proposes hypotheses from a symptom and trace, but the engineer verifies against evidence before acting on them.","mnemonic":"Hypothesis first, evidence second, action third."},{"id":"d7s3q06","concept":"lumpy-adoption","type":"single","stem":"Two developers on a 30-person team use Claude heavily, while the rest barely touch it. Which failure mode is this, and what addresses it?","options":["Spend overrun; tighten per-user caps and model allowlists","Lumpy adoption; spread usage through champions and batches","Stalling at basic chat; enable tool use and repo-aware assistance","Judgment erosion; add a verification checklist before merge"],"correct":[1],"explanation":"Lumpy adoption means a few heavy users and many barely using it, so the gain never standardizes. The champion-and-batch rollout spreads usage deliberately.","mnemonic":"Few heavy users is lumpy; batches smooth it."},{"id":"d7s3q07","concept":"lumpy-adoption","type":"single","stem":"Why does leaving adoption to early adopters tend to fail?","options":["Early adopters exhaust the team's shared spend caps before others start","Early adopters usually misuse the tooling and teach bad habits to others","The team never sees the real gain and the practice never standardizes","Their usage typically violates the shared project baseline configuration"],"correct":[2],"explanation":"When a few use it heavily and the rest do not, the team does not realize the tool's real benefit and the practice is not standardized across it.","mnemonic":"Heavy few, idle many: no standard forms."},{"id":"d7s3q08","concept":"stalling-basic-chat","type":"multi","stem":"A team has full Claude access but uses it only as a question-answering box. Which TWO steps move them past basic chat? Select TWO.","options":["Package repeated procedures as skills","Remove the shared CLAUDE.md to reduce friction","Wait for individual developers to find advanced features","Increase every user's model tier by default","Enable tool use and repository-aware assistance"],"correct":[0,4],"explanation":"Access is not adoption. Teams stall until someone enables tool use, repository-aware assistance and packaged skills within current workflows.","mnemonic":"Access is not adoption: enable tools, repo, skills."},{"id":"d7s3q09","concept":"diligence-standard","type":"single","stem":"How is diligence defined for deployment in developer workflows?","options":["Taking responsibility for verifying and vouching for outputs we use or share","Limiting AI assistance to non-production code that carries no risk","Reviewing only the code that fails automated tests during the pipeline","Using the most capable model available for every task in the workflow"],"correct":[0],"explanation":"Deployment diligence is responsibility for verifying and vouching for the outputs used or shared, shown as holding AI code to the same standards as any other code.","mnemonic":"Diligence: verify it, vouch for it."},{"id":"d7s3q10","concept":"checklist-dimensions","type":"multi","stem":"Which THREE belong among the four dimensions a verification checklist for AI-generated output must cover? Select THREE.","options":["Human understanding of what shipped","Security of the generated change","Token cost per request at scale","Maintainability for the next engineer","Model latency percentile under load"],"correct":[0,1,3],"explanation":"The four dimensions are correctness, security, maintainability and human understanding. Cost and latency are operational metrics, not part of that checklist.","mnemonic":"Correct, secure, maintainable, understood: four checks."},{"id":"d7s3q18","concept":"checklist-dimensions","type":"single","stem":"A team's checklist for AI-generated changes covers correctness, security and maintainability. Which item adds the missing fourth dimension?","options":["The change was generated by the most capable model available","The diff stays under an agreed maximum size for review","The author can explain what the change does and why","A second AI session reviewed and approved the change"],"correct":[2],"explanation":"The four dimensions are correctness, security, maintainability and human understanding: the person merging must be able to explain what shipped and why. A stronger model or a second AI approval does not show that any human understands the change.","mnemonic":"Fourth check is a person: can you explain what shipped?"},{"id":"d7s3q12","concept":"judgment-erosion","type":"single","stem":"What does judgment erosion look like in an AI-assisted team?","options":["Reviewers rejecting generated code far too often during the review stage","Shipping output nobody fully understands because it looked right and passed checks","Developers refusing to use the tools inside their own editor at all","Escalating nearly every incident to the Architect for resolution"],"correct":[1],"explanation":"Judgment erosion is accepting output you no longer understand because it looks plausible and passes checks, until an unreasoned input reaches production.","mnemonic":"Looks right, passes checks, nobody understands."},{"id":"d7s3q13","concept":"diligence-standard","type":"single","stem":"Which stance toward AI-generated code matches the diligence guidance?","options":["Apply a lighter bar since the model has already tested its own output","Trust it by default and catch problems later through production monitoring","Relax review somewhat because it ships faster and looks right on inspection","Hold it to the same correctness, security and maintainability standards as hand-written code"],"correct":[3],"explanation":"Diligence means the same standards for AI code as any other, especially when it ships faster and looks right. A team without a checklist trusts output by default.","mnemonic":"Same bar for AI code as human code."},{"id":"d7s3q14","concept":"automate-checks","type":"single","stem":"AI assistance lowers the cost of producing code. What is the consequence for review, and what keeps quality intact?","options":["Review volume falls, so fewer checks are needed per change","Review volume rises; a checklist with automated tests and evals holds the bar","Review volume rises, so the Architect must approve every change personally","Review volume stays flat, so only the chosen model tier matters"],"correct":[1],"explanation":"Cheaper code production raises the volume reaching review. The checklist defines what must be true, and regression suites and eval sets prove it automatically on every change.","mnemonic":"More code in, so automate the gate."},{"id":"d7s3q15","concept":"checklist-vs-automated-gates","type":"single","stem":"A team has a written verification checklist for AI-generated changes, but reviewers re-derive correctness by hand on every pull request. Which improvement best follows the diligence guidance?","options":["Replace the checklist with Claude's own review flags on each pull request","Adopt a vendor-published checklist so the standard is not team-specific","Add a second human reviewer so two people re-check each change by hand","Automate checkable items as a regression suite and eval set gating every change"],"correct":[3],"explanation":"Wherever a check can be automatic it should be: a regression suite and eval set turn verification into a gate that runs on every change. The checklist is produced internally for the team's needs, and AI review flags are input, not a verdict.","mnemonic":"Checklist says what; tests and evals prove it every time."},{"id":"d7s3q16","concept":"checklist-vs-automated-gates","type":"multi","stem":"Which TWO statements correctly describe how a verification checklist relates to tests and evals? Select TWO.","options":["Once tests and evals exist, the checklist can be retired","The checklist defines what must be true before output reaches production","The checklist should be adopted unchanged from a standard template","Tests and evals prove those properties repeatably on every change","Evals remove the need for the author to understand the change"],"correct":[1,3],"explanation":"The checklist defines what must be true; tests and evals are how the team proves it repeatably instead of by hand. The checklist is team-produced for specific needs, and human understanding remains one of its four dimensions.","mnemonic":"Checklist defines, gates prove: both stay."},{"id":"d7s3q17","concept":"diligence-cultural-complexity","type":"single","stem":"A team's AI-assisted coding tools are well configured, yet review standards keep slipping on generated changes. What is the hard part of diligence in this situation?","options":["Technical: configuring hooks so generated code cannot skip linting","Cultural: holding generated code to the hand-written review standard","Financial: the review budget cannot keep pace with the volume","Technical: choosing a model tier strong enough to skip review"],"correct":[1],"explanation":"The hard part is cultural rather than technical: holding AI-generated code to the same review standard as hand-written code, especially when it ships faster and looks right. Better tooling or a stronger model does not remove the need for that standard.","mnemonic":"Looks right, ships fast: culture, not tooling, holds the bar."}]},{"id":"d7s4","title":"Operational support, runbooks and escalation","learn":["The Architect's support role is translation from symptom to architecture cause, not firefighting.","Gradual quality drop with no code change points to model or prompt change or retrieval drift; compare against an eval set.","Latency spikes: context growth, slow tool or cache not hitting; use traces and token counts. Intermittent tool failures: auth, limits, error paths.","Cost rising without usage change: model tier creep or caching regression; check per-request tier and cache hit rate against the budget model.","Runbooks capture known symptom-to-cause-to-action paths; escalation paths define who handles what and when; the goal is a team needing you only for new problems."],"traps":["Firefighting instinct: fixing the incident yourself is faster now but repeats the load later.","Slow degradation: a gradual decline no one connects to a cause runs until a scheduled review catches it, not the day it starts.","Cause mismatch: quality drop, latency, tool failures and cost each map to different first actions.","Fix before trace: act on a hypothesis only after tracing evidence, not by changing models first.","Missing boundary: without an escalation path, people do not know what they can resolve."],"questions":[{"id":"d7s4q01","concept":"translation-not-firefighting","type":"single","stem":"What is the Architect's core value when an operational issue lands with the team?","options":["Replacing the team's on-call rotation with the Architect's own availability","Approving every deploy until incidents stop occurring in production","Connecting the symptom to its architecture cause and teaching the path","Resolving each incident personally and as quickly as possible every time"],"correct":[2],"explanation":"The team usually sees a symptom, not a cause. The Architect translates symptom to cause; resolving one incident alone is firefighting rather than lasting support.","mnemonic":"Translate the symptom; don't just fight the fire."},{"id":"d7s4q02","concept":"gradual-quality-drop","type":"single","stem":"Answer quality has declined gradually for weeks with no code change. What is the likely architecture cause and first action?","options":["Model or prompt change, or retrieval drift; compare to an eval set","Rate limits; trace one failed call end to end through the tool","A cache stopped hitting; inspect token counts per request","Model tier crept up; check the per-request model tier in use"],"correct":[0],"explanation":"Gradual quality decline without code changes points to a model or prompt change or retrieval drift as the corpus grew. Compare to an eval set and check model, prompt and corpus.","mnemonic":"Slow slide, no code: eval set, then model, prompt, corpus."},{"id":"d7s4q03","concept":"latency-first-action","type":"single","stem":"Latency has spiked in a production deployment. What is the best first action?","options":["Use traces to find the slowest span: token counts, slowest tool, cache behavior","Switch the whole team to a smaller model immediately to cut latency","Rewrite CLAUDE.md so that the responses become much shorter","Raise the per-user rate cap so requests stop queueing up"],"correct":[0],"explanation":"Likely causes are context growth, a slow tool, or a cache that stopped hitting. Traces find the slowest span before any change is made, linking back to production observability.","mnemonic":"Find the slowest span before changing anything."},{"id":"d7s4q04","concept":"intermittent-tool-failures","type":"single","stem":"A tool call fails intermittently, and only for some users. Which first action best fits?","options":["Re-run the eval set against the current prompt and model version","Check whether retrieval drift set in as the corpus has grown","Compare the per-request model tier against the budget model","Inspect the tool's auth and limits; trace one failed call end to end"],"correct":[3],"explanation":"Intermittent tool failures usually trace to authorization, rate limits, or an unhandled error path. Inspect auth and limits and trace a single failed call end to end.","mnemonic":"Flaky tool: auth, limits, error path; trace one call."},{"id":"d7s4q05","concept":"cost-without-usage","type":"single","stem":"Spend rose though request volume stayed flat. Which first action is most appropriate?","options":["Check per-request model tier and cache hit rate against the budget model","Tighten the escalation path so that cost incidents reach the Architect sooner","Trace the slowest tool call in the request path end to end","Compare the eval set results against those of the previous release"],"correct":[0],"explanation":"Cost rising without a usage change suggests model tier crept up or caching regressed. Check per-request tier and cache hit rate against the budget model.","mnemonic":"Flat usage, rising cost: tier crept, cache slipped."},{"id":"d7s4q06","concept":"runbook-purpose","type":"single","stem":"What is the purpose of a runbook for a deployment?","options":["To capture known symptom, cause and action paths for recurring issues","To replace the monitoring dashboards the team already runs","To record who is on call for each weekend and holiday","To document the original architecture decisions for later auditors"],"correct":[0],"explanation":"A runbook captures known symptom-to-cause-to-action paths. The symptom-to-cause table is its foundation, letting the team handle recurring issues independently.","mnemonic":"Runbook: known symptom, cause, action. No Architect needed."},{"id":"d7s4q07","concept":"escalation-path","type":"single","stem":"What does an escalation path define?","options":["Which dashboards should be turned red during an incident","Who handles what, and when an issue leaves the team","Which model tier each support ticket is processed on","The weekly report schedule the Architect follows for the team"],"correct":[1],"explanation":"An escalation path identifies who handles what and when an issue crosses the team's boundary, so people know what to resolve and what to escalate.","mnemonic":"Escalation: who handles what, and when."},{"id":"d7s4q08","concept":"translation-not-firefighting","type":"single","stem":"Teaching the team a symptom-to-cause path costs more of the Architect's time than fixing one incident directly. Why is it still the right approach?","options":["Incidents never recur once the Architect has fixed them once","Teams are prohibited from touching production without the Architect","It is the only support that reduces future load rather than repeating it","It removes the need for the team to keep any runbook"],"correct":[2],"explanation":"Teaching costs more up front but is the only version of support that reduces future load. The goal is a team that needs the Architect only for new problems.","mnemonic":"Teach once, pay once; fix alone, pay forever."},{"id":"d7s4q14","concept":"runbook-purpose","type":"single","stem":"An Architect could resolve a recurring incident herself in minutes. What is the durable fix?","options":["Resolve it personally each time, since speed limits the impact on users","Add more dashboards so the team sees the incident sooner next time","Route every future incident of this kind directly to the Architect","Help the team write a runbook entry and define the escalation path"],"correct":[3],"explanation":"The fast fix is to resolve it yourself, but the durable fix is to help the team create a runbook entry and identify the escalation path so it resolves the next occurrence without the Architect. Routing everything to the Architect is firefighting that repeats the load.","mnemonic":"Fast fix: do it yourself. Durable fix: runbook plus escalation path."},{"id":"d7s4q15","concept":"slow-degradation-risk","type":"single","stem":"For a team that owns a production deployment, what is the biggest operational failure mode to guard against?","options":["Loud outages that page the whole team at once and force a rushed fix","Excess alerting that gradually wears down the engineers on call","A slow degradation nobody connects to a cause, lasting until a scheduled review","Cost increases hidden because caching quietly masks the real spend"],"correct":[2],"explanation":"The biggest failure mode is a slow degradation that no one connects to a cause, so it runs until a scheduled review catches it rather than being caught the day it starts. Loud outages get noticed at once; a runbook entry for gradual decline helps catch the quiet ones.","mnemonic":"Quiet slide, no cause linked, waits for the next review."},{"id":"d7s4q11","concept":"latency-first-action","type":"multi","stem":"Which TWO are likely architecture causes of a latency spike? Select TWO.","options":["Authorization tokens expired","Context size per request has grown","A cache stopped hitting","Retrieval drift as the corpus grows","The model tier crept up"],"correct":[1,2],"explanation":"Latency spikes trace to context growth, a slow tool, or a cache that stopped hitting. Retrieval drift affects quality, tier creep affects cost, and expired auth causes tool failures.","mnemonic":"Slow means big context, slow tool, or cold cache."},{"id":"d7s4q12","concept":"cost-without-usage","type":"multi","stem":"Which TWO are likely causes when cost rises without a usage change? Select TWO.","options":["An unhandled error path in a tool call","The model tier crept up over time","Retrieval drift as the corpus grew","A new eval set was added to the suite","Caching regressed and hit rate fell"],"correct":[1,4],"explanation":"Cost increases with flat usage point to model tier creep or a caching regression. Error paths cause tool failures and retrieval drift causes quality decline.","mnemonic":"Cost up, usage flat: tier crept, cache failed."},{"id":"d7s4q13","concept":"intermittent-tool-causes","type":"multi","stem":"A tool used by a production agent fails intermittently. Which THREE are the likely architecture causes? Select THREE.","options":["Retrieval drift as the corpus kept growing","An authorization problem on the tool's credentials or scope","Rate limits on the tool being reached under load","The model tier creeping up across requests over time","An unhandled error path in the tool integration"],"correct":[1,2,4],"explanation":"Intermittent tool failures usually trace to authorization, rate limits or an unhandled error path; the first action is to inspect auth and limits and trace one failed call end to end. Retrieval drift explains gradual quality decline, and tier creep explains cost rising without usage change.","mnemonic":"Flaky tool? Auth, limits, unhandled path: trace one failure."}]}]}]};

function stats(qs){
  let seen=0, right=0;
  qs.forEach(q=>{ const r=P.q[q.id]; if(r&&r.n){ seen++; if(r.last) right++; } });
  return {total:qs.length, seen, right, mastery: qs.length? Math.round(100*right/qs.length):0, acc: seen? Math.round(100*right/seen):0, cover: qs.length? Math.round(100*seen/qs.length):0};
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function spread(list){ // random order, but keep same-concept variants apart where possible
  const a = shuffle(list);
  for(let i=1;i<a.length;i++){
    if(a[i].concept===a[i-1].concept){
      for(let j=i+1;j<a.length;j++){ if(a[j].concept!==a[i-1].concept && (i+1>=a.length || a[j].concept!==a[i+1]?.concept)){ [a[i],a[j]]=[a[j],a[i]]; break; } }
    }
  }
  return a;
}

const weak = qs => qs.filter(q=>{ const r=P.q[q.id]; return !r||!r.n||!r.last; });
const MIX_LEN = 20;
/* random draw of k questions: unseen/missed first (shuffled), topped up with already-correct ones (shuffled) */
function pick(qs,k){
  const w = shuffle(weak(qs)), wid = new Set(w.map(q=>q.id));
  const rest = shuffle(qs.filter(q=>!wid.has(q.id)));
  return spread(w.concat(rest).slice(0,Math.min(k,qs.length)));
}
const attempted = qs => qs.some(q=>P.q[q.id]&&P.q[q.id].n);

/* Subject quiz: first run serves every question. Retakes serve only missed + unanswered. */
function quizLabel(sub){
  const w = weak(sub.questions);
  if(!attempted(sub.questions)) return "Start quiz";
  return w.length ? `Retake missed (${w.length})` : "Mastered ✓";
}
function startSubjectQuiz(sub){
  const w = weak(sub.questions);
  if(!attempted(sub.questions)) return startSession({title:sub.title, dom:sub.domain, qs:spread(sub.questions), back:["subject",sub.id]});
  if(w.length) return startSession({title:sub.title+" (retake)", dom:sub.domain, qs:spread(w), back:["subject",sub.id]});
  choice(`You have answered all ${sub.questions.length} questions in this subject correctly.`,
    [{label:"Start full quiz again", primary:true, fn:()=>startSession({title:sub.title, dom:sub.domain, qs:spread(sub.questions), back:["subject",sub.id]})},
     {label:"Cancel"}]);
}
function restartSubject(sub){

  };
  const pick = b=>{
    if(sess.done) return; const oi=+b.dataset.oi;
    if(multi){ if(sess.picked.has(oi)) sess.picked.delete(oi); else if(sess.picked.size<need) sess.picked.add(oi); }
    else { sess.picked=new Set([oi]); }
    refresh();
  };
  btns.forEach(b=>b.onclick=()=>pick(b));
  sess.keyHandler = e=>{
    if(e.target.closest && e.target.closest(".modal")) return;
    const k = parseInt(e.key,10);
    if(!sess.done && k>=1 && k<=btns.length){ pick(btns[k-1]); e.preventDefault(); }
    else if(e.key==="Enter"){ if(!go_.disabled){ e.preventDefault(); go_.click(); } }
  };
  document.onkeydown = sess.keyHandler;
  go_.onclick = ()=> sess.done ? advance() : submit(q,btns,order,go_);
  $("#quit").onclick=()=>{ if(sess.results.length && !confirmQuit()) return; document.onkeydown=null; go(...sess.back); };
}
function confirmQuit(){ return window.confirm("Leave this quiz? Answers already checked are saved.") }
function submit(q,btns,order,go_){
  const picked = [...sess.picked].sort(), right = [...q.correct].sort();
  const ok = picked.length===right.length && picked.every((v,i)=>v===right[i]);
  sess.done = true;
  btns.forEach(b=>{
    const oi=+b.dataset.oi, isC=q.correct.includes(oi), isP=sess.picked.has(oi);
    b.disabled=true; b.classList.remove("sel");
    const flag=b.querySelector(".flag");
    if(isC && isP){ b.classList.add("right"); flag.textContent="Correct"; }
    else if(isC){ b.classList.add("right","missed"); flag.textContent= ok?"":"Correct answer"; }
    else if(isP){ b.classList.add("wrong"); flag.textContent="Your pick"; }
  });
  const r = P.q[q.id] || {n:0,c:0,last:0}; r.n++; if(ok) r.c++; r.last = ok?1:0; r.t=Date.now(); P.q[q.id]=r; save();
  sess.results.push({q, ok, picked:[...sess.picked]});
  const correctText = q.correct.map(i=>q.options[i]);
  $("#fb").innerHTML = ok
   ? `<div class="fb ok"><h4>Correct</h4><p>${esc(q.explanation)}</p><div class="mnemonic"><span class="m">Hook</span><q>${esc(q.mnemonic)}</q></div></div>`
   : `<div class="fb no"><h4>Not quite &mdash; ${q.correct.length>1?'the correct answers are':'the correct answer is'}:</h4>
      ${correctText.map(t=>`<p style="margin:0 0 6px"><b>&bull; ${esc(t)}</b></p>`).join("")}
      <p style="margin-top:10px">${esc(q.explanation)}</p><div class="mnemonic"><span class="m">Mnemonic</span><q>${esc(q.mnemonic)}</q></div></div>`;
  const last = sess.i===sess.qs.length-1;
  go_.disabled=false; go_.textContent= last? "See results" : "Next question";
  $("#hint").textContent="Press Enter to continue.";
  go_.focus();
  renderChrome();
}
function advance(){
  if(sess.i < sess.qs.length-1){ sess.i++; viewQuestion(); window.scrollTo({top:0}); }
  else { finishSession(); }
}
function finishSession(){
  document.onkeydown=null;
  const ok = sess.results.filter(r=>r.ok).length;
  P.sessions.push({t:Date.now(), title:sess.title, dom:sess.dom, ok, n:sess.results.length}); P.sessions=P.sessions.slice(-60); save();
  go("results");
}

/* ---------- results ---------- */
function viewResults(){
  const res = sess.results, n = sess.dom, ok = res.filter(r=>r.ok).length, pct = res.length? Math.round(100*ok/res.length):0;
  const pass = pct>=PASS, missed = res.filter(r=>!r.ok);
  const bySub = {}; res.forEach(r=>{ const s=r.q.subject; (bySub[s]=bySub[s]||{ok:0,n:0}); bySub[s].n++; if(r.ok) bySub[s].ok++; });
  const dstat = stats(allQ(n));
  app.innerHTML = `<div style="--dc:${dcol(n)}">
  <div class="crumbs"><button data-h>All domains</button> &rsaquo; <button data-d>Domain ${n}</button> &rsaquo; Results</div>
  <div class="panel resbig ${pass?'pass':'fail'}" style="margin-top:14px"><div class="big">${pct}%</div><div class="verdict">${pass?`Pass level reached (${PASS}% needed)`:`Below the ${PASS}% pass level`}</div>
    <div style="color:var(--muted)">${ok} of ${res.length} correct &middot; ${esc(sess.title)}</div>
    <div style="max-width:420px;margin:18px auto 0"><div class="mini" style="justify-content:center">Domain ${n} mastery now <b style="color:var(--text)">${dstat.mastery}%</b></div><div style="margin-top:8px">${barHTML(dstat.mastery,n)}</div></div></div>
  ${Object.keys(bySub).length>1?`<div class="panel" style="margin:16px 0"><h3>By subject</h3>${Object.entries(bySub).map(([s,v])=>`<div class="sub-res"><span>${esc(bySubject[s].title)}</span><b>${v.ok}/${v.n}</b></div>`).join("")}</div>`:""}
  <div class="cta" style="margin-top:20px">
    ${missed.length?`<button class="btn primary" id="retry">Retry the ${missed.length} missed</button>`:""}
    <button class="btn dom" id="again">Run again (new order)</button><button class="btn ghost" id="back">Back</button></div>
  ${missed.length?`<h3 style="margin-top:30px">Review what you missed</h3>${missed.map(r=>`<div class="miss"><div class="s">${esc(r.q.stem)}</div>
     ${r.q.correct.map(i=>`<div class="a"><b>Correct:</b> ${esc(r.q.options[i])}</div>`).join("")}
     <div class="a">${esc(r.q.explanation)}</div>
     <div class="mnemonic" style="margin-top:10px"><span class="m">Mnemonic</span><q>${esc(r.q.mnemonic)}</q></div></div>`).join("")}`:`<div class="panel empty">A clean sweep. Nothing to review.</div>`}
  <div style="height:40px"></div></div>`;
  $("[data-h]").onclick=()=>go("home");
  $("[data-d]").onclick=()=>go("domain",n);
  $("#back").onclick=()=>go(...sess.back);
  $("#again").onclick=()=>startSession({title:sess.title, dom:n, qs:spread(sess.qs.map(x=>x)), back:sess.back});
  const rt=$("#retry"); if(rt) rt.onclick=()=>startSession({title:sess.title+" (retry)", dom:n, qs:spread(missed.map(r=>r.q)), back:sess.back});
}

go("home");
</script>
</body>
