<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAR-P Study Aid</title>
<style>
:root{
  --bg:#0c1016; --bg2:#10151d; --surface:#161c26; --surface2:#1c2431; --line:#273041; --line2:#344055;
  --text:#e6ebf2; --muted:#9aa6b8; --dim:#6f7b8e;
  --good:#4cc38a; --good-bg:rgba(76,195,138,.12); --bad:#f0647a; --bad-bg:rgba(240,100,122,.12); --warn:#e8b04a;
  --accent:#7aa7ff; --radius:14px;
  --d1:#6ea8fe; --d2:#a48cf4; --d3:#35c2b0; --d4:#e6b04b; --d5:#ea6f86; --d6:#66c47a; --d7:#e08a52;
  --shadow:0 6px 24px rgba(0,0,0,.35);
  font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#162033 0,transparent 60%),var(--bg);color:var(--text);line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(12,16,22,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;background:none;border:0;padding:0}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#7aa7ff,#a48cf4);display:grid;place-items:center;color:#0c1016;font-weight:800;font-size:14px}
.brand small{display:block;color:var(--dim);font-weight:500;font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.spacer{flex:1}
.overall{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.overall .bar{width:130px}
.btn{background:var(--surface);border:1px solid var(--line);padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;transition:.15s}
.btn:hover{border-color:var(--line2);background:var(--surface2)}
.btn.primary{background:var(--accent);color:#08101f;border-color:transparent}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dom{background:color-mix(in srgb,var(--dc) 22%,var(--surface));border-color:color-mix(in srgb,var(--dc) 45%,var(--line));}
.btn.dom:hover{background:color-mix(in srgb,var(--dc) 32%,var(--surface))}

/* progress bar */
.bar{position:relative;height:8px;border-radius:99px;background:#222b3a;overflow:visible}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--dc,var(--accent));transition:width .4s}
.bar>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:#cfd8e6;opacity:.7;border-radius:2px}
.bar.pass>i{background:var(--good)}

h1{font-size:30px;line-height:1.2;margin:34px 0 8px;letter-spacing:-.4px}
h2{font-size:21px;margin:0 0 6px;letter-spacing:-.2px}
h3{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
p.lead{color:var(--muted);max-width:760px;margin:0 0 22px}
.crumbs{margin:22px 0 4px;font-size:13px;color:var(--dim)}
.crumbs button{background:none;border:0;color:var(--muted);padding:0;text-decoration:underline;text-underline-offset:3px}
.crumbs button:hover{color:var(--text)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;margin-bottom:60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden;transition:.18s}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--dc) 50%,var(--line));box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dc,var(--accent));opacity:.9}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(400px 120px at 0 0,color-mix(in srgb,var(--dc) 10%,transparent),transparent);pointer-events:none}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--dc);margin-bottom:8px}
.tag .w{color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:12px 0 0}
.stat{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin:14px 0 7px}
.stat strong{font-size:22px;color:var(--text);font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);letter-spacing:.3px}
.chip.good{color:var(--good);border-color:rgba(76,195,138,.5);background:var(--good-bg)}
.chip.warn{color:var(--warn);border-color:rgba(232,176,74,.45)}
.chip.bad{color:var(--bad);border-color:rgba(240,100,122,.45)}

.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin:6px 0 26px}
@media(max-width:820px){.hero{grid-template-columns:1fr}.overall .bar,.overall span.t{display:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.big{font-size:44px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.legend{font-size:12.5px;color:var(--dim);margin:6px 0 40px;max-width:800px}

/* subject rows */
.subj{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:16px 18px;margin-bottom:10px}
.subj h2{font-size:17px}
.subj .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:700px){.subj{grid-template-columns:1fr}.subj .actions{justify-content:flex-start}}
.mini{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.mini .bar{width:180px;max-width:46vw}

/* learn page */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.list{margin:0;padding:0;list-style:none}
.list li{position:relative;padding:9px 0 9px 26px;border-bottom:1px dashed var(--line);font-size:15px}
.list li:last-child{border-bottom:0}
.list.learn li::before{content:"";position:absolute;left:3px;top:17px;width:8px;height:8px;border-radius:2px;background:var(--dc)}
.list.trap li::before{content:"!";position:absolute;left:2px;top:9px;width:16px;height:16px;border-radius:50%;background:rgba(232,176,74,.18);color:var(--warn);font-weight:800;font-size:11px;display:grid;place-items:center}
.list strong{color:#fff}
.callout{border:1px solid rgba(232,176,74,.35);background:rgba(232,176,74,.05)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 60px}

/* quiz */
.qhead{display:flex;align-items:center;gap:14px;margin:22px 0 16px;flex-wrap:wrap}
.qhead .bar{flex:1;min-width:120px}
.qhead .cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;position:relative;margin-bottom:20px;border-top:3px solid var(--dc)}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-bottom:14px}
.qmeta .tag{margin:0}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.5px}
.badge.single{background:rgba(122,167,255,.14);color:var(--accent)}
.badge.multi{background:rgba(232,176,74,.14);color:var(--warn)}
.stem{font-size:18.5px;line-height:1.55;margin:0 0 20px;font-weight:500}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:14px 16px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line);transition:.12s;font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--line2);background:var(--surface2)}
.opt .k{flex:0 0 28px;height:28px;border-radius:8px;border:1.5px solid var(--line2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted);margin-top:-1px}
.opt.multi .k{border-radius:6px}
.opt.sel{border-color:var(--accent);background:rgba(122,167,255,.09)}
.opt.sel .k{background:var(--accent);color:#08101f;border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{background:var(--good);color:#06150d;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#1c050a;border-color:var(--bad)}
.opt.missed{border-style:dashed}
.opt:disabled{cursor:default}
.opt .flag{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;padding-left:10px;align-self:center}
.right .flag{color:var(--good)} .wrong .flag{color:var(--bad)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}
.hint{font-size:13px;color:var(--dim)}
.fb{margin-top:20px;border-radius:12px;padding:18px 20px;border:1px solid var(--line);animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fb.ok{background:var(--good-bg);border-color:rgba(76,195,138,.4)}
.fb.no{background:var(--bad-bg);border-color:rgba(240,100,122,.4)}
.fb h4{margin:0 0 6px;font-size:16px}
.fb.ok h4{color:var(--good)} .fb.no h4{color:var(--bad)}
.fb p{margin:0 0 10px;font-size:15px}
.mnemonic{display:flex;gap:12px;align-items:flex-start;background:rgba(0,0,0,.25);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;padding:12px 14px;font-size:15px}
.mnemonic .m{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--warn);white-space:nowrap;padding-top:3px}
.mnemonic q{quotes:none;font-weight:600;color:#fff}
.sess{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}

/* results */
.resbig{text-align:center;padding:34px 20px}
.resbig .big{font-size:64px}
.resbig .verdict{font-size:20px;font-weight:700;margin:10px 0 4px}
.resbig.pass .big,.resbig.pass .verdict{color:var(--good)}
.resbig.fail .big,.resbig.fail .verdict{color:var(--warn)}
.miss{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:var(--surface)}
.miss .s{font-weight:600;margin-bottom:8px}
.miss .a{font-size:14.5px;color:var(--muted);margin:3px 0}
.miss .a b{color:var(--good)}
.sub-res{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.sub-res:last-child{border:0}
.foot{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--dim);font-size:12.5px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line2);border-radius:var(--radius);padding:26px;max-width:420px;box-shadow:var(--shadow)}
.modal p{color:var(--muted)}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" id="home" aria-label="Home"><span class="logo">CA</span><span>CCAR-P Study Aid<small>Claude Certified Architect &ndash; Professional</small></span></button>
  <div class="spacer"></div>
  <div class="overall" id="overall"></div>
</div></header>
<main class="wrap" id="app"></main>
<div class="wrap foot" id="foot"></div>

<script>
const DATA = {"domains":[{"domain":1,"subjects":[{"id":"d1s1","title":"The four properties architects design around","learn":["Next-token prediction: strong on common patterns (summarize, reformat, explain); weak on precision for names, dates, citations and statistics. Mitigate with citations, uncertainty signaling, generator-verifier loops and tool calls.","Knowledge: reliable for common, recent, consistent topics; unreliable for rare, niche, contested or fast-changing ones. Make an external source of truth (search, RAG, tools, MCP) authoritative.","Working memory is the active context window, a hard edge. Mitigate with progressive context loading, chunking, front-loading critical information and summarizing across turns.","Steerability: short, concrete, verifiable instructions work; abstract instructions, long reasoning chains and precise arithmetic drift. Use structured outputs, code execution and restated goals.","Context errors: oversized prompt gives 400 invalid_request_error; oversized body gives 413 request_too_large; a fitting prompt whose generation hits the ceiling gives model_context_window_exceeded.","Design consequences: non-determinism, context as a finite resource, confidence is not validity, knowledge and capability boundaries."],"traps":["Demo equals determinism: a clean demo proves nothing; the same input can yield different outputs, so certify with evals rather than one observation.","Fluent means correct: wrong answers arrive in the same assured tone as right ones, so verification and human-in-the-loop placement are architecture choices.","Conflating the two limit errors: a rejected oversized request (400/413) is different from a generation truncated at the window ceiling.","Trusting parametric knowledge: for fresh or authoritative facts, bring the data into context yourself rather than relying on training data.","Model as calculator: high-stakes numerical accuracy belongs to deterministic computation or tool execution, not the model."],"questions":[{"id":"d1s1q01","concept":"nexttoken-precision","type":"single","stem":"Which category of output is most at risk of looking accurate while being wrong, because Claude generates text by predicting likely continuations?","options":["Specific names, dates, citations and statistics","Explanations of common programming patterns","Reformatting an existing table into a new layout","Summaries of widely documented, well-established concepts"],"correct":[0],"explanation":"Next-token prediction is strong on common patterns but risk concentrates on precision for specifics such as names, dates, citations and statistics. Summarizing and reformatting well-established material is where the property helps.","mnemonic":"Patterns are cheap, specifics are risky: names, dates, cites, stats."},{"id":"d1s1q02","concept":"nexttoken-precision","type":"single","stem":"A claims assistant must pull the policy start date and claim amount from each document. Which design response best addresses the next-token-prediction limitation?","options":["Raise the model tier so extraction errors become negligible","Verify extracted values against the source of truth with code-based checks","Ask the model to double-check its own extraction in the same prompt","Lengthen the system prompt with more extraction examples"],"correct":[1],"explanation":"Extraction of authoritative values needs verification against the source; generator-verifier loops, code-based evals and tool calls compensate. Self-checking in the same prompt keeps the same fluent-but-unchecked failure mode.","mnemonic":"Precise values get verified against the source, never taken on trust."},{"id":"d1s1q17","concept":"properties-fail-silently","type":"single","stem":"A team ships a system without designing around the four model properties. When one of those properties causes a problem in production, how is the gap most likely to come to light?","options":["The API returns an error that names the property involved","It drifts quietly and is found by an audit or a user","Monitoring raises an alert as soon as outputs start to vary","Pre-launch testing fails on the first batch of clean inputs"],"correct":[1],"explanation":"The properties do not announce themselves: a system that ignores them throws no error, it drifts quietly, and the resulting variable outputs are found in an audit or by an angry user rather than by the system itself. Clean inputs in demos and early testing are exactly where the gap tends not to show, which is why the cost lands after launch.","mnemonic":"No error, no alarm: ignored properties drift quietly until an audit or a user finds them."},{"id":"d1s1q04","concept":"demo-not-determinism","type":"single","stem":"An architect asks why evaluation frameworks are needed if a prototype already behaves well in front of stakeholders. Which answer reflects the right reasoning?","options":["Evaluations are only needed when fine-tuning a model","Evaluations replace the need for human review in production","Evaluations mainly measure token cost rather than behavior","Behavior observed once cannot be certified for a non-deterministic system"],"correct":[3],"explanation":"Because outputs vary across runs, you cannot certify behavior you only observed once; evals exist for exactly this reason. They do not replace human review and are not specific to fine-tuning.","mnemonic":"Seen once is not certified; non-determinism demands evals."},{"id":"d1s1q05","concept":"context-limit-errors","type":"single","stem":"A client sends a request whose raw body exceeds the API's byte limit. Which response should the architect expect?","options":["A 413 request_too_large error before any generation","A truncated output with model_context_window_exceeded","A 400 invalid_request_error saying the prompt is too long","A 429 rate limit error asking for exponential backoff"],"correct":[0],"explanation":"An oversized raw body returns 413 request_too_large, rejected before generation. A 400 invalid_request_error is the token-limit case, and the stop reason is for generation that hits the ceiling.","mnemonic":"Too many tokens is 400; too many bytes is 413."},{"id":"d1s1q06","concept":"context-limit-errors","type":"single","stem":"A request is accepted, but the response stops early with a model_context_window_exceeded stop reason and truncated output. What happened?","options":["The raw request body exceeded the API byte limit","The prompt fit, but generation ran into the window ceiling","The API throttled the request because of a rate limit","The prompt was rejected before generation as too many tokens"],"correct":[1],"explanation":"This stop reason describes a prompt that fit but whose generation hit the window ceiling and stopped early. Oversized requests are rejected up front with 400 or 413 and never generate at all.","mnemonic":"Fits going in, hits the ceiling coming out: truncated, not rejected."},{"id":"d1s1q07","concept":"knowledge-external-truth","type":"single","stem":"A legal-research tool must answer questions about a regulation amended last month. Which mitigation fits the knowledge property best?","options":["Rely on parametric knowledge and add an uncertainty disclaimer","Ask the model to cite years from memory for each claim","Use retrieval or tools so the current source is authoritative","Fine-tune on older regulation text to improve recall"],"correct":[2],"explanation":"For rare, contested or frequently changing topics, make an external system the source of truth through search, RAG, tools or MCP. Memory-based citing leaves the model supplying stale knowledge in a confident tone.","mnemonic":"Fast-changing facts: let the source answer, not the model's memory."},{"id":"d1s1q08","concept":"knowledge-external-truth","type":"single","stem":"Which statement best describes how Claude behaves when asked about a rare or fast-changing topic outside its reliable knowledge?","options":["It refuses to answer and returns a context-window stop reason","It automatically queries an external source to refresh itself","It signals low confidence before answering in most cases","It may give stale or incomplete information in its usual confident tone"],"correct":[3],"explanation":"The limitation is that stale or incomplete information can be presented with the same confidence as established facts. The model does not reliably flag the gap or refresh itself.","mnemonic":"Stale facts arrive in the same confident voice as fresh ones."},{"id":"d1s1q09","concept":"working-memory-mitigation","type":"multi","stem":"A support assistant's conversations are growing long and critical instructions are being lost. Which TWO working-memory mitigations apply? Select TWO.","options":["Restate every instruction in capital letters each turn","Switch to a higher temperature for variety","Remove the system prompt to save tokens","Front-load the critical information in context","Summarize across turns as context grows"],"correct":[3,4],"explanation":"Working-memory mitigations include progressive context loading, chunking, front-loading critical information and summarizing across turns. Removing the system prompt or changing sampling does not manage what stays in scope.","mnemonic":"Summarize as you go, front-load what matters."},{"id":"d1s1q10","concept":"confidence-not-validity","type":"single","stem":"Why are human-in-the-loop placement and verification described as architectural choices rather than afterthoughts?","options":["Claude's wrong answers look as fluent and assured as right ones","Regulators require review for every model call regardless of risk","Human review is cheaper than writing automated evaluations","Claude cannot produce output without an approving human present"],"correct":[0],"explanation":"Confidence is not validity: a wrong answer arrives in the same assured tone as a correct one, so detection must be designed in. The other options overstate requirements or invent cost claims.","mnemonic":"Fluency fools; design the check in, do not bolt it on."},{"id":"d1s1q11","concept":"steerability-limits","type":"multi","stem":"Which TWO task types does the steerability property flag as places where Claude can drift from intent? Select TWO.","options":["Abstract or ambiguous instructions","Tasks with explicit length limits and clear roles","Short instructions with a defined output format","Tasks requiring precise numerical or logical computation","Summarizing a document that fits in context"],"correct":[0,3],"explanation":"Abstract or ambiguous instructions, long reasoning chains, and precise numerical or logical computation are the limits; short, concrete, verifiable instructions are the capability. For high-stakes numbers, deterministic computation or tool execution owns the answer.","mnemonic":"Vague in, drift out; arithmetic belongs to code."},{"id":"d1s1q12","concept":"steerability-limits","type":"single","stem":"A finance workflow needs exact totals across thousands of invoices, and the model sometimes follows the letter of an instruction but misses its intent. What is the best design response?","options":["Ask the model to average its answers over several runs","Let deterministic computation or tool execution own the totals","Move the totals into the system prompt as examples","Rely on a longer chain of reasoning in a single call"],"correct":[1],"explanation":"For high-stakes numerical accuracy, deterministic computation or tool execution should own the answer, and restated goals help when intent and wording diverge. Long reasoning chains are a named steerability weak spot.","mnemonic":"Money math goes to code, not to chain-of-thought."},{"id":"d1s1q13","concept":"oversized-request-400","type":"single","stem":"A team sends one prompt whose token count exceeds the model's limit, although the raw request body is well under the byte limit. What should they expect?","options":["A 413 request_too_large error, because the request is too large to send","A 400 invalid_request_error saying the prompt is too long, before generation","A response that stops early with a model_context_window_exceeded stop reason","A truncated response in which the oldest turns are silently dropped first"],"correct":[1],"explanation":"A prompt over the model's token limit is an oversized request, rejected before generation with a 400 invalid_request_error saying the prompt is too long. A 413 request_too_large applies when the raw body exceeds the byte limit, and model_context_window_exceeded applies when the prompt fits but generation runs into the window ceiling.","mnemonic":"Too many tokens: 400. Too many bytes: 413. Fits but runs out: stop reason."},{"id":"d1s1q14","concept":"oversized-request-400","type":"multi","stem":"An architect wants to avoid hitting the context-window edge in production rather than learning about it from errors. Which TWO practices fit? Select TWO.","options":["Retry any 400 prompt-too-long error with exponential backoff","Check the usage field returned on every response","Raise the byte limit so that 413 errors stop occurring","Call the token-counting API before sending large requests","Wait for a model_context_window_exceeded reason, then trim"],"correct":[1,3],"explanation":"To stay clear of the limit, check the usage field on every response and use the token-counting API before sending. Retrying an oversized request with backoff fails the same way every time, because the request itself is too large; backoff is for transient errors.","mnemonic":"Count before you send; read usage when it lands."},{"id":"d1s1q15","concept":"restate-goal-with-instruction","type":"single","stem":"A prompt tells Claude to keep every shift handover note under 80 words. The notes now meet the limit but sometimes drop the one allergy warning the next nurse needs. Which change best addresses this steerability risk?","options":["Raise the limit to 200 words so the model has room for every detail","Move the word limit into a hook so the model cannot exceed it","Restate the goal beside the limit: the note must let the next shift act safely","Add extended thinking so the model reasons longer about each note"],"correct":[2],"explanation":"The model followed the letter of the length instruction and missed its intent. When intent and literal instruction might diverge, restate the goal explicitly alongside the instruction. Enforcing the limit with a hook would make the letter even stricter, and a bigger limit still does not say what must never be dropped.","mnemonic":"Letter without intent? Say the goal out loud beside the rule."},{"id":"d1s1q16","concept":"restate-goal-with-instruction","type":"multi","stem":"Which TWO mitigations does the steerability property call for? Select TWO.","options":["Restate the goal explicitly whenever intent and the literal instruction could diverge","Rely on longer reasoning chains so the model checks its own arithmetic","Prefer abstract, open-ended instructions so the model can infer the intent","Use system prompts, structured outputs and code execution where logic must be precise","Route factual lookups of names and dates through retrieval or web search"],"correct":[0,3],"explanation":"Steerability is mitigated with system prompts, structured outputs and code execution for logical precision, and by restating the goal alongside an instruction when intent and letter might diverge. Long reasoning chains and abstract instructions are listed as steerability limitations, and routing lookups through retrieval mitigates the knowledge and next-token properties.","mnemonic":"Steer with structure and say why: system prompt, schema, code, plus the goal."}]},{"id":"d1s2","title":"Three layers and seven primitives","learn":["Three layers: entry points (Claude.ai, Claude Code, custom app), build-time interfaces (direct API, SDKs, MCP, Agent SDK), delivery routes (Anthropic directly, Bedrock, Vertex AI, Foundry).","Each layer answers a different question for a different stakeholder: user and work, engineering team and integration, cloud commitments and compliance posture. A choice in one rarely dictates the others.","Seven primitives and jobs: Tools act, MCP connects, Subagents isolate or parallelise, Hooks guarantee, Skills package a procedure, Agent Teams coordinate peers, Dynamic Workflows compose at runtime.","Hooks are deterministic code firing on defined events to enforce a rule the model cannot skip.","Patterns are assemblies of primitives: a workflow is steps wired in your code, an agent is the model choosing its own tool sequence, multi-agent is an orchestrator delegating to subagents.","Use the fewest primitives necessary; without a shared vocabulary teams cannot communicate, because they do not agree on what the parts are."],"traps":["Collapsing the layers: the same model sits under every entry point, but the entry point is the wrapper; choose it for the user and the work.","Choosing the entry point before naming the user: an avoidable and common architecture error.","Heavier than needed: a team of agents where a single tool call would suffice costs latency, tokens and operational surface every request.","Hooks versus prompts: a rule that must never be skipped needs a hook, not an instruction the model may ignore.","Undefined vocabulary: if the team does not agree on what the parts are, it cannot communicate; name the primitive or pattern meant before debating the design."],"questions":[{"id":"d1s2q01","concept":"three-layers-definition","type":"single","stem":"Which set correctly lists examples of build-time interfaces, the layer an engineer programs against?","options":["Claude.ai, Claude Code and a custom application built on the API","Tools, Hooks, Skills and Subagents as the seven primitives","The direct API, the SDKs, MCP and the Agent SDK","Anthropic directly, AWS Bedrock, GCP Vertex AI and Microsoft Foundry"],"correct":[2],"explanation":"Build-time interfaces are how an engineer programs against Claude: the direct API, SDKs, MCP and the Agent SDK. Claude.ai and Claude Code are entry points, and Bedrock or Vertex AI are delivery routes.","mnemonic":"Entry = who touches it; Build = how code talks; Route = where traffic lands."},{"id":"d1s2q02","concept":"three-layers-definition","type":"single","stem":"A partner insists on running all Claude traffic through its existing AWS commitments for compliance reasons. Which layer is this decision, and who drives it?","options":["Build-time interface, chosen for the engineering team","Primitive, chosen by the orchestrating agent","Entry point, chosen for the end user and the work","Delivery route, chosen for cloud commitments and compliance"],"correct":[3],"explanation":"Delivery routes determine whose infrastructure the request runs on and are chosen for cloud commitments and compliance posture. Entry points suit users and work; build-time interfaces suit the engineering team.","mnemonic":"Routes follow the cloud contract and the compliance officer."},{"id":"d1s2q15","concept":"three-layers-independence","type":"single","stem":"A design document fixes the entry point in its opening section and only identifies who the users are three sections later. Which architecture error does this show?","options":["Choosing the delivery route before confirming the partner's cloud commitments","Choosing the build-time interface before the engineering team is consulted","Picking the entry point before naming the user, a layer-collapse error","Choosing the model tier before the latency budget has been agreed"],"correct":[2],"explanation":"An entry point is chosen for the user and the work, so choosing it before the user is named is a common and avoidable error, usually traceable to collapsing the three layers into one concept. The delivery route and build-time interface are separate decisions for other stakeholders and are not what went wrong here.","mnemonic":"Name the user first; the entry point follows the user and the work."},{"id":"d1s2q04","concept":"primitive-jobs","type":"single","stem":"A compliance rule says no refund over a set value may be issued without approval, and the model must not be able to skip it. Which primitive fits best?","options":["Subagents, to isolate the refund step in its own context","Hooks, to enforce the rule in deterministic code on events","Skills, to package the refund procedure as a versioned unit","MCP, to expose the refund service to several clients"],"correct":[1],"explanation":"Hooks are deterministic code firing on defined events to enforce a rule the model cannot skip. A Skill packages a procedure but does not guarantee compliance, and MCP only connects tools.","mnemonic":"Hooks guarantee: code the model cannot talk its way past."},{"id":"d1s2q05","concept":"primitive-jobs","type":"single","stem":"Match the primitive to its one-line job: which statement about Skills is correct?","options":["A separate context for running a scoped sub-task in parallel","A rule enforced on events that the model cannot skip","A versioned, reusable unit packaging a repeatable procedure","A protocol exposing tools to multiple Claude clients"],"correct":[2],"explanation":"Skills package a repeatable procedure as a versioned, reusable unit of instructions plus optional scripts. The protocol is MCP, the isolated context is a Subagent, and the unskippable rule is a Hook.","mnemonic":"Skill equals a procedure in a box, versioned and reusable."},{"id":"d1s2q06","concept":"primitive-jobs","type":"single","stem":"Several different Claude clients inside an enterprise need to reach the same set of internal tools. Which primitive's job is this?","options":["Dynamic Workflows, which compose the clients at runtime","Tools, because each client defines its own functions","Hooks, because they fire on shared events","MCP, a protocol exposing tools to multiple clients"],"correct":[3],"explanation":"MCP connects: it is a protocol for exposing tools so multiple Claude clients can reach them. A Tool alone is a function the model can call from your code, without the cross-client sharing.","mnemonic":"Tools act; MCP connects many clients to the same tools."},{"id":"d1s2q07","concept":"fewest-primitives","type":"single","stem":"A team proposes an Agent Team to look up one order status for each chat message. Which principle does this violate?","options":["Use the fewest primitives necessary to meet the requirement","Place every checkpoint before the first model call","Always pin the model version in configuration","Prefer Skills over tools for all lookups"],"correct":[0],"explanation":"Reaching for a heavier primitive than the job requires costs latency, tokens and operational surface every request, and a single tool call would suffice. Each primitive added is another part to build, observe and govern.","mnemonic":"One tool call beats a team; fewest parts that do the job."},{"id":"d1s2q16","concept":"agent-vocabulary","type":"single","stem":"An architecture team starts debating patterns without first agreeing what tools, subagents, hooks and the other primitives mean. What risk does this create?","options":["Members talk past each other, not agreeing what the parts are","Higher token cost on every request the finished system serves","Slower approval of the delivery route by the partner's compliance team","Weaker eval coverage, because eval sets cannot be labelled consistently"],"correct":[0],"explanation":"Without a shared vocabulary, teams cannot communicate effectively because they do not agree on what the parts are. Naming the primitives once makes later patterns combinations of parts everyone recognizes. Extra token cost comes from reaching for heavier primitives than needed, not from missing vocabulary.","mnemonic":"No shared names, no shared design: agree what the parts are first."},{"id":"d1s2q09","concept":"agent-vocabulary","type":"multi","stem":"Which TWO statements correctly describe patterns as assemblies of the seven primitives? Select TWO.","options":["A workflow is steps wired together in your own code","A multi-agent system is a single call with extended thinking","A workflow means the model decides every step at runtime","An agent is the model choosing its own sequence of tool calls","An agent is always an orchestrator delegating to peers"],"correct":[0,3],"explanation":"A workflow wires steps in your code, often using tools, while an agent is the model choosing its own tool-call sequence. A multi-agent system is an orchestrator delegating to subagents, not a single call.","mnemonic":"Workflow: your code picks the path. Agent: the model picks it."},{"id":"d1s2q10","concept":"three-layers-independence","type":"multi","stem":"Which TWO statements about the three layers are correct? Select TWO.","options":["A choice in one layer rarely dictates the others","Every deployment involves all three layers","Build-time interface is chosen for compliance posture","Delivery route decides which end user reaches Claude","The three layers are alternatives; pick exactly one"],"correct":[0,1],"explanation":"The layers are not alternatives: every deployment involves all three, and each is a separate decision for a different stakeholder. Confusing them is the most common source of muddled architecture conversations.","mnemonic":"Three layers, three questions, three stakeholders; all always present."},{"id":"d1s2q17","concept":"primitive-jobs-parallel","type":"single","stem":"A parent agent wants each of several independent research questions handled away from its own context, so the intermediate notes do not crowd it. Which primitive carries that job?","options":["Hooks, firing deterministic code on each research event","Skills, packaging the research method as a versioned unit","MCP, exposing the research tools to multiple Claude clients","Subagents, each taking a scoped sub-task in a separate context"],"correct":[3],"explanation":"Subagents hand a scoped sub-task to a separate context so the work runs in isolation, or in parallel where useful, without filling the parent's context. A Skill packages a procedure but does not give it its own context, and MCP only connects tools to clients.","mnemonic":"Keep the parent's context clean: hand the chore to a subagent."},{"id":"d1s2q12","concept":"primitive-jobs-dynamic","type":"single","stem":"A platform assembles the steps of each job at runtime based on the request, rather than fixing them in advance. Which primitive describes this?","options":["Skills, packaging a repeatable procedure","MCP, exposing tools to many clients","Agent Teams, coordinating peers on a goal","Dynamic Workflows, composing steps at runtime"],"correct":[3],"explanation":"Dynamic Workflows compose the steps of a workflow at runtime. Agent Teams are coordinated peers each owning part of a larger goal, a different job.","mnemonic":"Peers coordinate; workflows compose at runtime."},{"id":"d1s2q13","concept":"subagents-vs-agent-teams","type":"single","stem":"A program runs three long-lived agents that each own one part of a product launch (pricing, legal review, messaging) and coordinate as equals toward a single goal. Which primitive describes this?","options":["Subagents, each handed a scoped sub-task in a separate context","Agent Teams, coordinated peers each owning part of a larger goal","Dynamic Workflows, which assemble the steps at runtime instead","Skills, versioned units that each package a repeatable procedure"],"correct":[1],"explanation":"Agent Teams are multiple agents working as coordinated peers, each owning part of a larger goal. Subagents are scoped sub-tasks handed to a separate context for isolation or parallelism; they return results to a parent rather than owning part of the goal as peers.","mnemonic":"Subagents take a ticket; teammates own a territory."},{"id":"d1s2q14","concept":"subagents-vs-agent-teams","type":"single","stem":"A parent agent must review 30 independent log files, each in a clean context, and simply combine the findings returned. A colleague proposes an Agent Team. What is the better fit?","options":["An Agent Team, since thirty files need peers that coordinate as equals","Hooks, since each file review must fire deterministically on an event","MCP, since every file reviewer needs to reach the same set of tools","Subagents, since the parent hands out scoped sub-tasks and combines results"],"correct":[3],"explanation":"Handing scoped sub-tasks to separate contexts to run in isolation or in parallel is the subagent job. Agent Teams are for peers each owning part of a goal, and reaching for a heavier primitive than the job requires costs latency, tokens and operational surface on every request.","mnemonic":"Fan-out of isolated chores: subagents. Peer ownership: teams."}]},{"id":"d1s3","title":"Decomposition and delegation","learn":["Decompose before choosing a pattern: every solution has three owners, assigned early: Claude (language understanding, summarization, planning, drafting, tool-mediated action), existing systems (rule engines, databases of record), humans (judgment, exceptions, approvals).","Delegation lens: justify each assignment by reversibility, stakes and accountability. Assignments are AI-appropriate, human-retained, or collaborative (Claude drafts, a person decides).","Existing systems own what the partner already paid to make reliable: order-status service, policy engine, rules table, database of record. Claude calls them through tools or MCP rather than replacing them.","The framing shift: ask where the four properties argue for Claude over the system that already does this right, not where Claude can help.","Routing deterministic lookups to Claude means paying model rates for work a database query or rules table does for a fraction of the cost; across thousands of requests it adds up fast.","Skipping decomposition forces Claude into work another system does more cheaply, or into work without the context a human would give a colleague. Over-assigning costs more, runs slower and makes errors untraceable; a deterministic rule fails predictably, a model variably."],"traps":["Where can Claude help: the wrong question; the right one asks where the four properties favour Claude over the existing reliable system.","Rules disguised as language tasks: a decision the partner already defines in a rule engine or rules table stays with that system, not the model.","Model as source of truth: it cannot tell when its information went stale and will not flag the gap, so authoritative answers drift quietly with no error.","Claude owning the decision: judgment calls, exceptions and approvals belong to humans; in collaborative work Claude drafts and a person decides.","Logic moved into the model: a deterministic rule fails predictably and debuggably; the model fails variably, and its errors become hard to observe and trace."],"questions":[{"id":"d1s3q01","concept":"three-owners","type":"single","stem":"Which assignment correctly places work among the three owners of an AI solution?","options":["Existing systems own reliable rules; humans own judgment and approvals","Humans handle summarization and routine drafting at volume","Claude holds the rules table and the database of record","Existing systems own language understanding of free-text input"],"correct":[0],"explanation":"Existing systems do what the partner has already paid to make reliable (rule engine, database of record); humans take judgment, exceptions and approvals; Claude takes language-heavy work. Over-assigning everything to Claude makes the process costlier, slower and harder.","mnemonic":"Claude language, systems rules, humans judgment."},{"id":"d1s3q02","concept":"three-owners","type":"single","stem":"An architect's first instinct is to place every step of a request in the 'what Claude does' bucket. What is the most likely consequence?","options":["The process needs fewer evaluations because one component owns it","The process becomes more expensive, slower and harder to debug","The process becomes fully auditable through model turn traces","The process becomes faster because fewer integrations are needed"],"correct":[1],"explanation":"Over-assigning tasks to Claude almost always makes the solution more expensive, slower and harder, because deterministic lookups are sent to the model and errors lose traceability. Fewer integrations may look cleaner in a demo but does not remove these costs.","mnemonic":"Everything-to-Claude means pricier, slower, murkier."},{"id":"d1s3q03","concept":"delegation-lens","type":"single","stem":"Which trio of questions does the delegation lens use to justify what Claude is trusted to own?","options":["Latency, throughput and cost per call","Predictability, observability and error cost","Reversibility, stakes and accountability","Recall, precision and coverage"],"correct":[2],"explanation":"Delegation is justified through reversibility (can a wrong call be undone), stakes (what a wrong call costs) and accountability (who must answer for it). The predictability and observability factors belong to pattern selection.","mnemonic":"RSA of delegation: Reversibility, Stakes, Accountability."},{"id":"d1s3q15","concept":"existing-systems-own-rules","type":"single","stem":"A partner's eligibility decisions are already made by a rules table it maintains. In a new Claude workflow that reads free-text applications, who should own the eligibility decision?","options":["Claude, inferring eligibility from the wording of each application","The existing rules table, with Claude passing it the extracted details","A human reviewer, checking every application before any decision","A fine-tuned model trained to replace the rules table over time"],"correct":[1],"explanation":"Existing systems own anything the partner has already paid to make reliable, such as a rules table or policy engine; Claude reads the application and calls or feeds that system rather than replacing it. Handing a defined rule to the model adds a knowledge limitation and makes errors harder to trace, and a defined rule does not need a human on every case.","mnemonic":"Already reliable? Leave it with the system: Claude reads, the rules table decides."},{"id":"d1s3q16","concept":"model-unaware-of-staleness","type":"single","stem":"Why is it risky to let the model act as the source of truth for a reference table that the business updates often?","options":["Reference tables of that kind never fit inside the context window","The model refuses to answer lookups about tabular reference data","It cannot tell its information is stale, and will not flag it","Frequent updates force the model version to be re-pinned weekly"],"correct":[2],"explanation":"The model has no reliable way to know when its information is out of date, and it will not flag the gap, so once it replaces the partner's actual system, answers drift quietly with no error thrown and no warning raised. The data should come from the system that holds it, through a tool or MCP.","mnemonic":"The model never knows it is out of date, and never tells you."},{"id":"d1s3q17","concept":"human-owner-role","type":"multi","stem":"When a request is decomposed across Claude, existing systems and humans, which TWO kinds of work belong in the 'what humans do' bucket? Select TWO.","options":["High-volume summarization of incoming free-text customer requests","Approvals, such as signing off a high-value action","Lookups against the partner's database of record for each case","Judgment calls and exceptions where being right beats being fast","Drafting routine replies for a person to review afterwards"],"correct":[1,3],"explanation":"Humans own the judgment calls, the exception paths, the approvals and the moments where being right matters more than being fast. Summarization and drafting are Claude's language work (collaborative when a person then decides), and lookups against a database of record belong to existing systems.","mnemonic":"Humans keep the calls that count: judgment, exceptions, approvals, right over fast."},{"id":"d1s3q07","concept":"framing-shift","type":"single","stem":"Which question best captures the right framing for deciding where Claude belongs when decomposing a request?","options":["Which steps would be cheapest for us to prototype in a demo this month?","Where do the four properties favour Claude over the existing reliable system?","Which steps can Claude perform if we prompt it carefully?","How can we use Claude across as many steps as possible in the build?"],"correct":[1],"explanation":"Decomposition should ask where the four properties favour Claude over the existing reliable system, not simply where Claude can help. The 'where can Claude help' framing leads to over-assignment.","mnemonic":"Not 'where can Claude help' but 'where does Claude beat the system'."},{"id":"d1s3q08","concept":"framing-shift","type":"single","stem":"A team lists every task Claude is capable of performing and assigns all of them to Claude. Which flaw in their method does this show?","options":["They did not choose a delivery route before decomposing","They skipped the model tier decision before assigning tasks","They asked what Claude can do rather than where it beats incumbents","They added too many human approval gates to the process"],"correct":[2],"explanation":"Capability alone is the wrong test. The right question compares the four properties against the existing system already doing the job reliably.","mnemonic":"Can-do is not should-do; compare against the incumbent."},{"id":"d1s3q18","concept":"deterministic-lookup-cost","type":"single","stem":"A design sends every product-code lookup to Claude, even though a database query returns the same answer. What cost consequence should the architect expect?","options":["Paying model rates for work a query does far more cheaply","Lookups overflow the context window once the product catalogue grows","Prompt caching stops working for every other request type served","Costs fall, because a single component replaces several integrations"],"correct":[0],"explanation":"Every lookup a simple deterministic system could handle goes to the model instead, so you pay for the model to do work a database query or rules table could do for a fraction of the cost, and across thousands of requests that adds up fast. Fewer integrations can look cleaner, but it does not make the process cheaper.","mnemonic":"Don't pay model prices for a database answer; thousands of lookups add up fast."},{"id":"d1s3q19","concept":"model-unaware-of-staleness","type":"multi","stem":"A team lets Claude answer from what it learned in training instead of querying the partner's system of record. Which TWO describe the resulting risk? Select TWO.","options":["It has no reliable way to know its information is out of date","The API rejects each request with a 400 invalid_request_error message","Costs fall sharply, while latency rises on every single request","Answers can drift quietly, with no error thrown and no warning raised","The model refuses to answer once its training data falls out of date"],"correct":[0,3],"explanation":"When the model becomes the source of truth instead of the partner's actual system, it has no reliable way to know when its information is out of date and will not flag the gap, so answers drift quietly with no error and no warning. It neither refuses nor raises an API error, which is exactly why the drift goes unnoticed.","mnemonic":"Stale and silent: it can't tell its age, throws no error, raises no warning."},{"id":"d1s3q20","concept":"deterministic-rule-in-model","type":"single","stem":"A team moves a validation rule out of a lookup table and into a prompt. Why do errors become harder to diagnose?","options":["Models cannot return numbers in any reliably structured format","Lookup tables run faster, so their errors surface sooner in testing","Model outputs are logged in more detail, burying the errors in noise","The rule failed predictably; the model fails variably and resists observation"],"correct":[3],"explanation":"When logic moves out of a table-driven system into the model, errors stop being traceable: a deterministic rule fails in a predictable, debuggable way, while a model doing the same job produces variable outputs that are much harder to observe and diagnose. Speed and logging volume are not the issue.","mnemonic":"Tables fail the same way twice; models fail differently each time."},{"id":"d1s3q21","concept":"existing-systems-own-rules","type":"single","stem":"A partner's database of record already returns each customer's account tier reliably. An engineer proposes having Claude infer the tier from the customer's emails instead, to save an integration. What is the best response?","options":["Agree, provided the clean test cases all pass in development","Keep the database as the owner and let Claude use its result","Agree, but pin the model version so that the inference is stable","Move the inference into a Skill so the result becomes deterministic"],"correct":[1],"explanation":"Anything the partner has already paid to make reliable, such as a database of record, stays the owner; Claude calls it and uses the result. Over-assigning that work to Claude makes the process more expensive, slower and harder to debug. Passing clean development cases says nothing about the inputs production will raise, and a Skill packages a procedure without making it deterministic.","mnemonic":"If the system already gets it right, Claude asks the system, not the emails."},{"id":"d1s3q13","concept":"delegation-map","type":"single","stem":"Decomposing a partner request produces a delegation map. Which three categories does it assign each part of the request to?","options":["AI-appropriate, human-retained, and collaborative work where Claude drafts and a person decides","Augmented calls, workflows and agents, chosen by how predictable each step is","Entry points, build-time interfaces and delivery routes, each chosen by a stakeholder","Low, medium and high stakes, assigned from the model's confidence score on each step"],"correct":[0],"explanation":"The delegation map sorts each part into AI-appropriate work, human-retained work, or collaborative work where Claude drafts and a person decides, justified by reversibility, stakes and accountability. Augmented call, workflow and agent are the patterns chosen afterwards, once ownership is settled.","mnemonic":"The map says: Claude's, human's, or draft-then-decide."},{"id":"d1s3q14","concept":"delegation-map","type":"single","stem":"Which AI Fluency competency is an architect exercising when deciding, part by part, whether Claude should own a piece of work, judged on reversibility, stakes and accountability?","options":["Discernment","Diligence","Delegation","Description"],"correct":[2],"explanation":"Delegation, the first of the four AI Fluency competencies, is deciding what Claude is trusted to own, producing the delegation map. Discernment judges whether outputs are acceptable, and Diligence maintains human accountability checkpoints.","mnemonic":"Delegation decides who does it; Discernment judges what came back."},{"id":"d1s3q22","concept":"decompose-first","type":"single","stem":"A design review for a new partner request opens with a debate about whether to build a workflow or an agent. What should the architect do first?","options":["Pick the model tier the design will run on","Choose the entry point users will reach it through","Split the work among Claude, existing systems and humans","Prototype an agent and measure how well it performs"],"correct":[2],"explanation":"Decomposition is the move that comes before architecture: before choosing a pattern, split the work into what Claude handles, what existing systems handle and what humans handle, and assign those owners early. The split shows whether each task belongs with Claude at all, which is what the pattern then has to carry. Prototyping an agent first skips that step.","mnemonic":"Owners before patterns: split Claude, systems, humans, then pick workflow or agent."},{"id":"d1s3q23","concept":"skip-decomposition","type":"multi","stem":"A team jumps straight to an agent design without decomposing the request first. Which TWO consequences should the architect expect? Select TWO.","options":["Claude does work another system would do at lower cost","The model tier gets locked in before any evals are written","Human approval gates multiply across every step of the flow","Claude operates without context a human would give a colleague","The entry point must be rebuilt for every new user channel"],"correct":[0,3],"explanation":"Designs that skip decomposition end up forcing Claude into work another system would do at lower cost, or asking it to operate without the context a human would have given a colleague; where that context is missing, the model improvises. Locked-in tiers, extra approval gates and rebuilt entry points are not consequences of skipping the split.","mnemonic":"Skip the split: Claude overpays for system work and works blind, without a colleague's context."},{"id":"d1s3q24","concept":"decompose-first","type":"single","stem":"Why does splitting the work among Claude, existing systems and humans come before choosing a pattern or architecture?","options":["Patterns can only be chosen once the model tier is pinned","The split shows which tasks belong with Claude at all","Humans must sign off on the pattern before any split","Existing systems pick the pattern through their own APIs"],"correct":[1],"explanation":"The split is driven by how the model behaves on each piece of the work, which tells you whether a task belongs with Claude or somewhere else in the stack. Only once each owner is assigned do you know what the pattern has to carry, so decomposition precedes architecture rather than following a pattern or tier choice.","mnemonic":"Decide who owns each piece first; the pattern only wraps Claude's share."}]},{"id":"d1s4","title":"Pattern selection","learn":["Three patterns: augmented LLM (one bounded call, optionally with tools or retrieval), workflow (steps orchestrated in your code), agent (model chooses its own steps; control flow lives in the model).","Four workflow sub-patterns: chaining (sequential stages), routing (classifier picks a path), parallelization (concurrent independent calls, aggregated or voted), evaluator-optimizer (generate, evaluate, revise until criterion or retry limit).","Five factors in sequence: predictability, error cost, observability, latency budget, cost. The first factor that rules out a pattern decides. Choose the simplest pattern that meets tolerance; escalate only when measurement shows it falling short.","Agent constraints are not optional: constrained tool entry points, per-turn budgets, explicit permissions, stopping criteria. Agent autonomy is your liability surface.","Before fine-tuning: optimize the prompt, add tools or retrieval, move to evaluator-optimizer, only then fine-tune. Justified for very high volume, critical latency, or consistent format when prompting fails. Fine-tuning availability is limited.","Skills-based packaging suits repeated, distributed, versioned procedures. Apply the delegation lens to the pattern itself: grant an agent autonomy only when the stakes and reversibility of its actions justify it."],"traps":["Agent for flexibility: choosing an agent because the task feels open-ended, when the steps could have been written in code.","Agent equals expensive: cost is driven by context accumulation and call count, so a poorly designed workflow can cost more than a well-designed agent.","Broad tool permissions: an agent can do anything its tools allow, including combinations nobody tested; keep the tool entry point as narrow as the task allows.","Fine-tuning as a quick fix: it locks you to a fixed model version; try prompt, tools or retrieval, then evaluator-optimizer first.","Mutually exclusive patterns: most production workflows combine several; start simple and escalate on evidence."],"questions":[{"id":"d1s4q01","concept":"three-patterns-definition","type":"single","stem":"What makes a system an agent rather than a workflow?","options":["It calls Claude at several steps in sequence","It was built with the Agent SDK instead of the direct API","The model chooses its own sequence of steps toward a goal","It uses more than one tool in the same request"],"correct":[2],"explanation":"In an agent the control flow lives inside the model; the path is not written in advance anywhere you can inspect. In a workflow the control flow lives in your code, even when several steps call Claude.","mnemonic":"Workflow: your code holds the map. Agent: the model draws it."},{"id":"d1s4q02","concept":"three-patterns-definition","type":"single","stem":"A single model call is given retrieval and a tool, and the control flow never branches on what the model decides. Which pattern is this?","options":["Routing workflow, a classifier choosing the path","Agent, the model choosing its own steps","Evaluator-optimizer, a draft and grade loop","Augmented LLM, one bounded call with helpers"],"correct":[3],"explanation":"An augmented LLM is one bounded job in one pass, optionally with tool use, retrieval or extended thinking. It is not an agent because the model does not choose a branching sequence of steps.","mnemonic":"One call plus helpers is still one call: augmented, not agent."},{"id":"d1s4q28","concept":"workflow-subpatterns","type":"single","stem":"Each chapter of a long technical manual is reviewed in its own simultaneous model call, and the findings are combined into one report. Which workflow sub-pattern is this?","options":["Chaining","Routing","Parallelization","Evaluator-optimizer"],"correct":[2],"explanation":"Independent sub-tasks run concurrently and their results are aggregated, which is parallelization; distinct sections of a long document fit because no section's review depends on another's output. Chaining would feed each call's output into the next.","mnemonic":"No dependencies between pieces? Run them side by side: parallelization."},{"id":"d1s4q29","concept":"workflow-subpatterns","type":"single","stem":"Generated code is run against a test suite; failures are fed back and the code is revised until the tests pass or a retry limit is reached. Which workflow sub-pattern is this?","options":["Evaluator-optimizer","Parallelization","Chaining","Routing"],"correct":[0],"explanation":"Generate, evaluate and revise until a quality criterion is met or a retry limit is reached is the evaluator-optimizer; it earns its place when quality is verifiable but a single attempt is not reliable enough. Chaining passes output forward once, with no loop back.","mnemonic":"Write, test, fix, repeat until green or out of retries."},{"id":"d1s4q30","concept":"workflow-subpatterns","type":"single","stem":"An intake service receives a mix of invoices, signed agreements and identity scans, and a classifier sends each kind to a different handler. Which workflow sub-pattern is this?","options":["Parallelization","Chaining","Evaluator-optimizer","Routing"],"correct":[3],"explanation":"A classifier, often Claude itself, decides the downstream path because inputs vary in kind and each kind needs different handling. Parallelization would run independent calls concurrently rather than choosing one path per input.","mnemonic":"Different kinds, different doors: a classifier routes each input."},{"id":"d1s4q06","concept":"five-factor-framework","type":"single","stem":"In the five-factor framework, how should the architect apply the factors when choosing a pattern?","options":["Score all five factors equally and choose the highest total","Apply them only after the agent has already been prototyped","Start with cost and set the remaining four factors aside","Walk them in sequence; the first factor that rules out a pattern decides"],"correct":[3],"explanation":"The five factors (predictability, error cost, observability, latency budget, cost) are walked in order, and the first factor that rules out a pattern is the deciding one.","mnemonic":"Walk the five in order; the first veto wins."},{"id":"d1s4q07","concept":"agent-when-justified","type":"single","stem":"When is an agent the right pattern?","options":["When the steps genuinely cannot be determined in advance and unexpected output is recoverable","When the task feels open-ended and the team wants flexibility","When the audit team wants every decision logged as a model turn","When the latency budget is tight and cost per request must be minimal"],"correct":[0],"explanation":"Agents suit work whose path cannot be enumerated in advance and whose cost of an unexpected output is acceptable and recoverable. Feeling uncertain about structure is not the same as steps being unknowable.","mnemonic":"Unknowable path plus recoverable errors earns an agent."},{"id":"d1s4q31","concept":"agent-when-justified","type":"single","stem":"A team can write down every step of a process in advance but wants an agent because the work 'feels open-ended'. What should the architect recommend?","options":["An agent with tight tool permissions to keep it on the known path","A workflow, since steps that can be written in code need no agent","A multi-agent fan-out, so each step has its own clean context","Fine-tuning first, so the model learns the steps before any build"],"correct":[1],"explanation":"Agents are often chosen because a task feels open-ended rather than because it requires one; feeling uncertain about structure is different from steps that genuinely cannot be determined in advance. If the steps could be written in code, a workflow avoids non-deterministic control flow, and an agent would mean paying for flexibility you won't use in tokens, latency and audit gaps.","mnemonic":"Feels open-ended isn't open-ended: if you can code the steps, build a workflow."},{"id":"d1s4q09","concept":"agent-constraints","type":"multi","stem":"Which THREE are constraints a production agent is typically bound by? Select THREE.","options":["Explicit permissions on what each tool is allowed to do","Constrained tool entry points limiting what the agent can reach","A fixed fine-tuned model that skips evaluation entirely","Per-turn budgets together with explicit stopping criteria","Unlimited tool permissions so the goal is never blocked"],"correct":[0,1,3],"explanation":"In production, agents are bound by constrained tool entry points, per-turn budgets, explicit permissions and stopping criteria; these are not optional. Unlimited permissions widen the liability surface.","mnemonic":"Narrow tools, capped turns, stated permissions, clear stop."},{"id":"d1s4q10","concept":"prompt-before-finetune","type":"single","stem":"Prompting feels unreliable on a classification task. What is the recommended order of escalation?","options":["Add retrieval, fine-tune, then move to an evaluator-optimizer","Fine-tune first, then optimize the prompt, then add retrieval","Optimize the prompt, add tools or retrieval, try evaluator-optimizer, then fine-tune","Switch to an agent, then fine-tune, then optimize the prompt"],"correct":[2],"explanation":"Most reliability problems are prompt problems; work through prompt optimization, tool use or retrieval, then a stronger pattern such as evaluator-optimizer, and only then fine-tuning. Fine-tuning locks you to a fixed model version.","mnemonic":"Prompt, tools, loop, then tune: fine-tuning comes last."},{"id":"d1s4q11","concept":"prompt-before-finetune","type":"multi","stem":"Which TWO situations justify considering fine-tuning? Select TWO.","options":["The team is unsure which pattern best fits the work","The team wants to avoid pinning a model version altogether","Latency is critical and a smaller specialised model would beat a prompted one","The task runs at very high volume and inference cost is the constraint","A prompt has not yet been written for the task at hand"],"correct":[2,3],"explanation":"Fine-tuning is justified for very high volume where inference cost dominates, critical latency where a smaller model wins, or a consistent format that prompting cannot deliver. Outside those cases it narrows options.","mnemonic":"Tune only for volume, latency or stubborn format."},{"id":"d1s4q32","concept":"pattern-delegation-lens","type":"single","stem":"When the delegation lens is applied to the choice of pattern itself, what decides whether an autonomous agent is appropriate?","options":["Whether the task feels open-ended to the team at design time","Whether the latency budget is generous enough for open-ended runs","Whether the stakes and reversibility of its actions justify that autonomy","Whether the Agent SDK is available on the chosen delivery route"],"correct":[2],"explanation":"Applying the delegation lens to the pattern asks whether it grants Claude appropriate or excessive decision authority for the risk profile: an agent that can act autonomously is right only when the stakes and reversibility of its actions justify the autonomy it is given. A task that merely feels open-ended is a common wrong reason to choose an agent.","mnemonic":"Autonomy must be earned: stakes and reversibility decide how much the agent gets."},{"id":"d1s4q13","concept":"skills-packaging","type":"single","stem":"The same claims-review procedure must run across several teams and products, be versioned, and be governed as one unit. Which packaging option fits?","options":["A Skills-based architecture packaging the procedure and scripts","Fine-tuning a separate model for each team","A prompt-only solution with instructions copied per team","Direct tool use with functions embedded in each application"],"correct":[0],"explanation":"Reach for a Skill when the same procedure runs repeatedly, is distributed across teams or products, or must be versioned and governed. Prompt-only copies and per-app tool code cannot be governed as a single unit.","mnemonic":"Repeat, distribute, version: package it as a Skill."},{"id":"d1s4q14","concept":"predictability-autonomy-axes","type":"single","stem":"Use cases are plotted on two axes: how predictable the path is and how much autonomy the model is granted. Where does a workflow sit?","options":["High predictability and low autonomy, executing one bounded task once","High autonomy and low predictability, where the next move depends on the last","The middle band: a predictable overall shape with contained model judgment per step","Low predictability and low autonomy, since your code fixes every branch"],"correct":[2],"explanation":"Workflows occupy the middle band: the overall shape is predictable, but each step may involve contained model judgment. High predictability and low autonomy is the augmented LLM quadrant, and high autonomy with low predictability is the agent corner.","mnemonic":"Augmented: control corner. Workflow: middle band. Agent: freedom corner."},{"id":"d1s4q33","concept":"chaining-subpattern","type":"single","stem":"The first call transcribes a recorded meeting, the second extracts the decisions from that transcript, and the third formats them into a status update. Which workflow sub-pattern is this?","options":["Chaining","Routing","Parallelization","Evaluator-optimizer"],"correct":[0],"explanation":"Chaining is sequential: each stage produces a defined output that the next stage consumes, so the task decomposes into stages with clear handoffs. Parallelization runs independent calls at once, and routing sends different kinds of input down different paths.","mnemonic":"Chain links: each stage eats the last stage's output."},{"id":"d1s4q16","concept":"simplest-pattern-first","type":"single","stem":"A team designing a support workflow wants to adopt routing, parallelization and evaluator-optimizer together from day one 'to be safe'. What is the recommended approach?","options":["Combine all three now, since production workflows usually mix several patterns","Choose the simplest pattern meeting error tolerance and observability; escalate on measured shortfall","Start with an agent, then extract sub-patterns once the traces reveal the paths","Use evaluator-optimizer everywhere, since a second check always raises quality"],"correct":[1],"explanation":"Sub-patterns can be combined, but the right choice is usually the simplest one that meets the task's error tolerance and observability requirements, revisited with production data and escalated only when measurement shows it falling short. That most workflows mix patterns does not justify adding them all up front.","mnemonic":"Start simple, measure, then climb: escalate on evidence, not anxiety."},{"id":"d1s4q17","concept":"simplest-pattern-first","type":"multi","stem":"Which TWO statements about workflow sub-patterns are correct? Select TWO.","options":["Each workflow must commit to exactly one sub-pattern to stay observable","They are not mutually exclusive; production workflows often combine several","Evaluator-optimizer should be the default because it guarantees quality","Parallelization fits best when each stage consumes the previous stage's output","Escalate to a heavier pattern only when measurement shows the simpler one falls short"],"correct":[1,4],"explanation":"The four sub-patterns are not mutually exclusive and are often combined, and you escalate only when measurement shows the simpler pattern falling short. Stages consuming the previous output describe chaining, not parallelization, which suits independent sub-tasks.","mnemonic":"Mix patterns freely, but upgrade only on data."},{"id":"d1s4q18","concept":"five-factor-ratings","type":"single","stem":"In the five-factor comparison of patterns, why does an agent rate worst on observability?","options":["A single call is easy to log but stays opaque about what happened inside","Its steps log like ordinary code, so standard tooling records too much noise","Agents cannot emit token counts or stop reasons in their responses","Its trajectory reads like a transcript that most tooling cannot alert on"],"correct":[3],"explanation":"An agent's trajectory reads like a transcript, and most current observability tooling is not built to alert on it. A single call that is easy to log but opaque inside describes the augmented LLM, and steps logging like code is why workflows rate best.","mnemonic":"Agent logs read like a novel; dashboards can't alert on plot twists."},{"id":"d1s4q19","concept":"five-factor-ratings","type":"single","stem":"A user-facing feature has a strict response deadline. When weighing an agent against the latency-budget factor, how should its runtime be budgeted?","options":["Plan for the median run, since most agent trajectories finish quickly","Budget for the worst case, since agent runtime is open-ended","Treat it like a workflow: predictable and additive in duration","Assume single-call latency, adding time only for extended thinking"],"correct":[1],"explanation":"Agent runtime is open-ended, so the latency budget must cover the worst case, not the median. Predictable, additive duration describes a workflow, and single-call latency describes the augmented LLM.","mnemonic":"Agents have no finish line you can promise: budget the worst lap."},{"id":"d1s4q20","concept":"five-factor-ratings","type":"multi","stem":"In the five-factor comparison, which TWO pairings of pattern, factor and rating are correct? Select TWO.","options":["Agent on predictability: low, because the trajectory is fixed in advance","Workflow on error cost: low, because deterministic guards sit between steps","Workflow on observability: high, because steps produce a model transcript","Augmented LLM on error cost: low, because step-level guards wrap the call","Augmented LLM on cost: low, because it uses the fewest tokens per request"],"correct":[1,4],"explanation":"Workflows rate low on error cost because deterministic guards sit between steps, and the augmented LLM rates low on cost because it uses the fewest tokens per request. The augmented LLM rates medium on error cost precisely because it has no step-level guards, and workflows log as code, not as a transcript.","mnemonic":"Guards between steps cut error cost; one call cuts token cost."},{"id":"d1s4q21","concept":"agent-cost-by-design","type":"single","stem":"A reviewer rejects an agent design solely because 'agents always cost more than workflows'. What is the most accurate response?","options":["Correct: agents carry a fixed premium per request regardless of design","Incorrect: workflows always cost more, because every step calls the model","Cost tracks accumulated context and call count; design matters more than the label","Correct: only augmented calls should be used wherever cost is a factor"],"correct":[2],"explanation":"Agents do not automatically cost more than workflows; what drives cost is how much context accumulates and how many model calls are made. Design matters more than the pattern label, so the claim is wrong in both directions, not reversed.","mnemonic":"Price the context and the calls, not the pattern's name tag."},{"id":"d1s4q22","concept":"agent-cost-by-design","type":"single","stem":"A workflow re-sends its full accumulated history to the model at each of twelve steps and costs more per request than a tightly bounded agent doing the same job. What does this illustrate?","options":["A poorly designed workflow can cost more than a well-designed agent","Workflows are inherently more expensive, so the agent should be the default","The agent must be hiding tokens, since agents always cost the most","Cost is set by the model tier alone, not by context or call count"],"correct":[0],"explanation":"Cost is driven by context accumulation and the number of calls, so a poorly designed workflow can cost more than a well-designed agent. That does not make agents the default; it means design, not the label, sets the bill.","mnemonic":"Bloated workflow, lean agent: the bill follows the design."},{"id":"d1s4q23","concept":"workflow-vs-agent-failure","type":"single","stem":"Why is an agent failure typically harder to spot and diagnose than a workflow failure?","options":["Workflows fail at a code step; agents fail on a model decision mid-sequence","Agents throw no errors at all, while workflows always raise exceptions","Workflows hide failures inside a single call that cannot be logged","Agents fail only when a tool is unavailable, which logs rarely show"],"correct":[0],"explanation":"A workflow fails when a step in your code fails, which standard debugging catches. An agent fails when the model makes a bad decision somewhere in a sequence of turns, which is harder to spot and which standard tools do not catch the same way.","mnemonic":"Workflow breaks at a line of code; agent breaks at a line of thought."},{"id":"d1s4q24","concept":"finetune-limits","type":"single","stem":"Prompting has not made a high-volume extractor follow a consistent output format, and the partner asks for fine-tuning on Claude. What should the architect do before recommending it?","options":["Proceed directly, since fine-tuning is broadly available on every delivery route","Switch delivery routes, since fine-tuning is guaranteed on all cloud providers","Confirm current fine-tuning access with the Anthropic account team, since availability varies","Skip the request, since a consistent format is never a valid fine-tuning reason"],"correct":[2],"explanation":"Fine-tuning Claude is not broadly available; access is limited and varies by model and delivery route, so verify current options with the Anthropic account team first. A consistent format that prompting has not fixed is one of the situations where fine-tuning can be justified.","mnemonic":"Fine-tuning: last rung, limited access; ask the account team first."},{"id":"d1s4q25","concept":"finetune-limits","type":"single","stem":"Outside the narrow situations that justify it, what is the main downside of fine-tuning?","options":["It locks you to a fixed model version and narrows your options","It always raises per-request inference cost above prompting","It removes the need for an eval set after deployment"
